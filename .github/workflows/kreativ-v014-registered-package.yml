name: KREATIV 0.1.4 Registered Package

on:
  workflow_dispatch:
  push:
    branches: [ agent/kreativ-studio-v0.1 ]
    paths:
      - '.github/workflows/kreativ-v014-registered-package.yml'

permissions:
  contents: write

concurrency:
  group: kreativ-v014-registered-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID: 949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com
      ORG_GRADLE_PROJECT_KREATIV_OLIVIA_FIREBASE_UID: ${{ secrets.KREATIV_OLIVIA_FIREBASE_UID }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_API_KEY: AIzaSyDze_icg2SIo2h-PV9SFAW1CBFcjMhp-MI
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID: 1:949620144971:android:63fec0446e8549d25946ce
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID: my-study-companion-abc01
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_STORAGE_BUCKET: my-study-companion-abc01.firebasestorage.app
      ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_STORE_PASSWORD: temporary-build-password
      ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_KEY_ALIAS: temporary-build-key
      ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_KEY_PASSWORD: temporary-build-password
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kreativ-studio-v0.1
          fetch-depth: 0
      - name: Publish active run locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          cat > ci/KREATIV-V014-ACTIVE-RUN.txt <<EOF
          run_id=$GITHUB_RUN_ID
          head_sha=$GITHUB_SHA
          artifact=KREATIV-Studio-v0.1.4-ready-for-registered-signing
          status=running
          EOF
          git config user.name 'KREATIV Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/KREATIV-V014-ACTIVE-RUN.txt
          git commit -m 'Record active KREATIV 0.1.4 package run'
          git push origin HEAD:agent/kreativ-studio-v0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Create disposable CI signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kreativ-temporary-signing"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/kreativ-temporary-signing/temporary.jks" \
            -storepass "$ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_STORE_PASSWORD" \
            -keypass "$ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_KEY_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Temporary KREATIV CI,O=KREATIV Studio,C=US"
          echo "ORG_GRADLE_PROJECT_KREATIV_PRIVATE_ALPHA_STORE_FILE=$RUNNER_TEMP/kreativ-temporary-signing/temporary.jks" >> "$GITHUB_ENV"
      - name: Compile, lint, and unit test
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon lintDebug testDebugUnitTest assemblePrivateAlpha
          grep -Fq 'versionName = "0.1.4"' app/build.gradle.kts
          grep -Fq 'Select / Move • object moved' app/src/main/java/com/kreativstudio/app/ui/canvas/KreativCanvasView.kt
          grep -Fq 'ToolType.PEN -> Icons.Default.BorderColor' app/src/main/java/com/kreativstudio/app/ui/KreativSketchbookStudio.kt
          grep -Fq 'ToolType.SELECT -> Icons.Default.SelectAll' app/src/main/java/com/kreativstudio/app/ui/KreativSketchbookStudio.kt
      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          test -f "$APK"
          mkdir -p package
          cp "$APK" package/KREATIV-Studio-v0.1.4-private-alpha-temp-signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > package/IDENTITY.txt
          grep -q "package: name='com.kreativstudio.app'" package/IDENTITY.txt
          grep -q "versionCode='5'" package/IDENTITY.txt
          grep -q "versionName='0.1.4-private-alpha'" package/IDENTITY.txt
          sha256sum package/*.apk > package/TEMP-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KREATIV-Studio-v0.1.4-ready-for-registered-signing
          path: package
          retention-days: 14
          if-no-files-found: error
      - name: Mark package passed
        shell: bash
        run: |
          set -euo pipefail
          cat > ci/KREATIV-V014-ACTIVE-RUN.txt <<EOF
          run_id=$GITHUB_RUN_ID
          head_sha=$GITHUB_SHA
          artifact=KREATIV-Studio-v0.1.4-ready-for-registered-signing
          status=passed
          EOF
          git add ci/KREATIV-V014-ACTIVE-RUN.txt
          git commit -m 'Record successful KREATIV 0.1.4 package run'
          git push origin HEAD:agent/kreativ-studio-v0.1
