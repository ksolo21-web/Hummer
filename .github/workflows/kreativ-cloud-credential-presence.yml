name: Probe KREATIV Cloud Deployment Credential Presence

on:
  push:
    branches: [ agent/msc-0.15.12-vote-widget-fix ]
    paths:
      - '.github/workflows/kreativ-cloud-credential-presence.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  presence-only:
    runs-on: ubuntu-latest
    environment: my-study-companion-private
    env:
      S_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      S_FIREBASE_CI_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
      S_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      S_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      S_FIREBASE_SERVICE_ACCOUNT_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_STUDY_COMPANION_ABC01 }}
      S_FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
      S_FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
      S_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      S_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      S_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
      S_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      S_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      S_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      S_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      S_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      S_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      S_GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      S_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      S_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      S_GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      S_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      S_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      V_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      V_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      V_GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      V_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      V_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      V_GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      V_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      V_DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      V_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for name in \
            S_FIREBASE_TOKEN \
            S_FIREBASE_CI_TOKEN \
            S_FIREBASE_SERVICE_ACCOUNT \
            S_FIREBASE_SERVICE_ACCOUNT_JSON \
            S_FIREBASE_SERVICE_ACCOUNT_PROJECT \
            S_FIREBASE_ADMIN_SDK \
            S_FIREBASE_ADMIN_CREDENTIALS \
            S_GOOGLE_APPLICATION_CREDENTIALS_JSON \
            S_GOOGLE_CREDENTIALS \
            S_GOOGLE_CLOUD_CREDENTIALS \
            S_GCP_CREDENTIALS \
            S_GCP_SA_KEY \
            S_GCP_SERVICE_ACCOUNT_KEY \
            S_GCP_SERVICE_ACCOUNT_JSON \
            S_GOOGLE_SERVICE_ACCOUNT_JSON \
            S_SERVICE_ACCOUNT_JSON \
            S_GCLOUD_SERVICE_KEY \
            S_GCP_WORKLOAD_IDENTITY_PROVIDER \
            S_WORKLOAD_IDENTITY_PROVIDER \
            S_GCP_WIF_PROVIDER \
            S_GCP_DEPLOY_SERVICE_ACCOUNT \
            S_GCP_SERVICE_ACCOUNT \
            V_GCP_PROJECT_ID \
            V_FIREBASE_PROJECT_ID \
            V_GOOGLE_CLOUD_PROJECT \
            V_GCP_WORKLOAD_IDENTITY_PROVIDER \
            V_WORKLOAD_IDENTITY_PROVIDER \
            V_GCP_WIF_PROVIDER \
            V_GCP_DEPLOY_SERVICE_ACCOUNT \
            V_DEPLOY_SERVICE_ACCOUNT \
            V_GCP_SERVICE_ACCOUNT; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=PRESENT"
              present=$((present+1))
            else
              echo "$name=missing"
            fi
          done
          echo "PRESENT_COUNT=$present"
