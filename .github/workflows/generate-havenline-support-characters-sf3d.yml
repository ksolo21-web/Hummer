name: Generate HAVENLINE SF3D Recovery Characters on RTX

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/generate-havenline-support-characters-sf3d.yml'
      - '.tooling/havenline-character-production/run_sf3d_character_pipeline.ps1'
      - '.tooling/havenline-character-production/run_sf3d_support_pipeline.ps1'
      - '.tooling/havenline-character-production/prepare_sf3d_character_input.py'
      - '.tooling/havenline-character-production/finalize_sf3d_generation.py'
      - '.tooling/havenline-character-production/runtime-versions.json'
      - '.tooling/havenline-character-production/character1-seed9101-visual-rejection.json'
      - '.tooling/havenline-character-production/character2-unity-review-candidate.json'
      - '.tooling/havenline-character-production/stage_unity_character_review_sources.py'
      - '.tooling/havenline-character-production/test_character_artifact_policy.py'
      - '.tooling/havenline-character-production/sanitize_character_mesh.py'
      - '.tooling/havenline-character-production/rig_animate_character.py'
      - '.tooling/havenline-character-production/rig_animate_character_export_only.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/render_character_proofs_cpu.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'
      - '.tooling/havenline-character-reference-payload/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-sf3d-recovery-characters-rtx
  cancel-in-progress: true

jobs:
  validate-contract:
    name: Validate SF3D recovery contract
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out exact HAVENLINE branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate runtime, rejection policy and executable route
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.tooling/havenline-character-production')
          runtime = json.loads((root / 'runtime-versions.json').read_text())
          rejection = json.loads((root / 'character1-seed9101-visual-rejection.json').read_text())
          candidate = json.loads((root / 'character2-unity-review-candidate.json').read_text())
          pipeline = (root / 'run_sf3d_character_pipeline.ps1').read_text()
          workflow = Path('.github/workflows/generate-havenline-support-characters-sf3d.yml').read_text()

          assert runtime['schemaVersion'] == 3
          assert runtime['blender']['version'] == '4.5.12'
          assert runtime['stableFast3D']['commit'] == 'ff21fc491b4dc5314bf6734c7c0dabd86b5f5bb2'
          assert runtime['reconstruction']['Character1']['generator'] == 'Stability-AI/stable-fast-3d'
          assert runtime['reconstruction']['Character2']['artifactId'] == 8973791027
          assert runtime['reconstruction']['Character3']['generator'] == 'Stability-AI/stable-fast-3d'
          assert runtime['reconstruction']['Character4']['generator'] == 'Stability-AI/stable-fast-3d'
          assert rejection['artifact']['id'] == '8974534288'
          assert rejection['humanVisualReview']['status'] == 'rejected'
          assert rejection['acceptedForUnityReview'] is False
          assert candidate['artifact']['id'] == '8973791027'
          assert candidate['approved'] is False

          for literal in (
              "[ValidateSet('Character1', 'Character3', 'Character4')]",
              "acceptedForUnityReview = $false",
              "humanVisualApprovalRequired = $true",
              "run_sf3d_character_pipeline.ps1",
              "character1-seed9101-visual-rejection.json",
          ):
              if literal not in pipeline + workflow:
                  raise SystemExit(f'Missing SF3D recovery literal: {literal}')
          forbidden_runner_context = '$' + '{{ runner.'
          if forbidden_runner_context in workflow:
              raise SystemExit('runner context cannot be used before runner assignment.')
          print('SF3D recovery contract passed before self-hosted runner assignment.')

      - name: Run artifact rejection and substitution tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-production/test_character_artifact_policy.py

  generate-character:
    name: ${{ matrix.character }} SF3D RTX production proof
    needs: validate-contract
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        character:
          - Character1
          - Character3
          - Character4
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      STABILITY_AI_LICENSE_ACCEPTED: ${{ vars.STABILITY_AI_LICENSE_ACCEPTED }}
      STABILITY_AI_COMMERCIAL_REGISTRATION_CONFIRMED: ${{ vars.STABILITY_AI_COMMERCIAL_REGISTRATION_CONFIRMED }}

    steps:
      - name: Check out exact HAVENLINE branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .tooling/havenline-character-production/runtime-versions.json

      - name: Materialize checksum-pinned approved references
        shell: pwsh
        run: python .tooling/havenline-character-reference-payload/materialize_references.py

      - name: Run the fail-closed RTX reconstruction and Blender proof pipeline
        id: pipeline
        continue-on-error: true
        shell: pwsh
        run: |
          & .tooling\havenline-character-production\run_sf3d_character_pipeline.ps1 `
            -Character '${{ matrix.character }}'

      - name: Upload complete character review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-SF3D-RTX-review-${{ github.run_id }}
          path: character_output/${{ matrix.character }}/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Enforce machine completion without granting visual approval
        if: always()
        shell: pwsh
        run: |
          $statusPath = 'character_output\${{ matrix.character }}\sf3d-pipeline-status.json'
          if (-not (Test-Path $statusPath)) {
            throw 'SF3D pipeline status is missing.'
          }
          $status = Get-Content $statusPath -Raw | ConvertFrom-Json
          if ('${{ steps.pipeline.outcome }}' -ne 'success' -or -not $status.machinePassed) {
            throw '${{ matrix.character }} failed the SF3D/Blender machine pipeline. Evidence was preserved.'
          }
          if ($status.acceptedForUnityReview -or $status.approved -or $status.unityIntegrated -or -not $status.humanVisualApprovalRequired) {
            throw 'Machine generation attempted to bypass Blender or Unity human visual review.'
          }

# Triggered after the default-branch workflow registry became valid.
