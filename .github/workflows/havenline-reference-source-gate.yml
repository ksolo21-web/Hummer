name: HAVENLINE Clean Unity Source Gate

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - HAVENLINE_UNITY/**
      - .github/workflows/havenline-reference-source-gate.yml
      - .github/workflows/havenline-unity-android-build.yml
  pull_request:
    branches:
      - main
    paths:
      - HAVENLINE_UNITY/**
      - .github/workflows/havenline-reference-source-gate.yml
      - .github/workflows/havenline-unity-android-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havenline-clean-unity-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch or pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate connected Unity project and exact reference contract
        shell: bash
        run: |
          set -euo pipefail
          root=HAVENLINE_UNITY

          require_file() {
            local path="$1"
            local label="$2"
            if [ ! -f "$path" ]; then
              echo "Missing HAVENLINE source contract file: $label ($path)" >&2
              exit 1
            fi
          }

          require_pattern() {
            local pattern="$1"
            local path="$2"
            local label="$3"
            if ! grep -Fq -- "$pattern" "$path"; then
              echo "Missing HAVENLINE source contract: $label" >&2
              echo "Expected literal: $pattern" >&2
              echo "File: $path" >&2
              exit 1
            fi
          }

          require_file "$root/ProjectSettings/ProjectVersion.txt" "Unity editor version"
          require_file "$root/Packages/manifest.json" "Unity package manifest"
          require_file "$root/Assets/Havenline/Reference/HAVENLINE_REFERENCE_CONTRACT.json" "preserved reference contract"
          require_file "$root/Assets/Havenline/Runtime/HavenlineReference.cs" "runtime reference constants"
          require_file "$root/Assets/Havenline/Runtime/HavenlineInput.cs" "input implementation"
          require_file "$root/Assets/Havenline/Runtime/HavenlineActor.cs" "actor implementation"
          require_file "$root/Assets/Havenline/Runtime/HavenlineGameplay.cs" "gameplay implementation"
          require_file "$root/Assets/Havenline/Runtime/HavenlinePresentation.cs" "presentation implementation"
          require_file "$root/Assets/Havenline/Runtime/HavenlineHud.cs" "adaptive HUD implementation"
          require_file "$root/Assets/Havenline/Editor/HavenlineAssetBootstrap.cs" "reference-art bootstrap"
          require_file "$root/Assets/Havenline/Editor/HavenlineSceneAuthoring.cs" "shipping-scene authoring"
          require_file "$root/Assets/Havenline/Editor/HavenlineBuildPipeline.cs" "Android build pipeline"
          require_file "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "clean-checkout CI preparation"
          require_file "$root/Assets/Havenline/Tests/Editor/HavenlineReferenceContractTests.cs" "Unity reference tests"
          require_file ".github/workflows/havenline-unity-android-build.yml" "premium Android workflow"

          require_pattern 'm_EditorVersion: 6000.3.18f1' "$root/ProjectSettings/ProjectVersion.txt" "Unity 6000.3.18f1"
          require_pattern '"com.unity.cloud.gltfast": "6.19.0"' "$root/Packages/manifest.json" "glTFast 6.19.0"
          require_pattern '"com.unity.inputsystem": "1.17.0"' "$root/Packages/manifest.json" "Input System 1.17.0"
          require_pattern '"com.unity.render-pipelines.universal": "17.3.0"' "$root/Packages/manifest.json" "URP 17.3.0"

          # Runtime framing can improve beyond the preserved APK baseline. The approved
          # runtime values and gameplay ranges remain locked by compiled Unity tests.
          require_pattern 'CameraKeepsTheCartoonSurvivorCloseAndReadable' "$root/Assets/Havenline/Tests/Editor/HavenlineReferenceContractTests.cs" "close readable camera test"
          require_pattern 'MovementCarryAndAutomaticActionRangesUseTheLockedDesign' "$root/Assets/Havenline/Tests/Editor/HavenlineReferenceContractTests.cs" "movement/carry/action-range test"
          require_pattern 'PlayerSpawn = new(0f, 0.08f, 6.2f)' "$root/Assets/Havenline/Runtime/HavenlineReference.cs" "locked player spawn"

          require_pattern '[ExecuteAlways]' "$root/Assets/Havenline/Runtime/HavenlineHud.cs" "edit-time foldable HUD execution"
          require_pattern 'Canvas.preWillRenderCanvases' "$root/Assets/Havenline/Runtime/HavenlineHud.cs" "pre-render adaptive HUD layout"
          require_pattern 'FoldableAspectThreshold = 1.45f' "$root/Assets/Havenline/Runtime/HavenlineHud.cs" "foldable aspect threshold"

          require_pattern 'public static void BuildAndroidReviewCandidate()' "$root/Assets/Havenline/Editor/HavenlineBuildPipeline.cs" "device-test Android build stage"
          require_pattern 'public static void BuildVerifiedReleaseCandidate()' "$root/Assets/Havenline/Editor/HavenlineBuildPipeline.cs" "verified-release Android build stage"
          require_pattern 'HavenlinePremiumSceneAuthoring.Author(manifest)' "$root/Assets/Havenline/Editor/HavenlineBuildPipeline.cs" "premium scene authoring call"
          require_pattern 'public static void Bootstrap()' "$root/Assets/Havenline/Editor/HavenlineAssetBootstrap.cs" "reference-art bootstrap entry point"

          require_pattern 'public static void PrepareGeneratedProductionContent()' "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "deterministic production preparation entry point"
          require_pattern 'HavenlineProceduralArtStudio.GenerateForCi();' "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "deterministic asset generation before gate"
          require_pattern 'HavenlinePremiumBuildGate.InspectProductionContent();' "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "strict premium inspection after generation"
          require_pattern 'public static void BuildAndroidDeviceTest()' "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "prepared device-test entry point"
          require_pattern 'public static void BuildVerifiedRelease()' "$root/Assets/Havenline/Editor/HavenlineCiBuildEntryPoints.cs" "prepared verified-release entry point"
          require_pattern 'HavenlineCiBuildEntryPoints.BuildAndroidDeviceTest' ".github/workflows/havenline-unity-android-build.yml" "workflow uses prepared device-test method"
          require_pattern 'HavenlineCiBuildEntryPoints.BuildVerifiedRelease' ".github/workflows/havenline-unity-android-build.yml" "workflow uses prepared verified-release method"

          if grep -RIl --include='*.cs' --include='*.json' -E 'Godot|project\.godot|extends Node' "$root"; then
            echo 'Forbidden legacy-engine content found in the clean HAVENLINE Unity source.' >&2
            exit 1
          fi

          # Validator copy may legitimately discuss prohibited placeholder objects. Only
          # fail on actionable implementation markers, not on the English word itself.
          if grep -RIl --include='*.cs' --include='*.json' \
              -E 'TODO[[:space:]]*[:(]|FIXME[[:space:]]*[:(]|NotImplementedException|PLACEHOLDER_(ASSET|MODEL|TEXTURE|AUDIO|LOGIC)' \
              "$root"; then
            echo 'Unfinished implementation marker found in the clean HAVENLINE Unity source.' >&2
            exit 1
          fi

      - name: Parse reference JSON and validate gameplay obligations
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("HAVENLINE_UNITY")
          contract = json.loads((root / "Assets/Havenline/Reference/HAVENLINE_REFERENCE_CONTRACT.json").read_text())
          manifest = json.loads((root / "Packages/manifest.json").read_text())

          assert contract["product"] == "HAVENLINE"
          assert contract["unityEditor"] == "6000.3.18f1"
          assert contract["referencePackage"]["sizeBytes"] == 107695534
          assert contract["referencePackage"]["sha256"] == "17996ba270e6b56505d3273fca1915f977f6d892b4949f37c66098ac6efcfa67"
          assert contract["camera"] == {
              "projection": "orthographic",
              "size": 14.8,
              "offset": [0.0, 7.0, 7.0],
              "focusHeight": 0.82,
              "lookAhead": 1.15,
          }
          assert contract["player"]["spawn"] == [0.0, 0.08, 6.2]
          assert contract["player"]["carryCapacity"] == 6
          required = {
              "screen-relative movement",
              "automatic gathering",
              "visible carrying",
              "automatic furnace deposit",
              "furnace upgrades",
              "expanding warmth zone",
              "survivor rescue",
              "helper gathering and delivery",
              "barricade repair",
              "animated wolf pressure",
              "bounded world and fall recovery",
              "Galaxy Z Fold safe-area HUD",
          }
          assert required == set(contract["requiredLoop"])
          assert manifest["dependencies"]["com.unity.cloud.gltfast"] == "6.19.0"
          assert manifest["dependencies"]["com.unity.inputsystem"] == "1.17.0"
          assert manifest["dependencies"]["com.unity.render-pipelines.universal"] == "17.3.0"
          print("HAVENLINE connected Unity project contract passed.")

      - name: Inventory normal source files
        shell: bash
        run: |
          set -euo pipefail
          find HAVENLINE_UNITY -type f -print | sort | tee havenline-clean-source-inventory.txt
          test "$(find HAVENLINE_UNITY/Assets/Havenline -name '*.cs' | wc -l)" -ge 10

      - name: Upload source-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-clean-source-gate-${{ github.run_number }}
          retention-days: 30
          path: havenline-clean-source-inventory.txt
