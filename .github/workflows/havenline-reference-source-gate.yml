name: HAVENLINE Clean Unity Source Gate

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - HAVENLINE_UNITY/**
      - HAVENLINE_WEB/shared/HAVENLINE_REFERENCE_CONTRACT.json
      - .github/workflows/havenline-reference-source-gate.yml
      - .github/workflows/havenline-unity-android-build.yml
  pull_request:
    branches:
      - main
    paths:
      - HAVENLINE_UNITY/**
      - HAVENLINE_WEB/shared/HAVENLINE_REFERENCE_CONTRACT.json
      - .github/workflows/havenline-reference-source-gate.yml
      - .github/workflows/havenline-unity-android-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havenline-clean-unity-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch or pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate required HAVENLINE source files
        shell: bash
        run: |
          set -euo pipefail
          root=HAVENLINE_UNITY

          required=(
            "$root/ProjectSettings/ProjectVersion.txt"
            "$root/Packages/manifest.json"
            "$root/Assets/Havenline/Reference/HAVENLINE_REFERENCE_CONTRACT.json"
            "$root/Assets/Havenline/Runtime/HavenlineReference.cs"
            "$root/Assets/Havenline/Runtime/HavenlineInventory.cs"
            "$root/Assets/Havenline/Runtime/HavenlineCarryVisual.cs"
            "$root/Assets/Havenline/Runtime/HavenlineAutomaticActionController.cs"
            "$root/Assets/Havenline/Runtime/HavenlineCharacterRoster.cs"
            "$root/Assets/Havenline/Runtime/HavenlineCoreCrewRuntimeBootstrap.cs"
            "$root/Assets/Havenline/Runtime/HavenlineHud.cs"
            "$root/Assets/Havenline/Editor/HavenlineCharacterApprovalGate.cs"
            "$root/Assets/Havenline/Editor/HavenlineCharacterBuildPreprocessor.cs"
            "$root/Assets/Havenline/Editor/HavenlineProductionCharacterAssetBuilder.cs"
            "$root/Assets/Havenline/Editor/HavenlineCoreCrewScenePostprocessor.cs"
            "$root/Assets/Havenline/Tests/Editor/HavenlineReferenceContractTests.cs"
            "$root/Assets/Havenline/Tests/Editor/HavenlineJsonRuntimeContractTests.cs"
            "$root/REFERENCE_GAMEPLAY_LOCK.md"
            "HAVENLINE_WEB/shared/HAVENLINE_REFERENCE_CONTRACT.json"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required HAVENLINE file: $file" >&2; exit 1; }
          done

          grep -Fq 'm_EditorVersion: 6000.3.18f1' "$root/ProjectSettings/ProjectVersion.txt"
          grep -Fq 'public const bool UnlimitedCarry = true;' "$root/Assets/Havenline/Runtime/HavenlineReference.cs"
          grep -Fq 'public const int CarryCapacity = 0;' "$root/Assets/Havenline/Runtime/HavenlineReference.cs"
          grep -Fq 'public const int VisibleCarrySlots = 32;' "$root/Assets/Havenline/Runtime/HavenlineReference.cs"
          grep -Fq 'public bool IsFull => HasCarryLimit && Total >= capacity;' "$root/Assets/Havenline/Runtime/HavenlineInventory.cs"
          grep -Fq 'var accepted = HasCarryLimit' "$root/Assets/Havenline/Runtime/HavenlineInventory.cs"
          grep -Fq 'uncapped inventory' "$root/Assets/Havenline/Runtime/HavenlineCarryVisual.cs"
          grep -Fq 'LOAD {inventory.Total}' "$root/Assets/Havenline/Runtime/HavenlineHud.cs"
          grep -Fq 'SpawnCrew' "$root/Assets/Havenline/Runtime/HavenlineCoreCrewRuntimeBootstrap.cs"
          grep -Fq 'BuildApprovedGameplayRoster' "$root/Assets/Havenline/Editor/HavenlineCharacterBuildPreprocessor.cs"
          grep -Fq 'ApplyToShippingScene' "$root/Assets/Havenline/Editor/HavenlineCharacterBuildPreprocessor.cs"
          grep -Fq 'no gameplay cap' "$root/REFERENCE_GAMEPLAY_LOCK.md"
          grep -Fq 'example game is the gameplay, look, readability' "$root/REFERENCE_GAMEPLAY_LOCK.md"

          if grep -RIl --include='*.cs' --include='*.json' -E 'Godot|project\.godot|extends Node' "$root"; then
            echo 'Forbidden legacy-engine content found in HAVENLINE Unity source.' >&2
            exit 1
          fi

          if grep -RIl --include='*.cs' --include='*.json' \
              -E 'TODO[[:space:]]*[:(]|FIXME[[:space:]]*[:(]|NotImplementedException|PLACEHOLDER_(ASSET|MODEL|TEXTURE|AUDIO|LOGIC)' \
              "$root"; then
            echo 'Unfinished implementation marker found in HAVENLINE Unity source.' >&2
            exit 1
          fi

      - name: Parse runtime contract and require uncapped carrying
        shell: python
        run: |
          import json
          from pathlib import Path

          unity_path = Path('HAVENLINE_UNITY/Assets/Havenline/Reference/HAVENLINE_REFERENCE_CONTRACT.json')
          browser_path = Path('HAVENLINE_WEB/shared/HAVENLINE_REFERENCE_CONTRACT.json')
          assert unity_path.read_bytes() == browser_path.read_bytes(), 'Unity/browser runtime contracts drifted'

          contract = json.loads(unity_path.read_text())
          assert contract['contractVersion'] == '1.3.1'
          assert contract['product'] == 'HAVENLINE'
          assert contract['unityEditor'] == '6000.3.18f1'
          assert contract['referencePackage']['sha256'] == '17996ba270e6b56505d3273fca1915f977f6d892b4949f37c66098ac6efcfa67'

          player = contract['player']
          assert player['unlimitedCarry'] is True
          assert player['carryCapacity'] == 0
          assert player['visibleCarrySlots'] >= 24
          assert player['walkSpeed'] == 3.9
          assert player['runSpeed'] == 5.85

          crew = contract['characterSystem']
          assert crew['activeCrewSize'] == 4
          assert crew['startingPlayableLeads'] == ['Character1', 'Character2']
          assert crew['coreCompanions'] == ['Character3', 'Character4']
          assert crew['characters3And4LockedAtStart'] is False

          tuning = contract['openingLoopTuning']
          assert tuning['furnaceLevel2'] == {'wood': 18, 'stone': 6}
          assert tuning['northBarricadeBuild'] == {'wood': 8, 'stone': 3}
          assert tuning['firstWaveEnemyCount'] == 3
          assert tuning['automaticActionPriorities']['enemy'] == 200
          assert tuning['automaticActionPriorities']['construction'] == 80

          required = set(contract['requiredLoop'])
          assert 'uncapped visible carrying' in required
          assert 'automatic gathering' in required
          assert 'automatic furnace deposit' in required
          assert 'Character3 helper activity' in required
          assert 'Character4 helper activity' in required
          assert 'Galaxy Z Fold safe-area HUD' in required

          print('PASS: HAVENLINE source contract locks uncapped carrying and reference-game gameplay/presentation direction.')

      - name: Inventory normal source files
        shell: bash
        run: |
          set -euo pipefail
          find HAVENLINE_UNITY -type f -print | sort | tee havenline-clean-source-inventory.txt
          test "$(find HAVENLINE_UNITY/Assets/Havenline -name '*.cs' | wc -l)" -ge 10

      - name: Upload source-gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-clean-source-gate-${{ github.run_number }}
          retention-days: 30
          path: havenline-clean-source-inventory.txt
