name: My Study Companion Cloud Auth Inventory

on:
  push:
    branches:
      - agent/msc-0.15.15-ai-activity-rebuild
    paths:
      - .github/workflows/msc-cloud-auth-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' && 'yes' || 'no' }}
      HAS_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS != '' && 'yes' || 'no' }}
      HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' && 'yes' || 'no' }}
      HAS_GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' && 'yes' || 'no' }}
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' && 'yes' || 'no' }}
      HAS_GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY != '' && 'yes' || 'no' }}
      HAS_GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS != '' && 'yes' || 'no' }}
      HAS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && 'yes' || 'no' }}
      HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' && 'yes' || 'no' }}
      HAS_MSC_GCP_CREDENTIALS: ${{ secrets.MSC_GCP_CREDENTIALS != '' && 'yes' || 'no' }}
      HAS_MSC_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.MSC_GCP_SERVICE_ACCOUNT_KEY != '' && 'yes' || 'no' }}
      HAS_MSC_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.MSC_FIREBASE_SERVICE_ACCOUNT != '' && 'yes' || 'no' }}
      HAS_OPENAI_API_KEY: ${{ secrets.MSC_OPENAI_API_KEY != '' && 'yes' || 'no' }}
    steps:
      - name: Record non-secret credential availability
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'This report contains availability flags only; no secret values are printed.'
            env | grep '^HAS_' | sort
          } | tee cloud-auth-inventory.txt

      - name: Upload inventory
        uses: actions/upload-artifact@v6
        with:
          name: msc-cloud-auth-inventory
          path: cloud-auth-inventory.txt
          retention-days: 1
          if-no-files-found: error
