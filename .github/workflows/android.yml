name: KREATIV Studio Android

on:
  workflow_dispatch:
  push:
    branches: [ main, agent/kreativ-studio-v0.1 ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kreativ-android-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Firebase Android client values are public application configuration.
      # This verification job never receives the private signing key and never
      # publishes an installable APK.
      ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID: 949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com
      ORG_GRADLE_PROJECT_KREATIV_OLIVIA_FIREBASE_UID: ${{ secrets.KREATIV_OLIVIA_FIREBASE_UID }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_API_KEY: AIzaSyDze_icg2SIo2h-PV9SFAW1CBFcjMhp-MI
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID: 1:949620144971:android:63fec0446e8549d25946ce
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID: my-study-companion-abc01
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_STORAGE_BUCKET: my-study-companion-abc01.firebasestorage.app

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Lint, unit tests, and compile verification
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify Firebase, canvas, lesson, and Mentor configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'my-study-companion-abc01' app/build/generated/source/buildConfig/debug
          grep -R -Fq '1:949620144971:android:63fec0446e8549d25946ce' app/build/generated/source/buildConfig/debug
          grep -R -Fq '949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com' app/build/generated/source/buildConfig/debug
          grep -Fq 'KreativSketchbookStudioHost' app/src/main/java/com/kreativstudio/app/MainActivity.kt
          grep -Fq 'LayoutParams.MATCH_PARENT' app/src/main/java/com/kreativstudio/app/ui/KreativAdaptiveCanvas.kt
          ! grep -Fq 'ceil(width / .9f)' app/src/main/java/com/kreativstudio/app/ui/KreativAdaptiveCanvas.kt
          grep -Fq 'KreativLessonWorkspaceHost' app/src/main/java/com/kreativstudio/app/MainActivity.kt
          grep -Fq 'KreativMentorV2Host' app/src/main/java/com/kreativstudio/app/MainActivity.kt
          grep -Fq 'WindowInfoTracker' app/src/main/java/com/kreativstudio/app/ui/AdaptiveWindowState.kt
          grep -Fq 'ProjectBitmapRenderer.render' app/src/main/java/com/kreativstudio/app/ai/CanvasAwareMentorEngine.kt
          grep -Fq 'recordLessonAssessment' app/src/main/java/com/kreativstudio/app/ui/KreativLessonWorkspace.kt
          grep -Fq 'ToolType.SELECT -> Icons.Default.SelectAll' app/src/main/java/com/kreativstudio/app/ui/KreativSketchbookStudio.kt
          grep -Fq 'ToolType.PEN -> Icons.Default.BorderColor' app/src/main/java/com/kreativstudio/app/ui/KreativSketchbookStudio.kt

      - name: Enable KVM group access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mentor, lesson, and new-canvas route smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload test diagnostics only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KREATIV-Studio-0.1.10-test-diagnostics
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record distribution block
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/DISTRIBUTION-BLOCKED.txt <<EOF
          Commit: $GITHUB_SHA
          Result: source verification only.
          No APK was published by this workflow.
          The only authorized APK path is the dedicated authenticated private-alpha
          workflow after live Firebase readiness and permanent signer verification.
          EOF

      - name: Upload distribution-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: KREATIV-Studio-0.1.10-distribution-gate
          path: dist/DISTRIBUTION-BLOCKED.txt
          if-no-files-found: error
          retention-days: 7
