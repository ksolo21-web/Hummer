name: Android Signing Tools

on:
  workflow_dispatch:
  push:
    branches: [ agent/kreativ-studio-v0.1 ]
    paths:
      - '.github/workflows/android-signing-tools.yml'

permissions:
  contents: read

jobs:
  package-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"

      - name: Package signing utilities and host runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" signing-tools/lib64/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload signing utilities
        uses: actions/upload-artifact@v7
        with:
          name: android-build-tools-36-signing-complete
          path: signing-tools
          if-no-files-found: error
