name: KREATIV 0.1.10 Root-Fix Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kreativ-auth-cloud-root-fix
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/kreativ-auth-cloud-root-fix-build.yml'

permissions:
  contents: read

concurrency:
  group: kreativ-auth-cloud-root-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  KREATIV_GOOGLE_WEB_CLIENT_ID: 949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com
  KREATIV_FIREBASE_API_KEY: AIzaSyDze_icg2SIo2h-PV9SFAW1CBFcjMhp-MI
  KREATIV_FIREBASE_APP_ID: 1:949620144971:android:63fec0446e8549d25946ce
  KREATIV_FIREBASE_PROJECT_ID: my-study-companion-abc01
  KREATIV_FIREBASE_STORAGE_BUCKET: my-study-companion-abc01.firebasestorage.app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out root-fix source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build configured intermediate APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            -PKREATIV_GOOGLE_WEB_CLIENT_ID="$KREATIV_GOOGLE_WEB_CLIENT_ID" \
            -PKREATIV_FIREBASE_API_KEY="$KREATIV_FIREBASE_API_KEY" \
            -PKREATIV_FIREBASE_APP_ID="$KREATIV_FIREBASE_APP_ID" \
            -PKREATIV_FIREBASE_PROJECT_ID="$KREATIV_FIREBASE_PROJECT_ID" \
            -PKREATIV_FIREBASE_STORAGE_BUCKET="$KREATIV_FIREBASE_STORAGE_BUCKET"

      - name: Stage unsigned root-fix package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/KREATIV-Studio-v0.1.10-root-fix-intermediate.apk
          sha256sum dist/KREATIV-Studio-v0.1.10-root-fix-intermediate.apk \
            > dist/KREATIV-Studio-v0.1.10-root-fix-intermediate.sha256
          cat > dist/BUILD-IDENTITY.txt <<'EOF'
          Package: com.kreativstudio.app
          Version: 0.1.10-dev (versionCode 10)
          OAuth signer required (SHA-1): 5C:79:A8:F7:52:9B:0A:93:A2:69:AA:B1:67:6B:AE:9B:CE:B6:14:59
          OAuth signer required (SHA-256): 07:F0:25:19:C0:BD:05:62:F8:88:B2:FB:F1:F2:9B:1E:0B:43:1D:39:B9:1B:36:8C:72:04:29:D7:5D:84:D2:8D
          This Actions artifact is an intermediate package. Distribution requires signing with the recovered original KREATIV private-alpha key.
          EOF

      - name: Upload intermediate build
        uses: actions/upload-artifact@v4
        with:
          name: kreativ-0.1.10-root-fix-intermediate
          path: dist/*
          if-no-files-found: error
          retention-days: 3
