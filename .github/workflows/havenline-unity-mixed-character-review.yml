name: Render HAVENLINE Exact-Artifact Unity Character Review

on:
  workflow_dispatch:
    inputs:
      character1_artifact_id:
        description: Immutable Character 1 TRELLIS production artifact ID
        required: true
        type: string
      character2_artifact_id:
        description: Immutable Character 2 TRELLIS production artifact ID
        required: true
        type: string
      character3_artifact_id:
        description: Immutable Character 3 SF3D RTX production artifact ID
        required: true
        type: string
      character4_artifact_id:
        description: Immutable Character 4 SF3D RTX production artifact ID
        required: true
        type: string
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.tooling/havenline-unity-mixed-review-request.json'
      - '.tooling/havenline-character-production/download_character_artifacts.py'
      - '.tooling/havenline-character-production/stage_unity_character_review_sources.py'
      - '.tooling/havenline-character-production/build_unity_character_comparisons.py'
      - '.github/workflows/havenline-unity-mixed-character-review.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-exact-artifact-unity-character-review
  cancel-in-progress: true

jobs:
  unity-character-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact HAVENLINE source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve four immutable artifact IDs
        id: artifacts
        shell: python
        env:
          DISPATCH_CHARACTER1: ${{ inputs.character1_artifact_id }}
          DISPATCH_CHARACTER2: ${{ inputs.character2_artifact_id }}
          DISPATCH_CHARACTER3: ${{ inputs.character3_artifact_id }}
          DISPATCH_CHARACTER4: ${{ inputs.character4_artifact_id }}
        run: |
          import json
          import os
          from pathlib import Path

          characters = ('Character1', 'Character2', 'Character3', 'Character4')
          dispatch = {
              'Character1': (os.environ.get('DISPATCH_CHARACTER1') or '').strip(),
              'Character2': (os.environ.get('DISPATCH_CHARACTER2') or '').strip(),
              'Character3': (os.environ.get('DISPATCH_CHARACTER3') or '').strip(),
              'Character4': (os.environ.get('DISPATCH_CHARACTER4') or '').strip(),
          }
          request_path = Path('.tooling/havenline-unity-mixed-review-request.json')
          request = json.loads(request_path.read_text()) if request_path.exists() else {}
          requested = request.get('characterArtifactIds', {}) if isinstance(request, dict) else {}
          resolved = {
              character: dispatch[character] or str(requested.get(character, '')).strip()
              for character in characters
          }
          for character, value in resolved.items():
              if not value.isdigit() or int(value) <= 0:
                  raise SystemExit(f'Positive immutable artifact ID required for {character}; found {value!r}')
          if len(set(resolved.values())) != 4:
              raise SystemExit('Each character must use a distinct artifact ID.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for character, value in resolved.items():
                  output.write(f'{character.lower()}_artifact_id={value}\n')
          print(json.dumps({'characterArtifactIds': resolved}, indent=2))

      - name: Download immutable character artifacts through the GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-production/download_character_artifacts.py \
            --repo ksolo21-web/Hummer \
            --artifact 'Character1=${{ steps.artifacts.outputs.character1_artifact_id }}' \
            --artifact 'Character2=${{ steps.artifacts.outputs.character2_artifact_id }}' \
            --artifact 'Character3=${{ steps.artifacts.outputs.character3_artifact_id }}' \
            --artifact 'Character4=${{ steps.artifacts.outputs.character4_artifact_id }}' \
            --output character_packages \
            --metadata character_packages/source-artifact-metadata.json

      - name: Verify machine evidence and stage exact production FBXs
        shell: bash
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-production/stage_unity_character_review_sources.py \
            --packages-root character_packages \
            --artifact-metadata character_packages/source-artifact-metadata.json \
            --unity-project HAVENLINE_UNITY

      - name: Materialize checksum-pinned authored references
        shell: bash
        run: python3 .tooling/havenline-character-reference-payload/materialize_references.py

      - name: Confirm Unity CI credentials exist
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            test -n "${!required:-}" || { echo "Missing Unity secret: $required" >&2; exit 1; }
          done

      - name: Render the exact four characters inside the authored Unity scene
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: HAVENLINE_UNITY
          unityVersion: 6000.3.18f1
          targetPlatform: Android
          buildMethod: Havenline.Editor.HavenlineCharacterUnityReview.CaptureFromCi
          buildsPath: Builds
          buildName: HAVENLINE-exact-artifact-character-review
          allowDirtyBuild: true

      - name: Build exact-reference versus Unity comparison sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-production/build_unity_character_comparisons.py \
            --review-directory HAVENLINE_UNITY/Builds/CharacterUnityReview \
            --source-evidence HAVENLINE_UNITY/Assets/Havenline/Generated/CharacterReviewSource

      - name: Verify complete review evidence remains pending
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          project = Path('HAVENLINE_UNITY')
          review = project / 'Builds/CharacterUnityReview'
          source = project / 'Assets/Havenline/Generated/CharacterReviewSource'
          required = [
              review / 'HAVENLINE-characters-in-game-with-ui.png',
              review / 'HAVENLINE-characters-in-game-clean.png',
              review / 'unity-character-review-report.json',
              review / 'comparison-manifest.json',
              source / 'source-run.json',
              source / 'source-artifact-set.json',
          ]
          for character in ('Character1', 'Character2', 'Character3', 'Character4'):
              required.extend(
                  review / f'HAVENLINE-{character}-unity-{view}.png'
                  for view in ('front', 'three-quarter', 'side', 'back')
              )
              required.append(review / 'Comparisons' / f'HAVENLINE-{character}-approved-vs-unity.png')
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size <= 0]
          if missing:
              raise SystemExit('Missing review evidence: ' + ', '.join(missing))

          report = json.loads((review / 'unity-character-review-report.json').read_text())
          comparison = json.loads((review / 'comparison-manifest.json').read_text())
          source_set = json.loads((source / 'source-artifact-set.json').read_text())
          for label, payload in (
              ('Unity report', report),
              ('comparison manifest', comparison),
              ('source artifact set', source_set),
          ):
              if payload.get('humanVisualApprovalRequired') is not True:
                  raise SystemExit(f'{label} bypassed human visual approval.')
              if payload.get('approved') is not False:
                  raise SystemExit(f'{label} was prematurely approved.')
          if report.get('allMachineEvidenceComplete') is not True:
              raise SystemExit('Unity machine evidence is incomplete.')
          if report.get('humanVisualReviewStatus') != 'pending':
              raise SystemExit('Unity visual review status must remain pending.')
          if comparison.get('humanVisualReviewStatus') != 'pending':
              raise SystemExit('Comparison review status must remain pending.')
          if source_set.get('unityIntegrated') is not False:
              raise SystemExit('Source artifacts were prematurely marked Unity-integrated.')

          manifest = {
              'schemaVersion': 1,
              'sourceCommit': '${{ github.sha }}',
              'workflowRunId': '${{ github.run_id }}',
              'humanVisualApprovalRequired': True,
              'humanVisualReviewStatus': 'pending',
              'approved': False,
              'files': [],
          }
          for path in sorted(set(required)):
              manifest['files'].append({
                  'path': str(path.as_posix()),
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          (review / 'exact-artifact-review-evidence.json').write_text(
              json.dumps(manifest, indent=2) + '\n'
          )
          print(json.dumps(manifest, indent=2))

      - name: Upload complete Unity character review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-exact-artifact-Unity-character-review-${{ github.run_id }}
          path: |
            HAVENLINE_UNITY/Builds/CharacterUnityReview/**
            HAVENLINE_UNITY/Assets/Havenline/Generated/CharacterReviewSource/**
            HAVENLINE_UNITY/Assets/Havenline/Art/Characters/Production/Character*/Character*_production.fbx
            character_packages/source-artifact-metadata.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Block automatic promotion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest=HAVENLINE_UNITY/Builds/CharacterUnityReview/comparison-manifest.json
          test -s "$manifest"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('HAVENLINE_UNITY/Builds/CharacterUnityReview/comparison-manifest.json').read_text())
          assert payload['humanVisualApprovalRequired'] is True
          assert payload['humanVisualReviewStatus'] == 'pending'
          assert payload['approved'] is False
          print('Unity evidence captured. Human four-view approval remains required; no production promotion occurred.')
          PY
