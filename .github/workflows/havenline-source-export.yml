name: HAVENLINE Verified Source Export

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/EXPORT_SOURCE

permissions:
  contents: write

concurrency:
  group: havenline-source-export
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out isolated HAVENLINE branch
        uses: actions/checkout@v4

      - name: Reconstruct checksum-locked source archive
        shell: bash
        run: |
          set -euo pipefail
          expected="1f3d736f4fbee7d7b6b8763db7e7b325fb3f456cf835fab7a33bb8657d8f83f7"
          archive="/tmp/Havenline-production-source-v0.2.0.tar.xz"
          cat HAVENLINE/source.v3.parts/part-*.b64 | base64 --decode > "$archive"
          echo "$expected  $archive" | sha256sum --check --strict
          test "$(stat -c '%s' "$archive")" = "35460"
          tar -tJf "$archive" > /tmp/havenline-source-files.txt
          mkdir -p HAVENLINE/source-export
          cp "$archive" HAVENLINE/source-export/
          cp /tmp/havenline-source-files.txt HAVENLINE/source-export/

      - name: Inspect official Quaternius animated wolf
        shell: bash
        env:
          PACK_URL: https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip
        run: |
          set -euo pipefail
          archive=/tmp/quaternius-animated-animals.zip
          extract=/tmp/quaternius-animated-animals
          curl --fail --location --retry 5 --retry-delay 4 --user-agent 'HAVENLINE-asset-validator/1.0' "$PACK_URL" -o "$archive"
          test -s "$archive"
          unzip -t "$archive" >/tmp/quaternius-zip-test.txt
          unzip -Z1 "$archive" >/tmp/quaternius-files.txt
          wolf_path="$(python3 - <<'PY'
from pathlib import Path
names = Path('/tmp/quaternius-files.txt').read_text(encoding='utf-8', errors='replace').splitlines()
candidates = [n for n in names if n.lower().endswith(('.fbx', '.glb', '.gltf')) and 'wolf' in Path(n).name.lower()]
if not candidates:
    raise SystemExit('No wolf model found in Quaternius archive')
print(sorted(candidates, key=lambda n: (0 if n.lower().endswith('.fbx') else 1, len(n), n.lower()))[0])
PY
)"
          mkdir -p "$extract"
          unzip -j "$archive" "$wolf_path" -d "$extract"
          wolf_file="$extract/$(basename "$wolf_path")"
          test -s "$wolf_file"
          jq -n \
            --arg source_url "$PACK_URL" \
            --arg license "CC0 1.0" \
            --arg archive_sha256 "$(sha256sum "$archive" | awk '{print $1}')" \
            --arg archive_bytes "$(stat -c '%s' "$archive")" \
            --arg wolf_archive_path "$wolf_path" \
            --arg wolf_sha256 "$(sha256sum "$wolf_file" | awk '{print $1}')" \
            --arg wolf_git_blob "$(git hash-object "$wolf_file")" \
            --arg wolf_bytes "$(stat -c '%s' "$wolf_file")" \
            --arg inspected_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_url:$source_url, license:$license, archive_sha256:$archive_sha256, archive_bytes:($archive_bytes|tonumber), wolf_archive_path:$wolf_archive_path, wolf_sha256:$wolf_sha256, wolf_git_blob:$wolf_git_blob, wolf_bytes:($wolf_bytes|tonumber), inspected_at:$inspected_at}' \
            > HAVENLINE/animated-wolf-probe.json
          cp /tmp/quaternius-files.txt HAVENLINE/animated-wolf-files.txt
          cat HAVENLINE/animated-wolf-probe.json

      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-source-v0.2.0
          retention-days: 7
          if-no-files-found: error
          path: HAVENLINE/source-export/

      - name: Record export and wolf probe
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg status "uploaded" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$GITHUB_SHA" \
            --arg archive_sha256 "1f3d736f4fbee7d7b6b8763db7e7b325fb3f456cf835fab7a33bb8657d8f83f7" \
            --arg exported_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status, workflow_run_id:($run_id|tonumber), head_sha:$head_sha, archive_sha256:$archive_sha256, exported_at:$exported_at}' \
            > HAVENLINE/source-export-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/source-export-run.json HAVENLINE/animated-wolf-probe.json HAVENLINE/animated-wolf-files.txt
          git commit -m "Record HAVENLINE source export and animated wolf hashes"
          git push
