name: Build Portable OrcaSlicer Runtime

on:
  push:
    paths:
      - '.tooling/orca-runtime-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libjavascriptcoregtk-4.1-0 \
            libmspack0 \
            libsecret-1-0 \
            libopengl0 \
            libglu1-mesa \
            libgtk-3-0 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgdk-pixbuf-2.0-0 \
            shared-mime-info \
            xvfb

      - name: Download and extract latest official OrcaSlicer
        id: orca
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest)"
          TAG="$(jq -r '.tag_name' <<<"$JSON")"
          URL="$(jq -r '[.assets[] | select(.name | test("OrcaSlicer_Linux_AppImage_Ubuntu2404_V.*\\.AppImage$"; "i"))][0].browser_download_url' <<<"$JSON")"
          DIGEST="$(jq -r '[.assets[] | select(.name | test("OrcaSlicer_Linux_AppImage_Ubuntu2404_V.*\\.AppImage$"; "i"))][0].digest' <<<"$JSON")"
          test -n "$URL" -a "$URL" != null
          curl --fail --location --retry 5 --retry-all-errors --output OrcaSlicer.AppImage "$URL"
          chmod +x OrcaSlicer.AppImage
          ACTUAL="$(sha256sum OrcaSlicer.AppImage | cut -d' ' -f1)"
          if [[ "$DIGEST" == sha256:* ]]; then test "$ACTUAL" = "${DIGEST#sha256:}"; fi
          ./OrcaSlicer.AppImage --appimage-extract >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Add WebKitGTK and recursive shared-library runtime
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/squashfs-root"
          RUNTIME="$APPDIR/lib/orca-runtime"
          mkdir -p "$APPDIR/lib" "$RUNTIME" "$APPDIR/libexec/gstreamer-1.0" "$APPDIR/lib/gio"

          copy_first() {
            local pattern="$1" dest="$2" file
            file="$(find /usr/lib /lib -type f -o -type l 2>/dev/null | grep -E "/$pattern$" | head -1 || true)"
            test -n "$file"
            cp -L "$file" "$dest/"
          }

          copy_first 'libwebkit2gtk-4\.1\.so\.0(\..*)?' "$APPDIR/lib"
          copy_first 'libjavascriptcoregtk-4\.1\.so\.0(\..*)?' "$APPDIR/lib"
          copy_first 'libmspack\.so\.0(\..*)?' "$APPDIR/lib"
          copy_first 'libsecret-1\.so\.0(\..*)?' "$APPDIR/lib"

          if [ -d /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1 ]; then
            cp -a /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1 "$APPDIR/lib/"
          fi
          if [ -x /usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner ]; then
            cp -L /usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner "$APPDIR/libexec/gstreamer-1.0/"
          fi
          if [ -d /usr/lib/x86_64-linux-gnu/gio/modules ]; then
            cp -a /usr/lib/x86_64-linux-gnu/gio/modules "$APPDIR/lib/gio/"
          fi
          if [ -d /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0 ]; then
            cp -a /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0 "$APPDIR/lib/"
          fi
          if [ -x /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders ]; then
            cp -L /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders "$APPDIR/libexec/"
          elif command -v gdk-pixbuf-query-loaders >/dev/null; then
            cp -L "$(command -v gdk-pixbuf-query-loaders)" "$APPDIR/libexec/"
          fi
          mkdir -p "$APPDIR/share/glib-2.0"
          cp -a /usr/share/glib-2.0/schemas "$APPDIR/share/glib-2.0/"

          declare -A SEEN
          queue=(
            "$APPDIR/bin/orca-slicer"
            "$APPDIR/lib/libwebkit2gtk-4.1.so.0"
            "$APPDIR/lib/libjavascriptcoregtk-4.1.so.0"
            "$APPDIR/lib/libmspack.so.0"
            "$APPDIR/lib/libsecret-1.so.0"
          )
          while [ "${#queue[@]}" -gt 0 ]; do
            target="${queue[0]}"
            queue=("${queue[@]:1}")
            [ -e "$target" ] || continue
            while read -r lib; do
              [ -e "$lib" ] || continue
              base="$(basename "$lib")"
              case "$base" in
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux-*.so.*) continue ;;
              esac
              if [ -z "${SEEN[$lib]+x}" ]; then
                SEEN[$lib]=1
                cp -L "$lib" "$RUNTIME/$base"
                queue+=("$lib")
              fi
            done < <(ldd "$target" 2>/dev/null | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}')
          done

          cat > "$APPDIR/orcaslicer-headless" <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export APPDIR="$HERE"
          export LD_LIBRARY_PATH="$HERE/lib:$HERE/lib/orca-runtime:$HERE/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LIBGL_ALWAYS_SOFTWARE=1
          exec "$HERE/AppRun" "$@"
          EOF
          chmod +x "$APPDIR/orcaslicer-headless"

          xvfb-run -a "$APPDIR/orcaslicer-headless" --help >/tmp/orca-help.txt 2>&1 || true
          head -40 /tmp/orca-help.txt

      - name: Package and split portable runtime
        id: split
        shell: bash
        run: |
          set -euo pipefail
          tar --format=posix -cf orcaslicer-portable.tar squashfs-root
          mkdir -p parts
          split -b 240M -d -a 2 orcaslicer-portable.tar parts/part-
          sha256sum orcaslicer-portable.tar > parts/ORIGINAL-SHA256SUMS.txt
          sha256sum parts/part-* > parts/PARTS-SHA256SUMS.txt
          COUNT="$(find parts -maxdepth 1 -name 'part-*' -type f | wc -l | tr -d ' ')"
          echo "part_count=$COUNT" >> "$GITHUB_OUTPUT"
          ls -lh orcaslicer-portable.tar parts/

      - name: Upload part 00
        id: p0
        if: ${{ hashFiles('parts/part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-portable-part-00
          path: parts/part-00
          compression-level: 0
          retention-days: 7

      - name: Upload part 01
        id: p1
        if: ${{ hashFiles('parts/part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-portable-part-01
          path: parts/part-01
          compression-level: 0
          retention-days: 7

      - name: Upload part 02
        id: p2
        if: ${{ hashFiles('parts/part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-portable-part-02
          path: parts/part-02
          compression-level: 0
          retention-days: 7

      - name: Upload part 03
        id: p3
        if: ${{ hashFiles('parts/part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-portable-part-03
          path: parts/part-03
          compression-level: 0
          retention-days: 7

      - name: Upload checksums
        id: sums
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-portable-checksums
          path: |
            parts/ORIGINAL-SHA256SUMS.txt
            parts/PARTS-SHA256SUMS.txt
          retention-days: 7

      - name: Record portable-runtime artifacts
        shell: bash
        env:
          TAG: ${{ steps.orca.outputs.tag }}
          DIGEST: ${{ steps.orca.outputs.digest }}
          COUNT: ${{ steps.split.outputs.part_count }}
          P0: ${{ steps.p0.outputs.artifact-id }}
          P1: ${{ steps.p1.outputs.artifact-id }}
          P2: ${{ steps.p2.outputs.artifact-id }}
          P3: ${{ steps.p3.outputs.artifact-id }}
          SUMS: ${{ steps.sums.outputs.artifact-id }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" --arg digest "$DIGEST" --arg count "$COUNT" \
            --arg p0 "$P0" --arg p1 "$P1" --arg p2 "$P2" --arg p3 "$P3" --arg sums "$SUMS" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{status:"complete", release:$tag, appimage_sha256:$digest, part_count:($count|tonumber), artifact_ids:[$p0,$p1,$p2,$p3|select(length>0)|tonumber], checksums_artifact_id:($sums|tonumber), run_id:$run_id, run_url:$run_url}' \
            > .tooling/orca-runtime-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/orca-runtime-status.json
          git commit -m 'Record portable OrcaSlicer runtime artifacts'
          git push
