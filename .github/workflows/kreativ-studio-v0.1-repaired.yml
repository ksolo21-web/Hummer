name: KREATIV Studio v0.1 Repaired APK

on:
  push:
    branches:
      - agent/kreativ-studio-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kreativ-studio-v0.1-repaired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID: ${{ secrets.KREATIV_GOOGLE_WEB_CLIENT_ID }}
      ORG_GRADLE_PROJECT_KREATIV_OLIVIA_FIREBASE_UID: ${{ secrets.KREATIV_OLIVIA_FIREBASE_UID }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_API_KEY: ${{ secrets.KREATIV_FIREBASE_API_KEY }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID: ${{ secrets.KREATIV_FIREBASE_APP_ID }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID: ${{ secrets.KREATIV_FIREBASE_PROJECT_ID }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_STORAGE_BUCKET: ${{ secrets.KREATIV_FIREBASE_STORAGE_BUCKET }}
      ORG_GRADLE_PROJECT_KREATIV_FIREBASE_AI_MODEL: ${{ secrets.KREATIV_FIREBASE_AI_MODEL }}

    steps:
      - name: Check out KREATIV branch
        uses: actions/checkout@v4

      - name: Verify and expand source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            KREATIVStudio-bootstrap/repair2/part00.* \
            KREATIVStudio-bootstrap/source.part01 \
            KREATIVStudio-bootstrap/source.part02 \
            KREATIVStudio-bootstrap/repair2/part03.* \
            KREATIVStudio-bootstrap/source.part04 \
            KREATIVStudio-bootstrap/source.part05 \
            KREATIVStudio-bootstrap/source.part06 \
            | base64 --decode > KREATIVStudio-source.zip
          echo '5cf5192e9182b064e4571db8f07b746aa50f1db711d66d3ac017e1b3a689cb1b  KREATIVStudio-source.zip' | sha256sum -c -
          mkdir -p KREATIVStudio
          unzip -q KREATIVStudio-source.zip -d KREATIVStudio
          test -f KREATIVStudio/settings.gradle.kts
          test -f KREATIVStudio/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests and debug APK
        working-directory: KREATIVStudio
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK='KREATIVStudio/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee KREATIVStudio/APK-IDENTITY.txt
          grep -q "package: name='com.kreativstudio.app'" KREATIVStudio/APK-IDENTITY.txt
          grep -q "application-label:'KREATIV Studio'" KREATIVStudio/APK-IDENTITY.txt
          sha256sum "$APK" | tee KREATIVStudio/KREATIV-Studio-v0.1-debug.apk.sha256
          cp "$APK" KREATIVStudio/KREATIV-Studio-v0.1-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KREATIV-Studio-v0.1-debug-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            KREATIVStudio/KREATIV-Studio-v0.1-debug.apk
            KREATIVStudio/KREATIV-Studio-v0.1-debug.apk.sha256
            KREATIVStudio/APK-IDENTITY.txt
