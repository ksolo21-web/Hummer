name: My Study Companion 0.14.1 Signing Key Audit

on:
  push:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
    paths:
      - .msc-build/run-signing-key-audit.trigger

permissions:
  contents: read

jobs:
  audit-preserved-signers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Find and fingerprint every preserved keystore payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          : > MSC-SIGNING-KEY-AUDIT.txt
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              temp="$(mktemp)"
              decoded="$(mktemp)"
              git show "$ref:$path" > "$temp"
              if base64 --decode "$temp" > "$decoded" 2>/dev/null; then
                echo "branch=$branch" >> MSC-SIGNING-KEY-AUDIT.txt
                echo "path=$path" >> MSC-SIGNING-KEY-AUDIT.txt
                keytool -list -v -keystore "$decoded" -storepass android -alias androiddebugkey 2>/dev/null \
                  | grep -E 'Owner:|SHA1:|SHA256:' >> MSC-SIGNING-KEY-AUDIT.txt || true
                echo >> MSC-SIGNING-KEY-AUDIT.txt
              fi
              rm -f "$temp" "$decoded"
            done < <(git ls-tree -r --name-only "$ref" | grep -E '(keystore|jks).*\.b64$' || true)
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          cat MSC-SIGNING-KEY-AUDIT.txt
          grep -Fq '19:97:D4:21:D1:77:21:5A:44:F9:65:1C:E5:3D:BA:EC:15:2F:BC:49' MSC-SIGNING-KEY-AUDIT.txt \
            && echo 'MATCHING_FIREBASE_SIGNER_FOUND=true' \
            || echo 'MATCHING_FIREBASE_SIGNER_FOUND=false'
      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.1-signing-key-audit
          path: MSC-SIGNING-KEY-AUDIT.txt
          retention-days: 7
