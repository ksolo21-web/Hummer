name: HAVENLINE Font Fix

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - .github/workflows/havenline-fix-font-generation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0
      - name: Patch production font creation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs")
          source = path.read_text(encoding="utf-8")
          old = (
              "            AssetDatabase.DeleteAsset(FontPath);\n"
              "            var source = Resources.GetBuiltinResource<Font>(\"LegacyRuntime.ttf\");\n"
              "            if (source == null)\n"
              "                throw new InvalidOperationException(\"Unity runtime font resource is unavailable.\");\n"
              "            var font = UnityEngine.Object.Instantiate(source);\n"
              "            font.name = \"HAVENLINE_UI_Rounded\";\n"
              "            AssetDatabase.CreateAsset(font, FontPath);\n"
          )
          new = (
              "            AssetDatabase.DeleteAsset(FontPath);\n"
              "            var font = Font.CreateDynamicFontFromOSFont(\n"
              "                new[] { \"Roboto\", \"Noto Sans\", \"DejaVu Sans\", \"Arial\", \"sans-serif\" },\n"
              "                32);\n"
              "            if (font == null)\n"
              "                throw new InvalidOperationException(\"No supported system font was available for HAVENLINE UI generation.\");\n"
              "            font.name = \"HAVENLINE_UI_Rounded\";\n"
              "            AssetDatabase.CreateAsset(font, FontPath);\n"
          )
          if old not in source:
              raise SystemExit("Font authoring target was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs
          git commit -m "Generate production UI font without dynamic cloning"
          git push origin HEAD:havenline-unity-reference-rebuild
