name: Public north Rochester building and street check
on:
  push:
    branches: [public-rochester-building-check-20260915]
    paths: [.github/workflows/public-rochester-building-check.yml]
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public geographic evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import concurrent.futures, hashlib, json, time, urllib.parse, urllib.request
          D=Path('data');D.mkdir(exist_ok=True);receipts=[]
          bbox='-83.177,42.691,-83.130,42.727'
          def get(name,url):
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'Public-Geographic-Source-Verification/1.1'})
                      with urllib.request.urlopen(request,timeout=80) as response:
                          raw=response.read();ctype=response.headers.get('Content-Type');code=response.status
                      (D/name).write_bytes(raw)
                      receipts.append(dict(file=name,url=url,retrieved_at_utc=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),content_type=ctype,http_status=code))
                      return raw
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2*(attempt+1))
          def layer(name,url):
              try:
                  meta=json.loads(get(name+'-metadata.json',url+'?f=pjson'))
                  fields=meta.get('fields',[])
                  oid=meta.get('objectIdField') or next((f['name'] for f in fields if f['type']=='esriFieldTypeOID'),'OBJECTID')
                  wanted={'building_id','loadd1','hiadd1','street1','loadd2','hiadd2','street2','housing_units','build_type','year_built','stories','apn','city_id','parcel_id','zipcode','aka','address','keypin','pin','source','median_hgt','height','shape_area','shape_length','street','low_address','high_address','loadd','hiadd','house_number','fulladdress','siteaddress','sitecity','sitestate','sitezip5','classcode','structure_desc','revisiondate','landusecode','landuse','localfips','lowaddressleft','highaddressleft','lowaddressright','highaddressright','directionalprefix','streetname','streettype','directionalsuffix','cartographicname','surfacetype','roadcode','act51roadtype','jurisdictionname','traveldirection','cvttaxnameleft','cvttaxnameright','cvttaxdescription'}
                  chosen=[f['name'] for f in fields if f['name'].lower() in wanted or f['name']==oid]
                  query=dict(f='json',where='1=1',geometry=bbox,geometryType='esriGeometryEnvelope',inSR=4326,spatialRel='esriSpatialRelIntersects')
                  ids=json.loads(get(name+'-ids.json',url+'/query?'+urllib.parse.urlencode(dict(query,returnIdsOnly='true'))))
                  count=json.loads(get(name+'-count.json',url+'/query?'+urllib.parse.urlencode(dict(query,returnCountOnly='true'))))
                  if 'error' in ids or 'error' in count:raise RuntimeError(str((ids,count)))
                  allids=sorted(ids.get('objectIds') or []);features=[]
                  assert len(allids)==count['count']
                  for i in range(0,len(allids),150):
                      q=dict(f='json',objectIds=','.join(map(str,allids[i:i+150])),outFields=','.join(chosen),returnGeometry='true',outSR=4326)
                      page=json.loads(get(f'{name}-page-{i}.json',url+'/query?'+urllib.parse.urlencode(q)))
                      if page.get('exceededTransferLimit') or 'error' in page:raise RuntimeError(str(page)[:500])
                      features.extend(page.get('features',[]))
                  oid=ids.get('objectIdFieldName') or oid
                  assert sorted(f['attributes'][oid] for f in features)==allids
                  (D/(name+'.json')).write_text(json.dumps(dict(spatialReference={'wkid':4326},features=features)))
                  return dict(dataset=name,status='complete',bbox=bbox,expected=len(allids),returned=len(features),object_id_field=oid,source=url,requested_fields=chosen)
              except Exception as error:return dict(dataset=name,status='failed',error=str(error))
          layers=[
          ('semcog-points','https://gis.semcog.org/server/rest/services/Hosted/Building_Points/FeatureServer/34'),
          ('semcog-2020','https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints__2020/FeatureServer/60'),
          ('county-footprints','https://gisservices.oakgov.com/arcgisds/rest/services/Hosted/Building_Outline/FeatureServer/30'),
          ('roads','https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseTransportationDataMapService/MapServer/0'),
          ('landuse','https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseOpenPlanningMapService/MapServer/4'),
          ('parcels','https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseOpenParcelDataMapService/MapServer/1')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor: status=list(executor.map(lambda p:layer(*p),layers))
          for name,bb in [('osm-west','-83.177,42.691,-83.151,42.711'),('osm-east','-83.155,42.691,-83.130,42.710'),('osm-north','-83.163,42.708,-83.136,42.727')]:
              try:
                  get(name+'.osm','https://api.openstreetmap.org/api/0.6/map?bbox='+bb)
                  status.append(dict(dataset=name,status='complete',bbox=bb))
              except Exception as error:status.append(dict(dataset=name,status='failed',error=str(error)))
          try:
              get('rochester-club-official.html','https://www.rochesterclubapartments.com/mapsanddirections')
          except Exception as error: status.append(dict(dataset='property-official',status='failed',error=str(error)))
          (D/'COMPLETENESS.json').write_text(json.dumps(status,indent=2))
          (D/'RECEIPTS.json').write_text(json.dumps(receipts,indent=2))
          (D/'PROVENANCE.json').write_text(json.dumps(dict(bbox=bbox,scope='Public geographic building addresses, physical building footprints, land use and public street evidence only. No private assignment maps, resident names, owner names, credentials or financial values supplied.',recency='Layer publication dates are distinct from retrieval dates.'),indent=2))
          print(json.dumps(status,indent=2))
          if any(s['status']!='complete' for s in status):raise SystemExit('One or more public sources failed; preserve raw results and do not treat coverage as complete.')
          PY
      - name: Retain public source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-north-rochester-check-20260915
          path: data/
          retention-days: 30
