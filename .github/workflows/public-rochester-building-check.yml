name: Public Rochester building geometry and address check
on:
  push:
    branches: [public-rochester-building-check-20260915]
    paths: [.github/workflows/public-rochester-building-check.yml]
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch public building and street evidence
        run: |
          mkdir -p data
          python - <<'PY'
          import json,urllib.request,urllib.parse,hashlib,time,pathlib,concurrent.futures
          D=pathlib.Path('data'); receipts=[]
          bbox='-83.137,42.680,-83.120,42.695'
          def get(name,url):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Public-Geographic-Source-Verification/1.0'})
                      with urllib.request.urlopen(req,timeout=80) as r: raw=r.read();ct=r.headers.get('Content-Type');status=r.status
                      (D/name).write_bytes(raw)
                      receipts.append(dict(file=name,url=url,retrieved_at_utc=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),content_type=ct,http_status=status))
                      return raw
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2*(attempt+1))
          def layer(name,url):
              try:
                  meta=json.loads(get(name+'-metadata.json',url+'?f=pjson'))
                  fields=meta.get('fields',[])
                  oid=meta.get('objectIdField') or next((f['name'] for f in fields if f['type']=='esriFieldTypeOID'),'OBJECTID')
                  want={'building_id','loadd1','hiadd1','street1','loadd2','hiadd2','street2','housing_units','build_type','year_built','stories','apn','city_id','parcel_id','zipcode','aka','address','keypin','pin','source','median_hgt','height','shape_area','shape_length','street','low_address','high_address','loadd','hiadd','house_number','fulladdress'}
                  chosen=[f['name'] for f in fields if f['name'].lower() in want or f['name']==oid]
                  q=dict(f='json',where='1=1',geometry=bbox,geometryType='esriGeometryEnvelope',inSR=4326,spatialRel='esriSpatialRelIntersects')
                  ids=json.loads(get(name+'-ids.json',url+'/query?'+urllib.parse.urlencode(dict(q,returnIdsOnly='true'))))
                  count=json.loads(get(name+'-count.json',url+'/query?'+urllib.parse.urlencode(dict(q,returnCountOnly='true'))))
                  if 'error' in ids or 'error' in count:raise RuntimeError(str((ids,count)))
                  allids=sorted(ids.get('objectIds') or []); features=[]
                  assert len(allids)==count['count']
                  for i in range(0,len(allids),150):
                      query=dict(f='json',objectIds=','.join(map(str,allids[i:i+150])),outFields=','.join(chosen),returnGeometry='true',outSR=4326)
                      page=json.loads(get(f'{name}-page-{i}.json',url+'/query?'+urllib.parse.urlencode(query)))
                      if page.get('exceededTransferLimit') or 'error' in page:raise RuntimeError(str(page)[:500])
                      features+=page.get('features',[])
                  oid=ids.get('objectIdFieldName') or oid
                  assert sorted(f['attributes'][oid] for f in features)==allids
                  (D/(name+'.json')).write_text(json.dumps(dict(spatialReference={'wkid':4326},features=features)))
                  return dict(dataset=name,status='complete',bbox=bbox,expected=len(allids),returned=len(features),object_id_field=oid,source=url,requested_fields=chosen)
              except Exception as e:return dict(dataset=name,status='failed',error=str(e))
          layers=[('semcog-points','https://gis.semcog.org/server/rest/services/Hosted/Building_Points/FeatureServer/34'),('semcog-footprints','https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints/FeatureServer/14'),('semcog-2020','https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints__2020/FeatureServer/60'),('county-footprints','https://gisservices.oakgov.com/arcgisds/rest/services/Hosted/Building_Outline/FeatureServer/30')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: status=list(ex.map(lambda p:layer(*p),layers))
          try:
              get('osm-map.osm','https://api.openstreetmap.org/api/0.6/map?bbox='+bbox)
              status.append(dict(dataset='osm-map',status='complete',bbox=bbox))
          except Exception as e:status.append(dict(dataset='osm-map',status='failed',error=str(e)))
          (D/'COMPLETENESS.json').write_text(json.dumps(status,indent=2))
          (D/'RECEIPTS.json').write_text(json.dumps(receipts,indent=2))
          (D/'PROVENANCE.json').write_text(json.dumps(dict(bbox=bbox,scope='Public building geometry, published building addresses and public street map only. No private assignment information, resident identities, owner names, credentials or financial values supplied.',recency='Dataset metadata dates are distinct from retrieval dates.'),indent=2))
          print(json.dumps(status,indent=2))
          PY
      - name: Retain public data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rochester-building-check-20260915
          path: data/
          retention-days: 30
