name: Refine HAVENLINE Character 3 Percentile v2

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/refine-havenline-character3-percentile-v2.yml'
      - '.tooling/havenline-girls-multiview/run_refine_multiview_eyes_min12.py'
      - '.tooling/havenline-girls-multiview/refine_multiview_eyes.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-character3-percentile-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refine-character3:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable cleaned Character 3 source
        uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-Character3-final-visual-review
          path: source_package
          github-token: ${{ github.token }}
          repository: ksolo21-web/Hummer
          run-id: 31107341741

      - name: Stage source and approved references
        shell: bash
        run: |
          set -euo pipefail
          out=character_output/Character3
          mkdir -p "$out"
          source_glb="$(find source_package -type f -name Character3_spatial.glb -size +10000c -print -quit)"
          reference="$(find source_package -type f -name approved_reference_sheet.jpg -size +1000c -print -quit)"
          turnaround="$(find source_package -type f -name Character3_turnaround.jpg -size +1000c -print -quit)"
          sanitize="$(find source_package -type f -name mesh-sanitization-report.json -print -quit)"
          spatial="$(find source_package -type f -name spatial-outlier-report.json -print -quit)"
          test -n "$source_glb"
          test -n "$reference"
          cp "$source_glb" "$out/Character3_spatial.glb"
          cp "$reference" "$out/approved_reference_sheet.jpg"
          if [ -n "$turnaround" ]; then cp "$turnaround" "$out/Character3_turnaround.jpg"; fi
          if [ -n "$sanitize" ]; then cp "$sanitize" "$out/mesh-sanitization-report.json"; fi
          if [ -n "$spatial" ]; then cp "$spatial" "$out/spatial-outlier-report.json"; fi

      - name: Install minimal graphics runtime and portable Blender
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' pillow trimesh pygltflib
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx-mesa0
          archive="$RUNNER_TEMP/blender-4.2.3-linux-x64.tar.xz"
          runtime="$RUNNER_TEMP/blender-4.2.3"
          curl --fail --location --retry 5 --retry-delay 5 \
            https://mirrors.dotsrc.org/blender/blender-release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
            --output "$archive"
          mkdir -p "$runtime"
          tar -xJf "$archive" --strip-components=1 -C "$runtime"
          test -x "$runtime/blender"
          echo "$runtime" >> "$GITHUB_PATH"
          "$runtime/blender" --background --factory-startup \
            --python-expr "import bpy; print('Blender:', bpy.app.version_string)"

      - name: Delete the measured pale socket percentile and inset dark eyes
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character3
          blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/run_refine_multiview_eyes_min12.py -- \
            --character Character3 \
            --input "$out/Character3_spatial.glb" \
            --output "$out"
          test -s "$out/Character3_face_refined.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character3/multiview-eye-refinement-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Character 3 percentile eye refinement failed')
          removed = report.get('sourceVerticesRemoved', 0)
          if not 24 <= removed <= 10000:
              raise SystemExit(f'Character 3 socket removal count is unsafe: {removed}')
          if report.get('skinPatchAuthored') is not False or report.get('visibleScleraAuthored') is not False:
              raise SystemExit('Character 3 refinement reintroduced a patch or visible sclera')
          PY

      - name: Rig with Blender 4.2 compatibility patch
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character3
          rig_script="$RUNNER_TEMP/rig_animate_character_blender42.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          python - "$rig_script" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = 'scene.render.engine = "BLENDER_EEVEE_NEXT" if hasattr(bpy.types, "BLENDER_EEVEE_NEXT") else "BLENDER_EEVEE"'
          new = 'engines = {item.identifier for item in bpy.types.RenderSettings.bl_rna.properties["engine"].enum_items}\n    scene.render.engine = "BLENDER_EEVEE_NEXT" if "BLENDER_EEVEE_NEXT" in engines else "BLENDER_EEVEE"'
          if old not in text:
              raise SystemExit('Legacy EEVEE selector was not found')
          path.write_text(text.replace(old, new))
          PY
          blender --background --factory-startup \
            --python "$rig_script" -- \
            --character Character3 \
            --input "$out/Character3_face_refined.glb" \
            --output "$out"
          test -s "$out/Character3_production.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character3/rig-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Character 3 rig report failed')
          PY

      - name: Render exact production proof angles
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character3
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/render_character_proofs_v4.py -- \
            --character Character3 \
            --input "$out/Character3_production.glb" \
            --output "$out"
          for proof in front three-quarter side back; do test -s "$out/proof_${proof}.png"; done
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character3/proof-render-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Character 3 proof report failed')
          PY

      - name: Validate production package
        shell: bash
        run: |
          set -euo pipefail
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character Character3 \
            --directory character_output/Character3
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character3/validation-report.json').read_text())
          if report.get('passed') is not True:
              raise SystemExit('Character 3 validation failed: ' + '; '.join(report.get('failures', [])))
          PY

      - name: Write truthful status
        if: ${{ always() }}
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path('character_output/Character3')
          def load(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else {}
          eye = load('multiview-eye-refinement-report.json')
          rig = load('rig-report.json')
          proof = load('proof-render-report.json')
          validation = load('validation-report.json')
          machine_passed = all((
              eye.get('success') is True,
              rig.get('success') is True,
              proof.get('success') is True,
              validation.get('passed') is True,
          ))
          status = {
              'schemaVersion': 14,
              'character': 'Character3',
              'sourceRunId': '31107341741',
              'sourceMode': 'local-front-percentile-min12-inset-eyes',
              'socketVerticesRemoved': eye.get('sourceVerticesRemoved'),
              'machinePassed': machine_passed,
              'approved': False,
              'unityIntegrated': False,
              'humanVisualApprovalRequired': True,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / 'percentile-v2-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload visual review package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Character3-percentile-v2-review
          path: character_output/Character3/**
          compression-level: 0
          retention-days: 30

      - name: Enforce truthful completion
        if: ${{ always() }}
        shell: python
        run: |
          import json, pathlib
          status = json.loads(pathlib.Path('character_output/Character3/percentile-v2-status.json').read_text())
          if status.get('machinePassed') is not True:
              raise SystemExit('Character 3 percentile v2 pipeline is incomplete')
          if status.get('approved') is True:
              raise SystemExit('Character 3 was prematurely marked approved')
