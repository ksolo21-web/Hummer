name: TCS Phase 2A UI Foundation Freeze

on:
  push:
    branches:
      - tcs-phase1d-020-work
    paths:
      - .github/workflows/tcs-phase2a-025-ui-foundation.yml
      - .tooling/tcs/phase2a-overlay/**

permissions:
  contents: read

concurrency:
  group: tcs-phase2a-025-ui-foundation
  cancel-in-progress: false

jobs:
  phase2a:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Phase 2A branch
        uses: actions/checkout@v4

      - name: Reconstruct exact frozen Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence tcs-src
          echo "6449840c97a88bddf6be8c48db0de851ff6840d564e1ac9a8d0aee8aa3114442  .tooling/tcs/phase1b2-source.tar.xz" | sha256sum -c -
          tar -xJf .tooling/tcs/phase1b2-source.tar.xz -C tcs-src
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          expected="85bf31b214098df041b43f1aad65f947c59876fbace92e256bb1e26d73946946"
          parts=[p.read_text() for p in sorted(Path(".tooling/tcs").glob("phase1b3-overlay.b64.part*"))]
          raw="".join(parts)
          def exact(candidate):
              try: patch=base64.b64decode(candidate,validate=True)
              except Exception: return None
              return patch if hashlib.sha256(patch).hexdigest()==expected else None
          patch=exact(raw)
          repair="none"
          if patch is None:
              p6=parts[5]
              for i in range(len(p6)-1):
                  x=list(parts); x[5]=p6[:i]+p6[i+2:]
                  patch=exact("".join(x))
                  if patch is not None:
                      repair=f"part06-remove-adjacent-pair@{i}"; break
              else: raise SystemExit("unable to recover locked Phase 1B-3 patch")
          Path("/tmp/phase1b3.patch").write_bytes(patch)
          Path("evidence/phase1b3-recovery.txt").write_text(repair+"\n")
          PY
          echo "85bf31b214098df041b43f1aad65f947c59876fbace92e256bb1e26d73946946  /tmp/phase1b3.patch" | sha256sum -c -
          (cd tcs-src && patch -p1 --forward < /tmp/phase1b3.patch)
          python3 .tooling/tcs/phase1c-apply.py tcs-src | tee evidence/phase1c-apply.log
          grep -F "PHASE1C_APPLY=PASS" evidence/phase1c-apply.log

          mkdir -p tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core
          mkdir -p tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackPdf.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdf.kt
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackPdfTest.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdfTest.kt
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackFixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackFixtureGenerator.kt
          python3 .tooling/tcs/phase1d-overlay/apply-existing.py tcs-src | tee evidence/phase1d-overlay.log
          grep -F "PHASE1D_EXISTING_TRANSFORM=PASS" evidence/phase1d-overlay.log

          cp .tooling/tcs/phase1db-overlay/LetterWritingAddressInventory.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingAddressInventory.kt
          cp .tooling/tcs/phase1db-overlay/LetterWritingAddressInventoryRegression.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingAddressInventoryRegression.kt
          cp .tooling/tcs/phase1db-overlay/LetterWritingPage2FixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingPage2FixtureGenerator.kt
          python3 .tooling/tcs/phase1db-overlay/apply-existing.py tcs-src | tee evidence/phase1db-overlay.log
          grep -F "PHASE1D_B_EXISTING_TRANSFORM=PASS" evidence/phase1db-overlay.log

          base64 -d .tooling/tcs/phase1dc-overlay/apply-frontback.py.b64 > /tmp/phase1dc-frontback.py
          python3 /tmp/phase1dc-frontback.py tcs-src | tee evidence/phase1dc-frontback.log
          grep -F "PHASE1D_C_FRONTBACK_TRANSFORM=PASS" evidence/phase1dc-frontback.log
          cp .tooling/tcs/phase1dc-overlay/TelephoneTerritoryInventory.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/TelephoneTerritoryInventory.kt
          cp .tooling/tcs/phase1dc-overlay/TelephoneTerritoryInventoryRegression.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/TelephoneTerritoryInventoryRegression.kt
          cp .tooling/tcs/phase1dc-overlay/TelephonePage2FixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/TelephonePage2FixtureGenerator.kt

          cp .tooling/tcs/phase1dd-overlay/CrossModePacketValidation.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CrossModePacketValidation.kt
          cp .tooling/tcs/phase1dd-overlay/CrossModePacketValidationRegression.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CrossModePacketValidationRegression.kt

      - name: Apply Phase 2A production UI overlay
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          mkdir -p "$APP" "$TEST"

          cp .tooling/tcs/phase2a-overlay/MainActivity.kt "$APP/MainActivity.kt"
          cp .tooling/tcs/phase2a-overlay/TerritoryCardStudioApplication.kt "$APP/TerritoryCardStudioApplication.kt"
          cp .tooling/tcs/phase2a-overlay/AppearancePreferenceStore.kt "$APP/AppearancePreferenceStore.kt"
          cp .tooling/tcs/phase2a-overlay/TerritoryCardStudioTheme.kt "$APP/TerritoryCardStudioTheme.kt"
          cat .tooling/tcs/phase2a-overlay/ProductionUi.kt.part00               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part01               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part02               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part03               > "$APP/ProductionUi.kt"
          cp .tooling/tcs/phase2a-overlay/UiFoundationInstrumentationTest.kt "$TEST/UiFoundationInstrumentationTest.kt"
          cp .tooling/tcs/phase2a-overlay/Phase2AppBuild.gradle.kts tcs-src/app/build.gradle.kts

          grep -F 'versionCode = 25' tcs-src/app/build.gradle.kts
          grep -F 'versionName = "0.2.0"' tcs-src/app/build.gradle.kts
          grep -F 'SYSTEM("system", "System")' "$APP/AppearancePreferenceStore.kt"
          grep -F 'LIGHT("light", "Light")' "$APP/AppearancePreferenceStore.kt"
          grep -F 'DARK("dark", "Dark")' "$APP/AppearancePreferenceStore.kt"
          grep -F 'getSharedPreferences' "$APP/AppearancePreferenceStore.kt"
          grep -F 'ProductionRoute { TERRITORIES, WORKSPACE }' "$APP/ProductionUi.kt"
          grep -F 'Phase 1 engine locked' "$APP/ProductionUi.kt"
          grep -F 'TerritoryDashboardModel.from' "$TEST/UiFoundationInstrumentationTest.kt"
          grep -F 'assertEquals(225, dashboard.items.size)' "$TEST/UiFoundationInstrumentationTest.kt"

          if grep -E 'CandidatePdfRenderer|ProductionRenderModelAdapter|BuildingValidationEngine|TopologyOverlapDecisionEngine|RoadLabelPlacementEngine' "$APP/ProductionUi.kt" "$APP/TerritoryCardStudioTheme.kt"; then
            echo "Compose UI attempted to reimplement or directly invoke frozen territory rules" >&2
            exit 8
          fi

          echo "cf3dd6d4f9be48c9afda23ec4d428715e48f26b276454bfae235e0bb9a9bc9bc  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CandidatePdfRenderer.kt" | sha256sum -c -
          echo "67050950ae6bfcc9673a02b675a202bb7fdab1f5948958026fcfa95fc1068d0d  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/ProductionRenderModelAdapter.kt" | sha256sum -c -
          echo "9d926f5ea84621e3d12900c3f7833d01f69875410106d21eac5ecc868299c708  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdf.kt" | sha256sum -c -

          sha256sum "$APP/MainActivity.kt" "$APP/TerritoryCardStudioApplication.kt"             "$APP/AppearancePreferenceStore.kt" "$APP/TerritoryCardStudioTheme.kt" "$APP/ProductionUi.kt"             "$TEST/UiFoundationInstrumentationTest.kt" tcs-src/app/build.gradle.kts             > evidence/phase2a-source-sha256.txt

          find tcs-src -type f -iname "*.pdf" -printf "%f\n" > evidence/pdf-files-before-ui.txt
          if grep -E "(250T|257A|(^|[^0-9])297([^0-9]|$)|298A|(^|[^0-9])299([^0-9]|$)|347TA)" evidence/pdf-files-before-ui.txt > evidence/reserved-territory-pdf-sweep.txt; then
            echo "Reserved territory PDF detected" >&2
            exit 6
          fi
          : > evidence/reserved-territory-pdf-sweep.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android 37 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          (cd tcs-src && ./tools/check_android_toolchain.sh) 2>&1 | tee evidence/toolchain-preflight.log

      - name: Run frozen engine and compile Phase 2A UI
        shell: bash
        run: |
          set -euo pipefail
          (cd tcs-src && gradle --no-daemon :core:test) 2>&1 | tee evidence/core-test.log
          grep -F "BUILD SUCCESSFUL" evidence/core-test.log

          (cd tcs-src && gradle --no-daemon :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin) 2>&1 | tee evidence/app-compile.log
          grep -F "BUILD SUCCESSFUL" evidence/app-compile.log

          (cd tcs-src && gradle --no-daemon :app:assembleDebug :app:bundleDebug) 2>&1 | tee evidence/package-build.log
          grep -F "BUILD SUCCESSFUL" evidence/package-build.log

          APK="$(find tcs-src/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          AAB="$(find tcs-src/app/build/outputs/bundle/debug -type f -name '*.aab' | head -n 1)"
          test -s "$APK" && test -s "$AAB"

          sha256sum "$APK" > evidence/apk.sha256
          sha256sum "$AAB" > evidence/aab.sha256
          unzip -t "$APK" > evidence/apk-zip-test.txt
          unzip -t "$AAB" > evidence/aab-zip-test.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" > evidence/apk-signature.txt 2>&1
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" evidence/apk-signature.txt
          jarsigner -verify -verbose -certs "$AAB" > evidence/aab-jar-verify.txt 2>&1
          grep -E "jar verified|jar verified\." evidence/aab-jar-verify.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > evidence/apk-badging.txt
          grep -E "^package:.*versionCode='25'.*versionName='0.2.0'" evidence/apk-badging.txt
          grep -F "targetSdkVersion:'37'" evidence/apk-badging.txt

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run instrumentation and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p evidence/ui
            (cd tcs-src && gradle --no-daemon :app:connectedDebugAndroidTest) 2>&1 | tee evidence/connected-android-test.log
            grep -F "BUILD SUCCESSFUL" evidence/connected-android-test.log

            APK="$(find tcs-src/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
            adb install -r "$APK" >/dev/null

            adb shell pm clear com.koenterprises.territorycardstudio >/dev/null
            adb shell cmd uimode night no
            adb shell am start -W -n com.koenterprises.territorycardstudio/.MainActivity >/dev/null
            sleep 4
            adb exec-out screencap -p > evidence/ui/dashboard-light.png
            adb shell uiautomator dump /sdcard/tcs-light.xml >/dev/null
            adb pull /sdcard/tcs-light.xml evidence/ui/tcs-light.xml >/dev/null
            grep -F "Territories" evidence/ui/tcs-light.xml
            grep -F "Phase 1 engine locked" evidence/ui/tcs-light.xml

            adb shell am force-stop com.koenterprises.territorycardstudio
            adb shell cmd uimode night yes
            adb shell am start -W -n com.koenterprises.territorycardstudio/.MainActivity >/dev/null
            sleep 4
            adb exec-out screencap -p > evidence/ui/dashboard-dark.png
            adb shell uiautomator dump /sdcard/tcs-dark.xml >/dev/null
            adb pull /sdcard/tcs-dark.xml evidence/ui/tcs-dark.xml >/dev/null
            grep -F "Territories" evidence/ui/tcs-dark.xml
            grep -F "Appearance: System" evidence/ui/tcs-dark.xml

            adb shell wm size 1600x2560
            adb shell wm density 280
            adb shell am force-stop com.koenterprises.territorycardstudio
            adb shell am start -W -n com.koenterprises.territorycardstudio/.MainActivity >/dev/null
            sleep 4
            adb exec-out screencap -p > evidence/ui/dashboard-wide-dark.png
            adb shell wm size reset
            adb shell wm density reset

      - name: Validate screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          base=Path("evidence/ui")
          rows=[]
          for name in ["dashboard-light.png","dashboard-dark.png","dashboard-wide-dark.png"]:
              data=(base/name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", name
              w,h=struct.unpack(">II",data[16:24])
              assert w >= 900 and h >= 1800, (name,w,h)
              rows.append((name,w,h,hashlib.sha256(data).hexdigest()))
          assert rows[0][3] != rows[1][3], "Light and dark screenshots are identical"
          assert rows[2][1] > rows[2][0] or rows[2][1] >= 1500
          (base/"screenshot-evidence.txt").write_text("\n".join(
              name+" width="+str(w)+" height="+str(h)+" sha256="+sha for name,w,h,sha in rows
          )+"\n")
          for name,_,_,_ in rows:
              (base/(name+".b64.txt")).write_text(__import__("base64").b64encode((base/name).read_bytes()).decode("ascii"))
          PY
          cat evidence/ui/screenshot-evidence.txt
          sha256sum evidence/connected-android-test.log > evidence/connected-android-test.sha256

      - name: Freeze Phase 2A source package
        shell: bash
        run: |
          set -euo pipefail
          (cd tcs-src && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/extracted-source-files.sha256
          sha256sum evidence/extracted-source-files.sha256 > evidence/extracted-source-manifest.sha256
          tar -cJf evidence/TerritoryCardStudio-Android-0.2.0-phase2a-source.tar.xz -C tcs-src .
          sha256sum evidence/TerritoryCardStudio-Android-0.2.0-phase2a-source.tar.xz > evidence/source-package.sha256

          cat > evidence/status.txt <<'EOF'
          PHASE_2A_UI_FOUNDATION=PASS_PENDING_MODEL_VISUAL_REVIEW
          SYSTEM_LIGHT_DARK_THEME=PASS
          THEME_PREFERENCE_PERSISTENCE=PASS_INSTRUMENTATION
          TERRITORIES_DASHBOARD=PASS
          TERRITORY_WORKSPACE_NAVIGATION=PASS_INSTRUMENTATION
          KNOWLEDGE_BASE_ASSIGNMENTS=225
          RESERVED_NEEDS_NEW_CARD_UI_BINDING=PASS
          RESPONSIVE_PHONE_BOTTOM_NAV=PASS_COMPILED
          RESPONSIVE_WIDE_NAV_RAIL=PASS_SCREENSHOT
          PHASE_1_ENGINE_HASH_LOCK=PASS
          COMPOSE_RULE_REIMPLEMENTATION=NONE
          CORE_GRADLE_TEST=PASS
          APP_COMPILE=PASS
          ANDROID_TEST_COMPILE=PASS
          CONNECTED_ANDROID_TEST=PASS
          ASSEMBLE_DEBUG=PASS
          BUNDLE_DEBUG=PASS
          APK_V2_SIGNATURE=PASS
          AAB_JAR_VERIFY=PASS
          APK_ZIP_INTEGRITY=PASS
          AAB_ZIP_INTEGRITY=PASS
          VERSION_CODE=25
          VERSION_NAME=0.2.0
          TARGET_SDK=37
          RESERVED_TERRITORY_PDF_SWEEP=0
          NEXT_REQUIRED_GATE=MODEL_VISUAL_LIGHT_DARK_WIDE_REVIEW
          EOF

      - name: Upload Phase 2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-phase2a-025-ui-foundation-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 14
