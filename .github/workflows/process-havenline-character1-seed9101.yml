name: Process HAVENLINE Character 1 Seed 9101

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/process-havenline-character1-seed9101.yml'
      - '.tooling/havenline-character-production/remove_large_planar_artifacts.py'
      - '.tooling/havenline-character-production/prepare_mobile_source_mesh.py'
      - '.tooling/havenline-character-production/sanitize_character_mesh.py'
      - '.tooling/havenline-girls-multiview/remove_spatial_outliers.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-character1-seed9101-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-seed9101:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download clean Character 1 seed 9101 package
        uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-Character1-clean-candidate-9101
          path: source_package
          github-token: ${{ github.token }}
          repository: ksolo21-web/Hummer
          run-id: 31112674451

      - name: Stage immutable seed 9101 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          out=character_output/Character1
          mkdir -p "$out"
          cp -a source_package/. "$out"/
          test -s "$out/Character1_raw.glb"
          test -s "$out/generation-report.json"
          test -s "$out/approved_reference_sheet.jpg"

      - name: Install minimal EGL runtime, portable Blender, and validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' pillow trimesh pygltflib
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx-mesa0
          archive="$RUNNER_TEMP/blender-4.2.3-linux-x64.tar.xz"
          runtime="$RUNNER_TEMP/blender-4.2.3"
          curl --fail --location --retry 5 --retry-delay 5 \
            https://mirrors.dotsrc.org/blender/blender-release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
            --output "$archive"
          mkdir -p "$runtime"
          tar -xJf "$archive" --strip-components=1 -C "$runtime"
          test -x "$runtime/blender"
          echo "$runtime" >> "$GITHUB_PATH"
          "$runtime/blender" --background --factory-startup \
            --python-expr "import bpy, numpy; print('Blender:', bpy.app.version_string); print('NumPy:', numpy.__version__)"

      - name: Remove the orientation-breaking floor plane
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/remove_large_planar_artifacts.py -- \
            --character Character1 \
            --input "$out/Character1_raw.glb" \
            --output "$out"
          test -s "$out/Character1_large_plane_clean.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/large-planar-artifact-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 large-plane cleanup did not pass')
          if report.get('verticesRemoved', 0) <= 0:
              raise SystemExit('Seed 9101 large-plane cleanup removed no vertices')
          PY

      - name: Sanitize and orient seed 9101 after floor removal
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/sanitize_character_mesh.py -- \
            --character Character1 \
            --input "$out/Character1_large_plane_clean.glb" \
            --output "$out"
          test -s "$out/Character1_sanitized.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/mesh-sanitization-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 sanitizer did not pass after plane removal')
          if report.get('orientation', {}).get('standingAxisVerified') is not True:
              raise SystemExit('Seed 9101 standing axis was not verified')
          PY

      - name: Remove any remaining detached side debris
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/remove_spatial_outliers.py -- \
            --character Character1 \
            --input "$out/Character1_sanitized.glb" \
            --output "$out"
          test -s "$out/Character1_spatial.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/spatial-outlier-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 spatial cleanup did not pass')
          PY

      - name: Reduce the static source to a mobile-safe face budget
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/prepare_mobile_source_mesh.py -- \
            --character Character1 \
            --input "$out/Character1_spatial.glb" \
            --output "$out"
          test -s "$out/Character1_mobile_source.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/mobile-source-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 mobile source reduction did not pass')
          faces = report.get('reduction', {}).get('totalFacesAfter', 0)
          if not 14000 <= faces <= 39000:
              raise SystemExit(f'Seed 9101 mobile source face count is unsafe: {faces}')
          PY

      - name: Rig seed 9101 with Blender 4.2 compatibility patch
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          rig_script="$RUNNER_TEMP/rig_animate_character_blender42.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          python - "$rig_script" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = 'scene.render.engine = "BLENDER_EEVEE_NEXT" if hasattr(bpy.types, "BLENDER_EEVEE_NEXT") else "BLENDER_EEVEE"'
          new = 'engines = {item.identifier for item in bpy.types.RenderSettings.bl_rna.properties["engine"].enum_items}\n    scene.render.engine = "BLENDER_EEVEE_NEXT" if "BLENDER_EEVEE_NEXT" in engines else "BLENDER_EEVEE"'
          if old not in text:
              raise SystemExit('Legacy EEVEE selection line was not found')
          path.write_text(text.replace(old, new))
          PY
          blender --background --factory-startup \
            --python "$rig_script" -- \
            --character Character1 \
            --input "$out/Character1_mobile_source.glb" \
            --output "$out"
          test -s "$out/Character1_production.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/rig-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 rig report did not pass')
          PY

      - name: Render exact seed 9101 production proofs
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/render_character_proofs_v4.py -- \
            --character Character1 \
            --input "$out/Character1_production.glb" \
            --output "$out"
          for proof in front three-quarter side back; do test -s "$out/proof_${proof}.png"; done
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/proof-render-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Seed 9101 proof report did not pass')
          PY

      - name: Validate seed 9101 production package
        shell: bash
        run: |
          set -euo pipefail
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character Character1 \
            --directory character_output/Character1
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/validation-report.json').read_text())
          if report.get('passed') is not True:
              raise SystemExit('Seed 9101 validation did not pass: ' + '; '.join(report.get('failures', [])))
          PY

      - name: Write truthful seed 9101 status
        if: ${{ always() }}
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path('character_output/Character1')
          def load(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else {}
          generation = load('generation-report.json')
          plane = load('large-planar-artifact-report.json')
          sanitize = load('mesh-sanitization-report.json')
          spatial = load('spatial-outlier-report.json')
          mobile = load('mobile-source-report.json')
          rig = load('rig-report.json')
          proof = load('proof-render-report.json')
          validation = load('validation-report.json')
          machine_passed = all((
              generation.get('success') is True,
              plane.get('success') is True,
              sanitize.get('success') is True,
              spatial.get('success') is True,
              mobile.get('success') is True,
              rig.get('success') is True,
              proof.get('success') is True,
              validation.get('passed') is True,
          ))
          status = {
              'schemaVersion': 1,
              'character': 'Character1',
              'sourceRunId': '31112674451',
              'seed': 9101,
              'sourceMode': 'clean-trellis-multiview-floor-cleaned-mobile-source',
              'largePlaneVerticesRemoved': plane.get('verticesRemoved'),
              'mobileSourceFaces': mobile.get('reduction', {}).get('totalFacesAfter'),
              'productionVertices': validation.get('metrics', {}).get('baseMesh', {}).get('vertices'),
              'machinePassed': machine_passed,
              'approved': False,
              'unityIntegrated': False,
              'humanVisualApprovalRequired': True,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / 'seed9101-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload seed 9101 production review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Character1-seed9101-review
          path: character_output/Character1/**
          compression-level: 0
          retention-days: 30

      - name: Enforce truthful completion
        if: ${{ always() }}
        shell: python
        run: |
          import json, pathlib
          status = json.loads(pathlib.Path('character_output/Character1/seed9101-status.json').read_text())
          if status.get('machinePassed') is not True:
              raise SystemExit('Character 1 seed 9101 production pipeline is incomplete')
          if status.get('approved') is True:
              raise SystemExit('Character 1 seed 9101 was prematurely marked approved')
