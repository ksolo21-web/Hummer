name: Correct HAVENLINE Character 1 Eye Line

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/refine-havenline-character1-eye-line.yml'
      - '.tooling/havenline-character-production/adjust_character1_face.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-character1-eye-line-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-character1-eye-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact successful modeled-face source
        uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-Character1-final-visual-review
          path: source_package
          github-token: ${{ github.token }}
          repository: ksolo21-web/Hummer
          run-id: 31110310588

      - name: Stage Character 1 modeled-face source
        shell: bash
        run: |
          set -euo pipefail
          out=character_output/Character1
          mkdir -p "$out"
          source_glb="$(find source_package -type f -name Character1_face_refined.glb -size +10000c -print -quit)"
          reference="$(find source_package -type f -name approved_reference_sheet.jpg -size +1000c -print -quit)"
          test -n "$source_glb"
          test -n "$reference"
          cp "$source_glb" "$out/Character1_face_refined.glb"
          cp "$reference" "$out/approved_reference_sheet.jpg"

      - name: Install Blender and validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' pillow trimesh pygltflib
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            blender python3-numpy libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libglu1-mesa libopengl0 libglib2.0-0 mesa-utils xvfb xauth

      - name: Raise, widen and resize Character 1 face repair
        id: adjust
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-character-production/adjust_character1_face.py -- \
            --character Character1 \
            --input "$out/Character1_face_refined.glb" \
            --output "$out"
          test -s "$out/Character1_face_adjusted.glb"
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('character_output/Character1/character1-face-adjustment-report.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Character 1 eye-line adjustment failed')
          if report.get('adjustment', {}).get('raiseDistance', 0) <= 0:
              raise SystemExit('Character 1 face details were not raised')
          PY

      - name: Rig adjusted Character 1 and rebuild LODs
        id: rig
        if: ${{ always() && steps.adjust.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          rig_script="$RUNNER_TEMP/rig_animate_character_clean.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          test -s "$rig_script"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python "$rig_script" -- \
            --character Character1 \
            --input "$out/Character1_face_adjusted.glb" \
            --output "$out"

      - name: Render corrected Character 1 proofs
        id: proof
        if: ${{ always() && steps.rig.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out=character_output/Character1
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-character-production/render_character_proofs_v4.py -- \
            --character Character1 \
            --input "$out/Character1_production.glb" \
            --output "$out"

      - name: Validate corrected Character 1 package
        id: validate
        if: ${{ always() && steps.rig.outcome == 'success' && steps.proof.outcome == 'success' }}
        continue-on-error: true
        run: |
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character Character1 \
            --directory character_output/Character1

      - name: Write truthful corrected Character 1 status
        if: ${{ always() }}
        shell: python
        env:
          ADJUST_OUTCOME: ${{ steps.adjust.outcome }}
          RIG_OUTCOME: ${{ steps.rig.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          import json, os, pathlib
          root = pathlib.Path('character_output/Character1')
          validation_path = root / 'validation-report.json'
          validation = json.loads(validation_path.read_text()) if validation_path.exists() else {}
          machine_passed = (
              os.environ.get('ADJUST_OUTCOME') == 'success'
              and os.environ.get('RIG_OUTCOME') == 'success'
              and os.environ.get('PROOF_OUTCOME') == 'success'
              and os.environ.get('VALIDATE_OUTCOME') == 'success'
              and validation.get('passed') is True
          )
          status = {
              'schemaVersion': 3,
              'character': 'Character1',
              'sourceRunId': '31110310588',
              'sourceMode': 'modeled-face-repair-plus-measured-eye-line-correction',
              'adjustOutcome': os.environ.get('ADJUST_OUTCOME', 'skipped'),
              'rigOutcome': os.environ.get('RIG_OUTCOME', 'skipped'),
              'proofOutcome': os.environ.get('PROOF_OUTCOME', 'skipped'),
              'validateOutcome': os.environ.get('VALIDATE_OUTCOME', 'skipped'),
              'machinePassed': machine_passed,
              'approved': False,
              'unityIntegrated': False,
              'humanVisualApprovalRequired': True,
          }
          (root / 'matrix-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload corrected Character 1 visual package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Character1-eye-line-review
          path: character_output/Character1/**
          compression-level: 0
          retention-days: 30

      - name: Enforce corrected Character 1 pipeline
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.adjust.outcome }}' = success
          test '${{ steps.rig.outcome }}' = success
          test '${{ steps.proof.outcome }}' = success
          test '${{ steps.validate.outcome }}' = success
          python - <<'PY'
          import json, pathlib
          status = json.loads(pathlib.Path('character_output/Character1/matrix-status.json').read_text())
          if status.get('machinePassed') is not True:
              raise SystemExit('Corrected Character 1 machine pipeline did not pass')
          if status.get('approved') is True:
              raise SystemExit('Character 1 was prematurely marked approved')
          PY
