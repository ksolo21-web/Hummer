name: My Study Companion 0.12.4 Firestore Rules Emulator

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.4-firestore-rules-emulator.yml'
      - '.msc-build/firebase-family-0.12.3.part*.b64'
      - '.msc-build/firebase-family-0.12.4-hardening.patch.xz.b64'
      - '.msc-build/firestore-rules-0124/**'
  workflow_dispatch:

concurrency:
  group: msc-0124-firestore-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated app branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .msc-build/firestore-rules-0124/package.json

      - name: Reconstruct checksum-locked final Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/msc-firestore-rules"
          mkdir -p "$WORK/overlay"

          cat .msc-build/firebase-family-0.12.3.part*.b64 | base64 --decode \
            > "$WORK/firebase-family-0.12.3-overlay.tar.xz"
          echo 'fc5d7909d3f739e6eb33d95f56c17e14013f0ffb6f685f7b78a9cea59a3cc8a2  '"$WORK"'/firebase-family-0.12.3-overlay.tar.xz' \
            | sha256sum -c -
          tar -xJf "$WORK/firebase-family-0.12.3-overlay.tar.xz" -C "$WORK/overlay"

          base64 --decode .msc-build/firebase-family-0.12.4-hardening.patch.xz.b64 \
            > "$WORK/firebase-family-0.12.4-hardening.patch.xz"
          echo 'ca1a5c0310db811ccf9399e1bc2295b605ccba8dc14e4039481b0894b250bdae  '"$WORK"'/firebase-family-0.12.4-hardening.patch.xz' \
            | sha256sum -c -
          xz -dc "$WORK/firebase-family-0.12.4-hardening.patch.xz" \
            > "$WORK/firebase-family-0.12.4-hardening.patch"
          echo '7bcda6a10c1de5af1a37872f8b2a702b36d3787d38d9522f05a9313404c3e189  '"$WORK"'/firebase-family-0.12.4-hardening.patch' \
            | sha256sum -c -
          patch --batch --forward -p1 -d "$WORK/overlay" \
            < "$WORK/firebase-family-0.12.4-hardening.patch"

          cp -a .msc-build/firestore-rules-0124/. "$WORK/"
          cp "$WORK/overlay/firestore.rules" "$WORK/firestore.rules"
          grep -q 'match /ideas/{ideaId}' "$WORK/firestore.rules"
          grep -q 'match /ideaVotes/{voteId}' "$WORK/firestore.rules"
          grep -q "voteId == 'vote-'" "$WORK/firestore.rules"
          printf '%s\n' "$WORK" > "$RUNNER_TEMP/msc-firestore-workdir"

      - name: Install emulator and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(cat "$RUNNER_TEMP/msc-firestore-workdir")"
          cd "$WORK"
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund firebase-tools@14.16.0

      - name: Run Firestore authorization tests
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(cat "$RUNNER_TEMP/msc-firestore-workdir")"
          cd "$WORK"
          npx firebase emulators:exec \
            --only firestore \
            --project my-study-companion-rules-test \
            "npm test" | tee FIRESTORE-RULES-RESULT.txt
          grep -q 'PASS: all hardened Firestore authorization scenarios completed.' \
            FIRESTORE-RULES-RESULT.txt

      - name: Upload Firestore rules evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.4-firestore-rules-evidence
          path: |
            ${{ runner.temp }}/msc-firestore-rules/firestore.rules
            ${{ runner.temp }}/msc-firestore-rules/FIRESTORE-RULES-RESULT.txt
            ${{ runner.temp }}/msc-firestore-rules/firebase-debug.log
          retention-days: 5
          if-no-files-found: warn
