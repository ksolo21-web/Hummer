name: Public central Rochester independent street check
on:
  push:
    branches: [public-central-rochester-audit-20260914]
    paths: [.github/workflows/public-central-rochester-osm.yml]
permissions:
  contents: read
jobs:
  open-street-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read public OpenStreetMap tiles
        run: |
          mkdir -p data
          python - <<'PY'
          import urllib.request,hashlib,json,time,pathlib,concurrent.futures,xml.etree.ElementTree as ET
          D=pathlib.Path('data');boxes=[(-83.149,42.680,-83.1355,42.6875),(-83.1355,42.680,-83.122,42.6875),(-83.149,42.6875,-83.1355,42.695),(-83.1355,42.6875,-83.122,42.695)]
          def one(item):
              i,bbox=item;url='https://api.openstreetmap.org/api/0.6/map?bbox='+','.join(map(str,bbox))
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Public-Geographic-Source-Verification/1.0'})
                      with urllib.request.urlopen(req,timeout=90) as r:raw=r.read();status=r.status
                      root=ET.fromstring(raw)
                      if root.tag!='osm':raise RuntimeError('Not OSM XML')
                      name=f'osm-tile-{i}.osm';(D/name).write_bytes(raw)
                      return dict(file=name,status='complete',url=url,bbox=bbox,http_status=status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),retrieved_at_utc=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),nodes=len(root.findall('node')),ways=len(root.findall('way')),relations=len(root.findall('relation')))
                  except Exception as e:
                      if attempt==2:return dict(file=f'osm-tile-{i}.osm',status='failed',bbox=bbox,url=url,error=str(e))
                      time.sleep(2+attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex: results=list(ex.map(one,enumerate(boxes)))
          (D/'RECEIPTS.json').write_text(json.dumps(results,indent=2));print(json.dumps(results,indent=2))
          if not all(r['status']=='complete' for r in results):raise SystemExit('Incomplete public OSM tile coverage')
          PY
      - name: Retain public source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-central-rochester-osm-20260914
          path: data/
          retention-days: 30
