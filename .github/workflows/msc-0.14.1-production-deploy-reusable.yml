name: My Study Companion 0.14.1 Production Deployment

on:
  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
      deploy_backend:
        required: true
        type: boolean
      deploy_web_and_rules:
        required: true
        type: boolean
      provision_schedules:
        required: true
        type: boolean

concurrency:
  group: msc-0141-production-live-stack
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: my-study-companion-private
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  GCP_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.GCP_SCHEDULER_SERVICE_ACCOUNT }}
  FIREBASE_WEB_APP_ID: ${{ vars.MSC_FIREBASE_WEB_APP_ID }}
  FIREBASE_PROJECT_NUMBER: ${{ vars.MSC_FIREBASE_PROJECT_NUMBER }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.MSC_FIREBASE_ANDROID_APP_ID }}
  ORGANIZER_USER_ID: ${{ vars.MSC_ORGANIZER_USER_ID }}

jobs:
  deploy-production-live-stack:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: my-study-companion-private
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Check out checksum-locked workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic theme build dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT \
            GCP_SCHEDULER_SERVICE_ACCOUNT \
            FIREBASE_WEB_APP_ID \
            FIREBASE_PROJECT_NUMBER \
            FIREBASE_ANDROID_APP_ID \
            ORGANIZER_USER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required protected environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Reconstruct exact tested application source
        shell: bash
        run: bash .msc-build/reconstruct-current-source-0.14.1.sh

      - name: Re-run web, backend, and persistent Firestore tests
        shell: bash
        run: |
          set -euo pipefail
          for file in MyStudyCompanionWeb/*.js; do node --check "$file"; done
          node --test \
            MyStudyCompanionWeb/appearance.test.mjs \
            MyStudyCompanionWeb/study-library-merge.test.mjs
          python -m pip install --disable-pip-version-check \
            -r MyStudyCompanion/backend/requirements.txt \
            -r MyStudyCompanion/backend/requirements-dev.txt
          (cd MyStudyCompanion/backend && python -m pytest -q)
          npx --yes firebase-tools@15.1.0 emulators:exec \
            --only firestore \
            --project demo-msc-deployment \
            --config MyStudyCompanion/backend/firebase.json \
            "python -m pytest -q MyStudyCompanion/backend/tests/test_firestore_repositories.py"

      - id: auth
        name: Authenticate with Google Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 523.0.0'

      - name: Verify persistent services, identities, and protected secrets
        shell: bash
        run: |
          set -euo pipefail
          gcloud firestore databases describe \
            --database='(default)' \
            --project "$GCP_PROJECT_ID" >/dev/null
          gcloud iam service-accounts describe \
            "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --project "$GCP_PROJECT_ID" >/dev/null
          gcloud iam service-accounts describe \
            "$GCP_SCHEDULER_SERVICE_ACCOUNT" \
            --project "$GCP_PROJECT_ID" >/dev/null
          for secret in msc-admin-token msc-openai-api-key msc-content-signing-key; do
            gcloud secrets describe "$secret" --project "$GCP_PROJECT_ID" >/dev/null
          done

      - id: deploy_backend
        name: Deploy persistent private Cloud Run service
        if: ${{ inputs.deploy_backend }}
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          source: MyStudyCompanion/backend
          env_vars: |-
            MSC_ENV=production
            MSC_PERSISTENCE_BACKEND=firestore
            MSC_DATABASE_PATH=/tmp/my-study-companion-local-fallback.sqlite3
            MSC_CONTENT_SIGNING_KEY_PATH=/secrets/content-signing-key.pem
            MSC_CONTENT_SIGNING_KEY_ID=msc-0-14-1
            MSC_FIREBASE_PROJECT_NUMBER=${{ env.FIREBASE_PROJECT_NUMBER }}
            MSC_FIREBASE_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            MSC_FIREBASE_ANDROID_APP_ID=${{ env.FIREBASE_ANDROID_APP_ID }}
            MSC_REQUIRE_APP_CHECK=true
            MSC_REQUIRE_USER_AUTH=true
            MSC_ALLOWED_ORIGINS=https://${{ env.GCP_PROJECT_ID }}.web.app,https://${{ env.GCP_PROJECT_ID }}.firebaseapp.com
            MSC_HOUSEHOLD_ID=kaleb-family
            MSC_ORGANIZER_USER_ID=${{ env.ORGANIZER_USER_ID }}
            MSC_SCHEDULER_SERVICE_ACCOUNT_EMAIL=${{ env.GCP_SCHEDULER_SERVICE_ACCOUNT }}
            MSC_OPENAI_MODEL=gpt-5.1
            MSC_MINIMUM_PHONE_VERSION_CODE=33
            MSC_MINIMUM_WEAR_VERSION_CODE=360141001
            MSC_TIMEZONE=America/Detroit
            MSC_OFFICIAL_READER_MAX_BYTES=2000000
            MSC_OFFICIAL_READER_CACHE_SECONDS=300
          secrets: |-
            MSC_ADMIN_TOKEN=msc-admin-token:latest
            MSC_OPENAI_API_KEY=msc-openai-api-key:latest
            /secrets/content-signing-key.pem=msc-content-signing-key:latest
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --execution-environment=gen2
            --memory=512Mi
            --cpu=1
            --min=1
            --max=2
            --concurrency=40
            --timeout=60s

      - name: Verify deployed service health and persistent configuration
        if: ${{ inputs.deploy_backend }}
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy_backend.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --max-time 20 "$SERVICE_URL/health" | tee cloud-run-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('cloud-run-health.json').read_text())
          assert payload['status'] == 'ok'
          assert payload['version'] == '0.14.1'
          assert payload['signingKeyConfigured'] is True
          assert payload['appCheckRequired'] is True
          assert payload['userAuthRequired'] is True
          assert payload['persistenceBackend'] == 'firestore'
          assert payload['schedulerConfigured'] is True
          PY

      - name: Create or update scheduled content jobs
        if: ${{ inputs.deploy_backend && inputs.provision_schedules }}
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy_backend.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"

          upsert_http_job() {
            local name="$1"
            local schedule="$2"
            local path="$3"
            local body="$4"
            local action=create
            if gcloud scheduler jobs describe "$name" \
              --location "$GCP_REGION" \
              --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              action=update
            fi
            gcloud scheduler jobs http "$action" "$name" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --schedule "$schedule" \
              --time-zone America/Detroit \
              --uri "${SERVICE_URL}${path}" \
              --http-method POST \
              --headers 'Content-Type=application/json' \
              --message-body "$body" \
              --oidc-service-account-email "$GCP_SCHEDULER_SERVICE_ACCOUNT" \
              --oidc-token-audience "$SERVICE_URL" \
              --attempt-deadline 60s \
              --quiet
          }

          upsert_http_job \
            msc-daily-text-refresh \
            '5 2 * * *' \
            '/admin/v1/automation/daily' \
            '{"notifyDevices":true}'
          upsert_http_job \
            msc-weekly-meeting-watchtower-refresh \
            '20 2 * * 1' \
            '/admin/v1/automation/weekly' \
            '{"notifyDevices":true}'
          upsert_http_job \
            msc-family-worship-refresh \
            '35 2 * * *' \
            '/admin/v1/automation/family-worship/scheduled' \
            '{"lookaheadDays":7,"notifyDevices":true}'

          for job in \
            msc-daily-text-refresh \
            msc-weekly-meeting-watchtower-refresh \
            msc-family-worship-refresh; do
            gcloud scheduler jobs describe "$job" \
              --location "$GCP_REGION" \
              --project "$GCP_PROJECT_ID" >/dev/null
          done

      - name: Generate real Firebase Web runtime configuration
        if: ${{ inputs.deploy_web_and_rules }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.1.0
          firebase apps:sdkconfig web "$FIREBASE_WEB_APP_ID" \
            --project "$GCP_PROJECT_ID" \
            --out /tmp/firebase-web-sdk-config.json \
            --non-interactive
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('/tmp/firebase-web-sdk-config.json')
          firebase = json.loads(source.read_text())
          required = ('apiKey', 'authDomain', 'projectId', 'appId')
          missing = [key for key in required if not firebase.get(key)]
          if missing:
              raise SystemExit(f'Firebase web config is missing: {missing}')
          project_id = firebase['projectId']
          output = {
              'firebase': firebase,
              'backendBaseUrl': f'https://{project_id}.web.app/',
              'officialContentEndpoint': '/v1/official/read',
              'release': '0.14.1',
              'themeGallery': '23-permanent-themes',
              'customColorControl': 'visual-color-wheel',
          }
          Path('MyStudyCompanionWeb/runtime-config.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Deploy tested Firestore rules
        if: ${{ inputs.deploy_web_and_rules }}
        shell: bash
        run: |
          set -euo pipefail
          cat > firebase-firestore-deploy.json <<'JSON'
          {
            "firestore": {
              "rules": "MyStudyCompanion/firestore.rules"
            }
          }
          JSON
          firebase deploy \
            --project "$GCP_PROJECT_ID" \
            --config firebase-firestore-deploy.json \
            --only firestore:rules \
            --non-interactive \
            --message "My Study Companion 0.14.1 tested household, workbook, and reader rules"

      - name: Deploy installable connected PWA
        if: ${{ inputs.deploy_web_and_rules }}
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanionWeb
          firebase deploy \
            --project "$GCP_PROJECT_ID" \
            --only hosting \
            --non-interactive \
            --message "My Study Companion 0.14.1 persistent connected reader and theme gallery"

      - name: Verify deployed PWA, live API route, and runtime configuration
        if: ${{ inputs.deploy_web_and_rules }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            "$BASE_URL/runtime-config.json" > deployed-runtime-config.json
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            "$BASE_URL/sw.js" > deployed-sw.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            "$BASE_URL/appearance.js" > deployed-appearance.js
          API_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --get "$BASE_URL/v1/official/read" \
            --data-urlencode 'url=https://www.jw.org/')"
          case "$API_STATUS" in
            400|401|403|422) ;;
            *) echo "Unexpected official-reader route status: $API_STATUS" >&2; exit 1 ;;
          esac
          grep -Fq 'msc-web-v0143-theme-gallery' deployed-sw.js
          grep -Fq 'Waterfall Serenity' deployed-appearance.js
          grep -Fq 'Bible Map' deployed-appearance.js
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('deployed-runtime-config.json').read_text())
          assert payload['firebase']['appId']
          assert payload['firebase']['projectId']
          assert payload['backendBaseUrl'].endswith('.web.app/')
          assert payload['officialContentEndpoint'] == '/v1/official/read'
          assert payload['release'] == '0.14.1'
          assert payload['themeGallery'] == '23-permanent-themes'
          assert payload['customColorControl'] == 'visual-color-wheel'
          PY

      - name: Write deployment verification report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "project=${GCP_PROJECT_ID}"
            echo "region=${GCP_REGION}"
            echo "backend_deployed=${{ inputs.deploy_backend }}"
            echo "web_and_rules_deployed=${{ inputs.deploy_web_and_rules }}"
            echo "schedules_provisioned=${{ inputs.provision_schedules }}"
            echo "persistence=firestore"
            echo "release=0.14.1"
            echo "themes=23"
            echo "new_illustrated_themes=13"
            echo "custom_color=visual-wheel"
            echo "verification=passed"
          } > MSC-0.14.1-DEPLOYMENT-STATUS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.1-production-live-stack-status
          path: |
            MSC-0.14.1-DEPLOYMENT-STATUS.txt
            cloud-run-health.json
            deployed-runtime-config.json
            deployed-sw.js
            deployed-appearance.js
          retention-days: 14
          if-no-files-found: warn
