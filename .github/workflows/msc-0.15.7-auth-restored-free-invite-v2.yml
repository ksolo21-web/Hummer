name: My Study Companion 0.15.7 Auth Restored Free Invite V2

on:
  push:
    branches:
      - agent/msc-0.15.6-root-fix-ci
    paths:
      - .github/workflows/msc-0.15.7-auth-restored-free-invite-v2.yml
      - .msc-build/build-0.15.7-auth-restored-free-invite.sh

permissions:
  contents: write

concurrency:
  group: msc-0157-auth-restored-free-invite-v2
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish run ID immediately
        shell: bash
        env:
          STATUS_RESULT: in_progress
        run: |
          set -euo pipefail
          publish_status() {
            for attempt in 1 2 3 4; do
              rm -rf "$RUNNER_TEMP/msc-status"
              git fetch origin agent/msc-0.15.6-root-fix-ci
              git worktree add --detach "$RUNNER_TEMP/msc-status" origin/agent/msc-0.15.6-root-fix-ci
              (
                cd "$RUNNER_TEMP/msc-status"
                cat > MSC-0.15.7-AUTH-RESTORED-V2-STATUS.txt <<EOF
          source_commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          EOF
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git add MSC-0.15.7-AUTH-RESTORED-V2-STATUS.txt
                git commit -m "Record 0.15.7 auth-restored run ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
                git push origin HEAD:agent/msc-0.15.6-root-fix-ci
              ) && return 0
              git worktree remove --force "$RUNNER_TEMP/msc-status" || true
              sleep $((attempt * 2))
            done
            return 1
          }
          publish_status
          git worktree remove --force "$RUNNER_TEMP/msc-status" || true

      - name: Install deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0157-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-0157-packaging-only' \
            -keypass 'msc-0157-packaging-only' \
            -alias 'msc-0157-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.7 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build and verify configured 0.15.7
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0157-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0157-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0157-packaging-only
        run: bash .msc-build/build-0.15.7-auth-restored-free-invite.sh

      - name: Publish exact reconstructed auth and household source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/msc-auth-source"
          rm -rf "$OUT"
          mkdir -p "$OUT/auth" "$OUT/companion" "$OUT/family" "$OUT/ui" "$OUT/rules"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/auth/AuthModels.kt "$OUT/auth/"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/auth/GoogleSignInCoordinator.kt "$OUT/auth/"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/auth/AuthRepository.kt "$OUT/auth/"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/StudyGroupAssignmentResolver.kt "$OUT/companion/"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt "$OUT/family/"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/MyStudyCompanionApp.kt "$OUT/ui/"
          cp MyStudyCompanion/firestore.rules "$OUT/rules/android-firestore.rules"
          cp MyStudyCompanionWeb/firestore.rules "$OUT/rules/web-firestore.rules"
          cp MyStudyCompanionWeb/firebase-sync.js "$OUT/"

          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/msc-source-publish"
            git fetch origin agent/msc-0.15.6-root-fix-ci
            git worktree add --detach "$RUNNER_TEMP/msc-source-publish" origin/agent/msc-0.15.6-root-fix-ci
            (
              cd "$RUNNER_TEMP/msc-source-publish"
              rm -rf .msc-debug/0.15.7-auth-household-source
              mkdir -p .msc-debug/0.15.7-auth-household-source
              cp -R "$OUT"/. .msc-debug/0.15.7-auth-household-source/
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add .msc-debug/0.15.7-auth-household-source
              git commit -m 'Publish exact 0.15.7 auth and household source snapshot' || true
              git push origin HEAD:agent/msc-0.15.6-root-fix-ci
            ) && break
            git worktree remove --force "$RUNNER_TEMP/msc-source-publish" || true
            sleep $((attempt * 2))
          done
          git worktree remove --force "$RUNNER_TEMP/msc-source-publish" || true

      - name: Upload configured APKs and proof
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.7-auth-restored-free-invite-configured-ci-v2
          path: release-0.15.7
          retention-days: 7
          if-no-files-found: error

      - name: Publish final deterministic result
        if: always()
        shell: bash
        env:
          STATUS_RESULT: ${{ job.status }}
        run: |
          set -u
          publish_status() {
            for attempt in 1 2 3 4; do
              rm -rf "$RUNNER_TEMP/msc-status-final"
              git fetch origin agent/msc-0.15.6-root-fix-ci
              git worktree add --detach "$RUNNER_TEMP/msc-status-final" origin/agent/msc-0.15.6-root-fix-ci
              (
                cd "$RUNNER_TEMP/msc-status-final"
                cat > MSC-0.15.7-AUTH-RESTORED-V2-STATUS.txt <<EOF
          source_commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          artifact_name=msc-0.15.7-auth-restored-free-invite-configured-ci-v2
          architecture=firebase_spark_free_only
          google_sign_in=finished_apk_gated
          child_age_safety=unit_and_source_gated
          EOF
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                git add MSC-0.15.7-AUTH-RESTORED-V2-STATUS.txt
                git commit -m "Record 0.15.7 auth-restored final ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
                git push origin HEAD:agent/msc-0.15.6-root-fix-ci
              ) && return 0
              git worktree remove --force "$RUNNER_TEMP/msc-status-final" || true
              sleep $((attempt * 2))
            done
            return 1
          }
          publish_status
          git worktree remove --force "$RUNNER_TEMP/msc-status-final" || true
