name: HAVENLINE approved character reference materialization

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - ".tooling/havenline-character-reference-payload/**"
      - ".github/workflows/havenline-character-reference-materialization.yml"

permissions:
  contents: write

jobs:
  materialize-approved-character-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize all four approved turnaround sheets
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-reference-payload/materialize_references.py \
            --output-root HAVENLINE_UNITY/Reference/Characters/Approved

      - name: Verify reference count, formats, sizes, and checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("HAVENLINE_UNITY/Reference/Characters/Approved")
          expected = {
              "Character1.jpg": (17937, "36dd42d6d8f80651140958396742d37d14ae2c2676e167fe162a8d96b51df77f", b"\xff\xd8\xff"),
              "Character2.webp": (10762, "a3b492768c5d0bf9fb8cfc9cc294500590987f51e9b4c0668b8125537e7d72b8", b"RIFF"),
              "Character3.webp": (11506, "f51c249f4a1a904c40edb0cd35d1bfed0fbdfeb64c4f17dd052cc9b8a27c3d85", b"RIFF"),
              "Character4.webp": (11508, "2341399aefa304670c90835dfb14e24e31997d51d5ba2ae90a755d6e1ffcb671", b"RIFF"),
          }
          for name, (size, digest, magic) in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"missing approved reference: {path}")
              data = path.read_bytes()
              if len(data) != size:
                  raise SystemExit(f"size mismatch for {name}: {len(data)} != {size}")
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"checksum mismatch for {name}")
              if not data.startswith(magic):
                  raise SystemExit(f"file signature mismatch for {name}")
              if name.endswith(".webp") and data[8:12] != b"WEBP":
                  raise SystemExit(f"WEBP signature mismatch for {name}")

          report = json.loads((root / "materialization-report.json").read_text())
          if report.get("approvedReferenceCount") != 4 or not report.get("allVerified"):
              raise SystemExit("materialization report did not verify all four references")
          print("All four approved character turnaround sheets verified.")
          PY

      - name: Write Codex-readable reference index
        run: |
          set -euo pipefail
          cat > HAVENLINE_UNITY/Reference/Characters/Approved/README.md <<'EOF'
          # HAVENLINE Approved Character References

          **This directory is the canonical, visible GitHub location for all approved 2D character identity references.**

          Codex and all character-generation/reconstruction tooling must use these four files as identity authority. Fab or other marketplace characters may not replace the four hero identities.

          | Character | Canonical file | Original turnaround source name | Required views contained in sheet | SHA-256 |
          |---|---|---|---|---|
          | Character 1 | `Character1.jpg` | `image-gen-1(20260806-004835).png` | front, three-quarter, side, back | `36dd42d6d8f80651140958396742d37d14ae2c2676e167fe162a8d96b51df77f` |
          | Character 2 | `Character2.webp` | `image-gen-2(20260806-004837).png` | front, three-quarter, side, back | `a3b492768c5d0bf9fb8cfc9cc294500590987f51e9b4c0668b8125537e7d72b8` |
          | Character 3 | `Character3.webp` | `Expedition Girl Character Turnaround.png` | three-quarter, front, side, back | `f51c249f4a1a904c40edb0cd35d1bfed0fbdfeb64c4f17dd052cc9b8a27c3d85` |
          | Character 4 | `Character4.webp` | `Expedition Girl Character Turnaround(1).png` | three-quarter, front, side, back | `2341399aefa304670c90835dfb14e24e31997d51d5ba2ae90a755d6e1ffcb671` |

          There are **four approved turnaround sheets total**, not one. Each sheet contains the complete multi-view reference needed to reconstruct that character. Do not treat Character 1 as the only available reference.

          The source-of-truth text-safe payloads remain in `.tooling/havenline-character-reference-payload/`. `materialization-report.json` verifies byte count and SHA-256 for every reconstructed binary.
          EOF

          cat > HAVENLINE_UNITY/Reference/Characters/Approved/REFERENCE_INDEX.json <<'EOF'
          {
            "schemaVersion": 1,
            "authority": "approved-2d-character-identity",
            "approvedReferenceCount": 4,
            "heroReplacementFromMarketplaceAllowed": false,
            "references": [
              {"id":"character_1","file":"Character1.jpg","original":"image-gen-1(20260806-004835).png","views":["front","three_quarter","side","back"],"sha256":"36dd42d6d8f80651140958396742d37d14ae2c2676e167fe162a8d96b51df77f"},
              {"id":"character_2","file":"Character2.webp","original":"image-gen-2(20260806-004837).png","views":["front","three_quarter","side","back"],"sha256":"a3b492768c5d0bf9fb8cfc9cc294500590987f51e9b4c0668b8125537e7d72b8"},
              {"id":"character_3","file":"Character3.webp","original":"Expedition Girl Character Turnaround.png","views":["three_quarter","front","side","back"],"sha256":"f51c249f4a1a904c40edb0cd35d1bfed0fbdfeb64c4f17dd052cc9b8a27c3d85"},
              {"id":"character_4","file":"Character4.webp","original":"Expedition Girl Character Turnaround(1).png","views":["three_quarter","front","side","back"],"sha256":"2341399aefa304670c90835dfb14e24e31997d51d5ba2ae90a755d6e1ffcb671"}
            ]
          }
          EOF

      - name: Commit visible binary references to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HAVENLINE_UNITY/Reference/Characters/Approved
          if git diff --cached --quiet; then
            echo "Approved binary references are already committed and current."
            exit 0
          fi
          git commit -m "chore(havenline): attach all approved character references"
          git pull --rebase origin havenline-unity-reference-rebuild
          git push origin HEAD:havenline-unity-reference-rebuild
