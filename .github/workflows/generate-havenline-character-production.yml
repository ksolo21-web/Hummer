name: HAVENLINE Production Character Pipeline Router

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.tooling/havenline-character-production/**'
      - '.tooling/havenline-character-reference-payload/**'
      - '.github/workflows/generate-havenline-character-production.yml'
      - '.github/workflows/generate-havenline-support-characters-sf3d.yml'

permissions:
  contents: read

concurrency:
  group: havenline-production-character-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-routing-contract:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify active reconstruction routes and production boundaries
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.tooling/havenline-character-production')
          versions = json.loads((root / 'runtime-versions.json').read_text())
          reconstruction = versions['reconstruction']

          assert versions['schemaVersion'] == 3
          assert versions['blender']['version'] == '4.5.12'
          assert reconstruction['Character1']['generator'] == 'Stability-AI/stable-fast-3d'
          assert reconstruction['Character1']['rejectedPrimary']['humanVisualReviewStatus'] == 'rejected'
          assert reconstruction['Character1']['rejectedPrimary']['productionArtifactId'] == 8974534288
          assert reconstruction['Character2']['generator'] == 'trellis-community/TRELLIS'
          assert reconstruction['Character2']['artifactId'] == 8973791027
          assert reconstruction['Character2']['humanVisualReviewStatus'] == 'pending-unity-review'
          assert reconstruction['Character3']['generator'] == 'Stability-AI/stable-fast-3d'
          assert reconstruction['Character4']['generator'] == 'Stability-AI/stable-fast-3d'
          assert versions['stableFast3D']['commit'] == 'ff21fc491b4dc5314bf6734c7c0dabd86b5f5bb2'
          assert versions['stableFast3D']['minimumVramGb'] == 6
          assert versions['stableFast3D']['textureResolution'] == 2048
          assert versions['stableFast3D']['remeshOption'] == 'triangle'
          assert versions['stableFast3D']['targetVertexCount'] == 42000
          assert versions['promotionBoundary'].startswith('No generated character may enter')

          required = [
              root / 'prepare_sf3d_character_input.py',
              root / 'finalize_sf3d_generation.py',
              root / 'run_sf3d_support_pipeline.ps1',
              root / 'character1-seed9101-visual-rejection.json',
              root / 'character2-unity-review-candidate.json',
              root / 'stage_unity_character_review_sources.py',
              Path('.github/workflows/generate-havenline-support-characters-sf3d.yml'),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit('Missing routed production files: ' + ', '.join(missing))

          active_contract = '\n'.join(path.read_text(errors='ignore') for path in required)
          if 'local-triposr' in active_contract or 'VAST-AI-Research/TripoSR' in active_contract:
              raise SystemExit('Obsolete TripoSR execution remains in an active production route.')

          rejection = json.loads((root / 'character1-seed9101-visual-rejection.json').read_text())
          assert rejection['artifact']['id'] == '8974534288'
          assert rejection['humanVisualReview']['status'] == 'rejected'
          assert rejection['acceptedForUnityReview'] is False
          assert rejection['approved'] is False
          assert rejection['unityIntegrated'] is False

          candidate = json.loads((root / 'character2-unity-review-candidate.json').read_text())
          assert candidate['artifact']['id'] == '8973791027'
          assert candidate['blenderVisualReview']['status'] == 'accepted-for-unity-review'
          assert candidate['approved'] is False
          assert candidate['unityIntegrated'] is False

          print('HAVENLINE routing passed: Character 1/3/4 SF3D RTX; pinned Character 2 TRELLIS candidate; Blender 4.5.12; human approval required.')

      - name: Confirm obsolete reconstruction routes cannot execute
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/generate-havenline-character-production.yml
          ! grep -Fq 'local-triposr' "$workflow"
          ! grep -Fq 'VAST-AI-Research/TripoSR' "$workflow"
          ! grep -Fq 'prepare_triposr_character_input.py' "$workflow"
          test ! -e .tooling/havenline-character-production/prepare_triposr_character_input.py
          test ! -e .github/workflows/regenerate-havenline-character1-triposr.yml
