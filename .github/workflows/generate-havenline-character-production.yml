name: HAVENLINE Character Authority and Candidate Router

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.tooling/havenline-character-production/**'
      - '.tooling/havenline-character-reference-payload/**'
      - 'HAVENLINE_UNITY/Assets/Havenline/Art/Characters/Production/HAVENLINE_CHARACTER_APPROVALS.json'
      - '.github/workflows/generate-havenline-character-production.yml'

permissions:
  contents: read

concurrency:
  group: havenline-character-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-character-authority:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved 2D identity authority and candidate-only generators
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.tooling/havenline-character-production')
          versions = json.loads((root / 'runtime-versions.json').read_text())
          approvals = json.loads(Path(
              'HAVENLINE_UNITY/Assets/Havenline/Art/Characters/Production/HAVENLINE_CHARACTER_APPROVALS.json'
          ).read_text())

          assert versions['schemaVersion'] == 3
          assert versions['identityAuthority'] == 'approved-2d-turnaround-sheets'
          assert versions['generatorRole'] == 'candidate-base-generation-only'
          assert versions['customRemodelingAllowed'] is True
          assert versions['fabHeroReplacementAllowed'] is False
          assert versions['blender']['version'] == '4.5.12'
          assert 'custom mesh construction and remodeling' in versions['blender']['purpose']

          assert approvals['characterIdentityAuthority'] == 'approved-2d-turnaround-sheets'
          assert approvals['fabHeroReplacementAllowed'] is False
          assert approvals['customOrRemodeledProductionCharactersAllowed'] is True
          assert approvals['humanVisualApprovalRequired'] is True

          expected = {'Character1', 'Character2', 'Character3', 'Character4'}
          entries = approvals['characters']
          assert {entry['character'] for entry in entries} == expected
          for entry in entries:
              assert entry['approved'] is False
              assert not entry['approvedBy']
              assert 'approved 2D turnaround is the identity authority' in entry['approvalNote']

          reconstruction = versions['reconstruction']
          assert set(reconstruction) == expected
          assert reconstruction['Character1']['rejectedPrimary']['humanVisualReviewStatus'] == 'rejected'
          assert reconstruction['Character2']['humanVisualReviewStatus'] == 'pending-unity-review'

          # Existing image-to-3D outputs are optional starting points only. The router deliberately
          # does not require a specific generator to be the final hero-production path.
          assert versions['stableFast3D']['role'].endswith('never identity authority')
          assert versions['promotionBoundary'].startswith('No generated, marketplace, or remodeled character')

          print('HAVENLINE character authority passed: approved 2D sheets control identity; custom/remodeled stylized 3D is allowed; Fab hero replacement is forbidden; reconstruction outputs remain candidates only.')

      - name: Run immutable artifact rejection and substitution tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .tooling/havenline-character-production/test_character_artifact_policy.py

      - name: Confirm no character is silently promoted by routing metadata
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.tooling/havenline-character-production')
          for path in root.glob('*unity-review-candidate.json'):
              payload = json.loads(path.read_text())
              assert payload.get('approved') is False
              assert payload.get('unityIntegrated') is False
              assert payload.get('humanVisualApprovalRequired', True) is True
          print('All routed character candidates remain non-promoted pending visual approval.')
