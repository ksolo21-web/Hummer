name: Public Lysander aerial reference R08
on:
  push:
    branches: [public-lysander-imagery-20260915-r08]
    paths: ['.github/workflows/public-lysander-imagery-r08.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve official public imagery only
        shell: bash
        run: |
          mkdir -p public_imagery
          python - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,pathlib,datetime,time
          out=pathlib.Path('public_imagery'); receipts=[]
          def get(url,name):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'PublicMapVerification/1.0'})
                      with urllib.request.urlopen(req,timeout=40) as r: data=r.read();ctype=r.headers.get('Content-Type','')
                      (out/name).write_bytes(data)
                      receipts.append({'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content_type':ctype,'retrieved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
                      return data
                  except Exception as e: last=e;time.sleep(2)
              raise last
          for year in (2025,2023):
              base=f'https://gisservices.oakgov.com/arcgis/rest/services/ImageServices/EnterpriseOrthoTC{year}ImageService/ImageServer'
              get(base+'?f=pjson',f'county-{year}-metadata.json')
              params={'f':'json','bbox':'-83.13190,42.68760,-83.12940,42.68850','bboxSR':'4326','imageSR':'3857','size':'2048,1024','format':'png','bandIds':'0,1,2','interpolation':'RSP_BilinearInterpolation'}
              j=json.loads(get(base+'/exportImage?'+urllib.parse.urlencode(params),f'county-{year}-export.json'))
              if 'href' not in j: raise RuntimeError(j)
              get(j['href'],f'lysander-{year}.png')
          (out/'RECEIPTS.json').write_text(json.dumps(receipts,indent=2))
          (out/'SCOPE.txt').write_text('Public county aerial imagery of Lysander Street, Rochester, Michigan only. No private maps, assignments, resident names, credentials or user data supplied. County image-service year and retrieval date are distinct. Unmodified source imagery and geographic extent are retained for verification.')
          print(json.dumps([{'file':r['file'],'bytes':r['bytes']} for r in receipts]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-lysander-imagery-20260915-r08
          path: public_imagery/
          retention-days: 7
          if-no-files-found: error
