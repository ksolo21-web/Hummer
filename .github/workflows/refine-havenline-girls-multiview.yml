name: Refine HAVENLINE Girls Multi-View Characters

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/refine-havenline-girls-multiview.yml'
      - '.tooling/havenline-girls-multiview/remove_spatial_outliers.py'
      - '.tooling/havenline-girls-multiview/refine_multiview_eyes.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-girls-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refine-girl:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        character:
          - Character3
          - Character4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download proven multi-view production source
        uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-reconstructed-production-review
          path: prior
          github-token: ${{ github.token }}
          repository: ksolo21-web/Hummer
          run-id: 31102995053

      - name: Install Blender and validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' pillow trimesh pygltflib
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            blender python3-numpy libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libglu1-mesa libopengl0 libglib2.0-0 mesa-utils xvfb xauth

      - name: Restore exact multi-view source package
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
        run: |
          set -euo pipefail
          out="character_output/$CHARACTER"
          rm -rf "$out"
          mkdir -p "$out"
          cp -a prior/. "$out/"
          test -s "$out/${CHARACTER}_sanitized.glb"
          test -s "$out/approved_reference_sheet.jpg"

      - name: Remove detached spatial reconstruction islands
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/$CHARACTER"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/remove_spatial_outliers.py -- \
            --character "$CHARACTER" \
            --input "$out/${CHARACTER}_sanitized.glb" \
            --output "$out"
          test -s "$out/${CHARACTER}_spatial.glb"
          test -s "$out/spatial-outlier-report.json"

      - name: Add centered modeled eyes to Character 3
        if: ${{ matrix.character == 'Character3' }}
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/$CHARACTER"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/refine_multiview_eyes.py -- \
            --character "$CHARACTER" \
            --input "$out/${CHARACTER}_spatial.glb" \
            --output "$out"
          test -s "$out/${CHARACTER}_face_refined.glb"
          test -s "$out/multiview-eye-refinement-report.json"

      - name: Rebuild clean skinned production character
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/$CHARACTER"
          input="$out/${CHARACTER}_spatial.glb"
          if test -s "$out/${CHARACTER}_face_refined.glb"; then
            input="$out/${CHARACTER}_face_refined.glb"
          fi
          rm -f \
            "$out/${CHARACTER}_production.glb" \
            "$out/${CHARACTER}_production.fbx" \
            "$out/${CHARACTER}_LOD1.glb" \
            "$out/${CHARACTER}_LOD2.glb" \
            "$out/proof_front.png" \
            "$out/proof_three-quarter.png" \
            "$out/proof_side.png" \
            "$out/proof_back.png" \
            "$out/rig-report.json" \
            "$out/proof-render-report.json" \
            "$out/validation-report.json"
          rig_script="$RUNNER_TEMP/rig_animate_character_clean.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          test -s "$rig_script"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python "$rig_script" -- \
            --character "$CHARACTER" \
            --input "$input" \
            --output "$out"
          test -s "$out/${CHARACTER}_production.glb"
          test -s "$out/${CHARACTER}_production.fbx"
          test -s "$out/${CHARACTER}_LOD1.glb"
          test -s "$out/${CHARACTER}_LOD2.glb"

      - name: Render exact final-GLB proof angles
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/$CHARACTER"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-character-production/render_character_proofs_v4.py -- \
            --character "$CHARACTER" \
            --input "$out/${CHARACTER}_production.glb" \
            --output "$out"
          test -s "$out/proof_front.png"
          test -s "$out/proof_three-quarter.png"
          test -s "$out/proof_side.png"
          test -s "$out/proof_back.png"

      - name: Validate refined production asset
        shell: bash
        env:
          CHARACTER: ${{ matrix.character }}
        run: |
          set -euo pipefail
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character "$CHARACTER" \
            --directory "character_output/$CHARACTER"
          python - "character_output/$CHARACTER/validation-report.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not report.get('passed'):
              raise SystemExit(json.dumps(report.get('failures', []), indent=2))
          PY

      - name: Write truthful visual-review status
        shell: python
        env:
          CHARACTER: ${{ matrix.character }}
        run: |
          import json, os, pathlib
          character = os.environ['CHARACTER']
          root = pathlib.Path('character_output') / character
          spatial = json.loads((root / 'spatial-outlier-report.json').read_text())
          eye_path = root / 'multiview-eye-refinement-report.json'
          eye = json.loads(eye_path.read_text()) if eye_path.is_file() else None
          validation = json.loads((root / 'validation-report.json').read_text())
          status = {
              'schemaVersion': 1,
              'character': character,
              'sourceRunId': '31102995053',
              'spatialCleanupPassed': spatial.get('success') is True,
              'spatialSplitsDetected': spatial.get('splitsDetected'),
              'spatialVerticesRemoved': spatial.get('verticesRemoved'),
              'eyeRefinement': eye,
              'machineValidationPassed': validation.get('passed') is True,
              'humanVisualReviewStatus': 'pending',
              'approved': False,
              'unityIntegrated': False,
              'truth': 'Machine-complete refined character; human proof review is still required before Unity integration.',
          }
          (root / 'refinement-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload refined character review package
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-refined-multiview-review
          path: character_output/${{ matrix.character }}/
          if-no-files-found: error
          retention-days: 30
