name: My Study Companion 0.11.1 Phone and JW Library Retry

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-phone-jw-library-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out installed phone verifier
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download proven 0.11.1 debug APK bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts/8768596137/zip' \
            -o debug-bundle.zip
          mkdir -p dist
          unzip -q debug-bundle.zip -d dist
          test -f dist/MyStudyCompanion-phone-0.11.1-debug.apk
          echo 'c929d5a79164fb7131cc149e75f0e5f2218aafcab6f866c3c8aa74336b68087e  dist/MyStudyCompanion-phone-0.11.1-debug.apk' \
            | sha256sum -c -

      - name: Download current official JW Library APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?alllangs=1&fileformat=APK&langwritten=E&output=json&pub=jwlb&txtCMSLang=E' \
            -o response.json
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          data = json.loads(Path('response.json').read_text(encoding='utf-8'))
          urls = re.findall(r'https://[^"\\]+?\.apk(?:\?[^"\\]*)?', json.dumps(data), flags=re.I)
          if not urls:
              raise SystemExit('No official JW Library APK URL')
          urllib.request.urlretrieve(urls[0], 'JWLibrary.apk')
          PY
          unzip -tq JWLibrary.apk

      - name: Install phone APK and verify official JW Library integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 768M
          disk-size: 6144M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .msc-build/installed-phone-0111.sh

      - name: Upload installed phone and JW Library evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.11.1-installed-phone-jw-retry-evidence
          path: installed-evidence/
          retention-days: 3
          if-no-files-found: warn
