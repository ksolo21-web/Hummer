name: HAVENLINE Premium Visual Revision 9

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - .github/workflows/havenline-premium-visual-review-9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0

      - name: Apply premium visual revision
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/havenline_visual_patch9.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'Rerun the layered snow and HUD-inclusive visual review after correcting Unity mesh and shadow API compatibility.',
              'Compile and score the layered snow, dimensional lighting, static HUD font and UI-inclusive premium proofs.')
          path.write_text(source, encoding='utf-8')
          PY
          python .github/scripts/havenline_visual_patch9.py

      - name: Commit premium visual revision
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlinePremiumVisualAssets.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlinePremiumVisualPolish.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineStudioBitmapFont.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineStudioRevision.cs
          git commit -m "Improve HAVENLINE snow silhouettes composition and HUD"
          git push origin HEAD:havenline-unity-reference-rebuild
