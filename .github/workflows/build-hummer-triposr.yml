name: Build Hummer Surface with TripoSR

on:
  push:
    paths:
      - '.tooling/triposr-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential ninja-build ffmpeg libgl1 libegl1 libglib2.0-0

      - name: Install TripoSR CPU environment
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.2.2 torchvision==0.17.2
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git triposr
          cd triposr
          python -m pip install \
            'numpy<2' omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 \
            transformers==4.35.0 trimesh==4.0.5 rembg==2.0.57 \
            huggingface-hub imageio imageio-ffmpeg xatlas==0.0.9 \
            moderngl==5.10.0 onnxruntime
          python -m pip install git+https://github.com/tatsy/torchmcubes.git

      - name: Download licensed production Hummer reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs outputs
          curl --fail --location --retry 5 \
            --output inputs/hummer_suv_front3q.jpg \
            'https://upload.wikimedia.org/wikipedia/commons/c/c4/2024_GMC_Hummer_EV3X_SUV%2C_front_left%2C_10-29-2023.jpg'
          file inputs/hummer_suv_front3q.jpg
          sha256sum inputs/hummer_suv_front3q.jpg | tee inputs/SHA256SUMS.txt

      - name: Reconstruct Hummer surface on CPU
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          cd triposr
          python run.py ../inputs/hummer_suv_front3q.jpg \
            --device cpu \
            --chunk-size 4096 \
            --mc-resolution 192 \
            --foreground-ratio 0.86 \
            --model-save-format glb \
            --output-dir ../outputs
          find ../outputs -maxdepth 3 -type f -printf '%p %k KB\n'

      - name: Validate and package output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          mesh_path = Path('outputs/0/mesh.glb')
          if not mesh_path.exists() or mesh_path.stat().st_size < 10000:
              raise SystemExit('TripoSR output mesh missing or unexpectedly small')
          scene = trimesh.load(mesh_path, force='scene')
          geometries = list(scene.geometry.values())
          vertices = sum(len(g.vertices) for g in geometries)
          faces = sum(len(g.faces) for g in geometries)
          bounds = scene.bounds.tolist()
          report = {
              'source': 'Wikimedia Commons CC BY-SA 4.0 production Hummer EV SUV photo',
              'source_file': '2024_GMC_Hummer_EV3X_SUV_front_left_10-29-2023.jpg',
              'generator': 'VAST-AI-Research/TripoSR',
              'generator_license': 'MIT',
              'vertices': vertices,
              'faces': faces,
              'bounds': bounds,
              'raw_output_only': True,
              'intended_use': 'surface reference for dimensional Blender rebuild and retopology'
          }
          Path('outputs/reconstruction_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
          cp inputs/hummer_suv_front3q.jpg outputs/source_reference.jpg
          cat > outputs/ATTRIBUTION.txt <<'EOF'
          Source reference photograph:
          2024 GMC Hummer EV3X SUV, front left, 10-29-2023
          Wikimedia Commons file by Elise240SX
          License: Creative Commons Attribution-ShareAlike 4.0 International
          Source: https://commons.wikimedia.org/wiki/File:2024_GMC_Hummer_EV3X_SUV,_front_left,_10-29-2023.jpg

          Reconstruction software:
          TripoSR by Stability AI and VAST
          Repository: https://github.com/VAST-AI-Research/TripoSR
          License: MIT
          EOF
          tar --format=posix -C outputs -cf hummer-triposr-suv.tar .
          sha256sum hummer-triposr-suv.tar
          ls -lh hummer-triposr-suv.tar

      - name: Upload reconstructed surface
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hummer-triposr-suv
          path: hummer-triposr-suv.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Record result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{status:"complete",artifact_id:($artifact_id|tonumber),run_id:$run_id,run_url:$run_url}' \
            > .tooling/triposr-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/triposr-status.json
          git commit -m 'Record TripoSR Hummer surface artifact' || exit 0
          git push
