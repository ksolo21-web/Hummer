name: My Study Companion 0.12.2 Installed Complete-Link Verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.0-installed.yml'
      - '.github/workflows/msc-0.12.0-source-traceability.yml'
      - '.msc-build/start-phone-emulator.sh'
      - '.msc-build/download-0122-exact-head-artifact.sh'
      - '.msc-build/installed-phone-migration-0121.sh'
      - '.msc-build/installed-phone-migration-0122.sh'
      - '.msc-build/installed-phone-jw-0121-core.sh'
      - '.msc-build/run-installed-phone-jw-core-return.sh'
      - '.msc-build/run-installed-phone-jw-safe-scroll.sh'
      - '.msc-build/installed-phone-jw-0122.sh'
      - '.msc-build/installed-wear-0121.sh'
      - '.msc-build/installed-wear-0122.sh'
      - '.msc-build/reconstruct-build-0122.sh'
      - '.msc-build/reconstruct-build-0122-signed-pair.sh'
      - '.msc-build/patch-0.12.2-*'
  workflow_dispatch:

concurrency:
  group: msc-0122-installed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  installed-phone-migration-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out exact 0.12.2 verifier branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download exact-head 0.12.2 bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .msc-build/download-0122-exact-head-artifact.sh

      - name: Bootstrap a service-stable API 33 phone emulator
        shell: bash
        env:
          MSC_AVD_NAME: msc-0122-migration-api33
        run: bash .msc-build/start-phone-emulator.sh installed-0122-evidence/migration/emulator

      - name: Verify real Room migration and adaptive phone/tablet layouts
        shell: bash
        run: bash .msc-build/installed-phone-migration-0122.sh

      - name: Stop migration emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f installed-0122-evidence/migration/emulator/emulator.pid ]]; then
            kill "$(cat installed-0122-evidence/migration/emulator/emulator.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload 0.12.2 migration and layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.2-installed-phone-migration-layout-evidence
          path: installed-0122-evidence/migration/
          retention-days: 5
          if-no-files-found: warn

  installed-phone-jw-library:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact 0.12.2 JW Library verifier branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download exact-head 0.12.2 bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .msc-build/download-0122-exact-head-artifact.sh

      - name: Download current official JW Library APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?alllangs=1&fileformat=APK&langwritten=E&output=json&pub=jwlb&txtCMSLang=E' \
            -o response.json
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          data = json.loads(Path('response.json').read_text(encoding='utf-8'))
          urls = re.findall(r'https://[^"\\]+?\.apk(?:\?[^"\\]*)?', json.dumps(data), flags=re.I)
          if not urls:
              raise SystemExit('No official JW Library APK URL was returned.')
          urllib.request.urlretrieve(urls[0], 'JWLibrary.apk')
          PY
          unzip -tq JWLibrary.apk

      - name: Bootstrap a service-stable API 33 phone emulator
        shell: bash
        env:
          MSC_AVD_NAME: msc-0122-jw-api33
        run: bash .msc-build/start-phone-emulator.sh installed-0122-evidence/jw-library/emulator

      - name: Verify app UI return behavior and every exact JW Library target class
        shell: bash
        run: bash .msc-build/installed-phone-jw-0122.sh

      - name: Stop JW Library emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f installed-0122-evidence/jw-library/emulator/emulator.pid ]]; then
            kill "$(cat installed-0122-evidence/jw-library/emulator/emulator.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload complete 0.12.2 JW Library evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.2-installed-phone-jw-complete-link-evidence
          path: installed-0122-evidence/jw-library/
          retention-days: 5
          if-no-files-found: warn

  installed-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact 0.12.2 Wear verifier branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download exact-head 0.12.2 bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .msc-build/download-0122-exact-head-artifact.sh

      - name: Enable KVM acceleration for Wear emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown root:kvm /dev/kvm >/dev/null 2>&1 || true
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install and verify 0.12.2 Wear APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: bash .msc-build/installed-wear-0122.sh

      - name: Upload 0.12.2 Wear evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.2-installed-wear-evidence
          path: installed-0122-evidence/wear/
          retention-days: 5
          if-no-files-found: warn
