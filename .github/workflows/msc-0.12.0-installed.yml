name: My Study Companion 0.12.1 Installed Verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.0-installed.yml'
      - '.msc-build/start-phone-emulator.sh'
      - '.msc-build/installed-phone-migration-0121.sh'
      - '.msc-build/installed-phone-jw-0121.sh'
      - '.msc-build/installed-wear-0121.sh'
  workflow_dispatch:

concurrency:
  group: msc-0121-installed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  installed-phone-migration-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out 0.12.1 migration verifier
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download latest verified 0.12.1 bundle and 0.12.0 migration baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=''
          for attempt in $(seq 1 80); do
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts?name=msc-0.12.1-grounded-links-debug-bundle&per_page=100' \
              -o artifacts.json
            ARTIFACT_ID="$(python3 - <<'PY'
          import json
          data = json.load(open('artifacts.json', encoding='utf-8'))
          items = [a for a in data.get('artifacts', []) if not a.get('expired')]
          print(sorted(items, key=lambda a: a['created_at'], reverse=True)[0]['id'] if items else '')
          PY
            )"
            [[ -n "$ARTIFACT_ID" ]] && break
            echo "Waiting for the verified 0.12.1 build artifact (attempt ${attempt}/80)."
            sleep 15
          done
          test -n "$ARTIFACT_ID"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o debug-bundle.zip
          mkdir -p dist
          unzip -q debug-bundle.zip -d dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts/8772028739/zip' \
            -o baseline-bundle.zip
          mkdir -p dist-baseline
          unzip -q baseline-bundle.zip -d dist-baseline
          (cd dist-baseline && sha256sum -c SHA256SUMS.txt)

      - name: Bootstrap a service-stable API 33 phone emulator
        shell: bash
        env:
          MSC_AVD_NAME: msc-migration-api33
        run: bash .msc-build/start-phone-emulator.sh installed-0121-evidence/migration/emulator

      - name: Verify real Room migration and adaptive AI layouts
        shell: bash
        run: bash .msc-build/installed-phone-migration-0121.sh

      - name: Stop migration emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f installed-0121-evidence/migration/emulator/emulator.pid ]]; then
            kill "$(cat installed-0121-evidence/migration/emulator/emulator.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload phone migration and layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.1-installed-phone-migration-layout-evidence
          path: installed-0121-evidence/migration/
          retention-days: 5
          if-no-files-found: warn

  installed-phone-jw-library:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out 0.12.1 JW Library verifier
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download latest verified 0.12.1 bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=''
          for attempt in $(seq 1 80); do
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts?name=msc-0.12.1-grounded-links-debug-bundle&per_page=100' \
              -o artifacts.json
            ARTIFACT_ID="$(python3 - <<'PY'
          import json
          data = json.load(open('artifacts.json', encoding='utf-8'))
          items = [a for a in data.get('artifacts', []) if not a.get('expired')]
          print(sorted(items, key=lambda a: a['created_at'], reverse=True)[0]['id'] if items else '')
          PY
            )"
            [[ -n "$ARTIFACT_ID" ]] && break
            echo "Waiting for the verified 0.12.1 build artifact (attempt ${attempt}/80)."
            sleep 15
          done
          test -n "$ARTIFACT_ID"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o debug-bundle.zip
          mkdir -p dist
          unzip -q debug-bundle.zip -d dist
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Download current official JW Library APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?alllangs=1&fileformat=APK&langwritten=E&output=json&pub=jwlb&txtCMSLang=E' \
            -o response.json
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          data = json.loads(Path('response.json').read_text(encoding='utf-8'))
          urls = re.findall(r'https://[^"\\]+?\.apk(?:\?[^"\\]*)?', json.dumps(data), flags=re.I)
          if not urls:
              raise SystemExit('No official JW Library APK URL was returned.')
          urllib.request.urlretrieve(urls[0], 'JWLibrary.apk')
          PY
          unzip -tq JWLibrary.apk

      - name: Bootstrap a service-stable API 33 phone emulator
        shell: bash
        env:
          MSC_AVD_NAME: msc-jw-api33
        run: bash .msc-build/start-phone-emulator.sh installed-0121-evidence/jw-library/emulator

      - name: Verify exact JW Library targets and Bible Journey return
        shell: bash
        run: bash .msc-build/installed-phone-jw-0121.sh

      - name: Stop JW Library emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f installed-0121-evidence/jw-library/emulator/emulator.pid ]]; then
            kill "$(cat installed-0121-evidence/jw-library/emulator/emulator.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload installed phone and JW Library evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.1-installed-phone-jw-evidence
          path: installed-0121-evidence/jw-library/
          retention-days: 5
          if-no-files-found: warn

  installed-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out 0.12.1 Wear verifier
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Download latest verified 0.12.1 Wear APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=''
          for attempt in $(seq 1 80); do
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts?name=msc-0.12.1-grounded-links-debug-bundle&per_page=100' \
              -o artifacts.json
            ARTIFACT_ID="$(python3 - <<'PY'
          import json
          data = json.load(open('artifacts.json', encoding='utf-8'))
          items = [a for a in data.get('artifacts', []) if not a.get('expired')]
          print(sorted(items, key=lambda a: a['created_at'], reverse=True)[0]['id'] if items else '')
          PY
            )"
            [[ -n "$ARTIFACT_ID" ]] && break
            echo "Waiting for the verified 0.12.1 build artifact (attempt ${attempt}/80)."
            sleep 15
          done
          test -n "$ARTIFACT_ID"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/ksolo21-web/Hummer/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o debug-bundle.zip
          mkdir -p dist
          unzip -q debug-bundle.zip -d dist
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Enable KVM acceleration for Wear emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown root:kvm /dev/kvm >/dev/null 2>&1 || true
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Install and launch 0.12.1 Wear APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: bash .msc-build/installed-wear-0121.sh

      - name: Upload installed Wear evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.1-installed-wear-evidence
          path: installed-0121-evidence/wear/
          retention-days: 5
          if-no-files-found: warn
