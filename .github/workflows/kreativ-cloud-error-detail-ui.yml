name: KREATIV Cloud Error Detail UI

on:
  push:
    branches:
      - agent/kreativ-studio-v0.1
    paths:
      - .github/workflows/kreativ-cloud-error-detail-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kreativ-studio-v0.1
          fetch-depth: 0
      - name: Apply exact cloud error reporting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt',
              '    val isCloudConfigured: Boolean get() = container.cloudSyncRepository.isConfigured\n',
              '    val isCloudConfigured: Boolean get() = container.cloudSyncRepository.isConfigured\n    val cloudFailureDetail: String? get() = container.cloudSyncRepository.lastFailureMessage\n',
          )
          replace_once(
              'app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt',
              '    private fun cloudUnavailableMessage(): String =\n        "Cloud backup is not authorized yet. Your work remains safely stored on this device."\n',
              '    private fun cloudUnavailableMessage(): String =\n        (cloudFailureDetail ?: "Cloud access has not been verified yet.") +\n            " Your work remains safely stored on this device."\n',
          )
          replace_once(
              'app/src/main/java/com/kreativstudio/app/ui/Screens.kt',
              'else "Google sign-in succeeded. Device autosave is active; Firebase cloud permission is not available yet.",',
              'else "Google sign-in succeeded. Device autosave is active. ${viewModel.cloudFailureDetail ?: "Cloud access has not been verified yet."}",',
          )
          PY
      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KREATIV Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt app/src/main/java/com/kreativstudio/app/ui/Screens.kt
          git commit -m 'Show exact Firebase service rejection in cloud settings'
          git push origin HEAD:agent/kreativ-studio-v0.1
