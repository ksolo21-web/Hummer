name: My Study Companion 0.14.1 Exact Source Snapshot

on:
  pull_request:
    branches:
      - agent/my-study-companion-0140-ci-base
  workflow_dispatch:

concurrency:
  group: msc-0141-exact-source-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out application branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-interactive-workbooks-0140

      - name: Check out checksum-locked workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Reconstruct exact current source without compiling legacy stages
        shell: bash
        run: |
          set -euo pipefail
          python3 .msc-build/reconstruct-source-only-0.14.1.py
          bash /tmp/reconstruct-build-0125-source-driver.sh

          python3 - <<'PY'
          from pathlib import Path
          build_file = Path('MyStudyCompanion/build.gradle.kts')
          source = build_file.read_text(encoding='utf-8')
          anchor = '            "HomeScreen.kt",\n'
          if source.count(anchor) != 1:
              raise SystemExit('Expected one HomeScreen compatibility-list anchor.')
          for filename in ('DailyFieldServicePointerCard.kt', 'EventNotebooksSection.kt'):
              entry = f'            "{filename}",\n'
              if entry not in source:
                  source = source.replace(anchor, entry + anchor, 1)
          build_file.write_text(source, encoding='utf-8')
          PY

          cat .msc-build/final-major-0.13.0.part*.b64 | base64 --decode > /tmp/msc-0130.tar.xz
          echo 'bd01fe658b10a2203732023cd0a559a538d4152468fcf0a37b5418f7eea1e217  /tmp/msc-0130.tar.xz' | sha256sum -c -
          tar -xJf /tmp/msc-0130.tar.xz -C .

          for file in workbook-payload/payload/interactive-workbooks-0.14.0.part*.b64; do
            grep -v '^#' "$file"
          done | tr -d '\n' | base64 --decode > /tmp/msc-0140-overlay.tar.xz
          echo '3bdc13f78b42f85861d4f6d92b0892bb1db59224ef318f241bf616ef14a75d32  /tmp/msc-0140-overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/msc-0140-overlay.tar.xz -C .
          python3 .msc-build/fix-interactive-workbooks-0.14.0.py

      - name: Package exact application source
        shell: bash
        run: |
          set -euo pipefail
          paths=(MyStudyCompanion)
          [[ -d MyStudyCompanionWeb ]] && paths+=(MyStudyCompanionWeb)
          [[ -d web ]] && paths+=(web)
          [[ -f firebase.json ]] && paths+=(firebase.json)
          printf 'Packaging source roots:\n'
          printf '  %s\n' "${paths[@]}"
          tar \
            --exclude='**/build' \
            --exclude='.gradle' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='final-dist' \
            -czf msc-0.14.1-exact-source.tgz \
            "${paths[@]}"
          sha256sum msc-0.14.1-exact-source.tgz > EXACT-SOURCE-SHA256.txt

      - name: Upload exact source
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.1-exact-source
          path: |
            msc-0.14.1-exact-source.tgz
            EXACT-SOURCE-SHA256.txt
          retention-days: 2
          if-no-files-found: error
