name: My Study Companion 0.15.16 Source Snapshot

on:
  push:
    branches:
      - agent/msc-0.15.15-ai-activity-rebuild
    paths:
      - .github/workflows/msc-0.15.16-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install source reconstruction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0

      - name: Create disposable source-snapshot signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/msc-source-snapshot"
          mkdir -p "$DIR"
          keytool -genkeypair -noprompt \
            -keystore "$DIR/snapshot.jks" \
            -storepass 'snapshot-only' \
            -keypass 'snapshot-only' \
            -alias 'snapshot' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion Source Snapshot, O=My Study Companion, C=US'
          echo "store_file=$DIR/snapshot.jks" >> "$GITHUB_OUTPUT"

      - name: Reconstruct cumulative source
        shell: bash
        env:
          MSC_SMART_ONLINE_VALIDATED: false
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: snapshot-only
          MSC_RELEASE_KEY_ALIAS: snapshot
          MSC_RELEASE_KEY_PASSWORD: snapshot-only
        run: |
          set -euo pipefail
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/run-0.15.14-vote-persistence-fix.sh
          bash .msc-build/apply-0.15.16-release-truth.sh
          mkdir -p source-snapshot
          cp --parents \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/InteractiveWorkbookEditor.kt \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/WorkbookIllustrationCatalog.kt \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/AiStudyRepository.kt \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/network/BackendApi.kt \
            MyStudyCompanion/app/build.gradle.kts \
            MyStudyCompanion/wear/build.gradle.kts \
            MyStudyCompanion/backend/app/main.py \
            MyStudyCompanion/backend/app/config.py \
            MyStudyCompanion/app/src/main/assets/workbook/manifest.json \
            source-snapshot/

      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.16-source-snapshot
          path: source-snapshot
          retention-days: 1
          if-no-files-found: error
