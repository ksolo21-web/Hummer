name: My Study Companion 0.11.1 Verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Reconstruct verified 0.11.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > base.tar.xz
          echo "f2c0bfb74455046a28d7aa54a4e27df021955ea703ae93a639bbe3bcb67ed2c4  base.tar.xz" | sha256sum -c -
          tar -xJf base.tar.xz
          cat .msc-build/scene-0.9.3.part*.b64 | base64 --decode > scene.tar.xz
          echo "48b6aa28b630bdbf0ade5fcfadd77af7b4a259807df0b73c4318f17fede4eec4  scene.tar.xz" | sha256sum -c -
          tar -xJf scene.tar.xz
          cat .msc-build/semantic-0.9.4.part*.b64 | base64 --decode > semantic.tar.xz
          echo "f693bcb607ad00a30c4338e8819250ed5f1d44f372e40093682a13c4beed6277  semantic.tar.xz" | sha256sum -c -
          tar -xJf semantic.tar.xz
          cat .msc-build/watchtower-0.9.5.part*.b64 | base64 --decode > watchtower.tar.xz
          echo "a742f0c76ba81b87fff0fe97e93e3c03e3968f2dc6ef6ef5ed24dd039bcf5d6e  watchtower.tar.xz" | sha256sum -c -
          tar -xJf watchtower.tar.xz
          cat .msc-build/verified-preparation-0.9.6.part*.b64 | base64 --decode > preparation.tar.xz
          echo "f320e0d36adcd21b2c8c1b1583620a37c38d3415f981cc34b35c77eafcd27278  preparation.tar.xz" | sha256sum -c -
          tar -xJf preparation.tar.xz
          cat .msc-build/ai-0.10.0.part*.b64 | base64 --decode > ai.tar.xz
          echo "7e7dde1ad7e8a26fdc797b7df154a416ebdc12c588915e79f00d497a45b70461  ai.tar.xz" | sha256sum -c -
          tar -xJf ai.tar.xz
          base64 --decode .msc-build/ai-0.10.0-fix1.b64 > ai-fix1.tar.xz
          echo "817fa3144c355b2691c6af8d4b17e70de14ddb2010ec1990399416e02beeba2d  ai-fix1.tar.xz" | sha256sum -c -
          tar -xJf ai-fix1.tar.xz
          python3 .msc-build/patch_source.py
          python3 MyStudyCompanion/tools/validate_source.py
          base64 --decode .msc-build/patch-0.10.1.py.gz.b64 | gzip -dc > /tmp/patch-0.10.1.py
          python3 /tmp/patch-0.10.1.py
          cat .msc-build/companion-0.11.0.part*.b64 | base64 --decode > /tmp/companion-0.11.0-overlay.tar.xz
          echo "c9704c0eef9c0086e1b0d53fe87911fbdf313888afd83783cc77b682e8859a76  /tmp/companion-0.11.0-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/companion-0.11.0-overlay.tar.xz -C MyStudyCompanion
          python3 .msc-build/patch-0.11.0-gradle.py

      - name: Apply checksum-locked 0.11.1 connectivity overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/connectivity-0.11.1.part*.b64 | base64 --decode > /tmp/connectivity-0.11.1.tar.xz
          echo "3322bc325f4946d7ee679c818300f34964419d96e022cf6f3b3bdda25366e0d8  /tmp/connectivity-0.11.1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/connectivity-0.11.1.tar.xz -C MyStudyCompanion
          grep -q 'versionCode = 23' MyStudyCompanion/app/build.gradle.kts
          grep -q '0.11.1-private-alpha-verified-connectivity' MyStudyCompanion/app/build.gradle.kts
          grep -q '360110101' MyStudyCompanion/wear/build.gradle.kts
          grep -q 'jwlibrary:///finder' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/JwLibraryLinkResolver.kt
          grep -q 'ScrollableTabRow' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/CompanionHubScreen.kt
          grep -q 'LazyColumn' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/MoreScreen.kt
          grep -q 'Restart at Day 1' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/CompanionHubScreen.kt
          test -s MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/data/official/OfficialWeeklyMeetingRepository.kt
          test -s MyStudyCompanion/app/src/test/java/com/mystudycompanion/app/companion/JwLibraryLinkResolverTest.kt
          test -s MyStudyCompanion/app/src/test/java/com/mystudycompanion/app/data/official/OfficialWeeklyMeetingRepositoryTest.kt

      - name: Verify current official meeting week resolves precisely
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.jw.org/en/library/jw-meeting-workbook/july-august-2026-mwb/Life-and-Ministry-Meeting-Schedule-for-July-27-August-2-2026/'
          curl --fail --location --retry 3 "$URL" -o current-week.html
          grep -q '202026244' current-week.html
          grep -Eqi 'Jeremiah 20.?21|JEREMIAH 20.?21' current-week.html
          grep -Eqi 'Jeremiah 20:7.?18' current-week.html

      - name: Run phone and Wear tests and build debug APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -PMSC_LOCAL_OWNER_MODE=true \
            :app:testDebugUnitTest :wear:testDebugUnitTest \
            :app:assembleDebug :wear:assembleDebug

      - name: Collect testable APKs and reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -f "$PHONE_APK"
          test -f "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-0.11.1-debug.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-0.11.1-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging dist/MyStudyCompanion-phone-0.11.1-debug.apk > dist/PHONE-IDENTITY.txt
          "$AAPT" dump badging dist/MyStudyCompanion-wear-0.11.1-debug.apk > dist/WEAR-IDENTITY.txt
          grep -q "versionCode='23'" dist/PHONE-IDENTITY.txt
          grep -q "versionName='0.11.1-private-alpha-verified-connectivity'" dist/PHONE-IDENTITY.txt
          grep -q "versionCode='360110101'" dist/WEAR-IDENTITY.txt
          grep -q "versionName='0.11.1-wear-private-alpha-verified-connectivity'" dist/WEAR-IDENTITY.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cp -R MyStudyCompanion/app/build/reports/tests dist/phone-test-reports
          cp -R MyStudyCompanion/wear/build/reports/tests dist/wear-test-reports

      - name: Upload debug verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.11.1-debug-verification-bundle
          retention-days: 3
          if-no-files-found: error
          path: dist/

  installed-phone-jw-library-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download debug verification bundle
        uses: actions/download-artifact@v8
        with:
          name: msc-0.11.1-debug-verification-bundle
          path: dist

      - name: Download current official JW Library APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?alllangs=1&fileformat=APK&langwritten=E&output=json&pub=jwlb&txtCMSLang=E' -o response.json
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          data = json.loads(Path('response.json').read_text(encoding='utf-8'))
          urls = re.findall(r'https://[^"\\]+?\.apk(?:\?[^"\\]*)?', json.dumps(data), flags=re.I)
          if not urls:
              raise SystemExit('No official JW Library APK URL')
          urllib.request.urlretrieve(urls[0], 'JWLibrary.apk')
          PY
          unzip -t JWLibrary.apk

      - name: Run installed-app, link, return, scrolling and tablet tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -euo pipefail <<'BASH'
            adb install -r JWLibrary.apk
            adb install -r dist/MyStudyCompanion-phone-0.11.1-debug.apk
            test "$(adb shell pm path org.jw.jwlibrary.mobile | tr -d '\r')" != ""
            test "$(adb shell pm path com.mystudycompanion.app.debug | tr -d '\r')" != ""

            resolve_jw() {
              local uri="$1"
              local resolved
              resolved="$(adb shell cmd package resolve-activity --brief -a android.intent.action.VIEW -d "$uri" | tr -d '\r')"
              echo "$uri -> $resolved"
              echo "$resolved" | grep -q 'org.jw.jwlibrary.mobile'
            }
            resolve_jw 'jwlibrary:///finder?wtlocale=E&bible=18001000'
            resolve_jw 'jwlibrary:///finder?wtlocale=E&bible=24020007-24020018'
            resolve_jw 'jwlibrary:///finder?wtlocale=E&docid=202026244&srcid=share'
            resolve_jw 'jwlibrary:///finder?wtlocale=E&pub=rsg19&srcid=share'
            resolve_jw 'https://www.jw.org/finder?wtlocale=E&docid=202026244&srcid=share'

            adb shell am start -W -a android.intent.action.VIEW -d 'jwlibrary:///finder?wtlocale=E&bible=18001000' org.jw.jwlibrary.mobile | tee jw-start.txt
            grep -q 'Status: ok' jw-start.txt
            adb shell dumpsys activity activities | grep -m1 'mResumedActivity' | grep -q 'org.jw.jwlibrary.mobile'

            adb shell am force-stop com.mystudycompanion.app.debug
            adb shell monkey -p com.mystudycompanion.app.debug -c android.intent.category.LAUNCHER 1
            sleep 3

            cat > /tmp/ui.py <<'PY'
            import re, subprocess, sys, time, xml.etree.ElementTree as ET
            def dump():
                subprocess.run(['adb','shell','uiautomator','dump','/sdcard/window.xml'], check=True, stdout=subprocess.DEVNULL)
                subprocess.run(['adb','pull','/sdcard/window.xml','/tmp/window.xml'], check=True, stdout=subprocess.DEVNULL)
                return ET.parse('/tmp/window.xml').getroot()
            def find(text):
                root=dump()
                for n in root.iter('node'):
                    value=(n.attrib.get('text') or n.attrib.get('content-desc') or '').strip()
                    if value == text or text in value:
                        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                        if m:
                            a,b,c,d=map(int,m.groups()); return ((a+c)//2,(b+d)//2,value)
                return None
            def tap(text):
                hit=find(text)
                if not hit: raise SystemExit(f'UI text not found: {text}')
                subprocess.run(['adb','shell','input','tap',str(hit[0]),str(hit[1])],check=True); time.sleep(2)
            def assert_text(text):
                if not find(text): raise SystemExit(f'Expected UI text not found: {text}')
            cmd=sys.argv[1]
            if cmd=='tap': tap(sys.argv[2])
            elif cmd=='assert': assert_text(sys.argv[2])
            PY

            python3 /tmp/ui.py tap 'Enter owner-only private alpha'
            python3 /tmp/ui.py tap 'More'
            for i in 1 2 3 4; do adb shell input swipe 500 1500 500 500 350; sleep 1; done
            python3 /tmp/ui.py assert 'Settings'

            adb shell am force-stop com.mystudycompanion.app.debug
            adb shell monkey -p com.mystudycompanion.app.debug -c android.intent.category.LAUNCHER 1
            sleep 2
            python3 /tmp/ui.py tap 'More'
            python3 /tmp/ui.py tap 'Personal Study Companion'
            python3 /tmp/ui.py assert 'Research'
            python3 /tmp/ui.py tap 'Bible'
            for i in 1 2 3; do adb shell input swipe 500 1500 500 650 300; sleep 1; done
            python3 /tmp/ui.py tap 'Start journey at Day 1'
            python3 /tmp/ui.py assert 'Day 1 of'
            python3 /tmp/ui.py assert 'Read now in JW Library'
            python3 /tmp/ui.py tap 'Read now in JW Library'
            sleep 3
            adb shell dumpsys activity activities | grep -m1 'mResumedActivity' | grep -q 'org.jw.jwlibrary.mobile'
            adb shell input keyevent 4
            sleep 2
            adb shell dumpsys activity activities | grep -m1 'mResumedActivity' | grep -q 'com.mystudycompanion.app.debug'
            python3 /tmp/ui.py assert 'Day 1 of'

            adb shell wm size 1600x2560
            adb shell wm density 320
            adb shell am force-stop com.mystudycompanion.app.debug
            adb shell monkey -p com.mystudycompanion.app.debug -c android.intent.category.LAUNCHER 1
            sleep 3
            python3 /tmp/ui.py tap 'More'
            python3 /tmp/ui.py assert 'Settings'
            python3 /tmp/ui.py tap 'Personal Study Companion'
            python3 /tmp/ui.py assert 'Research'

            adb exec-out screencap -p > installed-tablet-final.png
            adb shell uiautomator dump /sdcard/final.xml >/dev/null
            adb pull /sdcard/final.xml installed-final.xml >/dev/null
            BASH

      - name: Upload installed-app verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.11.1-installed-app-evidence
          retention-days: 3
          path: |
            jw-start.txt
            installed-tablet-final.png
            installed-final.xml
