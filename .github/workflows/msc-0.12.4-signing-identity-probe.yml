name: My Study Companion Canonical Signing Identity Probe

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.4-signing-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated app branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify protected signing certificate matches Firebase canonical app
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.MSC_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.MSC_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.MSC_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.MSC_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_B64:-}"
          test -n "${SIGNING_STORE_PASSWORD:-}"
          test -n "${SIGNING_KEY_ALIAS:-}"
          test -n "${SIGNING_KEY_PASSWORD:-}"

          mkdir -p "$RUNNER_TEMP/msc-signing"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/msc-signing/canonical.jks"
          chmod 600 "$RUNNER_TEMP/msc-signing/canonical.jks"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/msc-signing/canonical.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            > "$RUNNER_TEMP/msc-signing/keytool.txt"

          ACTUAL_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/msc-signing/keytool.txt" \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA1="$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/msc-signing/keytool.txt" \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256='13a3bb08a32ab57c36ea6f885a74b5bd40d70501f93ca9002df7b6cdd0491b2c'
          EXPECTED_SHA1='1997d421d177215a44f9651ce53dbaec152fbc49'
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          cat > SIGNING-IDENTITY-STATUS.txt <<'TXT'
          PASS: the protected GitHub signing key matches the permanent My Study Companion Firebase Android registration.
          PASS: future canonical APKs can upgrade com.mystudycompanion.app without creating a second incompatible app.
          TXT

      - name: Upload non-secret signing status
        uses: actions/upload-artifact@v7
        with:
          name: msc-canonical-signing-identity-status
          path: SIGNING-IDENTITY-STATUS.txt
          retention-days: 5
          if-no-files-found: error
