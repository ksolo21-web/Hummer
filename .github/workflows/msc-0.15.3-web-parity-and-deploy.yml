name: My Study Companion 0.15.3 Web Parity and Deploy

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the verified 0.15.3 PWA
        required: false
        default: VERIFY
        type: string

concurrency:
  group: msc-0153-web-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RELEASE_VERSION: 0.15.3
  WEB_CACHE_VERSION: msc-web-v0153-professional-workbook-assets-v1
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  FIREBASE_WEB_APP_ID: ${{ vars.MSC_FIREBASE_WEB_APP_ID }}

jobs:
  verify-web-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact release head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic workbook dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0

      - name: Reconstruct the same release used by Android and Wear
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh

      - name: Verify JavaScript, PWA behavior, and release features
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find MyStudyCompanionWeb -maxdepth 1 -type f -name '*.js' -print | sort)

          mapfile -t TESTS < <(find MyStudyCompanionWeb -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          if (( ${#TESTS[@]} > 0 )); then
            node --test "${TESTS[@]}"
          fi

          grep -Fq 'loadProfessionalWorkbookAsset' MyStudyCompanionWeb/workbook.js
          grep -Fq 'professionalPrintData' MyStudyCompanionWeb/workbook.js
          grep -Fq 'regionMask' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderSavedWork' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderCrossword' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderWordSearch' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderDifferences' MyStudyCompanionWeb/workbook.js
          grep -Fq "$WEB_CACHE_VERSION" MyStudyCompanionWeb/sw.js
          ! grep -R -Eq 'msc-web-v0151|msc-web-v0152' MyStudyCompanionWeb/sw.js
          ! find MyStudyCompanionWeb -type f \( -name '*.orig' -o -name '*.rej' -o -name '*.tmp' \) -print -quit | grep -q .

      - name: Prove Android and web workbook assets are identical
        shell: bash
        run: |
          set -euo pipefail
          ANDROID='MyStudyCompanion/app/src/main/assets/workbook'
          WEB='MyStudyCompanionWeb/assets/workbook'
          test -f "$ANDROID/manifest.json"
          test -f "$WEB/manifest.json"
          diff -ru "$ANDROID" "$WEB"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          android = Path('MyStudyCompanion/app/src/main/assets/workbook')
          web = Path('MyStudyCompanionWeb/assets/workbook')
          a_manifest = json.loads((android / 'manifest.json').read_text())
          w_manifest = json.loads((web / 'manifest.json').read_text())
          assert a_manifest == w_manifest
          assert a_manifest['version'] >= 3
          assert len(a_manifest['assets']) == 16
          assert all(35 <= len(item['regions']) <= 70 for item in a_manifest['assets'])
          assert all(len(item['differences']) == 5 for item in a_manifest['assets'])

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          android_files = sorted(p.relative_to(android) for p in android.rglob('*') if p.is_file())
          web_files = sorted(p.relative_to(web) for p in web.rglob('*') if p.is_file())
          assert android_files == web_files
          for relative in android_files:
              assert digest(android / relative) == digest(web / relative), relative
          print(f'PASS: {len(android_files)} workbook files are byte-identical across Android and PWA.')
          PY

      - name: Package the installable PWA with release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-0.15.3/web release-0.15.3/metadata
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = {
              'release': '0.15.3',
              'commit': os.environ['GITHUB_SHA'],
              'serviceWorkerCache': 'msc-web-v0153-professional-workbook-assets-v1',
              'workbookManifest': 'assets/workbook/manifest.json',
              'releaseTrain': ['android', 'wear', 'web'],
          }
          Path('MyStudyCompanionWeb/release-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (
            cd MyStudyCompanionWeb
            zip -q -r ../release-0.15.3/web/MyStudyCompanionWeb-0.15.3-PWA.zip . \
              -x '*.DS_Store' '__pycache__/*' '*.pyc' '*.orig' '*.rej'
          )
          sha256sum release-0.15.3/web/MyStudyCompanionWeb-0.15.3-PWA.zip \
            > release-0.15.3/metadata/WEB-SHA256SUMS.txt
          cp MyStudyCompanionWeb/release-manifest.json release-0.15.3/metadata/
          cp MyStudyCompanionWeb/assets/workbook/manifest.json release-0.15.3/metadata/WORKBOOK-MANIFEST.json
          cp MyStudyCompanionWeb/assets/workbook/SHA256SUMS.txt release-0.15.3/metadata/WORKBOOK-SHA256SUMS.txt

      - name: Upload verified PWA release
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.3-verified-pwa
          path: release-0.15.3
          retention-days: 14
          if-no-files-found: error

  deploy-firebase-hosting:
    needs: verify-web-parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: my-study-companion-private
    steps:
      - name: Check out exact approved release head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate protected Firebase deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT FIREBASE_WEB_APP_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required protected variable: $name" >&2
              exit 1
            fi
          done

      - name: Reconstruct exact verified web release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          diff -ru MyStudyCompanion/app/src/main/assets/workbook MyStudyCompanionWeb/assets/workbook

      - name: Authenticate with Google Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 523.0.0'

      - name: Generate live Firebase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          npm install --global firebase-tools@15.1.0
          firebase apps:sdkconfig web "$FIREBASE_WEB_APP_ID" \
            --project "$GCP_PROJECT_ID" \
            --out /tmp/firebase-web-sdk-config.json \
            --non-interactive
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          firebase = json.loads(Path('/tmp/firebase-web-sdk-config.json').read_text())
          required = ('apiKey', 'authDomain', 'projectId', 'appId')
          missing = [key for key in required if not firebase.get(key)]
          if missing:
              raise SystemExit(f'Firebase web config is missing: {missing}')
          project_id = firebase['projectId']
          runtime = {
              'firebase': firebase,
              'backendBaseUrl': f'https://{project_id}.web.app/',
              'officialContentEndpoint': '/v1/official/read',
              'release': '0.15.3',
              'buildCommit': os.environ['GITHUB_SHA'],
              'serviceWorkerCache': 'msc-web-v0153-professional-workbook-assets-v1',
              'releaseTrain': ['android', 'wear', 'web'],
          }
          Path('MyStudyCompanionWeb/runtime-config.json').write_text(
              json.dumps(runtime, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('MyStudyCompanionWeb/release-manifest.json').write_text(
              json.dumps({
                  'release': '0.15.3',
                  'commit': os.environ['GITHUB_SHA'],
                  'serviceWorkerCache': 'msc-web-v0153-professional-workbook-assets-v1',
                  'workbookManifest': 'assets/workbook/manifest.json',
                  'releaseTrain': ['android', 'wear', 'web'],
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Deploy the verified connected PWA
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanionWeb
          firebase deploy \
            --project "$GCP_PROJECT_ID" \
            --only hosting \
            --non-interactive \
            --message "My Study Companion 0.15.3 Android-Wear-Web synchronized release"

      - name: Verify live web release and professional assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$BASE_URL/runtime-config.json" > live-runtime.json
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$BASE_URL/release-manifest.json" > live-release.json
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$BASE_URL/sw.js" > live-sw.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$BASE_URL/workbook.js" > live-workbook.js
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$BASE_URL/assets/workbook/manifest.json" > live-workbook-manifest.json

          grep -Fq "$WEB_CACHE_VERSION" live-sw.js
          grep -Fq 'loadProfessionalWorkbookAsset' live-workbook.js
          grep -Fq 'professionalPrintData' live-workbook.js

          python - <<'PY'
          import json
          from pathlib import Path
          runtime = json.loads(Path('live-runtime.json').read_text())
          release = json.loads(Path('live-release.json').read_text())
          workbook = json.loads(Path('live-workbook-manifest.json').read_text())
          assert runtime['release'] == '0.15.3'
          assert runtime['serviceWorkerCache'] == 'msc-web-v0153-professional-workbook-assets-v1'
          assert runtime['releaseTrain'] == ['android', 'wear', 'web']
          assert release['release'] == '0.15.3'
          assert release['commit'] == runtime['buildCommit']
          assert workbook['version'] >= 3
          assert len(workbook['assets']) == 16
          assert all(35 <= len(item['regions']) <= 70 for item in workbook['assets'])
          assert all(len(item['differences']) == 5 for item in workbook['assets'])
          PY

          python - <<'PY' > expected-assets.txt
          import json
          from pathlib import Path
          manifest = json.loads(Path('live-workbook-manifest.json').read_text())
          for item in manifest['assets']:
              print(item['id'])
          PY
          while IFS= read -r asset_id; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null "$BASE_URL/assets/workbook/$asset_id/master.webp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null "$BASE_URL/assets/workbook/$asset_id/region-mask.png"
          done < expected-assets.txt

          printf 'release=0.15.3\ncommit=%s\nurl=%s\nverification=passed\n' \
            "$GITHUB_SHA" "$BASE_URL" > MSC-0.15.3-WEB-DEPLOYMENT-STATUS.txt

      - name: Upload live deployment evidence
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.3-live-web-deployment-status
          path: |
            MSC-0.15.3-WEB-DEPLOYMENT-STATUS.txt
            live-runtime.json
            live-release.json
            live-sw.js
            live-workbook.js
            live-workbook-manifest.json
          retention-days: 30
          if-no-files-found: error
