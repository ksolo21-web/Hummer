name: HAVENLINE Override Hashes

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/HASH_OVERRIDES

permissions:
  contents: write

jobs:
  record-hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Record exact repository SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          final_composites="$(sha256sum HAVENLINE/overrides/final_composites.py | awk '{print $1}')"
          patch_fetch_assets="$(sha256sum HAVENLINE/overrides/patch_fetch_assets.py | awk '{print $1}')"
          patch_preflight="$(sha256sum HAVENLINE/overrides/patch_preflight.py | awk '{print $1}')"
          patch_gdscript_47="$(sha256sum HAVENLINE/overrides/patch_gdscript_47.py | awk '{print $1}')"
          patch_runtime_47="$(sha256sum HAVENLINE/overrides/patch_runtime_47.py | awk '{print $1}')"
          patch_wolf_animation="$(sha256sum HAVENLINE/overrides/patch_wolf_animation.py | awk '{print $1}')"
          patch_android_export="$(sha256sum HAVENLINE/overrides/patch_android_export.py | awk '{print $1}')"
          patch_opening_composition="$(sha256sum HAVENLINE/overrides/patch_opening_composition.py | awk '{print $1}')"
          jq -n \
            --arg final_composites "$final_composites" \
            --arg patch_fetch_assets "$patch_fetch_assets" \
            --arg patch_preflight "$patch_preflight" \
            --arg patch_gdscript_47 "$patch_gdscript_47" \
            --arg patch_runtime_47 "$patch_runtime_47" \
            --arg patch_wolf_animation "$patch_wolf_animation" \
            --arg patch_android_export "$patch_android_export" \
            --arg patch_opening_composition "$patch_opening_composition" \
            --arg head_sha "$GITHUB_SHA" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{final_composites_sha256:$final_composites, patch_fetch_assets_sha256:$patch_fetch_assets, patch_preflight_sha256:$patch_preflight, patch_gdscript_47_sha256:$patch_gdscript_47, patch_runtime_47_sha256:$patch_runtime_47, patch_wolf_animation_sha256:$patch_wolf_animation, patch_android_export_sha256:$patch_android_export, patch_opening_composition_sha256:$patch_opening_composition, head_sha:$head_sha, recorded_at:$recorded_at}' \
            > HAVENLINE/override-hashes.json
          python3 - "$patch_opening_composition" <<'PY'
          import re
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          workflow = Path(".github/workflows/havenline-android.yml")
          source = workflow.read_text(encoding="utf-8")
          pattern = r'echo "[0-9a-f]{64}  HAVENLINE/overrides/patch_opening_composition\.py" \| sha256sum --check --strict'
          replacement = f'echo "{expected}  HAVENLINE/overrides/patch_opening_composition.py" | sha256sum --check --strict'
          updated, count = re.subn(pattern, replacement, source)
          if count != 1:
              raise SystemExit(f"Expected one opening-composition checksum line, found {count}")
          workflow.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/override-hashes.json .github/workflows/havenline-android.yml
          git commit -m "Record exact HAVENLINE override hashes"
          git push
