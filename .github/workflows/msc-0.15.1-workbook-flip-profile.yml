name: My Study Companion 0.15.1 Workbook Flip Profile Fixes

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:

concurrency:
  group: msc-0151-workbook-flip-profile-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct verified 0.14.2 source
        shell: bash
        run: bash .msc-build/reconstruct-current-source-0.14.1.sh

      - name: Apply checksum-locked 0.15.1 fixes
        shell: bash
        run: bash .msc-build/apply-0.15.1-workbook-flip-profile.sh

      - name: Verify required source repairs
        shell: bash
        run: |
          set -euo pipefail
          APP='MyStudyCompanion/app/src/main/java/com/mystudycompanion/app'
          node --check MyStudyCompanionWeb/workbook.js
          grep -Fq 'buildCrosswordPuzzle' "$APP/companion/InteractiveWorkbookModels.kt"
          grep -Fq 'buildWordSearchPuzzle' "$APP/companion/InteractiveWorkbookModels.kt"
          grep -Fq 'DifferencePuzzle' "$APP/companion/InteractiveWorkbookModels.kt"
          grep -Fq 'ProfileAgeSetupScreen' "$APP/ui/MyStudyCompanionApp.kt"
          grep -Fq 'GoogleProfileHints' "$APP/auth/AuthModels.kt"
          grep -Fq 'SCOPE_BIRTHDAY' "$APP/auth/GoogleSignInCoordinator.kt"
          grep -Fq 'contentWindowInsets = WindowInsets.safeDrawing' "$APP/ui/MyStudyCompanionApp.kt"
          grep -Fq 'maxWidth < 390.dp' "$APP/ui/HomeScreen.kt"
          ! grep -R -Fq 'Good morning, Kaleb' "$APP" MyStudyCompanionWeb
          grep -Fq 'renderCrossword' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderWordSearch' MyStudyCompanionWeb/workbook.js
          grep -Fq 'renderDifferences' MyStudyCompanionWeb/workbook.js

      - name: Run Android and Wear tests and debug builds
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :app:compileDebugKotlin \
            :wear:compileDebugKotlin \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Install verified Firebase Android configuration
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' | sha256sum -c -
          mapfile -t VALUES < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('MyStudyCompanion/app/google-services.json').read_text())
          clients = {
              item['client_info']['android_client_info']['package_name']: item
              for item in data['client']
          }
          canonical = clients['com.mystudycompanion.app']
          android_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 1]
          web_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 3]
          assert data['project_info']['project_id'] == 'my-study-companion-abc01'
          assert len(android_clients) == 1
          assert android_clients[0]['android_info']['certificate_hash'] == '1997d421d177215a44f9651ce53dbaec152fbc49'
          assert len(web_clients) == 1
          print(web_clients[0]['client_id'])
          PY
          )
          echo "web_client_id=${VALUES[0]}" >> "$GITHUB_OUTPUT"
          echo 'backend_base_url=https://my-study-companion-abc01.web.app/' >> "$GITHUB_OUTPUT"

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0151-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-0151-packaging-only' \
            -keypass 'msc-0151-packaging-only' \
            -alias 'msc-0151-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.1 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build canonical phone and Wear APKs
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0151-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0151-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0151-packaging-only
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ steps.firebase.outputs.web_client_id }}
          MSC_BACKEND_BASE_URL: ${{ steps.firebase.outputs.backend_base_url }}
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            -PMSC_GOOGLE_WEB_CLIENT_ID="$MSC_GOOGLE_WEB_CLIENT_ID" \
            -PMSC_BACKEND_BASE_URL="$MSC_BACKEND_BASE_URL" \
            :app:assemblePrivateAlpha :wear:assemblePrivateAlpha

      - name: Verify and package 0.15.1 APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          mkdir -p release-0.15.1/phone release-0.15.1/wear release-0.15.1/metadata

          PHONE_SOURCE="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          WEAR_SOURCE="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          test -f "$PHONE_SOURCE"
          test -f "$WEAR_SOURCE"

          PHONE_APK='release-0.15.1/phone/MyStudyCompanion-phone-0.15.1-ci.apk'
          WEAR_APK='release-0.15.1/wear/MyStudyCompanion-wear-0.15.1-ci.apk'
          cp "$PHONE_SOURCE" "$PHONE_APK"
          cp "$WEAR_SOURCE" "$WEAR_APK"

          "$AAPT" dump badging "$PHONE_APK" > release-0.15.1/metadata/PHONE-IDENTITY.txt
          "$AAPT" dump badging "$WEAR_APK" > release-0.15.1/metadata/WEAR-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='35'" release-0.15.1/metadata/PHONE-IDENTITY.txt
          grep -q "versionName='0.15.1-private-alpha-workbook-flip-profile-fix'" release-0.15.1/metadata/PHONE-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360151001'" release-0.15.1/metadata/WEAR-IDENTITY.txt
          grep -q "versionName='0.15.1-wear-private-alpha-workbook-flip-profile-fix'" release-0.15.1/metadata/WEAR-IDENTITY.txt

          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK" > release-0.15.1/metadata/PHONE-SIGNATURE.txt
          "$APKSIGNER" verify --verbose --print-certs "$WEAR_APK" > release-0.15.1/metadata/WEAR-SIGNATURE.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$PHONE_APK" > release-0.15.1/metadata/PHONE-ZIPALIGN.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$WEAR_APK" > release-0.15.1/metadata/WEAR-ZIPALIGN.txt
          sha256sum "$PHONE_APK" "$WEAR_APK" > release-0.15.1/metadata/SHA256SUMS.txt

          cat > release-0.15.1/metadata/STATUS.txt <<'TXT'
          PASS: connected crossword, word-search, and find-the-difference engines compiled and tested.
          PASS: account-specific greeting and age-level binding compiled and tested.
          PASS: safe-inset and narrow-width Z Flip layout repairs compiled.
          NOTE: CI APKs use a disposable packaging certificate. Re-sign with the Firebase-registered private-test certificate before Google Sign-In device testing.
          NOTE: final Z Flip 7 acceptance still requires installation on the actual family devices.
          TXT

      - name: Upload 0.15.1 verification bundle
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.1-workbook-flip-profile-ci
          path: release-0.15.1
          retention-days: 5
          if-no-files-found: error
