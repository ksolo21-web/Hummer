name: Fetch CC BY Hummer EV Mirror

on:
  push:
    paths:
      - '.tooling/hummer-ccby-mirror-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact mirrored CC BY asset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install requests beautifulsoup4
          mkdir -p mirror
          python - <<'PY'
          import json, pathlib, re, urllib.parse, requests, hashlib
          from bs4 import BeautifulSoup
          root=pathlib.Path('mirror')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 HummerDesignResearch/1.0'})
          index='https://downloadfree3d.com/file-format/obj/page/95/'
          r=s.get(index,timeout=180);r.raise_for_status();(root/'index.html').write_text(r.text)
          soup=BeautifulSoup(r.text,'html.parser')
          pages=[]
          for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urllib.parse.urljoin(index,a['href'])
              if 'hummer ev' in text.lower() or 'hummer-ev' in href.lower(): pages.append({'text':text,'url':href})
          # Search surrounding cards when anchor text is generic "Download 3D model"
          if not pages:
              for node in soup.find_all(string=re.compile('Hummer EV',re.I)):
                  parent=node.parent
                  for anc in parent.find_all_previous('a',href=True,limit=5)+parent.find_all_next('a',href=True,limit=5):
                      href=urllib.parse.urljoin(index,anc['href'])
                      if href not in [x['url'] for x in pages]: pages.append({'text':anc.get_text(' ',strip=True),'url':href})
          report={'index':index,'page_candidates':pages,'downloads':[],'errors':[]}
          for p in pages[:20]:
              try:
                  rr=s.get(p['url'],timeout=180);rr.raise_for_status()
                  pagefile=root/('page-'+str(len(list(root.glob('page-*.html'))))+'.html');pagefile.write_text(rr.text)
                  ss=BeautifulSoup(rr.text,'html.parser')
                  links=[]
                  for a in ss.find_all('a',href=True):
                      href=urllib.parse.urljoin(rr.url,a['href'])
                      text=' '.join(a.get_text(' ',strip=True).split())
                      low=(href+' '+text).lower()
                      if any(ext in low for ext in ('.zip','.rar','.7z','.obj','.fbx','.gltf','.glb','.blend')) or 'download' in low:
                          links.append({'text':text,'url':href})
                  p['resolved_url']=rr.url;p['links']=links
                  for link in links:
                      try:
                          dl=s.get(link['url'],stream=True,timeout=600,allow_redirects=True)
                          ctype=dl.headers.get('content-type','').lower();cd=dl.headers.get('content-disposition','')
                          final=dl.url;size=int(dl.headers.get('content-length') or 0)
                          is_binary=('attachment' in cd.lower() or any(x in ctype for x in ['zip','octet-stream','rar','7z','model']) or any(final.lower().split('?')[0].endswith(ext) for ext in ['.zip','.rar','.7z','.obj','.fbx','.glb','.gltf','.blend']))
                          if not is_binary: continue
                          name=None
                          m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)',cd,re.I)
                          if m:name=urllib.parse.unquote(m.group(1))
                          if not name:name=pathlib.Path(urllib.parse.urlparse(final).path).name or 'hummer-ev-asset.bin'
                          out=root/name
                          with out.open('wb') as f:
                              for chunk in dl.iter_content(1024*1024):
                                  if chunk:f.write(chunk)
                          if out.stat().st_size<10000:
                              out.unlink();continue
                          report['downloads'].append({'source_page':p['url'],'link':link,'final_url':final,'filename':out.name,'size_bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'content_type':ctype})
                          break
                      except Exception as exc: report['errors'].append({'download_link':link,'error':repr(exc)})
                  if report['downloads']: break
              except Exception as exc: report['errors'].append({'page':p,'error':repr(exc)})
          (root/'report.json').write_text(json.dumps(report,indent=2))
          (root/'ATTRIBUTION.txt').write_text('Hummer EV - Low Poly by Ajay Gawde (@aagawde), Sketchfab UID 12622086af0449eda09f9d2ce5596090. License: Creative Commons Attribution 4.0. Source model page: https://sketchfab.com/3d-models/hummer-ev-low-poly-12622086af0449eda09f9d2ce5596090\n')
          print(json.dumps(report,indent=2))
          if not report['downloads']: raise SystemExit('No verified binary download found on mirror')
          PY
          tar --format=posix -C mirror -cf hummer-ev-ccby-mirror.tar .
          ls -lh mirror hummer-ev-ccby-mirror.tar
      - name: Upload verified mirror package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hummer-ev-ccby-mirror
          path: hummer-ev-ccby-mirror.tar
          compression-level: 0
          retention-days: 7
      - name: Record result
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          cp mirror/report.json .tooling/hummer-ccby-mirror-report.json || echo '{"error":"report missing"}' > .tooling/hummer-ccby-mirror-report.json
          jq -n --arg artifact_id "$ARTIFACT_ID" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{status:"complete",artifact_id:(if ($artifact_id|length)>0 then ($artifact_id|tonumber) else null end),run_id:$run_id,run_url:$run_url}' > .tooling/hummer-ccby-mirror-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/hummer-ccby-mirror-status.json .tooling/hummer-ccby-mirror-report.json
          git commit -m 'Record Hummer EV CC BY mirror result' || exit 0
          git push
