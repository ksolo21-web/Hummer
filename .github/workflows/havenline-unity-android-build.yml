name: HAVENLINE Unity Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - 'HAVENLINE_UNITY/**'
      - '.github/workflows/havenline-unity-android-build.yml'

permissions:
  contents: read

concurrency:
  group: havenline-unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm Unity CI secrets exist
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Required repository secret is missing: $required" >&2
              exit 1
            fi
          done
          echo "Unity CI credentials are present. Values are not printed."

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          docker system prune --all --force || true
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: HAVENLINE_UNITY/Library
          key: havenline-unity-6000.3.18f1-android-${{ hashFiles('HAVENLINE_UNITY/Packages/manifest.json', 'HAVENLINE_UNITY/Packages/packages-lock.json', 'HAVENLINE_UNITY/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            havenline-unity-6000.3.18f1-android-

      - name: Build HAVENLINE Android review candidate in Unity
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: HAVENLINE_UNITY
          unityVersion: 6000.3.18f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Havenline.Editor.HavenlineBuildPipeline.BuildAndroidReviewCandidate
          allowDirtyBuild: true
          collectUnityLogs: true
          streamUnityLogs: true

      - name: Locate and verify APK and proof outputs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "$GITHUB_WORKSPACE" -type f -name 'HAVENLINE-Unity-reference-review-arm64.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "Unity completed without producing the required HAVENLINE APK." >&2
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | sort
            exit 1
          fi

          size="$(stat -c '%s' "$apk")"
          if [ "$size" -lt 5000000 ]; then
            echo "APK is implausibly small: $size bytes" >&2
            exit 1
          fi

          unzip -t "$apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'

          calculated_sha="$(sha256sum "$apk" | awk '{print $1}')"
          sha_file="${apk}.sha256"
          test -f "$sha_file"
          recorded_sha="$(awk '{print $1}' "$sha_file")"
          test "$calculated_sha" = "$recorded_sha"

          proof_dir="$(find "$GITHUB_WORKSPACE" -type d -path '*/Builds/Review' -print -quit)"
          test -n "$proof_dir"
          test -f "$proof_dir/HAVENLINE-reference-frozen-outpost.png"
          test -f "$proof_dir/HAVENLINE-reference-close-camera.png"
          test -f "$proof_dir/HAVENLINE-evidence.json"

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$calculated_sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "proof_dir=$proof_dir" >> "$GITHUB_OUTPUT"
          echo "Verified HAVENLINE APK: $apk"
          echo "Size: $size bytes"
          echo "SHA-256: $calculated_sha"

      - name: Write build summary
        shell: bash
        run: |
          {
            echo '## HAVENLINE Android build'
            echo ''
            echo '- Unity: `6000.3.18f1`'
            echo '- ABI target: `ARM64`'
            echo '- APK bytes: `${{ steps.verify.outputs.size }}`'
            echo '- APK SHA-256: `${{ steps.verify.outputs.sha256 }}`'
            echo '- Commit: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified HAVENLINE APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Unity-Android-ARM64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            **/HAVENLINE-Unity-reference-review-arm64.apk
            **/HAVENLINE-Unity-reference-review-arm64.apk.sha256
            **/Builds/Review/HAVENLINE-reference-frozen-outpost.png
            **/Builds/Review/HAVENLINE-reference-close-camera.png
            **/Builds/Review/HAVENLINE-evidence.json

      - name: Upload complete Unity diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Unity-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            Logs/UnityDiagnostics/**
            HAVENLINE_UNITY/Logs/**
            HAVENLINE_UNITY/build/**
            HAVENLINE_UNITY/Builds/**
            HAVENLINE_UNITY/Library/PackageCache/**/Logs/**
