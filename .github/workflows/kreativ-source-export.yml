name: KREATIV Source Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ agent/kreativ-studio-v0.1 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: kreativ-source-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/KREATIV-Studio-source
          cp -a app build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat firebase firebase.json snapshot/KREATIV-Studio-source/
          test -f VERSION && cp VERSION snapshot/KREATIV-Studio-source/
          test -f README.md && cp README.md snapshot/KREATIV-Studio-source/
          (
            cd snapshot
            zip -qr KREATIV-Studio-v0.1.3-source.zip KREATIV-Studio-source
            sha256sum KREATIV-Studio-v0.1.3-source.zip > SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: KREATIV-Studio-v0.1.3-exact-source
          path: |
            snapshot/KREATIV-Studio-v0.1.3-source.zip
            snapshot/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
