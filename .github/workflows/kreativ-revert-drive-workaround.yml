name: Revert KREATIV Drive Workaround

on:
  push:
    branches:
      - agent/kreativ-studio-v0.1
    paths:
      - '.github/workflows/kreativ-revert-drive-workaround.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-workaround:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/kreativ-studio-v0.1
          fetch-depth: 0

      - name: Restore original Firebase cloud architecture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 16a74236c84015f078d02fd181cb50c8862d9c0e
          git checkout 16a74236c84015f078d02fd181cb50c8862d9c0e -- \
            app/src/main/java/com/kreativstudio/app/KreativContainer.kt \
            app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt \
            app/src/main/java/com/kreativstudio/app/ui/Screens.kt

          rm -f app/src/main/java/com/kreativstudio/app/cloud/DocumentCloudBackupRepository.kt
          rm -f .github/workflows/kreativ-google-drive-cloud-repair.yml
          rm -f .github/workflows/kreativ-google-drive-cloud-repair-v2.yml
          rm -f .github/workflows/kreativ-019-signed-drive-release.yml
          rm -f .github/workflows/kreativ-019-configured-drive-apk.yml

          grep -Fq 'CloudSyncRepository' app/src/main/java/com/kreativstudio/app/KreativContainer.kt
          ! grep -Rq 'DocumentCloudBackupRepository' app/src/main/java/com/kreativstudio/app
          ! grep -Fq 'Connect Google Drive backup' app/src/main/java/com/kreativstudio/app/ui/Screens.kt

      - name: Commit rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Revert Drive workaround and restore Firebase cloud sync'
          git push origin HEAD:agent/kreativ-studio-v0.1
