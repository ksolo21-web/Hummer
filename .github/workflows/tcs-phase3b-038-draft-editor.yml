name: TCS Phase 3B Draft Editor

on:
  push:
    branches:
      - tcs-phase1d-020-work
    paths:
      - .github/workflows/tcs-phase3b-038-draft-editor.yml
      - .tooling/tcs/phase3b-overlay/**
      - .tooling/tcs/phase3b-run-device-tests.sh

permissions:
  contents: read

concurrency:
  group: tcs-phase3b-038-draft-editor
  cancel-in-progress: true

jobs:
  phase2j:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Phase 2C branch
        uses: actions/checkout@v4

      - name: Reconstruct exact frozen Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence tcs-src
          echo "6449840c97a88bddf6be8c48db0de851ff6840d564e1ac9a8d0aee8aa3114442  .tooling/tcs/phase1b2-source.tar.xz" | sha256sum -c -
          tar -xJf .tooling/tcs/phase1b2-source.tar.xz -C tcs-src
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          expected="85bf31b214098df041b43f1aad65f947c59876fbace92e256bb1e26d73946946"
          parts=[p.read_text() for p in sorted(Path(".tooling/tcs").glob("phase1b3-overlay.b64.part*"))]
          raw="".join(parts)
          def exact(candidate):
              try: patch=base64.b64decode(candidate,validate=True)
              except Exception: return None
              return patch if hashlib.sha256(patch).hexdigest()==expected else None
          patch=exact(raw)
          if patch is None:
              p6=parts[5]
              for i in range(len(p6)-1):
                  x=list(parts); x[5]=p6[:i]+p6[i+2:]
                  patch=exact("".join(x))
                  if patch is not None: break
              else: raise SystemExit("unable to recover locked Phase 1B-3 patch")
          Path("/tmp/phase1b3.patch").write_bytes(patch)
          PY
          echo "85bf31b214098df041b43f1aad65f947c59876fbace92e256bb1e26d73946946  /tmp/phase1b3.patch" | sha256sum -c -
          (cd tcs-src && patch -p1 --forward < /tmp/phase1b3.patch)
          python3 .tooling/tcs/phase1c-apply.py tcs-src > evidence/phase1c-apply.log
          grep -F "PHASE1C_APPLY=PASS" evidence/phase1c-apply.log

          mkdir -p tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core
          mkdir -p tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackPdf.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdf.kt
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackPdfTest.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdfTest.kt
          cp .tooling/tcs/phase1d-overlay/CanonicalFrontBackFixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackFixtureGenerator.kt
          python3 .tooling/tcs/phase1d-overlay/apply-existing.py tcs-src > evidence/phase1d-overlay.log
          grep -F "PHASE1D_EXISTING_TRANSFORM=PASS" evidence/phase1d-overlay.log

          cp .tooling/tcs/phase1db-overlay/LetterWritingAddressInventory.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingAddressInventory.kt
          cp .tooling/tcs/phase1db-overlay/LetterWritingAddressInventoryRegression.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingAddressInventoryRegression.kt
          cp .tooling/tcs/phase1db-overlay/LetterWritingPage2FixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/LetterWritingPage2FixtureGenerator.kt
          python3 .tooling/tcs/phase1db-overlay/apply-existing.py tcs-src > evidence/phase1db-overlay.log
          grep -F "PHASE1D_B_EXISTING_TRANSFORM=PASS" evidence/phase1db-overlay.log

          base64 -d .tooling/tcs/phase1dc-overlay/apply-frontback.py.b64 > /tmp/phase1dc-frontback.py
          python3 /tmp/phase1dc-frontback.py tcs-src > evidence/phase1dc-frontback.log
          grep -F "PHASE1D_C_FRONTBACK_TRANSFORM=PASS" evidence/phase1dc-frontback.log
          cp .tooling/tcs/phase1dc-overlay/TelephoneTerritoryInventory.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/TelephoneTerritoryInventory.kt
          cp .tooling/tcs/phase1dc-overlay/TelephoneTerritoryInventoryRegression.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/TelephoneTerritoryInventoryRegression.kt
          cp .tooling/tcs/phase1dc-overlay/TelephonePage2FixtureGenerator.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/TelephonePage2FixtureGenerator.kt

      - name: Reconstruct exact passed Phase 2A and 2B UI
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          mkdir -p "$APP" "$TEST"

          cp .tooling/tcs/phase2a-overlay/MainActivity.kt "$APP/MainActivity.kt"
          cp .tooling/tcs/phase2a-overlay/TerritoryCardStudioApplication.kt "$APP/TerritoryCardStudioApplication.kt"
          cp .tooling/tcs/phase2a-overlay/AppearancePreferenceStore.kt "$APP/AppearancePreferenceStore.kt"
          cp .tooling/tcs/phase2a-overlay/TerritoryCardStudioTheme.kt "$APP/TerritoryCardStudioTheme.kt"
          cat .tooling/tcs/phase2a-overlay/ProductionUi.kt.part00               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part01               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part02               .tooling/tcs/phase2a-overlay/ProductionUi.kt.part03 > "$APP/ProductionUi.kt"
          cp .tooling/tcs/phase2a-overlay/UiFoundationInstrumentationTest.kt "$TEST/UiFoundationInstrumentationTest.kt"

          cp .tooling/tcs/phase2b-overlay/WorkspaceModeUi.kt "$APP/WorkspaceModeUi.kt"
          python3 .tooling/tcs/phase2b-overlay/apply-existing.py tcs-src > evidence/phase2b-overlay.log
          grep -F "PHASE2B_UI_TRANSFORM=PASS" evidence/phase2b-overlay.log
          cp .tooling/tcs/phase2b-overlay/Phase2BWorkspaceInstrumentationTest.kt "$TEST/Phase2BWorkspaceInstrumentationTest.kt"

          echo "5f9f8ea9a4588a0bc1cc440ac98c4f5bfe2237b74f45cab5fc3a2076380666d6  $APP/ProductionUi.kt" | sha256sum -c -
          echo "7b08267684f1771ae7a4a1abce912a8e7d43b17582da5397a7b704e59522bcc0  $APP/WorkspaceModeUi.kt" | sha256sum -c -
          echo "b3ef8ffe302d653dadc2492192d673bcec72c4cc312bef6e8affaf63a805ed7e  $TEST/Phase2BWorkspaceInstrumentationTest.kt" | sha256sum -c -
          grep -F "PHASE_2B_MODE_AWARE_WORKSPACE=PASS" phase2b-evidence/status.txt
          grep -F "VERSION_NAME=0.2.1" phase2b-evidence/status.txt

      - name: Apply Phase 2C import and verification overlay
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio

          cp .tooling/tcs/phase2c-overlay/SourceMapIntakeStore.kt "$APP/SourceMapIntakeStore.kt"
          cp .tooling/tcs/phase2c-overlay/VerificationWorkflowUi.kt "$APP/VerificationWorkflowUi.kt"
          python3 .tooling/tcs/phase2c-overlay/apply-workspace.py tcs-src > evidence/phase2c-workspace.log
          grep -F "PHASE2C_WORKSPACE_TRANSFORM=PASS" evidence/phase2c-workspace.log
          cp .tooling/tcs/phase2c-overlay/Phase2CImportVerificationInstrumentationTest.kt "$TEST/Phase2CImportVerificationInstrumentationTest.kt"
          python3 .tooling/tcs/phase2c-overlay/apply-phase2b-test-compat.py tcs-src > evidence/phase2c-phase2b-test-compat.log
          grep -F "PHASE2C_PHASE2B_TEST_COMPAT=PASS" evidence/phase2c-phase2b-test-compat.log

          cp .tooling/tcs/phase2a-overlay/Phase2AppBuild.gradle.kts tcs-src/app/build.gradle.kts
          sed -i 's/versionCode = 25/versionCode = 27/' tcs-src/app/build.gradle.kts
          sed -i 's/versionName = "0.2.0"/versionName = "0.2.2"/' tcs-src/app/build.gradle.kts
          cp .tooling/tcs/phase1b2-core-build.gradle.kts tcs-src/core/build.gradle.kts
          cp .tooling/tcs/phase1b2-CoreGradleTestBridge.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/CoreGradleTestBridge.kt

          grep -F 'versionCode = 27' tcs-src/app/build.gradle.kts
          grep -F 'versionName = "0.2.2"' tcs-src/app/build.gradle.kts
          grep -F 'assignmentAuthority = false' "$APP/SourceMapIntakeStore.kt"
          grep -F 'Source map file signature does not match' "$APP/SourceMapIntakeStore.kt"
          grep -F 'Build remains locked' "$APP/VerificationWorkflowUi.kt"
          grep -F 'Exact field release' "$APP/VerificationWorkflowUi.kt"
          grep -F 'ImportMapWorkflowScreen' "$APP/WorkspaceModeUi.kt"
          grep -F 'VerificationWorkflowScreen' "$APP/WorkspaceModeUi.kt"

          if grep -E 'CandidatePdfRenderer|ProductionRenderModelAdapter|BuildingValidationEngine|TopologyOverlapDecisionEngine|RoadLabelPlacementEngine' "$APP/VerificationWorkflowUi.kt" "$APP/SourceMapIntakeStore.kt"; then
            echo "Phase 2C UI/intake attempted to reimplement frozen territory rules" >&2
            exit 8
          fi

          echo "cf3dd6d4f9be48c9afda23ec4d428715e48f26b276454bfae235e0bb9a9bc9bc  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CandidatePdfRenderer.kt" | sha256sum -c -
          echo "67050950ae6bfcc9673a02b675a202bb7fdab1f5948958026fcfa95fc1068d0d  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/ProductionRenderModelAdapter.kt" | sha256sum -c -
          echo "9d926f5ea84621e3d12900c3f7833d01f69875410106d21eac5ecc868299c708  tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/CanonicalFrontBackPdf.kt" | sha256sum -c -

          sha256sum "$APP/ProductionUi.kt" "$APP/WorkspaceModeUi.kt" "$APP/SourceMapIntakeStore.kt"             "$APP/VerificationWorkflowUi.kt" "$TEST/Phase2CImportVerificationInstrumentationTest.kt"             tcs-src/app/build.gradle.kts > evidence/phase2c-source-sha256.txt

          find tcs-src -type f -iname "*.pdf" -printf "%f\n" > evidence/pdf-files-before-2c.txt
          if grep -E "(250T|257A|(^|[^0-9])297([^0-9]|$)|298A|(^|[^0-9])299([^0-9]|$)|347TA)" evidence/pdf-files-before-2c.txt > evidence/reserved-territory-pdf-sweep.txt; then
            echo "Reserved territory PDF detected" >&2
            exit 6
          fi
          : > evidence/reserved-territory-pdf-sweep.txt

      - name: Apply Phase 2D-A Page 2 service integration
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          sha256sum "$APP/AndroidPdfArtifactService.kt" > evidence/phase2da-base-service.sha256
          cp .tooling/tcs/phase2da-overlay/AndroidPdfArtifactService.kt "$APP/AndroidPdfArtifactService.kt"
          cp .tooling/tcs/phase2da-overlay/Phase2DPage2InstrumentationTest.kt "$TEST/Phase2DPage2InstrumentationTest.kt"
          sed -i 's/versionCode = 27/versionCode = 28/; s/versionName = "0.2.2"/versionName = "0.2.3"/' tcs-src/app/build.gradle.kts
          sha256sum "$APP/AndroidPdfArtifactService.kt" "$TEST/Phase2DPage2InstrumentationTest.kt" > evidence/phase2da-source-sha256.txt
          grep -F 'PHASE_2C_IMPORT_VERIFICATION=PASS' phase2c-evidence/status.txt

      - name: Apply Phase 2D-B Build UI and coordinator
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in AndroidBuildWorkflowCoordinator BuildWorkflowUi SourceMapIntakeStore TerritoryCardStudioServices WorkspaceModeUi; do cp ".tooling/tcs/phase2db-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2DBFixture Phase2DBCoordinatorInstrumentationTest Phase2DBNavigationInstrumentationTest Phase2DBCaptureInstrumentationTest; do cp ".tooling/tcs/phase2db-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 28/versionCode = 29/; s/versionName = "0.2.3"/versionName = "0.2.4"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2da-overlay/AndroidPdfArtifactService.kt "$APP/AndroidPdfArtifactService.kt"
          sha256sum .tooling/tcs/phase2db-overlay/*.kt > evidence/phase2db-source-sha256.txt
          grep -F 'PHASE_2DA_PAGE2_SERVICE=PASS' phase2da-evidence/status.txt

      - name: Apply Phase 2E exact candidate PDF preview
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in AndroidBuildWorkflowCoordinator BuildWorkflowUi TerritoryCardStudioServices WorkspaceModeUi AndroidPdfPreviewService PdfPreviewUi; do cp ".tooling/tcs/phase2e-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2EPreviewInstrumentationTest Phase2EPreviewUiInstrumentationTest; do cp ".tooling/tcs/phase2e-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 29/versionCode = 30/; s/versionName = "0.2.4"/versionName = "0.2.5"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2da-overlay/AndroidPdfArtifactService.kt "$APP/AndroidPdfArtifactService.kt"
          cmp .tooling/tcs/phase2db-overlay/SourceMapIntakeStore.kt "$APP/SourceMapIntakeStore.kt"
          sha256sum .tooling/tcs/phase2e-overlay/*.kt > evidence/phase2e-source-sha256.txt
          grep -F 'PHASE_2DB_BUILD_WORKFLOW=PASS' phase2db-evidence/status.txt

      - name: Apply Phase 2F candidate review and explicit local approval
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          CORE=tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core
          cmp .tooling/tcs/phase1dd-overlay/CrossModePacketValidation.kt .tooling/tcs/phase2f-overlay/CrossModePacketValidation.kt
          cp .tooling/tcs/phase1dd-overlay/CrossModePacketValidation.kt "$CORE/CrossModePacketValidation.kt"
          for file in AndroidBuildWorkflowCoordinator BuildWorkflowUi TerritoryCardStudioServices WorkspaceModeUi PdfPreviewUi AndroidCandidateReviewService CandidateReviewUi; do cp ".tooling/tcs/phase2f-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2FReviewInstrumentationTest Phase2FReviewUiInstrumentationTest; do cp ".tooling/tcs/phase2f-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 30/versionCode = 31/; s/versionName = "0.2.5"/versionName = "0.2.6"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2da-overlay/AndroidPdfArtifactService.kt "$APP/AndroidPdfArtifactService.kt"
          cmp .tooling/tcs/phase2e-overlay/AndroidPdfPreviewService.kt "$APP/AndroidPdfPreviewService.kt"
          sha256sum .tooling/tcs/phase2f-overlay/*.kt > evidence/phase2f-source-sha256.txt
          grep -F 'PHASE_2E_EXACT_PDF_PREVIEW=PASS' phase2e-evidence/status.txt

      - name: Apply Phase 2G guarded exact approved export
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in AndroidApprovedExportService ApprovedExportUi TerritoryCardStudioServices WorkspaceModeUi; do cp ".tooling/tcs/phase2g-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2GExportFixture Phase2GExportInstrumentationTest Phase2GExportUiInstrumentationTest Phase2FReviewUiInstrumentationTest; do cp ".tooling/tcs/phase2g-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 31/versionCode = 32/; s/versionName = "0.2.6"/versionName = "0.2.7"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2da-overlay/AndroidPdfArtifactService.kt "$APP/AndroidPdfArtifactService.kt"
          cmp .tooling/tcs/phase2e-overlay/AndroidPdfPreviewService.kt "$APP/AndroidPdfPreviewService.kt"
          cmp .tooling/tcs/phase2f-overlay/AndroidCandidateReviewService.kt "$APP/AndroidCandidateReviewService.kt"
          cmp .tooling/tcs/phase2f-overlay/AndroidBuildWorkflowCoordinator.kt "$APP/AndroidBuildWorkflowCoordinator.kt"
          sha256sum .tooling/tcs/phase2g-overlay/*.kt > evidence/phase2g-source-sha256.txt
          grep -F 'PHASE_2F_CANDIDATE_REVIEW=PASS' phase2f-evidence/status.txt

      - name: Apply Phase 2H read-only Knowledge Base
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in ProductionUi KnowledgeBaseUi; do cp ".tooling/tcs/phase2h-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2HKnowledgeInstrumentationTest Phase2HKnowledgeUiInstrumentationTest; do cp ".tooling/tcs/phase2h-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 32/versionCode = 33/; s/versionName = "0.2.7"/versionName = "0.2.8"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2g-overlay/ApprovedExportUi.kt "$APP/ApprovedExportUi.kt"
          cmp .tooling/tcs/phase2g-overlay/WorkspaceModeUi.kt "$APP/WorkspaceModeUi.kt"
          sha256sum .tooling/tcs/phase2h-overlay/*.kt > evidence/phase2h-source-sha256.txt
          grep -F 'PHASE_2G_APPROVED_EXPORT=PASS' .tooling/tcs/phase2g-evidence/status.txt

      - name: Apply Phase 2I dashboard filtering and complete browsing
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in ProductionUi WorkspaceModeUi; do cp ".tooling/tcs/phase2i-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2IDashboardInstrumentationTest Phase2IDashboardUiInstrumentationTest Phase2EPreviewUiInstrumentationTest Phase2FReviewUiInstrumentationTest; do cp ".tooling/tcs/phase2i-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 33/versionCode = 34/; s/versionName = "0.2.8"/versionName = "0.2.9"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2h-overlay/KnowledgeBaseUi.kt "$APP/KnowledgeBaseUi.kt"
          cmp .tooling/tcs/phase2g-overlay/ApprovedExportUi.kt "$APP/ApprovedExportUi.kt"
          cmp .tooling/tcs/phase2g-overlay/AndroidApprovedExportService.kt "$APP/AndroidApprovedExportService.kt"
          sha256sum .tooling/tcs/phase2i-overlay/*.kt > evidence/phase2i-source-sha256.txt
          grep -F 'PHASE_2H_KNOWLEDGE_BASE=PASS' .tooling/tcs/phase2h-evidence/status.txt

      - name: Apply Phase 2J current Workspace binding
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in AndroidBuildWorkflowCoordinator AndroidPdfPreviewService TerritoryCardStudioServices PdfPreviewUi WorkspaceModeUi WorkspaceCurrentUi WorkspacePreparedSnapshot VerificationWorkflowUi; do cp ".tooling/tcs/phase2j-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2JWorkspaceInstrumentationTest Phase2JWorkspaceUiInstrumentationTest Phase2FReviewUiInstrumentationTest; do cp ".tooling/tcs/phase2j-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 34/versionCode = 35/; s/versionName = "0.2.9"/versionName = "0.2.10"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2i-overlay/ProductionUi.kt "$APP/ProductionUi.kt"
          cmp .tooling/tcs/phase2g-overlay/AndroidApprovedExportService.kt "$APP/AndroidApprovedExportService.kt"
          sha256sum .tooling/tcs/phase2j-overlay/*.kt > evidence/phase2j-source-sha256.txt
          grep -F 'PHASE_2I_DASHBOARD_BROWSING=PASS' .tooling/tcs/phase2i-evidence/status.txt

      - name: Apply Phase 2K findings and scoped audit UI
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          for file in WorkspaceModeUi VerificationWorkflowUi PdfPreviewUi BuildWorkflowUi AndroidBuildWorkflowCoordinator Phase2KFindings Phase2KAudit; do cp ".tooling/tcs/phase2k-overlay/$file.kt" "$APP/$file.kt"; done
          for file in Phase2KInstrumentationTest Phase2KUiInstrumentationTest Phase2FReviewUiInstrumentationTest; do cp ".tooling/tcs/phase2k-overlay/$file.kt" "$TEST/$file.kt"; done
          sed -i 's/versionCode = 35/versionCode = 36/; s/versionName = "0.2.10"/versionName = "0.2.11"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase2j-overlay/WorkspaceCurrentUi.kt "$APP/WorkspaceCurrentUi.kt"
          cmp .tooling/tcs/phase2j-overlay/WorkspacePreparedSnapshot.kt "$APP/WorkspacePreparedSnapshot.kt"
          sha256sum .tooling/tcs/phase2k-overlay/*.kt > evidence/phase2k-source-sha256.txt
          grep -F 'PHASE_2J_WORKSPACE_BINDING=PASS' .tooling/tcs/phase2j-evidence/status.txt

      - name: Apply Phase 3A editing draft foundation
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          cp .tooling/tcs/phase3a-overlay/AndroidEditingDraftStore.kt "$APP/"
          cp .tooling/tcs/phase3a-overlay/TerritoryCardStudioServices.kt "$APP/"
          cp .tooling/tcs/phase3a-overlay/Phase3ADraftInstrumentationTest.kt "$TEST/"
          sed -i 's/versionCode = 36/versionCode = 37/; s/versionName = "0.2.11"/versionName = "0.3.0"/' tcs-src/app/build.gradle.kts
          cp .tooling/tcs/phase3a-evidence/frozen-phase2-verification.json evidence/

      - name: Apply Phase 3B draft editor
        shell: bash
        run: |
          set -euo pipefail
          APP=tcs-src/app/src/main/java/com/koenterprises/territorycardstudio
          TEST=tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio
          cp .tooling/tcs/phase3b-overlay/DraftEditorUi.kt "$APP/"
          cp .tooling/tcs/phase3b-overlay/WorkspaceModeUi.kt "$APP/"
          cp .tooling/tcs/phase3b-overlay/Phase3BEditorUiInstrumentationTest.kt "$TEST/"
          sed -i 's/versionCode = 37/versionCode = 38/; s/versionName = "0.3.0"/versionName = "0.3.1"/' tcs-src/app/build.gradle.kts
          cmp .tooling/tcs/phase3a-overlay/AndroidEditingDraftStore.kt "$APP/AndroidEditingDraftStore.kt"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android 37 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          python3 -m pip install --quiet pillow
          (cd tcs-src && ./tools/check_android_toolchain.sh) > evidence/toolchain-preflight.log 2>&1

      - name: Compile and package Phase 3B without rerunning frozen tests
        shell: bash
        run: |
          set -euo pipefail
          (cd tcs-src && gradle --no-daemon :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin) > evidence/app-compile.log 2>&1
          cat evidence/app-compile.log
          grep -F "BUILD SUCCESSFUL" evidence/app-compile.log

          (cd tcs-src && gradle --no-daemon :app:assembleDebug :app:bundleDebug) > evidence/package-build.log 2>&1
          grep -F "BUILD SUCCESSFUL" evidence/package-build.log

          APK="tcs-src/app/build/outputs/apk/debug/app-debug.apk"
          AAB="tcs-src/app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$APK" && test -s "$AAB"
          sha256sum "$APK" > evidence/apk.sha256
          sha256sum "$AAB" > evidence/aab.sha256
          unzip -t "$APK" > evidence/apk-zip-test.txt
          unzip -t "$AAB" > evidence/aab-zip-test.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" > evidence/apk-signature.txt 2>&1
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" evidence/apk-signature.txt
          jarsigner -verify -verbose -certs "$AAB" > evidence/aab-jar-verify.txt 2>&1
          grep -E "jar verified|jar verified\." evidence/aab-jar-verify.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > evidence/apk-badging.txt
          grep -E "^package:.*versionCode='38'.*versionName='0.3.1'" evidence/apk-badging.txt
          grep -F "targetSdkVersion:'37'" evidence/apk-badging.txt

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run only ten new Phase 3B UI tests and wide captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash .tooling/tcs/phase3b-run-device-tests.sh

      - name: Freeze Phase 3B source and package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum evidence/app-compile.log evidence/package-build.log evidence/phase3b-runtime.log > evidence/build-logs.sha256
          (cd tcs-src && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/extracted-source-files.sha256
          sha256sum evidence/extracted-source-files.sha256 > evidence/extracted-source-manifest.sha256
          tar -cJf evidence/TerritoryCardStudio-Android-0.3.1-phase3b-source.tar.xz -C tcs-src .
          sha256sum evidence/TerritoryCardStudio-Android-0.3.1-phase3b-source.tar.xz > evidence/source-package.sha256
          printf 'PHASE3B=PACKAGED_PENDING_REVIEW\nPHASE3=IN_PROGRESS\nFROZEN_PRIOR_TESTS=77\nRESERVED_TERRITORIES=UNTOUCHED\n' > evidence/status.txt

      - name: Upload Phase 3B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-phase3b-038-draft-editor-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 14
