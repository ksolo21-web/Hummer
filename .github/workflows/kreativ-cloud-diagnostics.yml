name: KREATIV Cloud Authorization Diagnostic

on:
  push:
    branches:
      - agent/kreativ-studio-v0.1
    paths:
      - '.github/workflows/kreativ-cloud-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  credential-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: my-study-companion-private
    env:
      VAR_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      VAR_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      VAR_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      SECRET_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SECRET_FIREBASE_PROJECT_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_STUDY_COMPANION_ABC01 }}
      SECRET_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      SECRET_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      SECRET_GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      SECRET_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SECRET_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      SECRET_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SECRET_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      SECRET_FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
      SECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_KREATIV_OLIVIA_FIREBASE_UID: ${{ secrets.KREATIV_OLIVIA_FIREBASE_UID }}
      SECRET_KREATIV_PRIVATE_ALPHA_KEYSTORE_B64: ${{ secrets.KREATIV_PRIVATE_ALPHA_KEYSTORE_B64 }}
      SECRET_KREATIV_PRIVATE_ALPHA_STORE_PASSWORD: ${{ secrets.KREATIV_PRIVATE_ALPHA_STORE_PASSWORD }}
      SECRET_KREATIV_PRIVATE_ALPHA_KEY_ALIAS: ${{ secrets.KREATIV_PRIVATE_ALPHA_KEY_ALIAS }}
      SECRET_KREATIV_PRIVATE_ALPHA_KEY_PASSWORD: ${{ secrets.KREATIV_PRIVATE_ALPHA_KEY_PASSWORD }}
      SECRET_KREATIV_KEYSTORE_B64: ${{ secrets.KREATIV_KEYSTORE_B64 }}
      SECRET_ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      SECRET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SECRET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SECRET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Report credential availability without revealing values
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            VAR_GCP_PROJECT_ID \
            VAR_GCP_WORKLOAD_IDENTITY_PROVIDER \
            VAR_GCP_DEPLOY_SERVICE_ACCOUNT \
            SECRET_FIREBASE_SERVICE_ACCOUNT \
            SECRET_FIREBASE_PROJECT_SERVICE_ACCOUNT \
            SECRET_GOOGLE_APPLICATION_CREDENTIALS_JSON \
            SECRET_GCP_SA_KEY \
            SECRET_GCLOUD_SERVICE_KEY \
            SECRET_GOOGLE_CREDENTIALS \
            SECRET_SERVICE_ACCOUNT_JSON \
            SECRET_GOOGLE_SERVICE_ACCOUNT_JSON \
            SECRET_FIREBASE_TOKEN \
            SECRET_FIREBASE_CLI_TOKEN \
            SECRET_CLOUDFLARE_API_TOKEN \
            SECRET_KREATIV_OLIVIA_FIREBASE_UID \
            SECRET_KREATIV_PRIVATE_ALPHA_KEYSTORE_B64 \
            SECRET_KREATIV_PRIVATE_ALPHA_STORE_PASSWORD \
            SECRET_KREATIV_PRIVATE_ALPHA_KEY_ALIAS \
            SECRET_KREATIV_PRIVATE_ALPHA_KEY_PASSWORD \
            SECRET_KREATIV_KEYSTORE_B64 \
            SECRET_ANDROID_KEYSTORE_B64 \
            SECRET_ANDROID_KEYSTORE_PASSWORD \
            SECRET_ANDROID_KEY_ALIAS \
            SECRET_ANDROID_KEY_PASSWORD
          do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
            fi
          done
