name: HAVENLINE Source V3 Verification

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/VERIFY_SOURCE_V3

permissions:
  contents: write

concurrency:
  group: havenline-source-v3-verification
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out isolated HAVENLINE branch
        uses: actions/checkout@v4

      - name: Diagnose, reconstruct, and verify production source
        shell: bash
        run: |
          set -u
          expected_archive="1f3d736f4fbee7d7b6b8763db7e7b325fb3f456cf835fab7a33bb8657d8f83f7"
          expected_bytes="35460"
          status="verified"
          failure_stage=""
          actual_archive=""
          actual_bytes="0"
          archive_files="0"
          : >/tmp/havenline-part-mismatches.tsv

          part_count="$(find HAVENLINE/source.v3.parts -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')"
          if [[ "$part_count" != "24" ]]; then
            status="failed"
            failure_stage="part_count"
          fi

          while read -r expected file; do
            if [[ ! -f "$file" ]]; then
              printf '%s\t%s\t%s\n' "$file" "$expected" "missing" >>/tmp/havenline-part-mismatches.tsv
              status="failed"
              failure_stage="part_hashes"
              continue
            fi
            actual="$(git hash-object "$file")"
            if [[ "$actual" != "$expected" ]]; then
              printf '%s\t%s\t%s\n' "$file" "$expected" "$actual" >>/tmp/havenline-part-mismatches.tsv
              status="failed"
              failure_stage="part_hashes"
            fi
          done < HAVENLINE/source-v3-git-hashes.txt

          if [[ "$status" == "verified" ]]; then
            if ! cat HAVENLINE/source.v3.parts/part-*.b64 | base64 --decode > /tmp/Havenline-production-source-v0.2.0.tar.xz; then
              status="failed"
              failure_stage="base64_decode"
            fi
          fi

          if [[ -f /tmp/Havenline-production-source-v0.2.0.tar.xz ]]; then
            actual_archive="$(sha256sum /tmp/Havenline-production-source-v0.2.0.tar.xz | awk '{print $1}')"
            actual_bytes="$(stat -c '%s' /tmp/Havenline-production-source-v0.2.0.tar.xz)"
          fi

          if [[ "$status" == "verified" && "$actual_archive" != "$expected_archive" ]]; then
            status="failed"
            failure_stage="archive_hash"
          fi
          if [[ "$status" == "verified" && "$actual_bytes" != "$expected_bytes" ]]; then
            status="failed"
            failure_stage="archive_size"
          fi

          if [[ "$status" == "verified" ]]; then
            if ! tar -tJf /tmp/Havenline-production-source-v0.2.0.tar.xz >/tmp/havenline-file-list.txt; then
              status="failed"
              failure_stage="archive_list"
            else
              archive_files="$(wc -l </tmp/havenline-file-list.txt | tr -d ' ')"
            fi
          fi

          if [[ "$status" == "verified" ]]; then
            rm -rf /tmp/havenline-verified
            mkdir -p /tmp/havenline-verified
            if ! tar -xJf /tmp/Havenline-production-source-v0.2.0.tar.xz -C /tmp/havenline-verified; then
              status="failed"
              failure_stage="archive_extract"
            elif ! (cd /tmp/havenline-verified/Havenline && python3 tools/preflight.py); then
              status="failed"
              failure_stage="source_preflight"
            fi
          fi

          mismatches="$(jq -R -s '
            split("\n")
            | map(select(length > 0) | split("\t") | {file:.[0], expected_git_blob:.[1], actual_git_blob:.[2]})
          ' /tmp/havenline-part-mismatches.tsv)"

          jq -n \
            --arg status "$status" \
            --arg failure_stage "$failure_stage" \
            --arg source_version "0.2.0" \
            --arg expected_sha256 "$expected_archive" \
            --arg actual_sha256 "$actual_archive" \
            --arg expected_bytes "$expected_bytes" \
            --arg actual_bytes "$actual_bytes" \
            --arg part_count "$part_count" \
            --arg archive_files "$archive_files" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --argjson mismatches "$mismatches" \
            '{status:$status, failure_stage:$failure_stage, source_version:$source_version, expected_sha256:$expected_sha256, actual_sha256:$actual_sha256, expected_bytes:($expected_bytes|tonumber), actual_bytes:($actual_bytes|tonumber), part_count:($part_count|tonumber), archive_file_count:($archive_files|tonumber), part_mismatches:$mismatches, verified_at:$verified_at, workflow_run_id:($workflow_run|tonumber)}' \
            > HAVENLINE/source-v3-verification.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/source-v3-verification.json
          git commit -m "Record HAVENLINE source v3 verification"
          git push

          [[ "$status" == "verified" ]]
