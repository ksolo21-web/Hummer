name: My Study Companion 0.15.15 Source Audit Export

on:
  push:
    branches:
      - agent/msc-0.15.15-ai-activity-rebuild
    paths:
      - .github/workflows/msc-0.15.15-export-reconstructed-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare toolchains and temporary signer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          mkdir -p "$RUNNER_TEMP/msc-audit-signing"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/msc-audit-signing/packaging.jks" \
            -storepass 'msc-audit-packaging-only' \
            -keypass 'msc-audit-packaging-only' \
            -alias 'msc-audit-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=MSC Source Audit Packaging, O=My Study Companion, C=US'
      - name: Reconstruct verified cumulative source
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ runner.temp }}/msc-audit-signing/packaging.jks
          MSC_RELEASE_STORE_PASSWORD: msc-audit-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-audit-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-audit-packaging-only
        run: |
          set -euo pipefail
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/run-0.15.14-vote-persistence-fix.sh
          find MyStudyCompanion -type f -name '*.rej' -delete
          tar -cJf msc-0.15.14-reconstructed-source.tar.xz MyStudyCompanion
      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.14-reconstructed-source
          path: msc-0.15.14-reconstructed-source.tar.xz
          retention-days: 2
          if-no-files-found: error
