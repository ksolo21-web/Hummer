name: HAVENLINE SF3D Recovery Characters RTX Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-sf3d-recovery-characters-rtx-runner
  cancel-in-progress: false

jobs:
  generate-character:
    name: ${{ matrix.character }} SF3D RTX production proof
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        character:
          - Character1
          - Character3
          - Character4
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      STABILITY_AI_LICENSE_ACCEPTED: ${{ vars.STABILITY_AI_LICENSE_ACCEPTED }}
      STABILITY_AI_COMMERCIAL_REGISTRATION_CONFIRMED: ${{ vars.STABILITY_AI_COMMERCIAL_REGISTRATION_CONFIRMED }}

    steps:
      - name: Check out current HAVENLINE production branch
        uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 1

      - name: Verify exact branch checkout and recovery contract
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if (-not $actual) { throw 'HAVENLINE checkout has no commit SHA.' }
          $runtime = Get-Content '.tooling\havenline-character-production\runtime-versions.json' -Raw | ConvertFrom-Json
          if ($runtime.schemaVersion -ne 3) { throw 'Unexpected HAVENLINE character runtime schema.' }
          if ($runtime.reconstruction.Character1.generator -ne 'Stability-AI/stable-fast-3d') {
            throw 'Character 1 is not routed through the SF3D recovery contract.'
          }
          if ($runtime.reconstruction.Character2.artifactId -ne 8973791027) {
            throw 'Character 2 is not locked to the accepted Unity-review artifact.'
          }
          if ($runtime.reconstruction.Character1.rejectedPrimary.productionArtifactId -ne 8974534288) {
            throw 'Character 1 rejection policy does not identify the rejected artifact.'
          }
          Write-Host "Checked out HAVENLINE commit: $actual"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .tooling/havenline-character-production/runtime-versions.json

      - name: Materialize checksum-pinned approved references
        shell: pwsh
        run: python .tooling/havenline-character-reference-payload/materialize_references.py

      - name: Run fail-closed RTX reconstruction and Blender proof pipeline
        id: pipeline
        continue-on-error: true
        shell: pwsh
        run: |
          & .tooling\havenline-character-production\run_sf3d_character_pipeline.ps1 `
            -Character '${{ matrix.character }}'

      - name: Upload complete character review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-SF3D-RTX-review-${{ github.run_id }}
          path: character_output/${{ matrix.character }}/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Enforce machine completion without visual approval
        if: always()
        shell: pwsh
        run: |
          $statusPath = 'character_output\${{ matrix.character }}\sf3d-pipeline-status.json'
          if (-not (Test-Path $statusPath)) {
            throw 'SF3D pipeline status is missing.'
          }
          $status = Get-Content $statusPath -Raw | ConvertFrom-Json
          if ('${{ steps.pipeline.outcome }}' -ne 'success' -or -not $status.machinePassed) {
            throw '${{ matrix.character }} failed the SF3D/Blender machine pipeline. Evidence was preserved.'
          }
          if ($status.acceptedForUnityReview -or $status.approved -or $status.unityIntegrated -or -not $status.humanVisualApprovalRequired) {
            throw 'Machine generation attempted to bypass Blender or Unity human visual review.'
          }
