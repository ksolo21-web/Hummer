name: My Study Companion 0.15.6 Free Invite Fix

on:
  push:
    branches:
      - agent/msc-0.15.6-root-fix-ci

permissions:
  contents: read

concurrency:
  group: msc-0156-free-invite-fix
  cancel-in-progress: true

jobs:
  free-invite-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Android and test toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Reconstruct exact free 0.15.6 source
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh
          bash .msc-build/apply-0.15.5-household-cancellation.sh
          bash .msc-build/apply-0.15.6-household-invitation-root-fix.sh
      - name: Verify Google sign-in was preserved
        shell: bash
        run: |
          set -euo pipefail
          AUTH=MyStudyCompanionWeb/firebase-sync.js
          grep -Fq 'browserLocalPersistence' "$AUTH"
          grep -Fq 'getRedirectResult' "$AUTH"
          grep -Fq 'GoogleAuthProvider' "$AUTH"
          grep -Fq 'signInWithPopup' "$AUTH"
          grep -Fq 'auth/popup-blocked' "$AUTH"
          grep -Fq 'signInWithRedirect' "$AUTH"
          grep -Fq 'onAuthStateChanged' "$AUTH"
          grep -R -Fq 'AccountProvider.GOOGLE' MyStudyCompanion/app/src/main/java
          grep -R -Eq 'GoogleSignIn|GoogleAuthProvider|CredentialManager|GoogleIdTokenCredential|GetGoogleIdOption' MyStudyCompanion/app/src/main/java
          grep -R -Eq 'signInWithCredential|FirebaseAuth' MyStudyCompanion/app/src/main/java
          echo 'PASS: Google sign-in lifecycle remains present on web and Android.'
      - name: Test existing backend features
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanion/backend
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m compileall -q app tests
          python -m pytest -q
      - name: Test PWA and Firebase Spark rules
        shell: bash
        run: |
          set -euo pipefail
          java -version
          while IFS= read -r file; do node --check "$file"; done < <(find MyStudyCompanionWeb -maxdepth 1 -type f -name '*.js' -print | sort)
          mapfile -t TESTS < <(find MyStudyCompanionWeb -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          node --test "${TESTS[@]}"
          DEPS="$RUNNER_TEMP/msc-rules-deps"
          npm install --prefix "$DEPS" --no-save firebase @firebase/rules-unit-testing
          (cd MyStudyCompanionWeb && NODE_PATH="$DEPS/node_modules" npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project demo-my-study-companion "NODE_PATH=$DEPS/node_modules node firestore-rules.test.cjs")
      - name: Compile and test Android and Wear
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleDebug :wear:assembleDebug
      - name: Upload free invitation validation APKs
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.6-free-invite-fix
          path: |
            MyStudyCompanion/app/build/outputs/apk/debug/*.apk
            MyStudyCompanion/wear/build/outputs/apk/debug/*.apk
            MyStudyCompanion/firestore.rules
            MyStudyCompanionWeb/firestore.rules
            MyStudyCompanionWeb/firebase-sync.js
          retention-days: 7
          if-no-files-found: error
