name: Territory Maintenance 1.3.1 OCR Recovery
on:
  push:
    branches: [tcs-maintenance-131-ocr-recovery-20260930]
    paths:
      - .github/workflows/tcs-maintenance-131.yml
      - .tooling/tcs/maintenance-131/**
permissions:
  contents: read
concurrency:
  group: territory-maintenance-131
  cancel-in-progress: true
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Prepare exact Phase C source
        run: bash .tooling/tcs/phaseC-130/prepare-source.sh
      - name: Apply OCR recovery hotfix
        run: python3 .tooling/tcs/maintenance-131/apply.py tcs-src | tee evidence/maintenance-131.json
      - name: Prepare private signer
        run: |
          set -euo pipefail
          pass='territory-maintenance-131'; alias='territory-private'; keyfile="$RUNNER_TEMP/territory-maintenance-131.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keyfile" -storepass "$pass" -keypass "$pass" -alias "$alias" -dname "CN=Territory Private 1.3.1, O=KO Enterprises, C=US" -keyalg RSA -keysize 3072 -validity 3650
          echo "TCS_RELEASE_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "TCS_RELEASE_STORE_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "TCS_RELEASE_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "TCS_RELEASE_KEY_PASSWORD=$pass" >> "$GITHUB_ENV"
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Core regression, lint and build
        run: |
          set -euo pipefail
          (cd tcs-src && gradle --no-daemon --build-cache :core:test :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease)
          mkdir -p evidence
          cp tcs-src/app/build/outputs/apk/debug/app-debug.apk evidence/Territory-1.3.1-debug.apk
          cp tcs-src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk evidence/Territory-1.3.1-androidTest.apk
          cp tcs-src/app/build/outputs/apk/release/app-release.apk evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk
          cp tcs-src/app/build/outputs/bundle/release/app-release.aab evidence/Territory-Android-1.3.1-OCR-Recovery-private.aab
          cp evidence/Territory-1.3.1-debug.apk evidence/Territory-PhaseC-1.3.0-debug.apk
          cp evidence/Territory-1.3.1-androidTest.apk evidence/Territory-PhaseC-1.3.0-androidTest.apk
          cp evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk evidence/Territory-Android-1.3.0-PhaseC-private.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"; APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk > evidence/badging.txt
          grep -q "versionCode='50'" evidence/badging.txt
          grep -q "versionName='1.3.1'" evidence/badging.txt
          "$APKSIGNER" verify --verbose --print-certs evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk > evidence/apk-signature.txt
          unzip -t evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk > evidence/apk-ziptest.txt
          unzip -t evidence/Territory-Android-1.3.1-OCR-Recovery-private.aab > evidence/aab-ziptest.txt
          sha256sum evidence/Territory-Android-1.3.1-OCR-Recovery-private.* > evidence/builds.sha256
      - name: Boot emulator
        run: bash .tooling/tcs/phaseC-130/boot-emulator.sh
      - name: Run OCR recovery regression
        run: |
          set -euo pipefail
          PKG=com.koenterprises.territorycardstudio
          adb uninstall "$PKG" >/dev/null 2>&1 || true
          adb install -r evidence/Territory-1.3.1-debug.apk
          adb install -r evidence/Territory-1.3.1-androidTest.apk
          adb logcat -b crash -c
          adb shell am instrument -w -r -e class "$PKG.MapOcrRecoveryInstrumentationTest" "$PKG.test/androidx.test.runner.AndroidJUnitRunner" | tee evidence/ocr-recovery.log
          grep -q 'OK (3 tests)' evidence/ocr-recovery.log
          adb shell am instrument -w -r -e class "$PKG.Phase6ImageInterpretationInstrumentationTest" "$PKG.test/androidx.test.runner.AndroidJUnitRunner" | tee evidence/image-regression.log
          grep -q 'OK (1 test)' evidence/image-regression.log
      - name: Run preserved Phase C device regressions
        run: bash .tooling/tcs/phaseC-130/run-device-tests.sh
      - name: Run preserved private-release smoke
        run: bash .tooling/tcs/phaseC-130/run-release-smoke.sh
      - name: Verify crash-free and write status
        run: |
          set -euo pipefail
          adb logcat -b crash -d > evidence/final-crash.log
          ! grep -q 'com.koenterprises.territorycardstudio' evidence/final-crash.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          e=Path('evidence'); apk=e/'Territory-Android-1.3.1-OCR-Recovery-private.apk'; aab=e/'Territory-Android-1.3.1-OCR-Recovery-private.aab'
          status={'schema':'territory-maintenance-131-final-v1','version':'1.3.1','versionCode':50,'ocrRecoveryTests':'PASS_3_OF_3','existingImageRegression':'PASS_1_OF_1','phaseCDeviceRegression':'PASS','phaseCReleaseSmoke':'PASS','rawSdkErrorHidden':True,'geometryFallbackAfterOcrFailure':True,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aabSha256':hashlib.sha256(aab.read_bytes()).hexdigest(),'blockers':[]}
          (e/'maintenance-131-final.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - name: Stop emulator
        if: always()
        run: |
          adb shell wm size reset >/dev/null 2>&1 || true
          adb shell wm density reset >/dev/null 2>&1 || true
          adb emu kill >/dev/null 2>&1 || true
          [[ -f evidence/emulator.pid ]] && kill "$(cat evidence/emulator.pid)" >/dev/null 2>&1 || true
      - name: Preserve fixed source
        if: always()
        run: |
          if [[ -d tcs-src ]]; then tar -cJf evidence/Territory-Android-1.3.1-OCR-Recovery-source.tar.xz --exclude=build --exclude=.gradle -C tcs-src .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Territory-1.3.1-OCR-Recovery-evidence
          path: |
            evidence
            !evidence/*.apk
            !evidence/*.aab
            !evidence/*.tar.xz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Territory-Android-1.3.1-OCR-Recovery-private-apk
          path: evidence/Territory-Android-1.3.1-OCR-Recovery-private.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Territory-Android-1.3.1-OCR-Recovery-private-aab
          path: evidence/Territory-Android-1.3.1-OCR-Recovery-private.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Territory-Android-1.3.1-OCR-Recovery-source
          path: evidence/Territory-Android-1.3.1-OCR-Recovery-source.tar.xz
          retention-days: 30
