name: My Study Companion Canva Artwork Fetch

on:
  pull_request:
    branches:
      - agent/my-study-companion-0140-ci-base
  workflow_dispatch:

concurrency:
  group: msc-canva-artwork-fetch-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Validate the final local Moonlit Wolf asset
        shell: bash
        run: |
          set -euo pipefail
          python .msc-build/install-premium-theme-art-0.14.2.py verify-source .msc-build/premium-theme-art-0.14.2
          mkdir -p canva-artwork
          cp .msc-build/premium-theme-art-0.14.2/theme_scene_moonlit_wolf.webp canva-artwork/
          file canva-artwork/theme_scene_moonlit_wolf.webp | tee canva-artwork/FILE-TYPE.txt
          sha256sum canva-artwork/theme_scene_moonlit_wolf.webp > canva-artwork/SHA256SUMS.txt

      - name: Upload generated artwork
        uses: actions/upload-artifact@v6
        with:
          name: msc-final-moonlit-wolf-artwork
          path: canva-artwork
          retention-days: 2
          if-no-files-found: error
