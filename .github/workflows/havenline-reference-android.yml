name: HAVENLINE Reference Android Build

on:
  workflow_dispatch:
    inputs:
      confirm_reference_build:
        description: Type REFERENCE to run all gameplay and Android gates
        required: true
        type: string
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/RUN_REFERENCE_BUILD

permissions:
  contents: write

concurrency:
  group: havenline-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-android:
    if: github.event_name == 'push' || github.event.inputs.confirm_reference_build == 'REFERENCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable
      GODOT_BIN: ${{ github.workspace }}/havenline/.tools/godot
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out isolated HAVENLINE branch
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and prove stable HAVENLINE reference final
        shell: bash
        run: |
          set -euo pipefail
          chmod +x HAVENLINE/ci/build_reference_final.sh
          HAVENLINE/ci/build_reference_final.sh

      - name: Upload final APK and validation evidence
        id: upload_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-reference-android-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            havenline/build/HAVENLINE-v0.3.0-reference-final-ARM64.apk
            havenline/build/HAVENLINE-v0.3.0-reference-final-ARM64.apk.sha256
            havenline/build/validation-frame.png
            havenline/build/ASSET_BUILD_REPORT.json
            havenline/build/source-preflight.log
            havenline/build/asset-fetch.log
            havenline/build/asset-preflight.log
            havenline/build/android-sdk.log
            havenline/build/import.log
            havenline/build/post-import-preflight.log
            havenline/build/runtime-smoke.log
            havenline/build/export.log
            havenline/build-godot-version.txt

      - name: Record reference-build locator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          apk_sha=""
          if test -s havenline/build/HAVENLINE-v0.3.0-reference-final-ARM64.apk.sha256; then
            apk_sha="$(cut -d' ' -f1 havenline/build/HAVENLINE-v0.3.0-reference-final-ARM64.apk.sha256)"
          fi
          jq -n \
            --arg status "${{ job.status }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg artifact_id "${{ steps.upload_artifact.outputs.artifact-id }}" \
            --arg artifact_name "HAVENLINE-reference-android-${{ github.run_number }}" \
            --arg apk_sha256 "$apk_sha" \
            '{status:$status,run_id:$run_id,run_number:$run_number,head_sha:$head_sha,artifact_id:$artifact_id,artifact_name:$artifact_name,apk_sha256:$apk_sha256}' \
            > HAVENLINE/latest-reference-android-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/latest-reference-android-build.json
          git commit -m "Record HAVENLINE reference Android build ${{ github.run_number }}" || exit 0
          git push origin HEAD:agent/havenline-android-build
