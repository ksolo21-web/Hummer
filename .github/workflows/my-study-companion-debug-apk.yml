name: Build My Study Companion 0.9.3 Unified App Independently

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out build branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify or install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK root is unavailable." >&2
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"

          if [[ -f "$SDK_ROOT/platforms/android-36/android.jar" && -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "Android API 36 and Build Tools 36.0.0 are already installed."
          else
            SDKMANAGER=""
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done

            if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -perm -u+x 2>/dev/null | sort -V | tail -n 1 || true)"
            fi

            if [[ -z "$SDKMANAGER" ]]; then
              echo "sdkmanager could not be located under $SDK_ROOT." >&2
              find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f -print || true
              exit 1
            fi

            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Reconstruct and verify 0.9.3 scene-theme source
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.2.tar.xz
          echo "f2c0bfb74455046a28d7aa54a4e27df021955ea703ae93a639bbe3bcb67ed2c4  MyStudyCompanion_0.9.2.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.2.tar.xz
          cat .msc-build/scene-0.9.3.part*.b64 | base64 --decode > MyStudyCompanion_0.9.3_scene_overlay.tar.xz
          echo "48b6aa28b630bdbf0ade5fcfadd77af7b4a259807df0b73c4318f17fede4eec4  MyStudyCompanion_0.9.3_scene_overlay.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.3_scene_overlay.tar.xz
          test -f MyStudyCompanion/settings.gradle.kts
          test -f MyStudyCompanion/app/build.gradle.kts
          test -f MyStudyCompanion/wear/build.gradle.kts
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design/ThemeArtwork.kt
          test -f MyStudyCompanion/app/src/main/res/drawable-nodpi/theme_scene_lion.webp
          grep -q 'versionName = "0.9.3-private-alpha-scene-themes"' MyStudyCompanion/app/build.gradle.kts

      - name: Apply Android source compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .msc-build/patch_source.py
          ! grep -R 'jvmTarget = "17"' MyStudyCompanion --include='*.gradle.kts'
          ! grep -R 'androidx.compose.ui.geometry.Path' MyStudyCompanion --include='*.kt'
          ! grep -R 'import androidx.compose.foundation.layout.weight' MyStudyCompanion --include='*.kt'
          ! grep -R 'import androidx.glance.material3.GlanceTheme' MyStudyCompanion --include='*.kt'
          ! grep -R '::Color' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/SettingsScreen.kt

      - name: Install stable private-alpha debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .msc-build/private-alpha-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee private-alpha-key-report.txt
          grep -q 'SHA256: 28:0F:9C:9A:D4:BE:BA:33:72:1A:BD:09:A5:B8:04:60:7A:AE:7C:9D:07:91:8D:67:44:6A:F7:AD:55:6D:EC:44' private-alpha-key-report.txt
          {
            echo "MSC_RELEASE_STORE_FILE=$HOME/.android/debug.keystore"
            echo "MSC_RELEASE_STORE_PASSWORD=android"
            echo "MSC_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "MSC_RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build canonical phone and Wear OS APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            :app:assemblePrivateAlpha \
            :wear:assemblePrivateAlpha

      - name: Collect, verify, and identify APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          test -f "$PHONE_APK"
          test -f "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-unified-0.9.3.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-unified-0.9.3.apk
          unzip -tq dist/MyStudyCompanion-phone-unified-0.9.3.apk
          unzip -tq dist/MyStudyCompanion-wear-unified-0.9.3.apk
          "$AAPT" dump badging dist/MyStudyCompanion-phone-unified-0.9.3.apk | tee dist/PHONE-IDENTITY.txt
          "$AAPT" dump badging dist/MyStudyCompanion-wear-unified-0.9.3.apk | tee dist/WEAR-IDENTITY.txt
          PHONE_PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" dist/PHONE-IDENTITY.txt | head -n 1)"
          WEAR_PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" dist/WEAR-IDENTITY.txt | head -n 1)"
          test "$PHONE_PACKAGE" = "com.mystudycompanion.app"
          test "$WEAR_PACKAGE" = "com.mystudycompanion.app"
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-phone-unified-0.9.3.apk | tee dist/PHONE-SIGNING.txt
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-wear-unified-0.9.3.apk | tee dist/WEAR-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/PHONE-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/WEAR-SIGNING.txt
          printf 'Verified canonical phone package: %s\n' "$PHONE_PACKAGE"
          printf 'Verified canonical Wear package: %s\n' "$WEAR_PACKAGE"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-unified-0.9.3-independent-apks
          if-no-files-found: error
          retention-days: 14
          path: dist/
