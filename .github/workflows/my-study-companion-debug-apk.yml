name: Build My Study Companion Debug APK

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out build branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify or install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK root is unavailable." >&2
            exit 1
          fi
          echo "Android SDK root: $SDK_ROOT"

          if [[ -f "$SDK_ROOT/platforms/android-36/android.jar" && -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            echo "Android API 36 and Build Tools 36.0.0 are already installed."
          else
            SDKMANAGER=""
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done

            if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -perm -u+x 2>/dev/null | sort -V | tail -n 1 || true)"
            fi

            if [[ -z "$SDKMANAGER" ]]; then
              echo "sdkmanager could not be located under $SDK_ROOT." >&2
              find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f -print || true
              exit 1
            fi

            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Reconstruct and verify app source
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.0.tar.xz
          echo "5186002f8c687b561975e4a17c9697334b0587081fac40dcef837ad72cbeec10  MyStudyCompanion_0.9.0.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.0.tar.xz
          test -f MyStudyCompanion/settings.gradle.kts
          test -f MyStudyCompanion/app/build.gradle.kts
          test -f MyStudyCompanion/wear/build.gradle.kts

      - name: Apply Kotlin 2 compiler DSL migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("MyStudyCompanion/app/build.gradle.kts"),
              Path("MyStudyCompanion/wear/build.gradle.kts"),
              Path("MyStudyCompanion/benchmark/build.gradle.kts"),
          ]
          pattern = re.compile(r"\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*\"17\"\s*\}", re.S)
          block = """

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """
          for path in files:
              text = path.read_text(encoding="utf-8")
              updated, count = pattern.subn("", text)
              if count != 1:
                  raise SystemExit(f"Expected one legacy kotlinOptions block in {path}, found {count}")
              path.write_text(updated.rstrip() + block, encoding="utf-8")
              print(f"Migrated {path}")
          PY

      - name: Apply current Android source compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .msc-build/apply-source-fixes.py

      - name: Build phone and Wear OS debug APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$PHONE_APK"
          test -n "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-debug.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: dist/
