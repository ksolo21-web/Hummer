name: My Study Companion 0.15.4 Canonical Android Wear Web Package

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:

concurrency:
  group: msc-0154-canonical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.15.4
  WEB_CACHE_VERSION: msc-web-v0154-professional-workbook-household-v1

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct all accepted repairs
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh

      - name: Run phone Wear and PWA tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find MyStudyCompanionWeb -maxdepth 1 -type f -name '*.test.mjs' -print | sort)
          node --test "${TESTS[@]}"
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :app:compileDebugKotlin \
            :wear:compileDebugKotlin \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Install verified Firebase configuration
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' | sha256sum -c -
          WEB_CLIENT_ID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('MyStudyCompanion/app/google-services.json').read_text())
          clients={item['client_info']['android_client_info']['package_name']:item for item in data['client']}
          canonical=clients['com.mystudycompanion.app']
          android=[item for item in canonical['oauth_client'] if item['client_type']==1]
          web=[item for item in canonical['oauth_client'] if item['client_type']==3]
          assert android[0]['android_info']['certificate_hash']=='1997d421d177215a44f9651ce53dbaec152fbc49'
          print(web[0]['client_id'])
          PY
          )"
          echo "web_client_id=$WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo 'backend_base_url=https://my-study-companion-abc01.web.app/' >> "$GITHUB_OUTPUT"

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0154-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt -keystore "$SIGNING_DIR/packaging.jks" -storepass 'msc-0154-packaging-only' -keypass 'msc-0154-packaging-only' -alias 'msc-0154-packaging' -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=My Study Companion 0.15.4 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build canonical private-alpha phone and Wear APKs
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0154-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0154-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0154-packaging-only
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ steps.firebase.outputs.web_client_id }}
          MSC_BACKEND_BASE_URL: ${{ steps.firebase.outputs.backend_base_url }}
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            -PMSC_GOOGLE_WEB_CLIENT_ID="$MSC_GOOGLE_WEB_CLIENT_ID" \
            -PMSC_BACKEND_BASE_URL="$MSC_BACKEND_BASE_URL" \
            :app:assemblePrivateAlpha :wear:assemblePrivateAlpha

      - name: Package synchronized PWA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-0.15.4/web
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('MyStudyCompanionWeb/release-manifest.json').write_text(json.dumps({'release':'0.15.4','commit':os.environ['GITHUB_SHA'],'serviceWorkerCache':'msc-web-v0154-professional-workbook-household-v1','workbookManifest':'assets/workbook/manifest.json','releaseTrain':['android','wear','web']},indent=2,sort_keys=True)+'\n')
          PY
          (cd MyStudyCompanionWeb && zip -q -r ../release-0.15.4/web/MyStudyCompanionWeb-0.15.4-PWA.zip . -x '*.DS_Store' '__pycache__/*' '*.pyc' '*.orig' '*.rej' '*.test.mjs')

      - name: Verify identities signatures alignment and unified package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          mkdir -p release-0.15.4/phone release-0.15.4/wear release-0.15.4/metadata release-0.15.4/generated-assets
          PHONE_SOURCE="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          WEAR_SOURCE="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          PHONE_APK='release-0.15.4/phone/MyStudyCompanion-phone-0.15.4-ci.apk'
          WEAR_APK='release-0.15.4/wear/MyStudyCompanion-wear-0.15.4-ci.apk'
          cp "$PHONE_SOURCE" "$PHONE_APK"
          cp "$WEAR_SOURCE" "$WEAR_APK"
          cp -a MyStudyCompanion/app/src/main/assets/workbook/. release-0.15.4/generated-assets/
          cp MyStudyCompanionWeb/release-manifest.json release-0.15.4/metadata/WEB-RELEASE-MANIFEST.json
          cp MyStudyCompanionWeb/firestore.rules release-0.15.4/metadata/FIRESTORE-RULES.txt

          "$AAPT" dump badging "$PHONE_APK" > release-0.15.4/metadata/PHONE-IDENTITY.txt
          "$AAPT" dump badging "$WEAR_APK" > release-0.15.4/metadata/WEAR-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='37'" release-0.15.4/metadata/PHONE-IDENTITY.txt
          grep -q "versionName='0.15.4-private-alpha-web-household-parity'" release-0.15.4/metadata/PHONE-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360154001'" release-0.15.4/metadata/WEAR-IDENTITY.txt
          grep -q "versionName='0.15.4-wear-private-alpha-web-household-parity'" release-0.15.4/metadata/WEAR-IDENTITY.txt
          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK" > release-0.15.4/metadata/PHONE-CI-SIGNATURE.txt
          "$APKSIGNER" verify --verbose --print-certs "$WEAR_APK" > release-0.15.4/metadata/WEAR-CI-SIGNATURE.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$PHONE_APK" > release-0.15.4/metadata/PHONE-ZIPALIGN.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$WEAR_APK" > release-0.15.4/metadata/WEAR-ZIPALIGN.txt
          diff -ru MyStudyCompanion/app/src/main/assets/workbook MyStudyCompanionWeb/assets/workbook
          sha256sum "$PHONE_APK" "$WEAR_APK" release-0.15.4/web/MyStudyCompanionWeb-0.15.4-PWA.zip > release-0.15.4/metadata/CI-SHA256SUMS.txt

      - name: Upload canonical synchronized 0.15.4 package
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.4-canonical-android-wear-web-package
          path: release-0.15.4
          retention-days: 14
          if-no-files-found: error
