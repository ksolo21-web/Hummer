name: My Study Companion 0.15.3 Canonical Package

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:

concurrency:
  group: msc-0153-canonical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct all accepted repairs
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          ! grep -R -Eq 'ProfileAgeSetupScreen\(|Google did not provide enough age information' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app
          grep -Fq 'WorkbookIllustrationCatalog.assetFor' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/InteractiveWorkbookEditor.kt

      - name: Install verified Firebase configuration
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' | sha256sum -c -
          WEB_CLIENT_ID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('MyStudyCompanion/app/google-services.json').read_text())
          clients = {
              item['client_info']['android_client_info']['package_name']: item
              for item in data['client']
          }
          canonical = clients['com.mystudycompanion.app']
          android_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 1]
          web_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 3]
          assert data['project_info']['project_id'] == 'my-study-companion-abc01'
          assert len(android_clients) == 1
          assert android_clients[0]['android_info']['certificate_hash'] == '1997d421d177215a44f9651ce53dbaec152fbc49'
          assert len(web_clients) == 1
          print(web_clients[0]['client_id'])
          PY
          )"
          echo "web_client_id=$WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo 'backend_base_url=https://my-study-companion-abc01.web.app/' >> "$GITHUB_OUTPUT"

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0153-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-0153-packaging-only' \
            -keypass 'msc-0153-packaging-only' \
            -alias 'msc-0153-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.3 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build canonical private-alpha phone and Wear APKs
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0153-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0153-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0153-packaging-only
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ steps.firebase.outputs.web_client_id }}
          MSC_BACKEND_BASE_URL: ${{ steps.firebase.outputs.backend_base_url }}
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            -PMSC_GOOGLE_WEB_CLIENT_ID="$MSC_GOOGLE_WEB_CLIENT_ID" \
            -PMSC_BACKEND_BASE_URL="$MSC_BACKEND_BASE_URL" \
            :app:assemblePrivateAlpha :wear:assemblePrivateAlpha

      - name: Verify identities, signatures, alignment, and package bundle
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          mkdir -p release-0.15.3/phone release-0.15.3/wear release-0.15.3/metadata release-0.15.3/generated-assets
          PHONE_SOURCE="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          WEAR_SOURCE="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          PHONE_APK='release-0.15.3/phone/MyStudyCompanion-phone-0.15.3-ci.apk'
          WEAR_APK='release-0.15.3/wear/MyStudyCompanion-wear-0.15.3-ci.apk'
          cp "$PHONE_SOURCE" "$PHONE_APK"
          cp "$WEAR_SOURCE" "$WEAR_APK"
          cp -a MyStudyCompanion/app/src/main/assets/workbook/. release-0.15.3/generated-assets/

          "$AAPT" dump badging "$PHONE_APK" > release-0.15.3/metadata/PHONE-IDENTITY.txt
          "$AAPT" dump badging "$WEAR_APK" > release-0.15.3/metadata/WEAR-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='36'" release-0.15.3/metadata/PHONE-IDENTITY.txt
          grep -q "versionName='0.15.3-private-alpha-professional-workbook-assets'" release-0.15.3/metadata/PHONE-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360153001'" release-0.15.3/metadata/WEAR-IDENTITY.txt
          grep -q "versionName='0.15.3-wear-private-alpha-professional-workbook-assets'" release-0.15.3/metadata/WEAR-IDENTITY.txt
          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK" > release-0.15.3/metadata/PHONE-CI-SIGNATURE.txt
          "$APKSIGNER" verify --verbose --print-certs "$WEAR_APK" > release-0.15.3/metadata/WEAR-CI-SIGNATURE.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$PHONE_APK" > release-0.15.3/metadata/PHONE-ZIPALIGN.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$WEAR_APK" > release-0.15.3/metadata/WEAR-ZIPALIGN.txt
          sha256sum "$PHONE_APK" "$WEAR_APK" > release-0.15.3/metadata/CI-SHA256SUMS.txt

      - name: Upload canonical 0.15.3 package
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.3-canonical-package
          path: release-0.15.3
          retention-days: 5
          if-no-files-found: error
