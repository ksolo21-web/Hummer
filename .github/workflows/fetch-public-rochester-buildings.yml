name: Fetch public Rochester building verification
on:
  push:
    branches: [public-map-source-20260914]
    paths: [.github/workflows/fetch-public-rochester-buildings.yml]
permissions:
  contents: read
jobs:
  public-building-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve independent building evidence
        shell: bash
        run: |
          mkdir -p public-buildings
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,datetime,hashlib,traceback,concurrent.futures
          out=pathlib.Path('public-buildings');receipts=[];errors=[]
          bbox='-83.147,42.6833,-83.1433,42.6918'
          def raw(url,name,params=None):
              if params:url+='?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'PublicGISMapReview/1.0'})
              with urllib.request.urlopen(req,timeout=65) as r:data=r.read()
              (out/name).write_bytes(data);receipts.append({'file':name,'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              return data
          def obj(url,name,params):
              v=json.loads(raw(url,name,params))
              if 'error' in v:raise RuntimeError(str(v['error']))
              return v
          def save(n,d):(out/n).write_text(json.dumps(d))
          def gis(label,url):
              meta=obj(url,label+'-metadata.json',{'f':'json'})
              base={'f':'json','where':'1=1','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              ids=obj(url+'/query',label+'-ids.json',dict(base,returnIdsOnly='true'));expected=sorted(ids.get('objectIds') or []);oid=ids['objectIdFieldName']
              count=obj(url+'/query',label+'-count.json',dict(base,returnCountOnly='true'));assert count['count']==len(expected)
              fs=[]
              for i in range(0,len(expected),150):
                  p=obj(url+'/query',label+'-page-'+str(i)+'.json',{'f':'json','objectIds':','.join(map(str,expected[i:i+150])),'outFields':'*','returnGeometry':'true','outSR':4326})
                  assert not p.get('exceededTransferLimit',False);fs+=p.get('features',[])
              assert sorted(f['attributes'][oid] for f in fs)==expected
              save(label+'.json',{'source':url,'bbox':bbox,'expected_count':len(expected),'complete':True,'features':fs});print(label,len(fs))
          def aerial(label,bb):
              raw('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export',label+'.png',{'f':'image','bbox':bb,'bboxSR':4326,'imageSR':3857,'size':'1400,1600','format':'png32','transparent':'false'})
          def run(k,fn):
              try:fn()
              except Exception as e:errors.append({'label':k,'error':str(e),'traceback':traceback.format_exc()})
          tasks={
            'footprints':lambda:gis('footprints','https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints/FeatureServer/14'),
            'building-points':lambda:gis('building-points','https://gis.semcog.org/server/rest/services/Hosted/Building_Points/FeatureServer/34'),
            'great-oaks-aerial':lambda:aerial('great-oaks-aerial','-83.1456,42.6834,-83.1436,42.6871'),
            'ironwood-aerial':lambda:aerial('ironwood-aerial','-83.1467,42.6897,-83.1445,42.6918')
          }
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:list(ex.map(lambda it:run(*it),tasks.items()))
          save('RECEIPTS.json',receipts);save('ERRORS.json',errors);print('errors',errors)
          PY
      - name: Retain public verification data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rochester-buildings-20260914
          path: public-buildings/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
