name: My Study Companion 0.14.2 Phone and Wear APKs

on:
  pull_request:
    branches:
      - agent/my-study-companion-0140-ci-base
  workflow_dispatch:

concurrency:
  group: msc-0142-release-apks-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact 0.14.2 repair source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct 0.14.2 from the verified 0.14.1 baseline
        shell: bash
        run: bash .msc-build/reconstruct-current-source-0.14.1.sh

      - name: Verify workbook, themes, and authentication repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-approved-theme-output.py
          grep -Fq 'drawWorkbookArt' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/InteractiveWorkbookEditor.kt
          grep -Fq 'drawPdfWorkbookArt' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/InteractiveWorkbookEditor.kt
          grep -Fq 'renderColorByNumber' MyStudyCompanionWeb/workbook.js
          grep -Fq 'drawArtCanvas' MyStudyCompanionWeb/workbook.js
          grep -Fq 'browserLocalPersistence' MyStudyCompanionWeb/firebase-sync.js
          grep -Fq 'getRedirectResult' MyStudyCompanionWeb/firebase-sync.js

      - name: Install verified Firebase Android configuration
        id: firebase
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' | sha256sum -c -
          mapfile -t VALUES < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('MyStudyCompanion/app/google-services.json').read_text())
          clients = {
              item['client_info']['android_client_info']['package_name']: item
              for item in data['client']
          }
          canonical = clients['com.mystudycompanion.app']
          android_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 1]
          web_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 3]
          assert data['project_info']['project_id'] == 'my-study-companion-abc01'
          assert len(android_clients) == 1
          assert android_clients[0]['android_info']['certificate_hash'] == '1997d421d177215a44f9651ce53dbaec152fbc49'
          assert len(web_clients) == 1
          print(web_clients[0]['client_id'])
          PY
          )
          echo "web_client_id=${VALUES[0]}" >> "$GITHUB_OUTPUT"
          echo 'backend_base_url=https://my-study-companion-abc01.web.app/' >> "$GITHUB_OUTPUT"

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0142-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-0142-packaging-only' \
            -keypass 'msc-0142-packaging-only' \
            -alias 'msc-0142-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.14.2 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build phone and Wear APKs
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0142-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0142-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0142-packaging-only
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ steps.firebase.outputs.web_client_id }}
          MSC_BACKEND_BASE_URL: ${{ steps.firebase.outputs.backend_base_url }}
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            -PMSC_GOOGLE_WEB_CLIENT_ID="$MSC_GOOGLE_WEB_CLIENT_ID" \
            -PMSC_BACKEND_BASE_URL="$MSC_BACKEND_BASE_URL" \
            :app:assemblePrivateAlpha :wear:assemblePrivateAlpha
          grep -R -Fq "$MSC_BACKEND_BASE_URL" app/build/generated
          grep -R -Fq "$MSC_GOOGLE_WEB_CLIENT_ID" app/build/generated

      - name: Verify and package 0.14.2 APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          mkdir -p release-0.14.2/phone release-0.14.2/wear release-0.14.2/metadata

          PHONE_SOURCE="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          WEAR_SOURCE="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f -print -quit)"
          test -f "$PHONE_SOURCE"
          test -f "$WEAR_SOURCE"

          PHONE_APK='release-0.14.2/phone/MyStudyCompanion-phone-0.14.2.apk'
          WEAR_APK='release-0.14.2/wear/MyStudyCompanion-wear-0.14.2.apk'
          cp "$PHONE_SOURCE" "$PHONE_APK"
          cp "$WEAR_SOURCE" "$WEAR_APK"

          "$AAPT" dump badging "$PHONE_APK" > release-0.14.2/metadata/PHONE-IDENTITY.txt
          "$AAPT" dump badging "$WEAR_APK" > release-0.14.2/metadata/WEAR-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='34'" release-0.14.2/metadata/PHONE-IDENTITY.txt
          grep -q "versionName='0.14.2-private-alpha-workbook-theme-repair'" release-0.14.2/metadata/PHONE-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360142001'" release-0.14.2/metadata/WEAR-IDENTITY.txt
          grep -q "versionName='0.14.2-wear-private-alpha-workbook-theme-repair'" release-0.14.2/metadata/WEAR-IDENTITY.txt

          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK" > release-0.14.2/metadata/PHONE-SIGNATURE.txt
          "$APKSIGNER" verify --verbose --print-certs "$WEAR_APK" > release-0.14.2/metadata/WEAR-SIGNATURE.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$PHONE_APK" > release-0.14.2/metadata/PHONE-ZIPALIGN.txt
          "$ZIPALIGN" -c -P 16 -v 4 "$WEAR_APK" > release-0.14.2/metadata/WEAR-ZIPALIGN.txt
          sha256sum "$PHONE_APK" "$WEAR_APK" > release-0.14.2/metadata/SHA256SUMS.txt

          cat > release-0.14.2/metadata/STATUS.txt <<'TXT'
          PASS: My Study Companion 0.14.2 phone and Wear APKs compiled and packaged.
          PASS: real workbook drawing and color-by-number engines are present.
          PASS: 25 permanent themes plus Automatic passed the deterministic theme gate.
          PASS: Firebase configuration, Google web client ID, and backend URL are compiled in.
          NOTE: these CI artifacts use a disposable packaging certificate. Re-sign with the Firebase-registered private-test certificate for Google Sign-In installation testing.
          TXT

      - name: Upload 0.14.2 phone APK
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.2-phone-apk
          path: |
            release-0.14.2/phone
            release-0.14.2/metadata
          retention-days: 5
          if-no-files-found: error

      - name: Upload 0.14.2 Wear APK
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.2-wear-apk
          path: |
            release-0.14.2/wear
            release-0.14.2/metadata
          retention-days: 5
          if-no-files-found: error
