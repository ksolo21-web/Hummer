name: My Study Companion 0.15.3 Professional Workbook Code Gate

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:

concurrency:
  group: msc-0153-professional-code-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact professional-renderer head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct every accepted repair in order
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-code.sh

      - name: Verify professional renderer contract
        shell: bash
        run: |
          set -euo pipefail
          APP='MyStudyCompanion/app/src/main/java/com/mystudycompanion/app'
          TESTS='MyStudyCompanion/app/src/test/java/com/mystudycompanion/app'
          WEB='MyStudyCompanionWeb'

          node --check "$WEB/workbook.js"
          node --check "$WEB/sw.js"

          grep -Fq 'internal object ProfessionalWorkbookAssetLoader' "$APP/ui/ProfessionalWorkbookAssets.kt"
          grep -Fq 'fun regionAt' "$APP/ui/ProfessionalWorkbookAssets.kt"
          grep -Fq 'fun createFillOverlay' "$APP/ui/ProfessionalWorkbookAssets.kt"
          grep -Fq 'rememberProfessionalWorkbookAsset' "$APP/ui/InteractiveWorkbookEditor.kt"
          grep -Fq 'professionalAsset.differenceSpots' "$APP/ui/InteractiveWorkbookEditor.kt"
          grep -Fq 'drawingStepIndex' "$APP/ui/InteractiveWorkbookEditor.kt"
          grep -Fq 'drawPdfBitmap' "$APP/ui/InteractiveWorkbookEditor.kt"
          grep -Fq 'ProfessionalWorkbookAssetsTest' "$TESTS/ui/ProfessionalWorkbookAssetsTest.kt"

          grep -Fq 'loadProfessionalWorkbookAsset' "$WEB/workbook.js"
          grep -Fq 'professionalPrintData' "$WEB/workbook.js"
          grep -Fq 'msc-web-v0153-professional-workbook-assets-v1' "$WEB/sw.js"

          # The approved Daily Text, automatic profile, ministry, Z Flip, and saved-work fixes must remain present.
          grep -Fq 'TODAY’S SCRIPTURE' "$APP/ui/HomeScreen.kt"
          grep -Fq 'internal object StudyGroupAssignmentResolver' "$APP/companion/StudyGroupAssignmentResolver.kt"
          grep -Fq 'Suggested words' "$APP/ui/DailyFieldServicePointerCard.kt"
          grep -Fq 'contentWindowInsets = WindowInsets.safeDrawing' "$APP/ui/MyStudyCompanionApp.kt"
          grep -Fq 'StoredWorkbookWorkView' "$APP/ui/InteractiveWorkbookEditor.kt"
          ! grep -R -Eq 'ProfileAgeSetupScreen\(|Google did not provide enough age information' "$APP"

      - name: Run Android and Wear tests, compilation, and debug builds
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :app:compileDebugKotlin \
            :wear:compileDebugKotlin \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Upload code-gate validation APKs
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.3-professional-workbook-code-debug
          path: |
            MyStudyCompanion/app/build/outputs/apk/debug/*.apk
            MyStudyCompanion/wear/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error
