name: Export Android 36 APK Verification Tools

on:
  push:
    branches:
      - agent/msc-0.15.14-vote-persistence-fix
    paths:
      - .github/workflows/export-android-signing-tools-36.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and collect Android Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'
          TOOLS="$SDK_ROOT/build-tools/36.0.0"
          mkdir -p exported-android-tools/lib64
          cp "$TOOLS/apksigner" exported-android-tools/
          cp "$TOOLS/lib/apksigner.jar" exported-android-tools/
          cp "$TOOLS/zipalign" exported-android-tools/
          cp "$TOOLS/aapt2" exported-android-tools/
          cp "$TOOLS/aapt" exported-android-tools/ || true
          if [ -d "$TOOLS/lib64" ]; then cp -a "$TOOLS/lib64/." exported-android-tools/lib64/; fi
          chmod +x exported-android-tools/apksigner exported-android-tools/zipalign exported-android-tools/aapt2
          cat > exported-android-tools/README.txt <<'EOF'
Official Android SDK Build Tools 36.0.0 utilities exported by GitHub Actions.
The apksigner launcher is accompanied by apksigner.jar in this directory.
EOF
      - uses: actions/upload-artifact@v6
        with:
          name: android-build-tools-36-apk-utilities
          path: exported-android-tools
          retention-days: 1
          if-no-files-found: error
