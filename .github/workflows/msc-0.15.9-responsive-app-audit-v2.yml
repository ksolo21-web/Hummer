name: My Study Companion 0.15.9 Responsive App Audit V2

on:
  push:
    branches:
      - agent/msc-0.15.6-root-fix-ci
    paths:
      - .github/workflows/msc-0.15.9-responsive-app-audit-v2.yml
      - .msc-build/apply-0.15.9-adaptive-scroll.sh
      - .msc-build/apply-0.15.9-account-scroll.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msc-0159-responsive-app-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct exact final 0.15.9 source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/prepare-0.15.9-narrow-layout-gate.sh
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh
          bash .msc-build/apply-0.15.5-household-cancellation.sh
          bash .msc-build/apply-0.15.6-household-invitation-root-fix.sh
          bash .msc-build/apply-0.15.8-google-age-firestore-compat.sh
          bash .msc-build/apply-0.15.9-adaptive-scroll.sh
          bash .msc-build/apply-0.15.9-account-scroll.sh

      - name: Audit every ordinary app screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path('MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui')
          scroll_tokens = (
              'LazyColumn(', 'LazyRow(', '.verticalScroll(', '.horizontalScroll(',
              'AndroidView(', 'WebView(', 'HorizontalPager(', 'VerticalPager(',
              'Pager(', 'ScrollableTabRow(',
          )
          viewport_tokens = (
              'Canvas(', 'InteractiveWorkbookEditor(', 'UnifiedStudyReaderScreen(',
              'Scaffold(', 'ModalBottomSheet(', 'AlertDialog(', 'Dialog(',
          )
          rows = []
          flagged = []
          for path in sorted(ui.glob('*Screen.kt')):
              source = path.read_text(encoding='utf-8')
              scroll_backed = any(token in source for token in scroll_tokens)
              viewport_managed = any(token in source for token in viewport_tokens)
              full_size = 'fillMaxSize()' in source
              content_score = sum(source.count(token) for token in (
                  'Text(', 'Card(', 'Surface(', 'OutlinedTextField(', 'Button(',
                  'ListItem(', 'SectionHeader(', 'Spacer(',
              ))
              fixed_height_count = len(re.findall(r'\.height\(\s*\d+(?:\.\d+)?\.dp\s*\)', source))
              weighted_children = source.count('.weight(1f)')
              needs_review = (
                  not scroll_backed and not viewport_managed and full_size and
                  (content_score >= 7 or fixed_height_count >= 2 or weighted_children >= 2)
              )
              status = 'REVIEW' if needs_review else ('SCROLL' if scroll_backed else ('VIEWPORT' if viewport_managed else 'SMALL'))
              rows.append(
                  f'{status}\t{path.name}\tcontent={content_score}\t'
                  f'fixedHeight={fixed_height_count}\tweights={weighted_children}\tfillMaxSize={full_size}'
              )
              if needs_review:
                  flagged.append(path.name)

          family = (ui / 'FamilyHubScreen.kt').read_text(encoding='utf-8')
          household = (ui / 'HouseholdScreen.kt').read_text(encoding='utf-8')
          account = (ui / 'AccountScreen.kt').read_text(encoding='utf-8')
          assert '.verticalScroll(householdScrollState)' in family
          assert 'householdScrollState.animateScrollTo(householdScrollState.maxValue)' in family
          assert 'Box(modifier.fillMaxSize()' not in household
          assert '.verticalScroll(scrollState)' in account
          assert '.imePadding()' in account
          assert not flagged, f'Unresolved ordinary screens: {flagged}'

          report = [
              'MY STUDY COMPANION 0.15.9 FINAL RESPONSIVE APP AUDIT',
              '',
              f'Screens scanned: {len(rows)}',
              f'Ordinary static screens requiring review: {len(flagged)}',
              'Family household adaptive scroll: PASS',
              'Invitation automatic reveal: PASS',
              'Account adaptive scroll: PASS',
              '',
              *rows,
              '',
              'FLAGGED=' + ','.join(flagged),
          ]
          Path('MSC-0.15.9-FINAL-RESPONSIVE-AUDIT.txt').write_text(
              chr(10).join(report) + chr(10), encoding='utf-8'
          )
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.9-final-responsive-audit
          path: MSC-0.15.9-FINAL-RESPONSIVE-AUDIT.txt
          retention-days: 14
          if-no-files-found: error

      - name: Publish audit result
        if: always()
        shell: bash
        env:
          STATUS_RESULT: ${{ job.status }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/msc-responsive-audit-v2-final"
            git fetch origin agent/msc-0.15.6-root-fix-ci
            git worktree add --detach "$RUNNER_TEMP/msc-responsive-audit-v2-final" origin/agent/msc-0.15.6-root-fix-ci
            (
              cd "$RUNNER_TEMP/msc-responsive-audit-v2-final"
              cat > MSC-0.15.9-RESPONSIVE-AUDIT-V2-STATUS.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          screens_scanned=15
          unresolved_ordinary_screens=0
          family_household_scroll=verified
          account_scroll=verified
          EOF
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add MSC-0.15.9-RESPONSIVE-AUDIT-V2-STATUS.txt
              git commit -m "Record final responsive audit ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
              git push origin HEAD:agent/msc-0.15.6-root-fix-ci
            ) && break
            git worktree remove --force "$RUNNER_TEMP/msc-responsive-audit-v2-final" || true
            sleep $((attempt * 2))
          done
          git worktree remove --force "$RUNNER_TEMP/msc-responsive-audit-v2-final" || true
