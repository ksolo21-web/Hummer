name: My Study Companion 0.12.3 Firebase Overlay Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.3-firebase-overlay-audit.yml'
      - '.msc-build/firebase-family-0.12.3.part*.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated app build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Reconstruct and verify Firebase overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/firebase-family-0.12.3.part*.b64 | base64 --decode > firebase-family-0.12.3-overlay.tar.xz
          echo 'fc5d7909d3f739e6eb33d95f56c17e14013f0ffb6f685f7b78a9cea59a3cc8a2  firebase-family-0.12.3-overlay.tar.xz' | sha256sum -c -
          mkdir -p overlay
          tar -xJf firebase-family-0.12.3-overlay.tar.xz -C overlay
          test -s overlay/firestore.rules
          test -s overlay/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt
          find overlay -type f -print0 | sort -z | xargs -0 sha256sum > OVERLAY-FILES-SHA256.txt

      - name: Upload auditable Firebase overlay
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.3-firebase-overlay-audit
          path: |
            overlay/
            OVERLAY-FILES-SHA256.txt
          retention-days: 5
          if-no-files-found: error
