name: Apply KREATIV Cloud Permission Repair v2

on:
  push:
    branches: [ agent/kreativ-studio-v0.1 ]
    paths:
      - '.github/workflows/kreativ-apply-cloud-permission-fix-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID: 949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com
  ORG_GRADLE_PROJECT_KREATIV_OLIVIA_FIREBASE_UID: ${{ secrets.KREATIV_OLIVIA_FIREBASE_UID }}
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_API_KEY: AIzaSyDze_icg2SIo2h-PV9SFAW1CBFcjMhp-MI
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID: 1:949620144971:android:63fec0446e8549d25946ce
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID: my-study-companion-abc01
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_STORAGE_BUCKET: my-study-companion-abc01.firebasestorage.app

jobs:
  apply-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/kreativ-studio-v0.1
          fetch-depth: 0

      - name: Apply local-first cloud authorization repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          vm = Path('app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt')
          screens = Path('app/src/main/java/com/kreativstudio/app/ui/Screens.kt')
          gradle = Path('app/build.gradle.kts')

          replace_once(
              vm,
              '''    var isBusy by mutableStateOf(false)\n        private set\n    var message by mutableStateOf<String?>(null)\n''',
              '''    var isBusy by mutableStateOf(false)\n        private set\n    var cloudAccessAvailable by mutableStateOf(false)\n        private set\n    var message by mutableStateOf<String?>(null)\n''',
          )

          replace_once(
              vm,
              '''            container.authRepository.signInWithGoogle(activity)\n                .onSuccess { signedIn ->\n                    message = "Welcome home, ${signedIn.displayName}."\n                    restoreFromCloud()\n                }\n                .onFailure { message = it.message ?: "Google sign-in failed." }\n''',
              '''            container.authRepository.signInWithGoogle(activity)\n                .onSuccess { signedIn ->\n                    val cloudReady = restoreFromCloud()\n                    message = if (cloudReady) {\n                        "Welcome home, ${signedIn.displayName}. Cloud backup is connected."\n                    } else {\n                        "Welcome home, ${signedIn.displayName}. Signed in successfully. Device autosave is active while cloud backup authorization is repaired."\n                    }\n                }\n                .onFailure { message = it.message ?: "Google sign-in failed." }\n''',
          )

          replace_once(
              vm,
              '''            container.authRepository.signOut()\n            currentProject = null\n            screen = StudioScreen.HOME\n''',
              '''            container.authRepository.signOut()\n            cloudAccessAvailable = false\n            currentProject = null\n            screen = StudioScreen.HOME\n''',
          )

          replace_once(
              vm,
              '''    fun syncCurrentProject() {\n        val project = currentProject ?: return\n        viewModelScope.launch {\n            isBusy = true\n            container.cloudSyncRepository.upload(project)\n                .onSuccess { synced ->\n                    currentProject = container.projectRepository.save(synced)\n                    backupUserState()\n                    message = "Project safely synced."\n                }\n                .onFailure { message = it.message ?: "Cloud sync failed." }\n            isBusy = false\n        }\n    }\n\n    fun syncAllUserData() {\n        if (!isCloudConfigured) {\n            message = "Sign in with the configured Google account before syncing the full studio."\n            return\n        }\n        viewModelScope.launch {\n            isBusy = true\n            runCatching {\n                projects.value.forEach { project ->\n                    val synced = container.cloudSyncRepository.upload(project).getOrThrow()\n                    val saved = container.projectRepository.save(synced)\n                    if (currentProject?.id == saved.id) currentProject = saved\n                }\n                backupUserState()\n            }.onSuccess {\n                message = "Every local project, lesson milestone, and studio setting is backed up."\n            }.onFailure {\n                message = it.message ?: "Full studio sync failed."\n            }\n            isBusy = false\n        }\n    }\n''',
              '''    fun syncCurrentProject() {\n        val project = currentProject ?: return\n        if (!cloudAccessAvailable) {\n            message = cloudUnavailableMessage()\n            return\n        }\n        viewModelScope.launch {\n            isBusy = true\n            container.cloudSyncRepository.upload(project)\n                .onSuccess { synced ->\n                    cloudAccessAvailable = true\n                    currentProject = container.projectRepository.save(synced)\n                    backupUserState()\n                    message = "Project safely synced."\n                }\n                .onFailure {\n                    cloudAccessAvailable = false\n                    message = cloudUnavailableMessage()\n                }\n            isBusy = false\n        }\n    }\n\n    fun syncAllUserData() {\n        if (!isCloudConfigured) {\n            message = "Sign in with the configured Google account before syncing the full studio."\n            return\n        }\n        if (!cloudAccessAvailable) {\n            message = cloudUnavailableMessage()\n            return\n        }\n        viewModelScope.launch {\n            isBusy = true\n            runCatching {\n                projects.value.forEach { project ->\n                    val synced = container.cloudSyncRepository.upload(project).getOrThrow()\n                    val saved = container.projectRepository.save(synced)\n                    if (currentProject?.id == saved.id) currentProject = saved\n                }\n                backupUserState()\n            }.onSuccess {\n                cloudAccessAvailable = true\n                message = "Every local project, lesson milestone, and studio setting is backed up."\n            }.onFailure {\n                cloudAccessAvailable = false\n                message = cloudUnavailableMessage()\n            }\n            isBusy = false\n        }\n    }\n''',
          )

          replace_once(
              vm,
              '''            if (isCloudConfigured) {\n                container.cloudSyncRepository.backupUserState(updated, lessonProgress.value)\n            }\n''',
              '''            if (isCloudConfigured && cloudAccessAvailable) {\n                container.cloudSyncRepository.backupUserState(updated, lessonProgress.value)\n                    .onFailure { cloudAccessAvailable = false }\n            }\n''',
          )

          replace_once(
              vm,
              '''    private suspend fun restoreFromCloud() {\n        if (!isCloudConfigured) return\n        val restoredProjects = container.cloudSyncRepository.restoreProjects().getOrElse {\n            message = "Signed in, but cloud artwork could not be restored yet: ${it.message ?: "unknown error"}"\n            emptyList()\n        }\n        restoredProjects.forEach { remote ->\n            val local = container.projectRepository.get(remote.id)\n            if (local == null || remote.updatedAt > local.updatedAt) {\n                container.projectRepository.save(remote.copy(syncState = SyncState.SYNCED))\n            }\n        }\n        container.cloudSyncRepository.restoreUserState().getOrNull()?.let { cloudState ->\n            cloudState.settings?.let { restored -> container.settingsRepository.update { restored } }\n            if (cloudState.progress.isNotEmpty()) {\n                val merged = (lessonProgress.value + cloudState.progress)\n                    .groupBy { it.lessonId }\n                    .map { (lessonId, entries) ->\n                        val mastered = entries.flatMap { it.masteredStepIndices }.toSet()\n                        val needsPractice = entries.flatMap { it.needsPracticeStepIndices }.toSet() - mastered\n                        LessonProgress(\n                            lessonId = lessonId,\n                            completedSteps = mastered.size,\n                            attempts = entries.maxOfOrNull { it.attempts } ?: 0,\n                            masteredStepIndices = mastered,\n                            needsPracticeStepIndices = needsPractice,\n                            lastOpenedAt = entries.maxOfOrNull { it.lastOpenedAt } ?: System.currentTimeMillis(),\n                        )\n                    }\n                container.lessonProgressRepository.replaceAll(merged)\n            }\n        }\n        if (restoredProjects.isNotEmpty()) {\n            message = "Welcome home. ${restoredProjects.size} cloud project${if (restoredProjects.size == 1) "" else "s"} checked and restored."\n        }\n    }\n\n    private suspend fun backupUserState() {\n        if (!isCloudConfigured) return\n        container.cloudSyncRepository.backupUserState(settings.value, lessonProgress.value)\n    }\n''',
              '''    fun retryCloudConnection() {\n        viewModelScope.launch {\n            isBusy = true\n            val cloudReady = restoreFromCloud()\n            message = if (cloudReady) {\n                "Cloud backup is connected."\n            } else {\n                cloudUnavailableMessage()\n            }\n            isBusy = false\n        }\n    }\n\n    private suspend fun restoreFromCloud(): Boolean {\n        if (!isCloudConfigured) {\n            cloudAccessAvailable = false\n            return false\n        }\n        val restoredProjects = container.cloudSyncRepository.restoreProjects().getOrElse {\n            cloudAccessAvailable = false\n            return false\n        }\n        val cloudState = container.cloudSyncRepository.restoreUserState().getOrElse {\n            cloudAccessAvailable = false\n            return false\n        }\n        restoredProjects.forEach { remote ->\n            val local = container.projectRepository.get(remote.id)\n            if (local == null || remote.updatedAt > local.updatedAt) {\n                container.projectRepository.save(remote.copy(syncState = SyncState.SYNCED))\n            }\n        }\n        cloudState?.let { restoredState ->\n            restoredState.settings?.let { restored -> container.settingsRepository.update { restored } }\n            if (restoredState.progress.isNotEmpty()) {\n                val merged = (lessonProgress.value + restoredState.progress)\n                    .groupBy { it.lessonId }\n                    .map { (lessonId, entries) ->\n                        val mastered = entries.flatMap { it.masteredStepIndices }.toSet()\n                        val needsPractice = entries.flatMap { it.needsPracticeStepIndices }.toSet() - mastered\n                        LessonProgress(\n                            lessonId = lessonId,\n                            completedSteps = mastered.size,\n                            attempts = entries.maxOfOrNull { it.attempts } ?: 0,\n                            masteredStepIndices = mastered,\n                            needsPracticeStepIndices = needsPractice,\n                            lastOpenedAt = entries.maxOfOrNull { it.lastOpenedAt } ?: System.currentTimeMillis(),\n                        )\n                    }\n                container.lessonProgressRepository.replaceAll(merged)\n            }\n        }\n        cloudAccessAvailable = true\n        return true\n    }\n\n    private suspend fun backupUserState() {\n        if (!isCloudConfigured || !cloudAccessAvailable) return\n        container.cloudSyncRepository.backupUserState(settings.value, lessonProgress.value)\n            .onFailure { cloudAccessAvailable = false }\n    }\n\n    private fun cloudUnavailableMessage(): String =\n        "Cloud backup is not authorized yet. Your work remains safely stored on this device."\n''',
          )

          replace_once(
              screens,
              'GreetingCard(user, settings.fromKalebMessage, Modifier.weight(1.35f))',
              'GreetingCard(user, settings.fromKalebMessage, viewModel.cloudAccessAvailable, Modifier.weight(1.35f))',
          )
          replace_once(
              screens,
              'GreetingCard(user, settings.fromKalebMessage, Modifier.fillMaxWidth())',
              'GreetingCard(user, settings.fromKalebMessage, viewModel.cloudAccessAvailable, Modifier.fillMaxWidth())',
          )
          replace_once(
              screens,
              'private fun GreetingCard(user: AppUser, fromKaleb: String, modifier: Modifier) {',
              'private fun GreetingCard(user: AppUser, fromKaleb: String, cloudAvailable: Boolean, modifier: Modifier) {',
          )
          replace_once(
              screens,
              'CloudStateBadge(synced = !user.isLocalPreview)',
              'CloudStateBadge(synced = !user.isLocalPreview && cloudAvailable)',
          )
          replace_once(
              screens,
              '''                Button(\n                    onClick = viewModel::syncAllUserData,\n                    enabled = viewModel.isCloudConfigured && !viewModel.isBusy,\n                    modifier = Modifier.fillMaxWidth(),\n                ) {\n                    Icon(Icons.Default.CloudSync, null)\n                    Spacer(Modifier.width(8.dp))\n                    Text("Back up the full studio")\n                }\n                OutlinedButton(onClick = viewModel::signOut) { Text("Sign out") }\n''',
              '''                Text(\n                    if (user.isLocalPreview) "Device-only preview."\n                    else if (viewModel.cloudAccessAvailable) "Cloud backup is connected."\n                    else "Google sign-in succeeded. Device autosave is active; Firebase cloud permission is not available yet.",\n                    style = MaterialTheme.typography.bodyMedium,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n                Button(\n                    onClick = viewModel::syncAllUserData,\n                    enabled = viewModel.cloudAccessAvailable && !viewModel.isBusy,\n                    modifier = Modifier.fillMaxWidth(),\n                ) {\n                    Icon(Icons.Default.CloudSync, null)\n                    Spacer(Modifier.width(8.dp))\n                    Text("Back up the full studio")\n                }\n                if (!user.isLocalPreview && !viewModel.cloudAccessAvailable) {\n                    OutlinedButton(\n                        onClick = viewModel::retryCloudConnection,\n                        enabled = !viewModel.isBusy,\n                        modifier = Modifier.fillMaxWidth(),\n                    ) {\n                        Text("Retry cloud connection")\n                    }\n                }\n                OutlinedButton(onClick = viewModel::signOut) { Text("Sign out") }\n''',
          )

          replace_once(gradle, 'versionCode = 6', 'versionCode = 7')
          replace_once(gradle, 'versionName = "0.1.5"', 'versionName = "0.1.6"')

          for path in (vm, screens, gradle):
              text = path.read_text(encoding='utf-8')
              if 'Signed in, but cloud artwork could not be restored yet' in text:
                  raise SystemExit(f'raw backend error still present in {path}')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Validate and build repaired app
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'cloudAccessAvailable' app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt
          grep -Fq 'Retry cloud connection' app/src/main/java/com/kreativstudio/app/ui/Screens.kt
          ! grep -R -Fq 'Signed in, but cloud artwork could not be restored yet' app/src/main/java
          gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KREATIV Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt \
            app/src/main/java/com/kreativstudio/app/ui/Screens.kt
          git commit -m 'Fix cloud permission fallback after Google sign-in'
          git push origin HEAD:agent/kreativ-studio-v0.1

      - name: Upload configured repaired APK
        uses: actions/upload-artifact@v7
        with:
          name: KREATIV-Studio-v0.1.6-cloud-permission-fallback-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
