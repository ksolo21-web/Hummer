name: WITHDRAWN - My Study Companion 0.15.17 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  withdrawn:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete 0.15.17 release path
        shell: bash
        run: |
          cat >&2 <<'EOF'
          RELEASE REFUSED: My Study Companion 0.15.17 was withdrawn.
          This obsolete workflow must not deploy Cloud Run, build an APK, access a signing key, or publish an artifact.
          Use the 0.15.18 Canonical Release Preparation workflow and the fail-closed offline canonical finalizer instead.
          EOF
          exit 1
