name: My Study Companion 0.15.18 Canonical Release Preparation

on:
  push:
    branches:
      - agent/msc-0.15.15-ai-activity-rebuild
    paths:
      - .github/workflows/msc-0.15.18-connected-transport-build.yml
      - .msc-build/package-0.15.18-connected-transport.sh
  workflow_dispatch:
    inputs:
      cloud_run_url:
        description: Optional already-deployed and healthy Cloud Run .run.app base URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: msc-01518-canonical-preparation
  cancel-in-progress: true

jobs:
  build-tested-signing-input:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out cumulative repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out checksum-locked workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 numpy==2.4.2 scipy==1.17.0 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"

      - name: Create isolated non-release staging signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-01518-staging-signing"
          mkdir -p "$SIGNING_DIR"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/staging.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias 'msc-01518-staging-not-release' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion Signing Input Only, OU=Never Install, O=My Study Companion, C=US'
          {
            echo "MSC_RELEASE_STORE_FILE=$SIGNING_DIR/staging.jks"
            echo "MSC_RELEASE_STORE_PASSWORD=$PASSWORD"
            echo 'MSC_RELEASE_KEY_ALIAS=msc-01518-staging-not-release'
            echo "MSC_RELEASE_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Reconstruct the accepted cumulative source through 0.15.14
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh
          bash .msc-build/apply-0.15.5-household-cancellation.sh
          bash .msc-build/apply-0.15.6-household-invitation-root-fix.sh
          bash .msc-build/apply-0.15.8-google-age-firestore-compat.sh
          bash .msc-build/apply-0.15.9-adaptive-scroll.sh
          bash .msc-build/apply-0.15.10-household-date-recovery.sh
          bash .msc-build/apply-0.15.11-local-family-generator.sh
          bash .msc-build/apply-0.15.13-family-schedule-regression-audit.sh
          bash .msc-build/apply-0.15.12-family-vote-widgets.sh
          bash .msc-build/apply-0.15.12-widget-compile-fix.sh
          bash .msc-build/apply-0.15.14-vote-persistence-fix.sh

      - name: Normalize the accepted 0.15.14 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path, code, name in (
              (Path('MyStudyCompanion/app/build.gradle.kts'), '47', '0.15.14-private-alpha-vote-persistence'),
              (Path('MyStudyCompanion/wear/build.gradle.kts'), '360164001', '0.15.14-wear-private-alpha-vote-persistence'),
          ):
              text = path.read_text(encoding='utf-8')
              text, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', text, count=1)
              text, b = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{name}"', text, count=1)
              if a != 1 or b != 1:
                  raise SystemExit(f'Could not normalize {path}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate optional existing Cloud Run endpoint
        id: endpoint
        shell: bash
        env:
          REQUESTED_URL: ${{ inputs.cloud_run_url }}
        run: |
          set -euo pipefail
          URL="${REQUESTED_URL%/}"
          if [[ -z "$URL" ]]; then
            echo 'No Cloud Run endpoint was supplied. Firebase Auth, Google Sign-In, Firestore, App Check configuration, and local fallbacks remain enabled; Smart Online stays truth-gated.'
            echo 'base_url=' >> "$GITHUB_OUTPUT"
            echo 'smart_online_validated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$URL" == https://*.run.app ]] || {
            echo "Refusing non-Cloud-Run backend URL: $URL" >&2
            exit 1
          }
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --max-time 30 "$URL/health" | tee endpoint-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('endpoint-health.json').read_text(encoding='utf-8'))
          expected = {
              'status': 'ok',
              'openAiConfigured': True,
              'signingKeyConfigured': True,
              'appCheckRequired': True,
              'userAuthRequired': True,
              'persistenceBackend': 'firestore',
          }
          bad = [f'{key}={payload.get(key)!r}' for key, value in expected.items() if payload.get(key) != value]
          if bad:
              raise SystemExit('Cloud Run health contract mismatch: ' + ', '.join(bad))
          PY
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"
          echo 'smart_online_validated=true' >> "$GITHUB_OUTPUT"

      - name: Apply cumulative 0.15.15 through responsive 0.15.18 widgets
        shell: bash
        env:
          MSC_SMART_ONLINE_VALIDATED: ${{ steps.endpoint.outputs.smart_online_validated }}
        run: |
          set -euo pipefail
          bash .msc-build/apply-0.15.18-premium-widgets.sh

      - name: Restore and verify Firebase and Google OAuth configuration
        id: google
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 \
            > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' | sha256sum -c -
          WEB_CLIENT_ID="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('MyStudyCompanion/app/google-services.json').read_text())
          clients = {item['client_info']['android_client_info']['package_name']: item for item in data['client']}
          canonical = clients['com.mystudycompanion.app']
          android = [item for item in canonical['oauth_client'] if item['client_type'] == 1]
          web = [item for item in canonical['oauth_client'] if item['client_type'] == 3]
          assert len(android) == 1
          assert android[0]['android_info']['certificate_hash'] == '1997d421d177215a44f9651ce53dbaec152fbc49'
          assert len(web) == 1
          assert web[0]['client_id'].endswith('.apps.googleusercontent.com')
          print(web[0]['client_id'])
          PY
          )"
          echo "web_client_id=$WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Build tested non-installable canonical signing inputs
        shell: bash
        env:
          MSC_BACKEND_BASE_URL: ${{ steps.endpoint.outputs.base_url }}
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ steps.google.outputs.web_client_id }}
          MSC_SMART_ONLINE_VALIDATED: ${{ steps.endpoint.outputs.smart_online_validated }}
        run: |
          set -euo pipefail
          bash .msc-build/package-0.15.18-connected-transport.sh

      - name: Upload signing inputs only
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.18-canonical-signing-input-NOT-INSTALLABLE
          path: release-0.15.18-signing-input
          retention-days: 3
          if-no-files-found: error
