name: Export Android APK Signer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-apksigner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -f "$SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar"
          mkdir -p dist/lib
          cp "$SDK_ROOT/build-tools/36.0.0/apksigner" dist/apksigner
          cp "$SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" dist/lib/apksigner.jar
          chmod 755 dist/apksigner
          sha256sum dist/apksigner dist/lib/apksigner.jar > dist/SHA256SUMS.txt

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v7
        with:
          name: android-apksigner-36.0.0
          if-no-files-found: error
          retention-days: 1
          path: dist/
