name: HAVENLINE Premium Visual Revision 10

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - .github/workflows/havenline-premium-visual-review-10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0

      - name: Apply premium HUD revision
        run: python .github/scripts/havenline_visual_patch10.py

      - name: Commit premium HUD revision
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineStudioBitmapFont.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineStudioRevision.cs
          git commit -m "Finalize HAVENLINE generated HUD presentation"
          git push origin HEAD:havenline-unity-reference-rebuild
