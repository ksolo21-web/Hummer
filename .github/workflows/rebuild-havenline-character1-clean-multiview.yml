name: Rebuild HAVENLINE Character 1 Clean Multi-View

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/rebuild-havenline-character1-clean-multiview.yml'
      - '.tooling/havenline-character-production/generate_character1_clean_multiview.py'
      - '.tooling/havenline-character-production/sanitize_character_mesh.py'
      - '.tooling/havenline-girls-multiview/remove_spatial_outliers.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'
      - '.tooling/havenline-character-reference-payload/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-character1-clean-multiview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        seed: [8101, 9101, 10101]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize checksum-pinned approved references
        run: python3 .tooling/havenline-character-reference-payload/materialize_references.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install authenticated TRELLIS client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'gradio_client>=1.8,<2' 'numpy<2' pillow trimesh pygltflib

      - name: Generate clean Character 1 candidate
        id: generate
        continue-on-error: true
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          rm -rf "$out"
          mkdir -p "$out"
          python .tooling/havenline-character-production/generate_character1_clean_multiview.py \
            --character Character1 \
            --sheet .tooling/havenline-character-production/references/Character1.jpg \
            --output "$out" \
            --seed '${{ matrix.seed }}'
          test -s "$out/Character1_raw.glb"
          python - "$out/generation-report.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if report.get('success') is not True:
              raise SystemExit('Clean Character 1 generation report did not pass')
          if report.get('meshSimplify') != 0.72:
              raise SystemExit('Clean Character 1 candidate used the wrong simplification contract')
          if len(report.get('cleanViews', [])) != 4:
              raise SystemExit('Clean Character 1 candidate did not use four isolated views')
          if any(item.get('neighborPosePixelsIncluded') is not False for item in report['cleanViews']):
              raise SystemExit('A Character 1 clean view contains a neighboring pose')
          PY

      - name: Install pinned portable Blender runtime
        id: blender
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.2.3-linux-x64.tar.xz"
          runtime="$RUNNER_TEMP/blender-4.2.3"
          curl --fail --location --retry 5 --retry-delay 5 \
            https://mirrors.dotsrc.org/blender/blender-release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
            --output "$archive"
          mkdir -p "$runtime"
          tar -xJf "$archive" --strip-components=1 -C "$runtime"
          test -x "$runtime/blender"
          echo "$runtime" >> "$GITHUB_PATH"
          "$runtime/blender" --background --factory-startup \
            --python-expr "import bpy, numpy; print('Blender:', bpy.app.version_string); print('NumPy:', numpy.__version__)"

      - name: Sanitize clean Character 1 candidate
        id: sanitize
        if: ${{ always() && steps.generate.outcome == 'success' && steps.blender.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/sanitize_character_mesh.py -- \
            --character Character1 \
            --input "$out/Character1_raw.glb" \
            --output "$out"
          test -s "$out/Character1_sanitized.glb"

      - name: Remove detached spatial outliers
        id: spatial
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/remove_spatial_outliers.py -- \
            --character Character1 \
            --input "$out/Character1_sanitized.glb" \
            --output "$out"
          test -s "$out/Character1_spatial.glb"

      - name: Rig, animate and rebuild LODs
        id: rig
        if: ${{ always() && steps.spatial.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          rig_script="$RUNNER_TEMP/rig_animate_character_clean.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          test -s "$rig_script"
          blender --background --factory-startup \
            --python "$rig_script" -- \
            --character Character1 \
            --input "$out/Character1_spatial.glb" \
            --output "$out"

      - name: Render clean Character 1 proof angles
        id: proof
        if: ${{ always() && steps.rig.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          blender --background --factory-startup \
            --python .tooling/havenline-character-production/render_character_proofs_v4.py -- \
            --character Character1 \
            --input "$out/Character1_production.glb" \
            --output "$out"

      - name: Validate clean Character 1 candidate
        id: validate
        if: ${{ always() && steps.rig.outcome == 'success' && steps.proof.outcome == 'success' }}
        continue-on-error: true
        run: |
          out="character_output/Character1/seed-${{ matrix.seed }}"
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character Character1 \
            --directory "$out"

      - name: Copy approved reference beside proof package
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          out="character_output/Character1/seed-${{ matrix.seed }}"
          mkdir -p "$out"
          cp .tooling/havenline-character-production/references/Character1.jpg \
            "$out/approved_reference_sheet.jpg"

      - name: Write truthful candidate status
        if: ${{ always() }}
        shell: python
        env:
          SEED: ${{ matrix.seed }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          BLENDER_OUTCOME: ${{ steps.blender.outcome }}
          SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
          SPATIAL_OUTCOME: ${{ steps.spatial.outcome }}
          RIG_OUTCOME: ${{ steps.rig.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          import json, os, pathlib
          root = pathlib.Path('character_output/Character1') / f"seed-{os.environ['SEED']}"
          root.mkdir(parents=True, exist_ok=True)
          validation_path = root / 'validation-report.json'
          validation = json.loads(validation_path.read_text()) if validation_path.exists() else {}
          generation_path = root / 'generation-report.json'
          generation = json.loads(generation_path.read_text()) if generation_path.exists() else {}
          machine_passed = (
              os.environ.get('GENERATE_OUTCOME') == 'success'
              and os.environ.get('BLENDER_OUTCOME') == 'success'
              and os.environ.get('SANITIZE_OUTCOME') == 'success'
              and os.environ.get('SPATIAL_OUTCOME') == 'success'
              and os.environ.get('RIG_OUTCOME') == 'success'
              and os.environ.get('PROOF_OUTCOME') == 'success'
              and os.environ.get('VALIDATE_OUTCOME') == 'success'
              and generation.get('success') is True
              and validation.get('passed') is True
          )
          status = {
              'schemaVersion': 2,
              'character': 'Character1',
              'seed': int(os.environ['SEED']),
              'sourceMode': 'clean-non-overlapping-trellis-multiview',
              'blenderRuntime': '4.2.3 portable',
              'meshSimplify': generation.get('meshSimplify'),
              'textureSize': generation.get('textureSize'),
              'generateOutcome': os.environ.get('GENERATE_OUTCOME', 'skipped'),
              'blenderOutcome': os.environ.get('BLENDER_OUTCOME', 'skipped'),
              'sanitizeOutcome': os.environ.get('SANITIZE_OUTCOME', 'skipped'),
              'spatialOutcome': os.environ.get('SPATIAL_OUTCOME', 'skipped'),
              'rigOutcome': os.environ.get('RIG_OUTCOME', 'skipped'),
              'proofOutcome': os.environ.get('PROOF_OUTCOME', 'skipped'),
              'validateOutcome': os.environ.get('VALIDATE_OUTCOME', 'skipped'),
              'machinePassed': machine_passed,
              'approved': False,
              'unityIntegrated': False,
              'humanVisualApprovalRequired': True,
          }
          (root / 'candidate-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload clean Character 1 candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Character1-clean-candidate-${{ matrix.seed }}
          path: character_output/Character1/seed-${{ matrix.seed }}/**
          compression-level: 0
          retention-days: 30

      - name: Enforce candidate generation and proof pipeline
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.generate.outcome }}' = success
          test '${{ steps.blender.outcome }}' = success
          test '${{ steps.sanitize.outcome }}' = success
          test '${{ steps.spatial.outcome }}' = success
          test '${{ steps.rig.outcome }}' = success
          test '${{ steps.proof.outcome }}' = success
          test '${{ steps.validate.outcome }}' = success
