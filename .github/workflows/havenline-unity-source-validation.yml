name: HAVENLINE Unity Source Validation

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - 'HAVENLINE_UNITY/Assets/Havenline/**'
      - 'HAVENLINE_UNITY/Packages/**'
      - 'HAVENLINE_UNITY/ProjectSettings/**'
      - '.github/workflows/havenline-unity-source-validation.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: havenline-unity-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-tests:
    name: Compile and run ${{ matrix.testMode }} premium tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm Unity CI secrets exist
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Required repository secret is missing: $required" >&2
              exit 1
            fi
          done

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: HAVENLINE_UNITY/Library
          key: havenline-source-6000.3.18f1-${{ matrix.testMode }}-${{ hashFiles('HAVENLINE_UNITY/Packages/manifest.json', 'HAVENLINE_UNITY/Packages/packages-lock.json', 'HAVENLINE_UNITY/ProjectSettings/ProjectVersion.txt', 'HAVENLINE_UNITY/Assets/Havenline/**/*.asmdef') }}
          restore-keys: |
            havenline-source-6000.3.18f1-${{ matrix.testMode }}-
            havenline-source-6000.3.18f1-

      - name: Compile project and run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: HAVENLINE_UNITY
          unityVersion: 6000.3.18f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: HAVENLINE Unity ${{ matrix.testMode }} validation

      - name: Normalize Unity-generated missing meta files and prove source-tree cleanliness
        if: matrix.testMode == 'editmode' && always()
        shell: bash
        run: |
          set -euo pipefail

          # Use Python to parse Git's NUL-delimited output. The previous grep/mapfile pipeline
          # could concatenate paths and make `git add` interpret a filename as a revision.
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output([
              'git', 'ls-files', '--others', '--exclude-standard', '-z', '--',
              'HAVENLINE_UNITY/Assets'
          ])
          paths = [item.decode('utf-8', errors='surrogateescape')
                   for item in raw.split(b'\0') if item]
          meta = [path for path in paths if path.endswith('.meta')]
          print(f'Unity generated {len(meta)} previously-untracked .meta files.')
          if meta:
              subprocess.check_call(['git', 'add', '--', *meta])
          PY

          # Capture anything Unity changed beyond the missing .meta files. We do not silently
          # commit other generated source changes: they require an explicit repository decision.
          git status --porcelain=v1 --untracked-files=all -- \
            HAVENLINE_UNITY/Assets \
            HAVENLINE_UNITY/Packages \
            HAVENLINE_UNITY/ProjectSettings \
            | grep -v '^?? .*\.meta$' > /tmp/havenline_remaining_source_changes.txt || true

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(havenline): track Unity-generated meta files'

            # This is an ephemeral runner. Remove only Unity-import source-tree leftovers so a
            # rebase cannot be blocked by generated files that are deliberately not being kept.
            git reset --hard HEAD
            git clean -fd -- \
              HAVENLINE_UNITY/Assets \
              HAVENLINE_UNITY/Packages \
              HAVENLINE_UNITY/ProjectSettings

            git fetch origin havenline-unity-reference-rebuild
            git rebase origin/havenline-unity-reference-rebuild
            git push origin HEAD:havenline-unity-reference-rebuild
          else
            echo 'No untracked Unity .meta files were generated.'
          fi

          if [ -s /tmp/havenline_remaining_source_changes.txt ]; then
            echo 'Unity changed additional non-meta source files on a clean import:' >&2
            cat /tmp/havenline_remaining_source_changes.txt >&2
            echo 'These changes were NOT committed automatically. The branch is not yet clean-checkout proven.' >&2
            exit 1
          fi

          echo 'Unity import produced no remaining non-ignored source-tree changes.'

      - name: Upload ${{ matrix.testMode }} test, compiler and studio diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-Unity-${{ matrix.testMode }}-validation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.tests.outputs.artifactsPath }}
            HAVENLINE_UNITY/Logs/**
            HAVENLINE_UNITY/Builds/Review/HAVENLINE-Studio/**
            Builds/Review/HAVENLINE-Studio/**
