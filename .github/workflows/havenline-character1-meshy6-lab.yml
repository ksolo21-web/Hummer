name: HAVENLINE Character 1 Meshy 6 Lab

on:
  push:
    branches:
      - havenline-character1-meshy6-lab
    paths:
      - '.github/workflows/havenline-character1-meshy6-lab.yml'
      - '.tooling/havenline-character-reference-payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meshy-character1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated lab branch
        uses: actions/checkout@v4

      - name: Verify Meshy API access
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          if [ -z "$MESHY_API_KEY" ]; then
            echo 'MESHY_API_KEY repository secret is not configured.'
            exit 78
          fi
          echo 'Meshy API credential is available.'

      - name: Prepare Character 1 approved multi-view inputs
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          from PIL import Image, ImageOps

          payload = Path('.tooling/havenline-character-reference-payload')
          out = Path('meshy-character1')
          out.mkdir(parents=True, exist_ok=True)
          encoded = ''.join(''.join((payload / f'Character1.part{i:02d}.b64').read_text(encoding='ascii').split()) for i in range(1,4))
          raw = base64.b64decode(encoded, validate=True)
          expected = '36dd42d6d8f80651140958396742d37d14ae2c2676e167fe162a8d96b51df77f'
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected:
              raise SystemExit(f'Approved Character1 checksum mismatch: {digest}')
          sheet = out / 'Character1_approved_turnaround.jpg'
          sheet.write_bytes(raw)
          img = Image.open(sheet).convert('RGB')
          w,h = img.size
          if (w,h) != (512,362):
              raise SystemExit(f'Unexpected approved sheet size {(w,h)}')
          fractions = (
              (0.0098,0.0276,0.2441,0.6906),
              (0.2832,0.0276,0.5039,0.6906),
              (0.5391,0.0276,0.7168,0.6906),
              (0.7812,0.0276,0.9961,0.6906),
          )
          names = ('front','threequarter','side','back')
          report=[]
          for name,fr in zip(names,fractions):
              l,t,r,b = fr
              box=(round(w*l),round(h*t),round(w*r),round(h*b))
              crop=img.crop(box)
              crop=ImageOps.contain(crop,(1024,1024),Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(1024,1024),(244,246,249))
              canvas.paste(crop,((1024-crop.width)//2,(1024-crop.height)//2))
              p=out/f'{name}.jpg'
              canvas.save(p,'JPEG',quality=96,subsampling=0,optimize=True)
              report.append({'view':name,'crop':box,'file':str(p),'bytes':p.stat().st_size})
          (out/'input-report.json').write_text(json.dumps({'sheetSha256':digest,'views':report},indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Generate Character 1 with Meshy 6 Multi-Image
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, time, urllib.request, urllib.error

          out=Path('meshy-character1')
          key=os.environ['MESHY_API_KEY']
          views=['front','threequarter','side','back']
          data=[]
          for name in views:
              b64=base64.b64encode((out/f'{name}.jpg').read_bytes()).decode('ascii')
              data.append('data:image/jpeg;base64,'+b64)

          payload={
              'image_urls': data,
              'ai_model':'meshy-6',
              'should_texture': True,
              'enable_pbr': True,
              'texture_resolution':'4k',
              'should_remesh': False,
              'pose_mode':'t-pose',
              'image_enhancement': False,
              'remove_lighting': True,
              'target_formats':['glb','fbx'],
              'auto_size': True,
              'origin_at':'bottom',
              'alpha_thumbnail': True,
              'multi_view_thumbnails': True,
          }
          create_url='https://api.meshy.ai/openapi/v1/multi-image-to-3d'
          req=urllib.request.Request(create_url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=90) as r:
                  created=json.loads(r.read())
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')
              raise SystemExit(f'Meshy create failed HTTP {e.code}: {body}')
          task_id=created.get('result')
          if not task_id:
              raise SystemExit(f'No Meshy task id: {created}')
          (out/'meshy-create.json').write_text(json.dumps(created,indent=2)+'\n')
          print('Meshy task:',task_id)

          task_url=create_url+'/'+task_id
          final=None
          for _ in range(120):
              q=urllib.request.Request(task_url,headers={'Authorization':'Bearer '+key})
              try:
                  with urllib.request.urlopen(q,timeout=60) as r:
                      final=json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  raise SystemExit(f'Meshy poll failed HTTP {e.code}: {body}')
              status=final.get('status')
              progress=final.get('progress')
              print('status=',status,'progress=',progress)
              (out/'meshy-task-latest.json').write_text(json.dumps(final,indent=2)+'\n')
              if status in ('SUCCEEDED','FAILED','CANCELED'):
                  break
              time.sleep(15)
          if not final or final.get('status')!='SUCCEEDED':
              raise SystemExit('Meshy task did not succeed: '+json.dumps(final))

          # Preserve task metadata without the submitted base64 inputs.
          (out/'meshy-task-final.json').write_text(json.dumps(final,indent=2)+'\n')

          downloads={}
          for fmt,url in (final.get('model_urls') or {}).items():
              if fmt not in ('glb','fbx') or not url:
                  continue
              dst=out/f'Character1_Meshy6.{fmt}'
              urllib.request.urlretrieve(url,dst)
              downloads[fmt]={'file':str(dst),'bytes':dst.stat().st_size}

          thumbs={}
          if final.get('thumbnail_url'):
              dst=out/'preview.png'; urllib.request.urlretrieve(final['thumbnail_url'],dst); thumbs['preview']=str(dst)
          if final.get('alpha_thumbnail_url'):
              dst=out/'preview_alpha.png'; urllib.request.urlretrieve(final['alpha_thumbnail_url'],dst); thumbs['alpha']=str(dst)
          for name,url in (final.get('thumbnail_urls') or {}).items():
              if url:
                  dst=out/f'preview_{name}.png'; urllib.request.urlretrieve(url,dst); thumbs[name]=str(dst)

          summary={'taskId':task_id,'status':final.get('status'),'progress':final.get('progress'),'consumedCredits':final.get('consumed_credits'),'downloads':downloads,'thumbnails':thumbs,'settings':{k:v for k,v in payload.items() if k!='image_urls'}}
          (out/'RESULT.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload Character 1 Meshy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: havenline-character1-meshy6-proof
          path: meshy-character1/
          if-no-files-found: warn
          retention-days: 7
