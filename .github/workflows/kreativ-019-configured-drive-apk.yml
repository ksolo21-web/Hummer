name: KREATIV 0.1.9 Configured Google Drive APK

on:
  push:
    branches:
      - agent/kreativ-studio-v0.1
    paths:
      - '.github/workflows/kreativ-019-configured-drive-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID: 949620144971-saq0foq660pgd6r0fgu4adft55qr7t1b.apps.googleusercontent.com
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_API_KEY: AIzaSyDze_icg2SIo2h-PV9SFAW1CBFcjMhp-MI
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID: 1:949620144971:android:63fec0446e8549d25946ce
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID: my-study-companion-abc01
  ORG_GRADLE_PROJECT_KREATIV_FIREBASE_STORAGE_BUCKET: my-study-companion-abc01.firebasestorage.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/kreativ-studio-v0.1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set 0.1.9 APK identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode = 9', 'versionCode = 10', 1)
          text = text.replace('versionName = "0.1.8"', 'versionName = "0.1.9"', 1)
          if 'versionCode = 10' not in text or 'versionName = "0.1.9"' not in text:
              raise SystemExit('Version patch failed.')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Test and build configured APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          grep -R -Fq "$ORG_GRADLE_PROJECT_KREATIV_GOOGLE_WEB_CLIENT_ID" app/build/generated
          grep -R -Fq "$ORG_GRADLE_PROJECT_KREATIV_FIREBASE_APP_ID" app/build/generated
          grep -R -Fq "$ORG_GRADLE_PROJECT_KREATIV_FIREBASE_PROJECT_ID" app/build/generated
          grep -Fq 'Connect Google Drive backup' app/src/main/java/com/kreativstudio/app/ui/Screens.kt

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/KREATIV-Studio-0.1.9-Google-Drive-Configured.apk
          sha256sum release/KREATIV-Studio-0.1.9-Google-Drive-Configured.apk > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: KREATIV-Studio-0.1.9-Google-Drive-Configured
          path: release
          retention-days: 14
          if-no-files-found: error
