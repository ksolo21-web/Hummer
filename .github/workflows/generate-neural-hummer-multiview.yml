name: Generate Multi-View Neural Hummer

on:
  push:
    paths:
      - '.tooling/neural-hummer-multiview-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client and validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.8,<2' requests pillow trimesh pygltflib

      - name: Download official GMC SUV references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p neural_multi/input neural_multi/output
          fetch() {
            local name="$1" url="$2"
            curl --fail --location --retry 5 --retry-all-errors -A 'Mozilla/5.0 HummerDesignReference/1.0' \
              --output "neural_multi/input/$name" "$url"
            test -s "neural_multi/input/$name"
          }
          fetch suv_front.jpg 'https://www.gmc.com/content/dam/gmc/na/us/english/index/vehicles/2026/electric/hummer-ev-suv/safety/2026-hummer-ev-suv-safety-driver-assistance-technologies-1280x640-26PGHM80004_.jpg?imwidth=1920'
          fetch suv_side.jpg 'https://www.gmc.com/content/dam/gmc/na/us/english/index/vehicles/2026/electric/hummer-ev-suv/trim-cards/2026-hummer-ev-suv-limited-edition-carbon-fiber-1280x640-26PGHMS80006.jpg?imwidth=1920'
          fetch suv_rear.jpg 'https://www.gmc.com/content/dam/gmc/na/us/english/index/vehicles/2026/electric/hummer-ev-suv/specs/2026-hummer-ev-suv-specs-specs-image-1280x960-26PGHMS80013.jpg?imwidth=1920'
          fetch suv_overhead.jpg 'https://www.gmc.com/content/dam/gmc/na/us/english/index/vehicles/2026/electric/hummer-ev-suv/exterior/2026-hummer-ev-suv-mov-exterior-header-1280x960-26PGHMS80020.jpg?imwidth=1920'
          sha256sum neural_multi/input/* > neural_multi/input/SHA256SUMS.txt
          file neural_multi/input/*.jpg

      - name: Generate full-vehicle mesh with TRELLIS multi-image GPU
        id: trellis
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil, traceback
          from gradio_client import Client, handle_file

          root=pathlib.Path('neural_multi')
          inp=root/'input'; out=root/'output'; out.mkdir(parents=True,exist_ok=True)
          report={'generator':'trellis-community/TRELLIS','mode':'multi-image','success':False}

          def lp(value):
              if isinstance(value,str):
                  p=pathlib.Path(value); return p if p.exists() else None
              if isinstance(value,dict):
                  p=value.get('path')
                  if isinstance(p,str) and pathlib.Path(p).exists(): return pathlib.Path(p)
              if isinstance(value,(list,tuple)):
                  for x in value:
                      p=lp(x)
                      if p is not None:return p
              return None
          def collect(value,files):
              p=lp(value)
              if p is not None and p.is_file():files.append(p)
              if isinstance(value,dict):
                  for v in value.values():collect(v,files)
              elif isinstance(value,(list,tuple)):
                  for v in value:collect(v,files)
          try:
              client=Client('trellis-community/TRELLIS',verbose=True)
              client.predict(api_name='/start_session')
              source_paths=[inp/'suv_front.jpg',inp/'suv_side.jpg',inp/'suv_rear.jpg',inp/'suv_overhead.jpg']
              gallery=[{'image':handle_file(str(p)),'caption':p.stem} for p in source_paths]
              processed=client.predict(images=gallery,api_name='/preprocess_images')
              report['processed_raw']=str(processed)
              reuploaded=[]
              items=processed if isinstance(processed,list) else [processed]
              for i,item in enumerate(items):
                  image_value=item.get('image') if isinstance(item,dict) and 'image' in item else item
                  p=lp(image_value)
                  if p is None:continue
                  shutil.copy2(p,out/f'processed_{i:02d}.png')
                  reuploaded.append({'image':handle_file(str(p)),'caption':f'view_{i}'})
              if len(reuploaded)<3:
                  raise RuntimeError(f'Only {len(reuploaded)} processed views could be resolved')
              client.predict(api_name='/lambda_1')
              result=client.predict(
                  image=None,
                  multiimages=reuploaded,
                  seed=1942,
                  ss_guidance_strength=7.5,
                  ss_sampling_steps=12,
                  slat_guidance_strength=3.0,
                  slat_sampling_steps=12,
                  multiimage_algo='multidiffusion',
                  mesh_simplify=0.95,
                  texture_size=1024,
                  api_name='/generate_and_extract_glb',
              )
              report['raw_result']=str(result)
              files=[];collect(result,files)
              copied=[]
              for i,p in enumerate(dict.fromkeys(files)):
                  if p.suffix.lower() not in {'.glb','.mp4','.ply','.zip'}:continue
                  dest=out/f'trellis_multi_{i:02d}{p.suffix.lower()}'
                  shutil.copy2(p,dest);copied.append(str(dest))
              glbs=list(out.glob('trellis_multi_*.glb'))
              if not glbs:raise RuntimeError(f'No GLB returned; files={files!r}')
              shutil.copy2(max(glbs,key=lambda p:p.stat().st_size),out/'hummer_ev_suv_multiview.glb')
              report.update(success=True,copied_files=copied,processed_count=len(reuploaded))
          except Exception as exc:
              report['error']=repr(exc);report['traceback']=traceback.format_exc()
          (out/'trellis_multiview_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if not report['success']:raise SystemExit(1)
          PY

      - name: Validate multi-view GLB
        id: validate
        if: ${{ steps.trellis.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,trimesh
          p=pathlib.Path('neural_multi/output/hummer_ev_suv_multiview.glb')
          scene=trimesh.load(p,force='scene')
          gs=list(scene.geometry.values())
          report={'success':True,'filename':p.name,'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'geometry_count':len(gs),'vertices':sum(len(g.vertices) for g in gs),'faces':sum(len(g.faces) for g in gs),'bounds':scene.bounds.tolist()}
          pathlib.Path('neural_multi/output/validation.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Write failure report
        if: ${{ steps.trellis.outcome != 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('neural_multi/output/trellis_multiview_report.json')
          r=json.loads(p.read_text()) if p.exists() else {'error':'report missing'}
          pathlib.Path('neural_multi/output/validation.json').write_text(json.dumps({'success':False,'trellis':r},indent=2))
          PY

      - name: Package all results
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cat > neural_multi/output/NOTICE.txt <<'EOF'
          Official GMC images are used as visual reconstruction references and remain copyright General Motors/GMC.
          Generated mesh: TRELLIS neural reconstruction starting point, not OEM CAD or certified Class-A surfacing.
          EOF
          tar --format=posix -C neural_multi -cf hummer-neural-multiview.tar input output
          find neural_multi/output -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload multi-view package
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hummer-neural-multiview
          path: hummer-neural-multiview.tar
          compression-level: 0
          retention-days: 7

      - name: Record status
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TRELLIS_OUTCOME: ${{ steps.trellis.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          cp neural_multi/output/validation.json .tooling/neural-hummer-multiview-validation.json
          jq -n --arg artifact_id "$ARTIFACT_ID" --arg trellis "$TRELLIS_OUTCOME" --arg validation "$VALIDATE_OUTCOME" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{status:"complete",trellis_outcome:$trellis,validation_outcome:$validation,artifact_id:($artifact_id|tonumber),run_id:$run_id,run_url:$run_url}' > .tooling/neural-hummer-multiview-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/neural-hummer-multiview-validation.json .tooling/neural-hummer-multiview-status.json
          git commit -m 'Record neural Hummer multi-view artifact' || exit 0
          git push
