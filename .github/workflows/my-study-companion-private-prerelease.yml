name: Publish My Study Companion Private APK Prerelease

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-private-apks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build phone and Wear OS debug APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"

          if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            SDKMANAGER=""
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
            if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

          cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.1.tar.xz
          echo "491c973a7f230c1d4ddbfce9db1d27f911513e5125bfdb70a942c7475787fc11  MyStudyCompanion_0.9.1.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.1.tar.xz
          python3 .msc-build/patch_source.py

          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            :app:assembleDebug \
            :wear:assembleDebug
          cd "$GITHUB_WORKSPACE"

          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$PHONE_APK"
          test -n "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-debug.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Replace private prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: my-study-companion-private-alpha-0.9.1
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" \
            dist/MyStudyCompanion-phone-debug.apk \
            dist/MyStudyCompanion-wear-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "My Study Companion Private Alpha 0.9.1 — Theme Studio" \
            --notes "Private owner-mode 0.9.1 Theme Studio APKs for Kaleb's physical-device testing. Includes full themed backgrounds, per-theme custom colors, and prominent Owl, Fox, Lion, and Tiger artwork. This is not a public app release." \
            --prerelease
