name: My Study Companion 0.14.0 Interactive Workbooks

on:
  push:
    branches:
      - agent/my-study-companion-interactive-workbooks-0140
  pull_request:
    branches:
      - agent/my-study-companion-0140-ci-base
  workflow_dispatch:

concurrency:
  group: msc-0140-interactive-workbooks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phone-wear-web:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-interactive-workbooks-0140
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Reconstruct verified source and apply workbook overlays
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-build-0125-ci.sh
          cat .msc-build/final-major-0.13.0.part*.b64 | base64 --decode > /tmp/msc-0130.tar.xz
          echo 'bd01fe658b10a2203732023cd0a559a538d4152468fcf0a37b5418f7eea1e217  /tmp/msc-0130.tar.xz' | sha256sum -c -
          tar -xJf /tmp/msc-0130.tar.xz -C .
          echo '454f6376981118b62e25790fe9a226d6cd05bcd0453dae55dfd604b89993715b  .msc-build/interactive-workbooks-0.14.0-overlay.tar.xz' | sha256sum -c -
          tar -xJf .msc-build/interactive-workbooks-0.14.0-overlay.tar.xz -C .
          echo '7061fd41666e3b4035b779fe753879e1f64be2a7fdda95e9ac13a8313be9edc5  .msc-build/interactive-workbooks-0.14.0-sync-overlay.tar.xz' | sha256sum -c -
          tar -xJf .msc-build/interactive-workbooks-0.14.0-sync-overlay.tar.xz -C .
      - name: Test, build, verify, and package phone, Wear, and web
        shell: bash
        run: bash .msc-build/run-interactive-workbooks-0.14.0-ci.sh build
      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.0-interactive-workbooks-phone-wear-web
          path: final-dist
          retention-days: 5
          if-no-files-found: error

  firestore-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-interactive-workbooks-0140
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reconstruct and apply workbook security rules
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/firebase-integrity-0.12.5.part*.b64 | base64 --decode > /tmp/firebase-integrity.tar.xz
          echo '8915fcd1e78a698c8528d4ccf0c06cace33251ee35e85b4a523a9c0af60db37f  /tmp/firebase-integrity.tar.xz' | sha256sum -c -
          tar -xJf /tmp/firebase-integrity.tar.xz -C .
          echo '454f6376981118b62e25790fe9a226d6cd05bcd0453dae55dfd604b89993715b  .msc-build/interactive-workbooks-0.14.0-overlay.tar.xz' | sha256sum -c -
          tar -xJf .msc-build/interactive-workbooks-0.14.0-overlay.tar.xz -C .
          echo '7061fd41666e3b4035b779fe753879e1f64be2a7fdda95e9ac13a8313be9edc5  .msc-build/interactive-workbooks-0.14.0-sync-overlay.tar.xz' | sha256sum -c -
          tar -xJf .msc-build/interactive-workbooks-0.14.0-sync-overlay.tar.xz -C .
      - name: Run 23 Firestore security tests
        shell: bash
        run: bash .msc-build/run-interactive-workbooks-0.14.0-ci.sh firestore
      - uses: actions/upload-artifact@v6
        with:
          name: msc-0.14.0-firestore-workbook-integrity
          path: |
            MyStudyCompanion/firestore.rules
            .msc-build/firebase-rules-tests/rules.test.cjs
            .msc-build/firebase-rules-tests/FIRESTORE-RULES-TEST-RESULTS.txt
          retention-days: 5
          if-no-files-found: error
