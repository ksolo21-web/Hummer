name: HAVENLINE Premium Visual Revision 14

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - .github/workflows/havenline-premium-visual-review-14.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0

      - name: Apply explicit particle curve correction
        run: python .github/scripts/havenline_visual_patch14.py

      - name: Commit explicit particle curve correction
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlinePremiumSceneGate.cs
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineStudioRevision.cs
          git commit -m "Serialize HAVENLINE furnace particle sizes explicitly"
          git push origin HEAD:havenline-unity-reference-rebuild
