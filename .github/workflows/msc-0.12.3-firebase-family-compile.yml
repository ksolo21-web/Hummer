name: My Study Companion 0.12.5 Firebase Integrity Compile

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.3-firebase-family-compile.yml'
      - '.msc-build/firebase-family-0.12.3.part*.b64'
      - '.msc-build/firebase-family-0.12.4.part*.b64'
      - '.msc-build/firebase-integrity-0.12.5.part*.b64'
      - '.msc-build/reconstruct-build-0125.sh'
  workflow_dispatch:

concurrency:
  group: msc-0125-firebase-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-phone-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out isolated app build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct, test, and compile Firebase integrity source
        shell: bash
        run: bash .msc-build/reconstruct-build-0125.sh

      - name: Verify Firestore-direct architecture and integrity controls
        shell: bash
        run: |
          set -euo pipefail
          test -s MyStudyCompanion/firestore.rules
          grep -q 'FirebaseFirestore' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt
          grep -q 'firebase-firestore' MyStudyCompanion/gradle/libs.versions.toml
          ! grep -q 'BackendApi' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt
          grep -q 'versionCode = 29' MyStudyCompanion/app/build.gradle.kts
          grep -q '0.12.5-private-alpha-firebase-integrity' MyStudyCompanion/app/build.gradle.kts
          grep -q 'function noOtherHousehold' MyStudyCompanion/firestore.rules
          grep -q "voteId == 'vote-'" MyStudyCompanion/firestore.rules
          grep -q 'jw\\.org' MyStudyCompanion/firestore.rules
          grep -q 'allow delete: if false' MyStudyCompanion/firestore.rules
          test "$(grep -c '^  test(' .msc-build/firebase-rules-tests/rules.test.cjs)" -eq 20
          cat > dist/FIREBASE-FAMILY-STATUS.txt <<'TXT'
          PASS: Firebase Authentication and structured Cloud Firestore family synchronization compiled without a private HTTPS backend.
          PASS: one household per account, immutable household links, deterministic one-vote-per-member IDs, organizer permissions, member progress isolation, and JW-only family links are enforced.
          PASS: household settings, members, ideas, votes, progress, and Family Worship are stored in separate Firestore documents to prevent one update from overwriting unrelated family data.
          PENDING LIVE TEST: publish the emulator-tested Firestore rules, install the canonical Firebase APK, then complete real Google sign-in and two-device synchronization tests.
          TXT

      - name: Export source for rules and data-flow audit
        shell: bash
        run: |
          set -euo pipefail
          tar -czf dist/MyStudyCompanion-0.12.5-firebase-integrity-source-audit.tgz \
            MyStudyCompanion/firestore.rules \
            MyStudyCompanion/app/build.gradle.kts \
            MyStudyCompanion/build.gradle.kts \
            MyStudyCompanion/settings.gradle.kts \
            MyStudyCompanion/gradle/libs.versions.toml \
            MyStudyCompanion/app/src/main/java \
            MyStudyCompanion/app/src/test \
            .msc-build/firebase-rules-tests/rules.test.cjs
          sha256sum dist/MyStudyCompanion-0.12.5-firebase-integrity-source-audit.tgz \
            > dist/SOURCE-AUDIT-SHA256.txt

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.5-firebase-integrity-compile-evidence
          path: dist/
          retention-days: 5
          if-no-files-found: warn
