name: My Study Companion 0.15.14 Vote Persistence Fix v2

on:
  push:
    branches:
      - agent/msc-0.15.14-vote-persistence-fix
    paths:
      - .github/workflows/msc-0.15.14-vote-persistence-fix-v2.yml
      - .msc-build/run-0.15.14-vote-persistence-fix.sh
      - .msc-build/build-0.15.14-vote-persistence-fix.sh
      - .msc-build/apply-0.15.14-vote-persistence-fix.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msc-01514-vote-persistence-fix-v2
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out cumulative fix branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-01514-packaging-v2"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-01514-packaging-v2-only' \
            -keypass 'msc-01514-packaging-v2-only' \
            -alias 'msc-01514-packaging-v2' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.14 CI Packaging v2, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build and verify cumulative 0.15.14
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-01514-packaging-v2-only
          MSC_RELEASE_KEY_ALIAS: msc-01514-packaging-v2
          MSC_RELEASE_KEY_PASSWORD: msc-01514-packaging-v2-only
        run: |
          set -euo pipefail
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/run-0.15.14-vote-persistence-fix.sh

      - name: Upload APKs and cumulative regression proof
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.14-vote-persistence-fix-configured-ci-v2
          path: release-0.15.14
          retention-days: 14
          if-no-files-found: error
