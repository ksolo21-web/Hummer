name: HAVENLINE Apply Studio Material Fix

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/havenline-studio-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out active HAVENLINE branch
        uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0

      - name: Remove self-deleting material copy
        shell: python
        run: |
          from pathlib import Path

          path = Path('HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs')
          source = path.read_text(encoding='utf-8')
          duplicate = (
              '            DuplicateMaterial("Snow", "HAVENLINE_Snow");\n'
              '            DuplicateMaterial("Ice", "HAVENLINE_Ice");\n'
          )
          if duplicate not in source:
              raise SystemExit('Expected HAVENLINE duplicate-material block was not found.')
          path.write_text(source.replace(duplicate, ''), encoding='utf-8')

      - name: Commit corrected studio source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlineProceduralArtStudio.cs
          git commit -m "Remove self-deleting studio material copy"
          git push origin HEAD:havenline-unity-reference-rebuild
