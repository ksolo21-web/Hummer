name: My Study Companion 0.13.0 Final Major Release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: msc-0130-final-major-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phone-wear-web-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out frozen final-major branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0127-webapp

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct the verified 0.12.5 foundation
        shell: bash
        run: bash .msc-build/reconstruct-build-0125-ci.sh

      - name: Apply the single checksum-locked 0.13.0 final-major overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/final-major-0.13.0.part*.b64 | base64 --decode \
            > /tmp/msc-0.13.0-final-major-overlay.tar.xz
          echo 'bd01fe658b10a2203732023cd0a559a538d4152468fcf0a37b5418f7eea1e217  /tmp/msc-0.13.0-final-major-overlay.tar.xz' \
            | sha256sum -c -
          tar -xJf /tmp/msc-0.13.0-final-major-overlay.tar.xz -C .

      - name: Verify phone, Wear, web, and content source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 31' MyStudyCompanion/app/build.gradle.kts
          grep -q '0.13.0-private-alpha-final-major' MyStudyCompanion/app/build.gradle.kts
          grep -q 'versionCode = 360130001' MyStudyCompanion/wear/build.gradle.kts
          grep -q '0.13.0-wear-private-alpha-final-major' MyStudyCompanion/wear/build.gradle.kts

          grep -Fq 'FIELD SERVICE • FOR EVERYONE' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/DailyFieldServicePointerCard.kt
          grep -Fq 'DailyFieldServicePointerCard(daily.date)' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/HomeScreen.kt
          grep -Fq 'Timeline Journeys' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/CompanionModels.kt
          grep -Fq 'Regional Convention (often called District Convention)' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/EventNotebooksSection.kt
          grep -Fq 'NotebookAudience.TEEN' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/EventNotebookModels.kt
          grep -Fq 'eventNotebooks' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/CompanionModels.kt

          grep -Fq 'FIELD SERVICE • FOR EVERYONE' \
            MyStudyCompanion/wear/src/main/java/com/mystudycompanion/app/wear/MainActivity.kt
          grep -Fq 'UPCOMING EVENT NOTEBOOK' \
            MyStudyCompanion/wear/src/main/java/com/mystudycompanion/app/wear/MainActivity.kt
          grep -Fq 'DAILY_POINTER_TITLE' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/wear/WearDataContract.kt
          grep -Fq 'EVENT_NEXT_TALK' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/wear/WearDataContract.kt

          grep -Fq 'Open in JW Library' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/HomeScreen.kt
          grep -Fq 'fun finderUrlFor(date: LocalDate)' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/data/official/OfficialDailyTextRepository.kt
          grep -Fq 'JwLibraryLinkResolver.openOfficial' \
            MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/widget/DailyStudyWidget.kt
          ! grep -R -F 'Today on WOL' MyStudyCompanion/app/src MyStudyCompanion/wear/src

          test -s MyStudyCompanionWeb/index.html
          test -s MyStudyCompanionWeb/manifest.webmanifest
          test -s MyStudyCompanionWeb/sw.js
          grep -Fq 'Glance mode' MyStudyCompanionWeb/index.html
          grep -Fq 'FIELD SERVICE • FOR EVERYONE' MyStudyCompanionWeb/index.html
          grep -Fq 'window.MSC_FIREBASE_CONFIG = null' MyStudyCompanionWeb/firebase-config.js

          for file in MyStudyCompanionWeb/*.js; do node --check "$file"; done
          node <<'JS'
          global.window = {};
          require('./MyStudyCompanionWeb/pointers.js');
          require('./MyStudyCompanionWeb/journeys.js');
          require('./MyStudyCompanionWeb/event-programs.js');
          if (window.MSC_POINTERS.length < 31) throw new Error('Expected at least 31 daily ministry pointers.');
          if (window.MSC_JOURNEYS.length < 30) throw new Error('Expected at least 30 Bible journeys.');
          const categories = new Set(window.MSC_JOURNEYS.map(item => item.category));
          for (const category of ['story', 'theme', 'timeline']) {
            if (!categories.has(category)) throw new Error(`Missing ${category} journeys.`);
          }
          if (window.MSC_EVENT_PROGRAMS.length !== 5) throw new Error('Expected five exact official programs.');
          const programParts = window.MSC_EVENT_PROGRAMS.reduce((total, program) => total + program.parts.length, 0);
          if (programParts !== 75) throw new Error(`Expected 75 exact official program parts, found ${programParts}.`);
          for (const program of window.MSC_EVENT_PROGRAMS) {
            if (!program.officialUrl.startsWith('https://www.jw.org/')) throw new Error('A non-JW program URL was found.');
          }
          console.log(`PASS: ${window.MSC_POINTERS.length} pointers, ${window.MSC_JOURNEYS.length} journeys, and ${programParts} program parts.`);
          JS

      - name: Install and validate canonical Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .msc-build/firebase-google-services-0.12.4.json.b64 \
            > MyStudyCompanion/app/google-services.json
          echo '5b2f85f67e6cb33e1fbe0a58b704a5c971bf2faf6f1b6e09730e904d02b91b5e  MyStudyCompanion/app/google-services.json' \
            | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('MyStudyCompanion/app/google-services.json').read_text(encoding='utf-8'))
          assert data['project_info']['project_id'] == 'my-study-companion-abc01'
          clients = {
              item['client_info']['android_client_info']['package_name']: item
              for item in data['client']
          }
          canonical = clients['com.mystudycompanion.app']
          android_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 1]
          web_clients = [item for item in canonical['oauth_client'] if item['client_type'] == 3]
          assert len(android_clients) == 1
          assert android_clients[0]['android_info']['certificate_hash'] == '1997d421d177215a44f9651ce53dbaec152fbc49'
          assert len(web_clients) == 1
          Path('/tmp/msc-web-client-id').write_text(web_clients[0]['client_id'], encoding='utf-8')
          print('PASS: canonical Firebase package, OAuth client, and permanent certificate binding validated.')
          PY
          printf 'MSC_GOOGLE_WEB_CLIENT_ID=%s\n' "$(cat /tmp/msc-web-client-id)" >> "$GITHUB_ENV"

      - name: Create disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/msc-temporary-signing"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/msc-temporary-signing/temporary.jks" \
            -storepass temporary-build-only \
            -alias temporary-build-only \
            -keypass temporary-build-only \
            -dname 'CN=Temporary CI Build,O=My Study Companion,C=US' \
            -keyalg RSA -keysize 2048 -validity 30
          {
            echo "MSC_RELEASE_STORE_FILE=$RUNNER_TEMP/msc-temporary-signing/temporary.jks"
            echo 'MSC_RELEASE_STORE_PASSWORD=temporary-build-only'
            echo 'MSC_RELEASE_KEY_ALIAS=temporary-build-only'
            echo 'MSC_RELEASE_KEY_PASSWORD=temporary-build-only'
          } >> "$GITHUB_ENV"

      - name: Run one uninterrupted phone and Wear test-and-build
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            -PMSC_GOOGLE_WEB_CLIENT_ID="$MSC_GOOGLE_WEB_CLIENT_ID" \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :app:compileDebugKotlin \
            :wear:compileDebugKotlin \
            :app:assembleDebug \
            :wear:assembleDebug \
            :app:assemblePrivateAlpha \
            :wear:assemblePrivateAlpha

      - name: Verify canonical identities, signatures, and release contents
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/36.0.0/zipalign"
          mkdir -p final-dist/test-reports

          PHONE_PRIVATE="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          WEAR_PRIVATE="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          PHONE_DEBUG="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_DEBUG="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -f "$PHONE_PRIVATE"
          test -f "$WEAR_PRIVATE"
          test -f "$PHONE_DEBUG"
          test -f "$WEAR_DEBUG"

          cp "$PHONE_PRIVATE" final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk
          cp "$WEAR_PRIVATE" final-dist/MyStudyCompanion-wear-0.13.0-canonical-temporary-signed.apk
          cp "$PHONE_DEBUG" final-dist/MyStudyCompanion-phone-0.13.0-debug.apk
          cp "$WEAR_DEBUG" final-dist/MyStudyCompanion-wear-0.13.0-debug.apk

          unzip -tq final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk
          unzip -tq final-dist/MyStudyCompanion-wear-0.13.0-canonical-temporary-signed.apk

          "$AAPT" dump badging final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk \
            | tee final-dist/PHONE-CANONICAL-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='31'" final-dist/PHONE-CANONICAL-IDENTITY.txt
          grep -q "versionName='0.13.0-private-alpha-final-major'" final-dist/PHONE-CANONICAL-IDENTITY.txt

          "$AAPT" dump badging final-dist/MyStudyCompanion-wear-0.13.0-canonical-temporary-signed.apk \
            | tee final-dist/WEAR-CANONICAL-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360130001'" final-dist/WEAR-CANONICAL-IDENTITY.txt
          grep -q "versionName='0.13.0-wear-private-alpha-final-major'" final-dist/WEAR-CANONICAL-IDENTITY.txt

          "$AAPT" dump resources final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk \
            > final-dist/FIREBASE-RESOURCE-AUDIT.txt
          grep -q 'google_app_id' final-dist/FIREBASE-RESOURCE-AUDIT.txt
          grep -q 'default_web_client_id' final-dist/FIREBASE-RESOURCE-AUDIT.txt
          grep -q 'project_id' final-dist/FIREBASE-RESOURCE-AUDIT.txt

          "$APKSIGNER" verify --verbose --print-certs \
            final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk \
            > final-dist/PHONE-TEMPORARY-SIGNATURE.txt
          "$APKSIGNER" verify --verbose --print-certs \
            final-dist/MyStudyCompanion-wear-0.13.0-canonical-temporary-signed.apk \
            > final-dist/WEAR-TEMPORARY-SIGNATURE.txt
          "$ZIPALIGN" -c -P 16 -v 4 \
            final-dist/MyStudyCompanion-phone-0.13.0-canonical-temporary-signed.apk \
            > final-dist/PHONE-ZIPALIGN.txt
          "$ZIPALIGN" -c -P 16 -v 4 \
            final-dist/MyStudyCompanion-wear-0.13.0-canonical-temporary-signed.apk \
            > final-dist/WEAR-ZIPALIGN.txt

          rm -rf /tmp/msc-phone-strings /tmp/msc-wear-strings
          mkdir -p /tmp/msc-phone-strings /tmp/msc-wear-strings
          unzip -q final-dist/MyStudyCompanion-phone-0.13.0-debug.apk 'classes*.dex' -d /tmp/msc-phone-strings
          unzip -q final-dist/MyStudyCompanion-wear-0.13.0-debug.apk 'classes*.dex' -d /tmp/msc-wear-strings
          find /tmp/msc-phone-strings -name 'classes*.dex' -type f -print0 | xargs -0 strings > final-dist/PHONE-STRING-AUDIT.txt
          find /tmp/msc-wear-strings -name 'classes*.dex' -type f -print0 | xargs -0 strings > final-dist/WEAR-STRING-AUDIT.txt
          grep -Fq 'FIELD SERVICE • FOR EVERYONE' final-dist/PHONE-STRING-AUDIT.txt
          grep -Fq 'Timeline Journeys' final-dist/PHONE-STRING-AUDIT.txt
          grep -Fq 'Regional Convention' final-dist/PHONE-STRING-AUDIT.txt
          grep -Fq 'Open in JW Library' final-dist/PHONE-STRING-AUDIT.txt
          ! grep -Fq 'Today on WOL' final-dist/PHONE-STRING-AUDIT.txt
          grep -Fq 'FIELD SERVICE • FOR EVERYONE' final-dist/WEAR-STRING-AUDIT.txt
          grep -Fq 'UPCOMING EVENT NOTEBOOK' final-dist/WEAR-STRING-AUDIT.txt

          cp -R MyStudyCompanion/app/build/reports/tests/testDebugUnitTest final-dist/test-reports/phone
          cp -R MyStudyCompanion/wear/build/reports/tests/testDebugUnitTest final-dist/test-reports/wear
          cp MyStudyCompanion/firestore.rules final-dist/firestore.rules
          cp .msc-build/firebase-rules-tests/rules.test.cjs final-dist/firestore-rules-tests.cjs
          cp -R MyStudyCompanionWeb final-dist/MyStudyCompanionWeb
          (cd final-dist && zip -qr MyStudyCompanion-Web-0.13.0-PWA.zip MyStudyCompanionWeb)

          cat > final-dist/RELEASE-STATUS.txt <<TXT
          PASS: daily Field Service Pointers for Everyone rotate deterministically by date on phone, Wear, and web.
          PASS: Story, Theme, and Timeline Journeys are included with saved progress.
          PASS: five verified official assembly/convention programs provide seventy-five talk pages with child, preteen, and teen activities.
          PASS: phone and Wear unit tests, Kotlin compilation, debug assemblies, and canonical privateAlpha assemblies completed in one Gradle invocation.
          PASS: canonical phone and Wear package identities, version codes, Firebase phone resources, signatures, and ZIP alignment were verified.
          PASS: installable offline PWA and Glance Mode were packaged for the Meta glasses web-app surface.
          NOTE: browser Firebase sync remains intentionally disabled until a Firebase Web App registration supplies its public web configuration.
          NOTE: unrestricted direct third-party rendering inside the Meta lens is not claimed; the PWA supplies the display-optimized web surface.
          PENDING LOCAL STEP: replace disposable CI signatures with the preserved permanent signing key.
          EXACT RELEASE COMMIT: ${GITHUB_SHA}
          TXT

          find final-dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum \
            > final-dist/SHA256SUMS-TEMPORARY.txt

      - name: Upload phone, Wear, and web final-major package
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.13.0-final-major-phone-wear-web
          path: final-dist/
          retention-days: 5
          if-no-files-found: error

  firestore-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out frozen final-major branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0127-webapp

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Reconstruct checksum-locked rules and 20-test suite
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/firebase-integrity-0.12.5.part*.b64 | base64 --decode \
            > /tmp/firebase-integrity-0.12.5-overlay.tar.xz
          echo '8915fcd1e78a698c8528d4ccf0c06cace33251ee35e85b4a523a9c0af60db37f  /tmp/firebase-integrity-0.12.5-overlay.tar.xz' \
            | sha256sum -c -
          tar -xJf /tmp/firebase-integrity-0.12.5-overlay.tar.xz -C .
          echo '0f834b748e561bf9a563a0714e90ccbb684e3dfbb0b0c47868e0cc24bbd12675  .msc-build/firestore-0.12.5.rules' \
            | sha256sum -c -
          echo 'b587ba8c2fe3fa0c93fa3e7d7935c1b65e78b83c6cae76bbf12fc564ad6df4e7  .msc-build/firebase-rules-tests/rules.test.cjs' \
            | sha256sum -c -
          cp .msc-build/firestore-0.12.5.rules .msc-build/firebase-rules-tests/firestore.rules
          node --check .msc-build/firebase-rules-tests/rules.test.cjs

      - name: Install Firebase emulator test dependencies
        working-directory: .msc-build/firebase-rules-tests
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            firebase@latest \
            @firebase/rules-unit-testing@latest \
            firebase-tools@latest

      - name: Run authorization, integrity, and abuse tests
        working-directory: .msc-build/firebase-rules-tests
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec \
            --only firestore \
            --project demo-my-study-companion \
            'node rules.test.cjs' \
            | tee FIRESTORE-RULES-TEST-RESULTS.txt
          grep -q 'PASS: 20 Firestore authorization, integrity, and abuse tests completed.' \
            FIRESTORE-RULES-TEST-RESULTS.txt

      - name: Upload Firestore integrity evidence
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.13.0-final-major-firestore-integrity
          path: |
            .msc-build/firebase-rules-tests/FIRESTORE-RULES-TEST-RESULTS.txt
            .msc-build/firebase-rules-tests/firestore.rules
            .msc-build/firebase-rules-tests/rules.test.cjs
            .msc-build/firebase-rules-tests/package.json
            .msc-build/firebase-rules-tests/package-lock.json
          retention-days: 5
          if-no-files-found: error
