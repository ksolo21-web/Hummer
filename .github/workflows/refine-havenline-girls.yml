name: Refine HAVENLINE Girls Visual Assets

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/refine-havenline-girls.yml'
      - '.tooling/havenline-girls-multiview/remove_spatial_outliers.py'
      - '.tooling/havenline-girls-multiview/refine_multiview_eyes.py'
      - '.tooling/havenline-character-production/render_character_proofs_v4.py'
      - '.tooling/havenline-character-production/validate_character_asset.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-girls-visual-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refine-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        character: [Character3, Character4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact successful multi-view source
        uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-reconstructed-production-review
          path: source_package
          github-token: ${{ github.token }}
          repository: ksolo21-web/Hummer
          run-id: 31102233972

      - name: Stage immutable source package
        shell: bash
        run: |
          set -euo pipefail
          out="character_output/${{ matrix.character }}"
          mkdir -p "$out"
          cp -a source_package/. "$out/"
          test -s "$out/${{ matrix.character }}_sanitized.glb"
          test -s "$out/approved_reference_sheet.jpg"

      - name: Install Blender and validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' pillow trimesh pygltflib
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            blender python3-numpy libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libglu1-mesa libopengl0 libglib2.0-0 mesa-utils xvfb xauth
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            env PYTHONPATH=/usr/lib/python3/dist-packages LIBGL_ALWAYS_SOFTWARE=1 \
            blender --background --factory-startup \
            --python-expr "import bpy, numpy; print('Blender:', bpy.app.version_string); print('NumPy:', numpy.__version__)"

      - name: Remove spatially detached reconstruction islands
        id: spatial
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/${{ matrix.character }}"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/remove_spatial_outliers.py -- \
            --character '${{ matrix.character }}' \
            --input "$out/${{ matrix.character }}_sanitized.glb" \
            --output "$out"
          test -s "$out/${{ matrix.character }}_spatial.glb"

      - name: Add centered 3D irises and pupils to Character 3
        id: eyes
        if: ${{ matrix.character == 'Character3' && steps.spatial.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/${{ matrix.character }}"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python .tooling/havenline-girls-multiview/refine_multiview_eyes.py -- \
            --character '${{ matrix.character }}' \
            --input "$out/${{ matrix.character }}_spatial.glb" \
            --output "$out"
          test -s "$out/${{ matrix.character }}_face_refined.glb"

      - name: Rig, animate and rebuild LODs from refined visual source
        id: rig
        if: ${{ always() && steps.spatial.outcome == 'success' && (matrix.character != 'Character3' || steps.eyes.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          out="character_output/${{ matrix.character }}"
          input="$out/${{ matrix.character }}_spatial.glb"
          if test -s "$out/${{ matrix.character }}_face_refined.glb"; then
            input="$out/${{ matrix.character }}_face_refined.glb"
          fi
          rig_script="$RUNNER_TEMP/rig_animate_character_clean.py"
          git show f3bc866367611b7ee94e00629c002b65fcb87fb7:.tooling/havenline-character-production/rig_animate_character.py > "$rig_script"
          test -s "$rig_script"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python "$rig_script" -- \
            --character '${{ matrix.character }}' \
            --input "$input" \
            --output "$out"

      - name: Render final close neutral proof angles
        id: proof
        if: ${{ always() && steps.rig.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          root=.tooling/havenline-character-production
          out="character_output/${{ matrix.character }}"
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            blender --background --factory-startup \
            --python "$root/render_character_proofs_v4.py" -- \
            --character '${{ matrix.character }}' \
            --input "$out/${{ matrix.character }}_production.glb" \
            --output "$out"

      - name: Validate refined production package
        id: validate
        if: ${{ always() && steps.rig.outcome == 'success' && steps.proof.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          python .tooling/havenline-character-production/validate_character_asset.py \
            --character '${{ matrix.character }}' \
            --directory "character_output/${{ matrix.character }}"

      - name: Write truthful final visual status
        if: ${{ always() }}
        shell: python
        env:
          CHARACTER: ${{ matrix.character }}
          SPATIAL_OUTCOME: ${{ steps.spatial.outcome }}
          EYES_OUTCOME: ${{ steps.eyes.outcome }}
          RIG_OUTCOME: ${{ steps.rig.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          import json, os, pathlib
          character = os.environ['CHARACTER']
          root = pathlib.Path('character_output') / character
          validation_path = root / 'validation-report.json'
          validation = json.loads(validation_path.read_text()) if validation_path.exists() else {}
          eye_required = character == 'Character3'
          eye_passed = (not eye_required) or os.environ.get('EYES_OUTCOME') == 'success'
          machine_passed = (
              os.environ.get('SPATIAL_OUTCOME') == 'success'
              and eye_passed
              and os.environ.get('RIG_OUTCOME') == 'success'
              and os.environ.get('PROOF_OUTCOME') == 'success'
              and os.environ.get('VALIDATE_OUTCOME') == 'success'
              and validation.get('passed') is True
          )
          status = {
              'schemaVersion': 1,
              'character': character,
              'sourceRunId': '31102233972',
              'sourceMode': 'trellis-multi-image',
              'spatialCleanupOutcome': os.environ.get('SPATIAL_OUTCOME', 'skipped'),
              'eyeRefinementRequired': eye_required,
              'eyeRefinementOutcome': os.environ.get('EYES_OUTCOME', 'skipped'),
              'rigOutcome': os.environ.get('RIG_OUTCOME', 'skipped'),
              'proofOutcome': os.environ.get('PROOF_OUTCOME', 'skipped'),
              'validateOutcome': os.environ.get('VALIDATE_OUTCOME', 'skipped'),
              'machinePassed': machine_passed,
              'approved': False,
              'unityIntegrated': False,
              'humanVisualApprovalRequired': True,
          }
          (root / 'matrix-status.json').write_text(json.dumps(status, indent=2) + '\n')
          print(json.dumps(status, indent=2))

      - name: Upload final visual review package
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-${{ matrix.character }}-final-visual-review
          path: character_output/${{ matrix.character }}/**
          compression-level: 0
          retention-days: 30

      - name: Enforce complete refinement pipeline
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.spatial.outcome }}' = success
          if test '${{ matrix.character }}' = Character3; then
            test '${{ steps.eyes.outcome }}' = success
          fi
          test '${{ steps.rig.outcome }}' = success
          test '${{ steps.proof.outcome }}' = success
          test '${{ steps.validate.outcome }}' = success
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('character_output/${{ matrix.character }}/matrix-status.json')
          status = json.loads(path.read_text())
          if status.get('machinePassed') is not True:
              raise SystemExit('Final visual refinement pipeline did not pass')
          if status.get('approved') is True:
              raise SystemExit('Character was prematurely marked human-approved')
          PY
