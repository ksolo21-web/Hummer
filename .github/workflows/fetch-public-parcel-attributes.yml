name: Retrieve public parcel classifications
on:
  push:
    branches: [public-map-source-20260914]
    paths: [.github/workflows/fetch-public-parcel-attributes.yml]
permissions:
  contents: read
jobs:
  public-attributes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public classification and situs fields only
        run: |
          mkdir -p public-parcel-attributes
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, datetime, hashlib
          out=pathlib.Path('public-parcel-attributes');receipts=[]
          base='https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseOpenParcelDataMapService/MapServer/1'
          def get(params):
              url=base+'/query?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'PublicGISMapReview/1.0'}),timeout=45) as r:raw=r.read()
              receipts.append({'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(raw).hexdigest()})
              obj=json.loads(raw)
              assert 'error' not in obj,obj
              return obj
          q={'f':'json','where':'1=1','geometry':'-83.190,42.678,-83.172,42.698','geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects','returnIdsOnly':'true'}
          ids=get(q); oid=ids['objectIdFieldName'];seq=sorted(ids['objectIds']);features=[]
          for i in range(0,len(seq),200):
              d=get({'f':'json','objectIds':','.join(map(str,seq[i:i+200])),'outFields':oid+',PIN,CLASSCODE,STRUCTURE_DESC,SITEADDRESS,SITECITY,REVISIONDATE','returnGeometry':'false'})
              assert not d.get('exceededTransferLimit',False)
              features.extend(d.get('features',[]))
          assert sorted(f['attributes'][oid] for f in features)==seq
          (out/'parcel-attributes.json').write_text(json.dumps({'source':base,'complete':True,'expected_count':len(seq),'features':features}))
          (out/'RECEIPTS.json').write_text(json.dumps(receipts))
          print('Complete public parcel classification records:',len(features))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-rochester-parcel-attributes-20260914
          path: public-parcel-attributes/
          retention-days: 1
          if-no-files-found: error
