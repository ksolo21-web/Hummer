name: My Study Companion 0.15.3 Professional Workbook Gate

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair
  workflow_dispatch:

concurrency:
  group: msc-0153-professional-workbook-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic illustration dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.4.2 \
            scikit-image==0.26.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct every accepted repair
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh

      - name: Verify professional offline pack and retained repairs
        shell: bash
        run: |
          set -euo pipefail
          APP='MyStudyCompanion/app/src/main/java/com/mystudycompanion/app'

          require_text() {
            local needle="$1"
            local file="$2"
            if ! grep -Fq "$needle" "$file"; then
              echo "MISSING REQUIRED MARKER: '$needle' in $file" >&2
              exit 1
            fi
            echo "PASS marker: $needle"
          }
          reject_regex() {
            local pattern="$1"
            local file="$2"
            if grep -En "$pattern" "$file"; then
              echo "REJECTED LEGACY MARKER remains in $file: $pattern" >&2
              exit 1
            fi
            echo "PASS rejected legacy pattern: $pattern"
          }

          require_text '0.15.3-private-alpha-professional-workbook-assets' MyStudyCompanion/app/build.gradle.kts
          require_text '0.15.3-wear-private-alpha-professional-workbook-assets' MyStudyCompanion/wear/build.gradle.kts
          require_text 'WorkbookIllustrationCatalog.assetFor' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'buildColorOverlay' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'regionAt' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'drawIllustrationBitmap' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'difference-changed.webp' "$APP/companion/WorkbookIllustrationCatalog.kt"
          reject_regex 'fun drawWorkbookArt|WorkbookArtScene\(|workbookArtScene\(' "$APP/ui/InteractiveWorkbookEditor.kt"

          # Verify the actual saved-work architecture rather than a UI label in an unrelated screen.
          require_text 'fun hasStoredWork()' "$APP/companion/InteractiveWorkbookModels.kt"
          require_text 'interactiveWorkbooksByUid' "$APP/companion/CompanionModels.kt"
          require_text 'private fun updateWorkbookPage' "$APP/companion/CompanionHubRepository.kt"
          require_text 'interactiveWorkbooksByUid = current.interactiveWorkbooksByUid +' "$APP/companion/CompanionHubRepository.kt"
          require_text 'StoredWorkbookWorkView' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'Open saved work' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'reopen exactly where this profile left them' "$APP/ui/InteractiveWorkbookEditor.kt"
          require_text 'uploadWorkbookPages' "$APP/family/FamilyWorshipOrganizerRepository.kt"

          require_text 'migrateProfileUid' "$APP/companion/CompanionHubRepository.kt"
          require_text 'TODAY’S SCRIPTURE' "$APP/ui/HomeScreen.kt"
          require_text 'FULL DAILY TEXT' "$APP/ui/HomeScreen.kt"
          require_text 'Scriptures to prepare' "$APP/ui/DailyFieldServicePointerCard.kt"
          if grep -R -En 'ProfileAgeSetupScreen\(|Google did not provide enough age information' "$APP"; then
            echo 'Child-facing manual age chooser remains active.' >&2
            exit 1
          fi
          echo 'PASS retained Daily Text, automatic profile, ministry, Z Flip, and per-profile saved-work repairs.'

          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import numpy as np

          root = Path('MyStudyCompanion/app/src/main/assets/workbook')
          manifest_path = root / 'manifest.json'
          if not manifest_path.is_file():
              raise SystemExit(f'Missing manifest: {manifest_path}')
          manifest = json.loads(manifest_path.read_text())
          assets = manifest.get('assets', [])
          print(f"Manifest version={manifest.get('version')} assets={len(assets)}")
          expected = {
              'creation', 'noahs-ark', 'jonah', 'david-goliath', 'daniel-lions',
              'jesus-storm', 'good-samaritan', 'lost-sheep', 'talents',
              'prodigal-son', 'wise-builders', 'armor-of-god',
              'favorite-scripture', 'favorite-animal', 'faith-action',
              'gratitude-journal',
          }
          actual = {item.get('id') for item in assets}
          if len(assets) != 16:
              raise SystemExit(f'Expected 16 assets; found {len(assets)}: {sorted(actual)}')
          if actual != expected:
              raise SystemExit(f'Asset IDs mismatch. Missing={sorted(expected-actual)} extra={sorted(actual-expected)}')

          failures = []
          counts = []
          for item in assets:
              asset_id = item['id']
              folder = root / asset_id
              region_count = len(item.get('regions', []))
              difference_count = len(item.get('differences', []))
              counts.append(region_count)
              print(f"{asset_id}: manifestRegions={region_count}, differences={difference_count}")
              if not 35 <= region_count <= 70:
                  failures.append(f'{asset_id}: region count {region_count} outside 35–70')
              if difference_count != 5:
                  failures.append(f'{asset_id}: expected 5 differences; found {difference_count}')
              required = (
                  'master.webp', 'line.webp', 'drawing-step-1.webp',
                  'drawing-step-2.webp', 'difference-changed.webp', 'region-mask.png',
              )
              missing = False
              for name in required:
                  path = folder / name
                  if not path.is_file():
                      failures.append(f'{asset_id}: missing {name}')
                      missing = True
                  elif path.stat().st_size <= 600:
                      failures.append(f'{asset_id}: {name} too small ({path.stat().st_size} bytes)')
              if missing:
                  continue
              original = np.asarray(Image.open(folder / 'master.webp').convert('RGB'))
              changed = np.asarray(Image.open(folder / 'difference-changed.webp').convert('RGB'))
              print(f"{asset_id}: masterShape={original.shape}, changedShape={changed.shape}")
              if original.shape != (768, 512, 3) or changed.shape != (768, 512, 3):
                  failures.append(f'{asset_id}: invalid image dimensions {original.shape}/{changed.shape}')
              if original.shape == changed.shape:
                  mean_delta = float(np.mean(np.abs(original.astype(float) - changed.astype(float))))
                  print(f"{asset_id}: changedMeanDelta={mean_delta:.4f}")
                  if mean_delta <= 0.8:
                      failures.append(f'{asset_id}: changed image delta {mean_delta:.4f} is too subtle')
              mask = np.asarray(Image.open(folder / 'region-mask.png'))
              unique_count = int(len(np.unique(mask)))
              print(f"{asset_id}: maskShape={mask.shape}, uniqueMaskRegions={unique_count}")
              if mask.shape != (768, 512):
                  failures.append(f'{asset_id}: invalid mask dimensions {mask.shape}')
              if unique_count < 35:
                  failures.append(f'{asset_id}: only {unique_count} unique mask regions')

          print(f"Region range: {min(counts)}–{max(counts)}")
          if failures:
              print('PROFESSIONAL PACK VERIFICATION FAILURES:')
              for failure in failures:
                  print(f' - {failure}')
              raise SystemExit(1)
          print(f"Verified {len(assets)} professional packs with {min(counts)}–{max(counts)} regions.")
          PY

      - name: Run Android and Wear tests and builds
        shell: bash
        run: |
          set -euo pipefail
          cd MyStudyCompanion
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :app:compileDebugKotlin \
            :wear:compileDebugKotlin \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Verify debug package identities
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          PHONE="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          WEAR="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -f "$PHONE" && test -f "$WEAR"
          "$AAPT" dump badging "$PHONE" | grep -q "package: name='com.mystudycompanion.app' versionCode='36'"
          "$AAPT" dump badging "$WEAR" | grep -q "package: name='com.mystudycompanion.app' versionCode='360153001'"

      - name: Upload professional workbook debug bundle
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.3-professional-workbook-debug
          path: |
            MyStudyCompanion/app/build/outputs/apk/debug/*.apk
            MyStudyCompanion/wear/build/outputs/apk/debug/*.apk
            MyStudyCompanion/app/src/main/assets/workbook/manifest.json
            MyStudyCompanion/app/src/main/assets/workbook/SHA256SUMS.txt
          retention-days: 5
          if-no-files-found: error
