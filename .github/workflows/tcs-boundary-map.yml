name: TCS Outlined Map Input
on:
  push:
    branches: [tcs-phase1d-020-work]
    paths:
      - .github/workflows/tcs-boundary-map.yml
      - .tooling/tcs/boundary/**
permissions:
  contents: read
concurrency:
  group: tcs-boundary-map
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover frozen source and apply integration
        run: |
          set -euo pipefail
          mkdir -p evidence tcs-src
          echo '12bbae2c2abb7dd820367ba9837476c39e86ae2ca854e4dccea21a6528272965  .tooling/tcs/phase4-evidence/Phase4-Android-0.4.0-source.tar.xz' | sha256sum -c -
          tar -xJf .tooling/tcs/phase4-evidence/Phase4-Android-0.4.0-source.tar.xz -C tcs-src
          for f in .tooling/tcs/phase56-overlay/*.kt; do
            case "$f" in *InstrumentationTest.kt) target=androidTest;; *) target=main;; esac
            cp "$f" "tcs-src/app/src/$target/java/com/koenterprises/territorycardstudio/"
          done
          cp .tooling/tcs/phase56-overlay/*.java tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio/
          cp .tooling/tcs/phase56-overlay/app-build.gradle.kts tcs-src/app/build.gradle.kts
          cp .tooling/tcs/phase56-overlay/AndroidTestManifest.xml tcs-src/app/src/androidTest/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Apply native authoring foundation and test affected contracts
        run: |
          set -euo pipefail
          cp .tooling/tcs/phase6-overlay/app/*.kt tcs-src/app/src/main/java/com/koenterprises/territorycardstudio/
          cp .tooling/tcs/phase6-overlay/androidTest/* tcs-src/app/src/androidTest/java/com/koenterprises/territorycardstudio/
          mkdir -p tcs-src/app/src/androidTest/assets
          cp 'tcs-src/core/src/test/resources/pdf-boundary/Territory - 300Aa.pdf' tcs-src/app/src/androidTest/assets/reference300.pdf
          cp .tooling/tcs/phase6-overlay/app-build.gradle.kts tcs-src/app/build.gradle.kts
          cp .tooling/tcs/phase6-overlay/core/*.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/
          cp .tooling/tcs/phase6-overlay/tests/*.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/
          cp .tooling/tcs/boundary/overlay/core/*.kt tcs-src/core/src/main/kotlin/com/koenterprises/territorycardstudio/core/
          cp .tooling/tcs/boundary/overlay/tests/*.kt tcs-src/core/src/test/kotlin/com/koenterprises/territorycardstudio/core/
          mkdir -p tcs-src/core/src/test/resources/boundary
          base64 -d .tooling/tcs/boundary/source-26435.jpg.b64 > tcs-src/core/src/test/resources/boundary/source-26435.jpg
          (cd tcs-src && gradle --no-daemon --build-cache :core:test --rerun --tests '*Outlined*Test') > evidence/core-tests.log 2>&1 || { cp -r tcs-src/core/build/test-results/test evidence/core-results; cat evidence/core-tests.log; exit 1; }
          cp -r tcs-src/core/build/test-results/test evidence/core-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outlined-map-evidence
          path: evidence
