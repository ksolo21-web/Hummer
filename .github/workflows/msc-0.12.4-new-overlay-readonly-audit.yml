name: My Study Companion New Firebase 0.12.4 Overlay Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.4-new-overlay-readonly-audit.yml'
      - '.msc-build/firebase-family-0.12.4.part*.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated app branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Reconstruct and safely inspect overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .msc-build -maxdepth 1 -name 'firebase-family-0.12.4.part*.b64' -type f | wc -l)" -eq 4
          cat .msc-build/firebase-family-0.12.4.part*.b64 | base64 --decode > firebase-family-0.12.4-overlay.tar.xz
          xz --test firebase-family-0.12.4-overlay.tar.xz
          sha256sum firebase-family-0.12.4-overlay.tar.xz > OVERLAY-SHA256.txt
          python3 - <<'PY'
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('firebase-family-0.12.4-overlay.tar.xz')
          out = Path('overlay')
          out.mkdir()
          inventory = []
          with tarfile.open(archive, mode='r:xz') as tf:
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f'Unsafe archive member type: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsupported archive member type: {member.name}')
                  inventory.append({
                      'name': member.name,
                      'size': member.size,
                      'type': 'file' if member.isfile() else 'directory',
                  })
              tf.extractall(out, filter='data')
          Path('OVERLAY-INVENTORY.json').write_text(
              json.dumps(inventory, indent=2), encoding='utf-8'
          )
          print(f'Safely extracted {len(inventory)} overlay members.')
          PY
          find overlay -type f -print0 | sort -z | xargs -0 sha256sum > OVERLAY-FILES-SHA256.txt

      - name: Upload read-only audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: msc-new-firebase-0.12.4-overlay-readonly-audit
          path: |
            firebase-family-0.12.4-overlay.tar.xz
            OVERLAY-SHA256.txt
            OVERLAY-INVENTORY.json
            OVERLAY-FILES-SHA256.txt
            overlay/
          retention-days: 3
          if-no-files-found: error
