name: My Study Companion 0.15.8 Google Age Free Invite

on:
  push:
    branches:
      - agent/msc-0.15.6-root-fix-ci
    paths:
      - .github/workflows/msc-0.15.8-google-age-free-invite.yml
      - .msc-build/apply-0.15.8-google-age-firestore-compat.sh
      - .msc-build/build-0.15.8-google-age-free-invite.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msc-0158-google-age-free-invite
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish run ID
        shell: bash
        env:
          STATUS_RESULT: in_progress
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/msc-0158-status"
            git fetch origin agent/msc-0.15.6-root-fix-ci
            git worktree add --detach "$RUNNER_TEMP/msc-0158-status" origin/agent/msc-0.15.6-root-fix-ci
            (
              cd "$RUNNER_TEMP/msc-0158-status"
              cat > MSC-0.15.8-STATUS.txt <<EOF
          source_commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          EOF
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add MSC-0.15.8-STATUS.txt
              git commit -m "Record 0.15.8 run ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
              git push origin HEAD:agent/msc-0.15.6-root-fix-ci
            ) && break
            git worktree remove --force "$RUNNER_TEMP/msc-0158-status" || true
            sleep $((attempt * 2))
          done
          git worktree remove --force "$RUNNER_TEMP/msc-0158-status" || true

      - name: Install deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-0158-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-0158-packaging-only' \
            -keypass 'msc-0158-packaging-only' \
            -alias 'msc-0158-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.8 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build and verify configured 0.15.8
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-0158-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-0158-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-0158-packaging-only
        run: bash .msc-build/build-0.15.8-google-age-free-invite.sh

      - name: Upload configured APKs and proof
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.8-google-age-free-invite-configured-ci
          path: release-0.15.8
          retention-days: 14
          if-no-files-found: error

      - name: Publish final result
        if: always()
        shell: bash
        env:
          STATUS_RESULT: ${{ job.status }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/msc-0158-final"
            git fetch origin agent/msc-0.15.6-root-fix-ci
            git worktree add --detach "$RUNNER_TEMP/msc-0158-final" origin/agent/msc-0.15.6-root-fix-ci
            (
              cd "$RUNNER_TEMP/msc-0158-final"
              cat > MSC-0.15.8-STATUS.txt <<EOF
          source_commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          artifact_name=msc-0.15.8-google-age-free-invite-configured-ci
          architecture=firebase_spark_free_only
          google_sign_in=preserved
          google_age_lookup=automatic_retry_plus_explicit_confirmation
          household_member_rules=live_spark_compatible
          EOF
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add MSC-0.15.8-STATUS.txt
              git commit -m "Record 0.15.8 final ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
              git push origin HEAD:agent/msc-0.15.6-root-fix-ci
            ) && break
            git worktree remove --force "$RUNNER_TEMP/msc-0158-final" || true
            sleep $((attempt * 2))
          done
          git worktree remove --force "$RUNNER_TEMP/msc-0158-final" || true
