name: My Study Companion 0.15.12 Widget Source Diagnostic

on:
  push:
    branches:
      - agent/msc-0.15.12-vote-widget-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-widget-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct current Android source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh
          bash .msc-build/apply-0.15.5-household-cancellation.sh
          bash .msc-build/apply-0.15.6-household-invitation-root-fix.sh
          bash .msc-build/apply-0.15.8-google-age-firestore-compat.sh
          bash .msc-build/apply-0.15.9-adaptive-scroll.sh
          bash .msc-build/apply-0.15.10-household-date-recovery.sh
          bash .msc-build/apply-0.15.11-local-family-generator.sh

      - name: Collect widget and family voting source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/msc-widget-source"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/widget "$OUT/widget"
          cp MyStudyCompanion/app/src/main/AndroidManifest.xml "$OUT/AndroidManifest.xml"
          cp MyStudyCompanion/app/build.gradle.kts "$OUT/app-build.gradle.kts"
          mkdir -p "$OUT/res"
          cp -a MyStudyCompanion/app/src/main/res/xml "$OUT/res/xml"
          find MyStudyCompanion/app/src/main/res -maxdepth 2 -type f \( -iname '*widget*' -o -iname '*preview*' \) -print0 | while IFS= read -r -d '' file; do
            rel="${file#MyStudyCompanion/app/src/main/res/}"
            mkdir -p "$OUT/res/$(dirname "$rel")"
            cp "$file" "$OUT/res/$rel"
          done
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/CompanionHubRepository.kt "$OUT/CompanionHubRepository.kt"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt "$OUT/FamilyWorshipOrganizerRepository.kt"
          cp MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/CompanionHubScreen.kt "$OUT/CompanionHubScreen.kt"
          find "$OUT" -type f -print | sort > "$OUT/FILES.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: msc-0.15.12-widget-source-diagnostic
          path: ${{ runner.temp }}/msc-widget-source
          retention-days: 7
          if-no-files-found: error
