name: HAVENLINE Animator Override Fix

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - .github/workflows/havenline-fix-animator-overrides.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0
      - name: Patch scene authoring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlinePremiumSceneAuthoring.cs")
          source = path.read_text(encoding="utf-8")
          needle = (
              "            animator.cullingMode = AnimatorCullingMode.CullUpdateTransforms;\n"
              "            return animator;"
          )
          replacement = (
              "            animator.cullingMode = AnimatorCullingMode.CullUpdateTransforms;\n"
              "            EditorUtility.SetDirty(animator);\n"
              "            if (PrefabUtility.IsPartOfPrefabInstance(animator))\n"
              "                PrefabUtility.RecordPrefabInstancePropertyModifications(animator);\n"
              "            return animator;"
          )
          if needle not in source:
              raise SystemExit("Animator authoring target was not found")
          path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
          PY
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HAVENLINE Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add HAVENLINE_UNITY/Assets/Havenline/Editor/HavenlinePremiumSceneAuthoring.cs
          git commit -m "Persist production animator controller overrides"
          git push origin HEAD:havenline-unity-reference-rebuild
