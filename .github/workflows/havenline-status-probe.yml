name: HAVENLINE Build Status Probe

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/PROBE_FINAL_BUILD

permissions:
  contents: write

jobs:
  inspect-animated-wolf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and pin official Quaternius animated wolf
        shell: bash
        env:
          PACK_URL: https://opengameart.org/sites/default/files/Animal%20Pack%20Vol.2%20by%20%40Quaternius.zip
        run: |
          set -euo pipefail
          archive=/tmp/quaternius-animated-animals.zip
          extract=/tmp/quaternius-animated-animals
          curl --fail --location --retry 5 --retry-delay 4 --user-agent 'HAVENLINE-asset-validator/1.0' "$PACK_URL" -o "$archive"
          test -s "$archive"
          unzip -t "$archive" >/tmp/quaternius-zip-test.txt
          unzip -Z1 "$archive" >/tmp/quaternius-files.txt
          wolf_path="$(awk 'tolower($0) ~ /wolf.*\.fbx$/ {print; exit}' /tmp/quaternius-files.txt)"
          if [[ -z "$wolf_path" ]]; then
            wolf_path="$(awk 'tolower($0) ~ /wolf.*\.(glb|gltf)$/ {print; exit}' /tmp/quaternius-files.txt)"
          fi
          test -n "$wolf_path"
          mkdir -p "$extract"
          unzip -j "$archive" "$wolf_path" -d "$extract"
          wolf_file="$extract/$(basename "$wolf_path")"
          test -s "$wolf_file"
          jq -n \
            --arg source_url "$PACK_URL" \
            --arg license "CC0 1.0" \
            --arg archive_sha256 "$(sha256sum "$archive" | awk '{print $1}')" \
            --arg archive_bytes "$(stat -c '%s' "$archive")" \
            --arg wolf_archive_path "$wolf_path" \
            --arg wolf_sha256 "$(sha256sum "$wolf_file" | awk '{print $1}')" \
            --arg wolf_git_blob "$(git hash-object "$wolf_file")" \
            --arg wolf_bytes "$(stat -c '%s' "$wolf_file")" \
            --arg inspected_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_url:$source_url, license:$license, archive_sha256:$archive_sha256, archive_bytes:($archive_bytes|tonumber), wolf_archive_path:$wolf_archive_path, wolf_sha256:$wolf_sha256, wolf_git_blob:$wolf_git_blob, wolf_bytes:($wolf_bytes|tonumber), inspected_at:$inspected_at}' \
            > HAVENLINE/animated-wolf-probe.json
          cp /tmp/quaternius-files.txt HAVENLINE/animated-wolf-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/animated-wolf-probe.json HAVENLINE/animated-wolf-files.txt
          git commit -m "Record Quaternius animated wolf hashes"
          git push
