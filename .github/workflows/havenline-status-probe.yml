name: HAVENLINE Build Status Probe

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/PROBE_FINAL_BUILD

permissions:
  contents: write

jobs:
  inspect-animated-wolf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pin Ultimate Animated Animals wolf from AnimaSim
        shell: bash
        run: |
          set -euo pipefail
          download_dir=/tmp/animasim-download
          extract=/tmp/animasim-wolf
          mkdir -p "$download_dir" "$extract"
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: animasim==0.2.1 --dest "$download_dir"
          package="$(find "$download_dir" -maxdepth 1 -type f -name 'animasim-0.2.1-*.whl' -print -quit)"
          test -n "$package"
          unzip -t "$package" >/tmp/animasim-wheel-test.txt
          unzip -Z1 "$package" >/tmp/animasim-files.txt
          wolf_path="$(awk 'tolower($0) ~ /(^|\/)wolf[^\/]*\.glb$/ {print; exit}' /tmp/animasim-files.txt)"
          if [[ -z "$wolf_path" ]]; then
            wolf_path="$(awk 'tolower($0) ~ /wolf.*\.(fbx|gltf)$/ {print; exit}' /tmp/animasim-files.txt)"
          fi
          test -n "$wolf_path"
          unzip -j "$package" "$wolf_path" -d "$extract"
          wolf_file="$extract/$(basename "$wolf_path")"
          test -s "$wolf_file"
          strings "$wolf_file" | grep -iE 'idle|walk|run|attack|bite|death|jump|gallop|trot|canter|eat|kick|anim' | sort -fu | head -n 400 > HAVENLINE/ultimate-wolf-animation-strings.txt || true
          jq -n \
            --arg package "animasim==0.2.1" \
            --arg upstream "Quaternius Ultimate Animated Animal Pack" \
            --arg license "CC0 1.0 model; MIT package code" \
            --arg wheel_name "$(basename "$package")" \
            --arg wheel_sha256 "$(sha256sum "$package" | awk '{print $1}')" \
            --arg wheel_bytes "$(stat -c '%s' "$package")" \
            --arg wolf_archive_path "$wolf_path" \
            --arg wolf_sha256 "$(sha256sum "$wolf_file" | awk '{print $1}')" \
            --arg wolf_git_blob "$(git hash-object "$wolf_file")" \
            --arg wolf_bytes "$(stat -c '%s' "$wolf_file")" \
            --arg inspected_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{package:$package, upstream:$upstream, license:$license, wheel_name:$wheel_name, wheel_sha256:$wheel_sha256, wheel_bytes:($wheel_bytes|tonumber), wolf_archive_path:$wolf_archive_path, wolf_sha256:$wolf_sha256, wolf_git_blob:$wolf_git_blob, wolf_bytes:($wolf_bytes|tonumber), inspected_at:$inspected_at}' \
            > HAVENLINE/ultimate-wolf-probe.json
          cp /tmp/animasim-files.txt HAVENLINE/ultimate-wolf-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/ultimate-wolf-probe.json HAVENLINE/ultimate-wolf-files.txt HAVENLINE/ultimate-wolf-animation-strings.txt
          git commit -m "Record Ultimate Animated Animals wolf hashes"
          git push
