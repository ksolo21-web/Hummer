name: HAVENLINE Build Status Probe

on:
  push:
    branches:
      - agent/havenline-android-build
    paths:
      - HAVENLINE/PROBE_FINAL_BUILD

permissions:
  actions: read
  contents: write

jobs:
  record-production-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Locate and record production run
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: e0b0242381440a1342313de1284fb2828678984e
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for attempt in $(seq 1 220); do
            payload="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fhavenline-android-build&event=push&per_page=50")"
            found="$(jq -c --arg sha "$PRODUCTION_SHA" '
              [.workflow_runs[]
                | select(.name == "HAVENLINE Final Android Build" and .head_sha == $sha)
                | {id, name, status, conclusion, run_number, run_attempt, event, head_sha, created_at, updated_at, html_url, jobs_url, artifacts_url}]
              | first // empty
            ' <<<"$payload")"
            if [[ -n "$found" && "$(jq -r '.status' <<<"$found")" == "completed" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$found" ]]; then
            found="$(jq -n --arg sha "$PRODUCTION_SHA" '{error:"production run not found", head_sha:$sha}')"
          fi
          printf '%s\n' "$found" | jq . > HAVENLINE/build-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAVENLINE/build-run.json
          git commit -m "Record HAVENLINE production build run" || exit 0
          git push
