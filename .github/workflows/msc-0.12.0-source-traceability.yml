name: My Study Companion 0.12.2 Complete JW Library Links Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/msc-0.12.0-source-traceability.yml'
      - '.msc-build/reconstruct-build-0120.sh'
      - '.msc-build/reconstruct-build-0121-signed-pair.sh'
      - '.msc-build/reconstruct-build-0122.sh'
      - '.msc-build/reconstruct-build-0122-signed-pair.sh'
      - '.msc-build/source-traceability-0.12.0.patch.part*'
      - '.msc-build/patch-0.12.1-hardening.py.xz.b64'
      - '.msc-build/patch-0.12.2-complete-jw-links.py.xz.b64'
      - '.msc-build/patch-0.12.2-exact-link-tests.py'
      - '.msc-build/patch-0.12.2-link-cloud-followup.py'
      - '.msc-build/patch-0.12.2-final-link-gate.py'
  workflow_dispatch:

concurrency:
  group: msc-0122-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-phone-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct signed 0.12.0 migration baseline and hardened 0.12.2 phone and Wear APKs
        shell: bash
        run: bash .msc-build/reconstruct-build-0122-signed-pair.sh

      - name: Record protected cloud-service readiness
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.MSC_GOOGLE_SERVICES_JSON_B64 }}
          MSC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.MSC_GOOGLE_WEB_CLIENT_ID }}
          MSC_BACKEND_BASE_URL: ${{ secrets.MSC_BACKEND_BASE_URL }}
        run: |
          set -euo pipefail
          : > dist/CLOUD-READINESS.txt
          missing=0
          check() {
            local name="$1" value="$2"
            if [[ -n "$value" ]]; then
              printf 'PRESENT: %s\n' "$name" | tee -a dist/CLOUD-READINESS.txt
            else
              printf 'MISSING: %s\n' "$name" | tee -a dist/CLOUD-READINESS.txt
              missing=1
            fi
          }
          check 'Firebase Android google-services configuration' "${GOOGLE_SERVICES_JSON_B64:-}"
          check 'Google OAuth web client ID' "${MSC_GOOGLE_WEB_CLIENT_ID:-}"
          check 'Deployed HTTPS My Study Companion backend base URL' "${MSC_BACKEND_BASE_URL:-}"
          if [[ "$missing" -eq 0 ]]; then
            cat >> dist/CLOUD-READINESS.txt <<'TXT'
          ELIGIBLE FOR LIVE TESTING ONLY: configuration values are present. Google sign-in, App Check, backend authentication, household invitation/join, and cross-device family synchronization still require live integration tests before release approval.
          TXT
          else
            cat >> dist/CLOUD-READINESS.txt <<'TXT'
          NOT RELEASE READY: Google sign-in and family synchronization are not enabled. Firebase configuration alone is insufficient; the OAuth web client and deployed HTTPS backend are also required. Household invitation/join is not yet implemented in the current client and remains a separate product blocker.
          TXT
          fi
          cp dist/CLOUD-READINESS.txt dist/FIREBASE-STATUS.txt

      - name: Upload 0.12.2 verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: msc-0.12.2-complete-jw-links-debug-bundle
          path: dist/
          retention-days: 5
          if-no-files-found: error
