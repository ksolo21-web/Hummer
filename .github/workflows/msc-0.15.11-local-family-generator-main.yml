name: My Study Companion 0.15.11 Local Family Generator Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/msc-0.15.11-local-family-generator-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msc-01511-local-family-generator-main
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out isolated local-generator source
        uses: actions/checkout@v6
        with:
          ref: agent/msc-0.15.11-local-family-generator
          fetch-depth: 0
      - name: Check out workbook payload
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish isolated run ID
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          STATUS_TREE="$RUNNER_TEMP/msc-01511-status"
          rm -rf "$STATUS_TREE"
          git fetch origin agent/msc-0.15.11-local-family-generator
          git worktree add --detach "$STATUS_TREE" origin/agent/msc-0.15.11-local-family-generator
          cd "$STATUS_TREE"
          cat > MSC-0.15.11-LOCAL-FAMILY-STATUS.txt <<EOF
          source_commit=${SOURCE_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=in_progress
          artifact_name=msc-0.15.11-local-family-generator-configured-ci
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MSC-0.15.11-LOCAL-FAMILY-STATUS.txt
          git commit -m "Record isolated 0.15.11 local generator run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:agent/msc-0.15.11-local-family-generator
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$STATUS_TREE"

      - name: Install deterministic toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create disposable CI packaging signer
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/msc-01511-packaging"
          mkdir -p "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/packaging.jks" \
            -storepass 'msc-01511-packaging-only' \
            -keypass 'msc-01511-packaging-only' \
            -alias 'msc-01511-packaging' \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=My Study Companion 0.15.11 CI Packaging, OU=Not Firebase Registered, O=My Study Companion, C=US'
          echo "store_file=$SIGNING_DIR/packaging.jks" >> "$GITHUB_OUTPUT"

      - name: Build and verify local generator 0.15.11
        shell: bash
        env:
          MSC_RELEASE_STORE_FILE: ${{ steps.signer.outputs.store_file }}
          MSC_RELEASE_STORE_PASSWORD: msc-01511-packaging-only
          MSC_RELEASE_KEY_ALIAS: msc-01511-packaging
          MSC_RELEASE_KEY_PASSWORD: msc-01511-packaging-only
        run: |
          set -euo pipefail
          bash .msc-build/prepare-0.15.8-google-credential-compat.sh
          bash .msc-build/prepare-0.15.8.2-persisted-age-migration.sh
          bash .msc-build/build-0.15.11-local-family-generator.sh

      - name: Upload local-generator APKs and proof
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.11-local-family-generator-configured-ci
          path: release-0.15.11
          retention-days: 14
          if-no-files-found: error

      - name: Publish isolated final result
        if: always()
        shell: bash
        env:
          STATUS_RESULT: ${{ job.status }}
        run: |
          set -u
          SOURCE_SHA="$(git rev-parse HEAD)"
          STATUS_TREE="$RUNNER_TEMP/msc-01511-final"
          rm -rf "$STATUS_TREE"
          git fetch origin agent/msc-0.15.11-local-family-generator
          git worktree add --detach "$STATUS_TREE" origin/agent/msc-0.15.11-local-family-generator
          cd "$STATUS_TREE"
          cat > MSC-0.15.11-LOCAL-FAMILY-STATUS.txt <<EOF
          source_commit=${SOURCE_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=${STATUS_RESULT}
          artifact_name=msc-0.15.11-local-family-generator-configured-ci
          package=com.mystudycompanion.app
          phone_version_code=44
          wear_version_code=360161001
          on_device_family_generator=enabled
          backend_required_for_family_generation=false
          direct_nwt_links=enabled
          household_firestore_publish=enabled
          household_pairing_recovery=preserved
          stable_date_picker=preserved
          adaptive_scroll=preserved
          google_sign_in=preserved
          architecture=firebase_spark_free_only
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MSC-0.15.11-LOCAL-FAMILY-STATUS.txt
          git commit -m "Record isolated 0.15.11 local generator ${GITHUB_RUN_ID} ${STATUS_RESULT}" || true
          git push origin HEAD:agent/msc-0.15.11-local-family-generator
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$STATUS_TREE"

# Retry after repairing the nested generated build driver.
