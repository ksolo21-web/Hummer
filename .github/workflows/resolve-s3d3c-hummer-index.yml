name: Resolve Hummer in S3D3C Index

on:
  push:
    paths:
      - '.tooling/s3d3c-index-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and inspect S3D3C indexes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip p7zip-full
          python -m pip install --upgrade pip
          python -m pip install requests
          mkdir -p s3d3c_index/metadata
          curl --fail --location --retry 5 --output s3d3c_index/metadata.zip 'https://osf.io/download/7xu45/'
          curl --fail --location --retry 5 --output s3d3c_index/model-paths.txt 'https://osf.io/download/egc96/'
          unzip -q s3d3c_index/metadata.zip -d s3d3c_index/metadata || 7z x -os3d3c_index/metadata s3d3c_index/metadata.zip
          find s3d3c_index/metadata -maxdepth 3 -type f -printf '%p %s bytes\n' | head -100

          python - <<'PY'
          import json, pathlib, re, zipfile, requests, hashlib, urllib.parse, traceback
          root=pathlib.Path('s3d3c_index')
          uids=['b686365d37a94cbdbb3a01d169f5a0de','7cd584fc9ba54acd9002d4286a08e419']
          terms=re.compile(r'(gmc\s+hummer|hummer\s+ev|\bhummer\b)',re.I)
          report={'uids':uids,'uid_hits':[],'hummer_hits':[],'path_hits':[],'downloads':[],'errors':[]}

          def inspect_file(p):
              try:data=p.read_bytes()
              except Exception as exc:
                  report['errors'].append({'file':str(p),'error':repr(exc)});return
              low=data.lower()
              for uid in uids:
                  pos=low.find(uid.encode())
                  if pos>=0:
                      excerpt=data[max(0,pos-1000):pos+3000].decode('utf-8','ignore')
                      report['uid_hits'].append({'uid':uid,'file':str(p),'excerpt':excerpt})
              text=data.decode('utf-8','ignore')
              for m in terms.finditer(text):
                  excerpt=text[max(0,m.start()-500):m.start()+2000]
                  report['hummer_hits'].append({'file':str(p),'excerpt':excerpt})
                  if len(report['hummer_hits'])>=200:return

          for p in root.joinpath('metadata').rglob('*'):
              if p.is_file():inspect_file(p)
          inspect_file(root/'model-paths.txt')

          # Search each line of path index for exact UID or Hummer.
          path_text=(root/'model-paths.txt').read_text(errors='ignore')
          for line in path_text.splitlines():
              low=line.lower()
              if any(uid in low for uid in uids) or 'hummer' in low:
                  report['path_hits'].append(line)

          # Extract candidate URLs and local archive paths from exact UID metadata/path hits.
          candidates=[]
          blobs='\n'.join([x['excerpt'] for x in report['uid_hits']]+report['path_hits'])
          for url in re.findall(r'https?://[^\s"\'<>]+',blobs):
              candidates.append(url.rstrip('),]}'))
          for line in report['path_hits']:
              for token in re.split(r'[\t,; ]+',line.strip()):
                  if token.lower().endswith(('.glb','.gltf','.zip','.tar','.tar.gz','.7z')):
                      candidates.append(token)
          report['candidate_locations']=list(dict.fromkeys(candidates))

          s=requests.Session();s.headers.update({'User-Agent':'HummerDesignResearch/1.0'})
          outdir=root/'downloads';outdir.mkdir(exist_ok=True)
          for n,c in enumerate(report['candidate_locations'][:50]):
              if not c.startswith('http'):continue
              try:
                  r=s.get(c,stream=True,timeout=1200,allow_redirects=True);r.raise_for_status()
                  name=pathlib.Path(urllib.parse.urlparse(r.url).path).name or f'candidate-{n}.bin'
                  out=outdir/(f'{n:02d}-'+name)
                  with out.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                          if chunk:f.write(chunk)
                  report['downloads'].append({'source':c,'final_url':r.url,'file':out.name,'size':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest()})
              except Exception as exc:report['errors'].append({'candidate':c,'error':repr(exc)})

          (root/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps({'uid_hit_count':len(report['uid_hits']),'hummer_hit_count':len(report['hummer_hits']),'path_hits':report['path_hits'][:50],'candidate_locations':report['candidate_locations'],'downloads':report['downloads'],'error_count':len(report['errors'])},indent=2))
          PY

          rm -f s3d3c_index/metadata.zip
          tar --format=posix -C s3d3c_index -cf hummer-s3d3c-index-results.tar .
          ls -lh hummer-s3d3c-index-results.tar s3d3c_index/report.json

      - name: Upload index results
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: hummer-s3d3c-index-results
          path: hummer-s3d3c-index-results.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Record index result
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          cp s3d3c_index/report.json .tooling/s3d3c-index-report.json || echo '{"error":"report missing"}' > .tooling/s3d3c-index-report.json
          jq -n --arg artifact_id "$ARTIFACT_ID" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{status:"complete",artifact_id:(if ($artifact_id|length)>0 then ($artifact_id|tonumber) else null end),run_id:$run_id,run_url:$run_url}' > .tooling/s3d3c-index-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/s3d3c-index-status.json .tooling/s3d3c-index-report.json
          git commit -m 'Record S3D3C Hummer index resolution' || exit 0
          git push
