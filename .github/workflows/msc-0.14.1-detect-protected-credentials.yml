name: Detect My Study Companion Protected Credentials

on:
  push:
    branches:
      - agent/my-study-companion-0141-production-deploy
    paths:
      - .msc-build/detect-protected-credentials.trigger

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: my-study-companion-private
    env:
      FIREBASE_SERVICE_ACCOUNT_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_STUDY_COMPANION_ABC01 }}
      FIREBASE_SERVICE_ACCOUNT_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_CI_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MSC_OPENAI_API_KEY: ${{ secrets.MSC_OPENAI_API_KEY }}
      MSC_ADMIN_TOKEN: ${{ secrets.MSC_ADMIN_TOKEN }}
      MSC_CONTENT_SIGNING_KEY: ${{ secrets.MSC_CONTENT_SIGNING_KEY }}
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Record presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .msc-build
          : > .msc-build/protected-credential-presence.txt
          for name in \
            FIREBASE_SERVICE_ACCOUNT_PROJECT \
            FIREBASE_SERVICE_ACCOUNT_GENERIC \
            GCP_SERVICE_ACCOUNT_KEY \
            GCP_SA_KEY \
            GOOGLE_CREDENTIALS \
            GOOGLE_CREDENTIALS_JSON \
            FIREBASE_TOKEN \
            FIREBASE_CI_TOKEN \
            OPENAI_API_KEY \
            MSC_OPENAI_API_KEY \
            MSC_ADMIN_TOKEN \
            MSC_CONTENT_SIGNING_KEY; do
            if [[ -n "${!name:-}" ]]; then
              printf '%s=present\n' "$name" >> .msc-build/protected-credential-presence.txt
            else
              printf '%s=absent\n' "$name" >> .msc-build/protected-credential-presence.txt
            fi
          done
          printf 'checked_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .msc-build/protected-credential-presence.txt

      - name: Commit presence report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'My Study Companion Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .msc-build/protected-credential-presence.txt
          git commit -m 'Record protected credential presence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
