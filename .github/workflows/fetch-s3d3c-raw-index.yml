name: Fetch Raw S3D3C Index Files

on:
  push:
    paths:
      - '.tooling/s3d3c-raw-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download public raw indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 5 --output raw/metadata.zip 'https://osf.io/download/7xu45/'
          curl --fail --location --retry 5 --output raw/model-paths.txt 'https://osf.io/download/egc96/'
          sha256sum raw/* > raw/SHA256SUMS.txt
          tar --format=posix -C raw -cf s3d3c-raw-index.tar .
          ls -lh raw s3d3c-raw-index.tar
      - name: Upload raw indexes
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: s3d3c-raw-index
          path: s3d3c-raw-index.tar
          compression-level: 0
          retention-days: 7
      - name: Record result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          jq -n --arg artifact_id "$ARTIFACT_ID" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{status:"complete",artifact_id:($artifact_id|tonumber),run_id:$run_id,run_url:$run_url}' > .tooling/s3d3c-raw-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/s3d3c-raw-status.json
          git commit -m 'Record raw S3D3C index artifact' || exit 0
          git push
