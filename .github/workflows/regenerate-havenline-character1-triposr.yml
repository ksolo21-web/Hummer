name: Regenerate HAVENLINE Character 1 with TripoSR

on:
  workflow_dispatch:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/regenerate-havenline-character1-triposr.yml'
      - '.tooling/havenline-character-production/prepare_triposr_character_input.py'
      - '.tooling/havenline-character-reference-payload/**'

permissions:
  contents: read

concurrency:
  group: havenline-character1-triposr-replacement
  cancel-in-progress: true

jobs:
  regenerate-character1:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Materialize checksum-pinned approved references
        run: python3 .tooling/havenline-character-reference-payload/materialize_references.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TripoSR CPU runtime
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.2.2 torchvision==0.17.2
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git triposr
          cd triposr
          python -m pip install \
            'numpy<2' omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 \
            transformers==4.35.0 trimesh==4.0.5 rembg==2.0.57 \
            huggingface-hub imageio imageio-ffmpeg xatlas==0.0.9 \
            moderngl==5.10.0 onnxruntime pygltflib
          python -m pip install git+https://github.com/tatsy/torchmcubes.git

      - name: Prepare clean Character 1 front input
        shell: bash
        run: |
          set -euo pipefail
          out=character_output/Character1
          mkdir -p "$out" triposr_output/Character1
          python .tooling/havenline-character-production/prepare_triposr_character_input.py \
            --character Character1 \
            --sheet .tooling/havenline-character-production/references/Character1.jpg \
            --output "$out/triposr_input.jpg"
          test -s "$out/triposr_input.jpg"

      - name: Reconstruct replacement mesh
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          cd triposr
          python run.py ../character_output/Character1/triposr_input.jpg \
            --device cpu \
            --chunk-size 4096 \
            --mc-resolution 192 \
            --foreground-ratio 0.88 \
            --model-save-format glb \
            --bake-texture \
            --texture-resolution 1024 \
            --output-dir ../triposr_output/Character1
          cd ..
          candidate="$(find triposr_output/Character1 -type f -name '*.glb' -size +10000c -print -quit)"
          test -n "$candidate"
          cp "$candidate" character_output/Character1/Character1_raw.glb
          cp -a triposr_output/Character1/. character_output/Character1/triposr_source/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from pygltflib import GLTF2
          root = Path('character_output/Character1')
          raw = root / 'Character1_raw.glb'
          gltf = GLTF2().load_binary(str(raw))
          report = {
              'schemaVersion': 1,
              'character': 'Character1',
              'generator': 'VAST-AI-Research/TripoSR local CPU reconstruction',
              'generatorLicense': 'MIT',
              'sourceMode': 'local-triposr-replacement',
              'replacesRejectedSourceMode': 'recovered-trellis',
              'success': True,
              'selectedBytes': raw.stat().st_size,
              'selectedSha256': hashlib.sha256(raw.read_bytes()).hexdigest(),
              'materials': len(gltf.materials or []),
              'textures': len(gltf.textures or []),
              'images': len(gltf.images or []),
              'humanVisualApprovalRequired': True,
          }
          (root / 'generation-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload replacement source candidate
        uses: actions/upload-artifact@v4
        with:
          name: havenline-character1-triposr-replacement-${{ github.run_id }}
          path: character_output/Character1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
