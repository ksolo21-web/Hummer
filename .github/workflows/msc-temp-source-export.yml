name: My Study Companion Temporary Source Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==12.2.0 numpy==2.4.2 scikit-image==0.26.0
      - name: Reconstruct exact complete 0.15.5 source
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          bash .msc-build/apply-0.15.2-daily-profile-ministry.sh
          bash .msc-build/apply-0.15.3-professional-workbook-assets.sh
          bash .msc-build/apply-0.15.4-web-household-parity.sh
          bash .msc-build/apply-0.15.5-household-cancellation.sh
          grep -Fq 'return@runFamilyCatching' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt
          ! grep -Fq 'return@runCatching' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/family/FamilyWorshipOrganizerRepository.kt
          tar -czf msc-current-reconstructed-source.tar.gz MyStudyCompanion MyStudyCompanionWeb
          sha256sum msc-current-reconstructed-source.tar.gz > msc-current-reconstructed-source.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: msc-current-reconstructed-source-${{ github.sha }}
          path: |
            msc-current-reconstructed-source.tar.gz
            msc-current-reconstructed-source.sha256
          retention-days: 1
          if-no-files-found: error
