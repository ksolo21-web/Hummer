name: My Study Companion Temporary Source Export

on:
  pull_request:
    branches:
      - agent/my-study-companion-0141-auth-theme-repair

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out checksum-locked workbook baseline
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-0140-overlay-payload
          path: workbook-payload
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic image dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.2.0

      - name: Reconstruct exact complete source
        shell: bash
        run: |
          set -euo pipefail
          bash .msc-build/reconstruct-current-source-0.14.1.sh
          bash .msc-build/apply-0.15.1-workbook-flip-profile.sh
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/InteractiveWorkbookEditor.kt
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/companion/InteractiveWorkbookModels.kt
          test -f MyStudyCompanionWeb/workbook.js
          tar -czf msc-0.15.1-reconstructed-source.tar.gz MyStudyCompanion MyStudyCompanionWeb
          sha256sum msc-0.15.1-reconstructed-source.tar.gz > msc-0.15.1-reconstructed-source.sha256

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v6
        with:
          name: msc-0.15.1-reconstructed-source-${{ github.event.pull_request.head.sha }}
          path: |
            msc-0.15.1-reconstructed-source.tar.gz
            msc-0.15.1-reconstructed-source.sha256
          retention-days: 1
          if-no-files-found: error
