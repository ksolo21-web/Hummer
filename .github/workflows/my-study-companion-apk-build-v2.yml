name: My Study Companion APK Build v2

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build phone and Wear OS APKs with diagnostics
        id: build
        shell: bash
        run: |
          set -uo pipefail
          RESULT_DIR="$GITHUB_WORKSPACE/.msc-build/results"
          LOG_FILE="$RUNNER_TEMP/my-study-companion-build.log"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$RESULT_DIR" "$DIST_DIR"
          : > "$LOG_FILE"

          run_build() {
            set -euo pipefail
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
              echo "Android SDK root is unavailable." >&2
              return 20
            fi
            echo "Android SDK root: $SDK_ROOT"

            if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
              SDKMANAGER=""
              for candidate in \
                "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
                "$SDK_ROOT/tools/bin/sdkmanager"; do
                if [[ -x "$candidate" ]]; then
                  SDKMANAGER="$candidate"
                  break
                fi
              done
              if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
                SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
              fi
              if [[ -z "$SDKMANAGER" ]]; then
                echo "sdkmanager could not be located under $SDK_ROOT." >&2
                find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f -print || true
                return 21
              fi
              echo "Using sdkmanager: $SDKMANAGER"
              yes | "$SDKMANAGER" --licenses >/dev/null || true
              "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            else
              echo "Android API 36 and Build Tools 36.0.0 are already installed."
            fi

            test -f "$SDK_ROOT/platforms/android-36/android.jar"
            test -d "$SDK_ROOT/build-tools/36.0.0"

            cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.0.tar.xz
            echo "5186002f8c687b561975e4a17c9697334b0587081fac40dcef837ad72cbeec10  MyStudyCompanion_0.9.0.tar.xz" | sha256sum -c -
            tar -xJf MyStudyCompanion_0.9.0.tar.xz
            test -f MyStudyCompanion/settings.gradle.kts
            test -f MyStudyCompanion/app/build.gradle.kts
            test -f MyStudyCompanion/wear/build.gradle.kts

            cd MyStudyCompanion
            gradle --no-daemon --stacktrace \
              -PMSC_LOCAL_OWNER_MODE=true \
              :app:assembleDebug \
              :wear:assembleDebug
            cd "$GITHUB_WORKSPACE"

            PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
            WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
            test -n "$PHONE_APK"
            test -n "$WEAR_APK"
            cp "$PHONE_APK" "$DIST_DIR/MyStudyCompanion-phone-debug.apk"
            cp "$WEAR_APK" "$DIST_DIR/MyStudyCompanion-wear-debug.apk"
            (cd "$DIST_DIR" && sha256sum *.apk > SHA256SUMS.txt)
          }

          set +e
          run_build > >(tee "$LOG_FILE") 2>&1
          EXIT_CODE=$?
          set -e

          if [[ $EXIT_CODE -eq 0 ]]; then
            BUILD_STATUS="success"
          else
            BUILD_STATUS="failure"
          fi

          python3 - "$RESULT_DIR/latest-status.json" "$BUILD_STATUS" "$EXIT_CODE" <<'PY'
          import json, os, sys
          path, status, exit_code = sys.argv[1:]
          payload = {
              "status": status,
              "exit_code": int(exit_code),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "artifact_name": "MyStudyCompanion-debug-apks" if status == "success" else None,
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

          tail -n 4000 "$LOG_FILE" > "$RESULT_DIR/latest-build.log"
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          cat "$RESULT_DIR/latest-status.json"
          exit 0

      - name: Upload phone and Wear OS APKs
        if: steps.build.outputs.build_status == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: dist/

      - name: Publish build diagnostics to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .msc-build/results/latest-status.json .msc-build/results/latest-build.log
          if git diff --cached --quiet; then
            echo "No diagnostic changes to publish."
          else
            git commit -m "Record My Study Companion APK build result [skip ci]"
            git push origin HEAD:agent/my-study-companion-apk-build
          fi

      - name: Fail workflow when APK build failed
        if: steps.build.outputs.build_status != 'success'
        shell: bash
        run: |
          echo "APK build failed with exit code ${{ steps.build.outputs.exit_code }}." >&2
          exit 1
