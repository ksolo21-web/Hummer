name: My Study Companion Scene Themes APK Build

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Reconstruct verified 0.9.2 source and apply 0.9.3 scene overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.2.tar.xz
          echo "f2c0bfb74455046a28d7aa54a4e27df021955ea703ae93a639bbe3bcb67ed2c4  MyStudyCompanion_0.9.2.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.2.tar.xz
          cat .msc-build/scene-0.9.3.part*.b64 | base64 --decode > MyStudyCompanion_0.9.3_scene_overlay.tar.xz
          echo "735f1fe0b63fefb5b189adb68cc1ab4a6a6d7ce189e1e2203d4287fecda8d907  MyStudyCompanion_0.9.3_scene_overlay.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.3_scene_overlay.tar.xz
          test -f MyStudyCompanion/settings.gradle.kts
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design/ThemeArtwork.kt
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design/ThemeBackdrop.kt
          test -f MyStudyCompanion/app/src/main/res/drawable-nodpi/theme_scene_tiger.webp
          test -f MyStudyCompanion/wear/src/main/res/drawable-nodpi/theme_scene_owl.webp
          grep -q 'versionName = "0.9.3-private-alpha-scene-themes"' MyStudyCompanion/app/build.gradle.kts

      - name: Apply Android source compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .msc-build/patch_source.py
          ! grep -R 'jvmTarget = "17"' MyStudyCompanion --include='*.gradle.kts'
          ! grep -R 'androidx.compose.ui.geometry.Path' MyStudyCompanion --include='*.kt'
          ! grep -R 'import androidx.compose.foundation.layout.weight' MyStudyCompanion --include='*.kt'
          ! grep -R 'import androidx.glance.material3.GlanceTheme' MyStudyCompanion --include='*.kt'
          ! grep -R '::Color' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/SettingsScreen.kt

      - name: Install stable private-alpha debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .msc-build/private-alpha-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | tee private-alpha-key-report.txt
          grep -q 'SHA256: 28:0F:9C:9A:D4:BE:BA:33:72:1A:BD:09:A5:B8:04:60:7A:AE:7C:9D:07:91:8D:67:44:6A:F7:AD:55:6D:EC:44' private-alpha-key-report.txt
          {
            echo "MSC_RELEASE_STORE_FILE=$HOME/.android/debug.keystore"
            echo "MSC_RELEASE_STORE_PASSWORD=android"
            echo "MSC_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "MSC_RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build phone and Wear OS scene-theme APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Collect, verify, and identify APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -f "$PHONE_APK"
          test -f "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-scene-themes-0.9.3.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-scene-themes-0.9.3.apk
          unzip -tq dist/MyStudyCompanion-phone-scene-themes-0.9.3.apk
          unzip -tq dist/MyStudyCompanion-wear-scene-themes-0.9.3.apk
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-phone-scene-themes-0.9.3.apk | tee dist/PHONE-SIGNING.txt
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-wear-scene-themes-0.9.3.apk | tee dist/WEAR-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/PHONE-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/WEAR-SIGNING.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload scene-theme APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-scene-themes-0.9.3-apks
          if-no-files-found: error
          retention-days: 30
          path: dist/
