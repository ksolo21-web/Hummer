name: My Study Companion Unified App APK Build

on:
  push:
    branches: [agent/my-study-companion-apk-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Reconstruct unified 0.10.0 local AI source
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > base.tar.xz
          echo "f2c0bfb74455046a28d7aa54a4e27df021955ea703ae93a639bbe3bcb67ed2c4  base.tar.xz" | sha256sum -c -
          tar -xJf base.tar.xz
          cat .msc-build/scene-0.9.3.part*.b64 | base64 --decode > scene.tar.xz
          echo "48b6aa28b630bdbf0ade5fcfadd77af7b4a259807df0b73c4318f17fede4eec4  scene.tar.xz" | sha256sum -c -
          tar -xJf scene.tar.xz
          cat .msc-build/semantic-0.9.4.part*.b64 | base64 --decode > semantic.tar.xz
          echo "f693bcb607ad00a30c4338e8819250ed5f1d44f372e40093682a13c4beed6277  semantic.tar.xz" | sha256sum -c -
          tar -xJf semantic.tar.xz
          cat .msc-build/watchtower-0.9.5.part*.b64 | base64 --decode > watchtower.tar.xz
          echo "a742f0c76ba81b87fff0fe97e93e3c03e3968f2dc6ef6ef5ed24dd039bcf5d6e  watchtower.tar.xz" | sha256sum -c -
          tar -xJf watchtower.tar.xz
          cat .msc-build/verified-preparation-0.9.6.part*.b64 | base64 --decode > preparation.tar.xz
          echo "f320e0d36adcd21b2c8c1b1583620a37c38d3415f981cc34b35c77eafcd27278  preparation.tar.xz" | sha256sum -c -
          tar -xJf preparation.tar.xz
          cat .msc-build/ai-0.10.0.part*.b64 | base64 --decode > ai.tar.xz
          echo "7e7dde1ad7e8a26fdc797b7df154a416ebdc12c588915e79f00d497a45b70461  ai.tar.xz" | sha256sum -c -
          tar -xJf ai.tar.xz
          base64 --decode .msc-build/ai-0.10.0-fix1.b64 > ai-fix1.tar.xz
          echo "817fa3144c355b2691c6af8d4b17e70de14ddb2010ec1990399416e02beeba2d  ai-fix1.tar.xz" | sha256sum -c -
          tar -xJf ai-fix1.tar.xz
          grep -q 'versionName = "0.10.0-private-alpha-local-ai"' MyStudyCompanion/app/build.gradle.kts
          grep -q 'versionCode = 20' MyStudyCompanion/app/build.gradle.kts
          grep -q 'versionName = "0.10.0-wear-private-alpha-local-ai"' MyStudyCompanion/wear/build.gradle.kts
          grep -q 'versionCode = 360100001' MyStudyCompanion/wear/build.gradle.kts
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/runtime/AiProviderRouter.kt
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/knowledge/OfficialKnowledgeSyncEngine.kt
          test -f MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/preparation/PreparationReviewEngine.kt
          grep -q 'response.candidates.first().text' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/runtime/GeminiNanoStudyProvider.kt

      - name: Apply Android source and runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .msc-build/patch_source.py
          base64 --decode .msc-build/apply-ai-ui-fix2.py.xz.b64 > /tmp/apply-ai-ui-fix2.py.xz
          echo "b5c4301ae9ca0b8424fb17ad638bf4185aa80a13a90ccfbbebecf3d1cde29a9e  /tmp/apply-ai-ui-fix2.py.xz" | sha256sum -c -
          xz -d -c /tmp/apply-ai-ui-fix2.py.xz > /tmp/apply-ai-ui-fix2.py
          python3 /tmp/apply-ai-ui-fix2.py
          python3 MyStudyCompanion/tools/validate_source.py
          grep -q 'Active: Live guided' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ai/AiStudyRepository.kt
          grep -q 'Automatic JW content refresh' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/ui/SettingsScreen.kt
          grep -q 'fun themeBackdropContentColor' MyStudyCompanion/app/src/main/java/com/mystudycompanion/app/design/StudyTheme.kt

      - name: Verify backend contracts
        working-directory: MyStudyCompanion/backend
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest -q

      - name: Install stable private-alpha signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .msc-build/private-alpha-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          {
            echo "MSC_RELEASE_STORE_FILE=$HOME/.android/debug.keystore"
            echo "MSC_RELEASE_STORE_PASSWORD=android"
            echo "MSC_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "MSC_RELEASE_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build and test phone and Wear OS APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -PMSC_LOCAL_OWNER_MODE=true \
            :app:testDebugUnitTest :wear:testDebugUnitTest \
            :app:assemblePrivateAlpha :wear:assemblePrivateAlpha

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/privateAlpha -name '*.apk' -type f | head -n 1)"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-unified-0.10.0.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-unified-0.10.0.apk
          unzip -tq dist/MyStudyCompanion-phone-unified-0.10.0.apk
          unzip -tq dist/MyStudyCompanion-wear-unified-0.10.0.apk
          "$AAPT" dump badging dist/MyStudyCompanion-phone-unified-0.10.0.apk | tee dist/PHONE-IDENTITY.txt
          "$AAPT" dump badging dist/MyStudyCompanion-wear-unified-0.10.0.apk | tee dist/WEAR-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='20'" dist/PHONE-IDENTITY.txt
          grep -q "package: name='com.mystudycompanion.app' versionCode='360100001'" dist/WEAR-IDENTITY.txt
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-phone-unified-0.10.0.apk | tee dist/PHONE-SIGNING.txt
          "$APKSIGNER" verify --verbose --print-certs dist/MyStudyCompanion-wear-unified-0.10.0.apk | tee dist/WEAR-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/PHONE-SIGNING.txt
          grep -qi '280f9c9ad4beba33721abd09a5b804607aae7c9d07918d67446af7ad556dec44' dist/WEAR-SIGNING.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload unified 0.10.0 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-unified-0.10.0-ai-ui-fix2-apks
          if-no-files-found: error
          retention-days: 7
          path: dist/
