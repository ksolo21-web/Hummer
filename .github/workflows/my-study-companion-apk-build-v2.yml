name: My Study Companion APK Build v3

on:
  push:
    branches:
      - agent/my-study-companion-apk-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v6
        with:
          ref: agent/my-study-companion-apk-build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          if [[ ! -f "$SDK_ROOT/platforms/android-36/android.jar" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .msc-build/source.part*.b64 | base64 --decode > MyStudyCompanion_0.9.0.tar.xz
          echo "5186002f8c687b561975e4a17c9697334b0587081fac40dcef837ad72cbeec10  MyStudyCompanion_0.9.0.tar.xz" | sha256sum -c -
          tar -xJf MyStudyCompanion_0.9.0.tar.xz
          test -f MyStudyCompanion/settings.gradle.kts

      - name: Migrate Kotlin compiler options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("MyStudyCompanion/app/build.gradle.kts"),
              Path("MyStudyCompanion/wear/build.gradle.kts"),
              Path("MyStudyCompanion/benchmark/build.gradle.kts"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
                  text = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n" + text
              text = text.replace(
                  '    kotlinOptions {\n        jvmTarget = "17"\n    }\n',
                  "",
              )
              text = text.replace('    kotlinOptions { jvmTarget = "17" }\n', "")
              anchor = "\ndependencies {"
              if "\nkotlin {\n    compilerOptions" not in text:
                  block = (
                      "\nkotlin {\n"
                      "    compilerOptions {\n"
                      "        jvmTarget.set(JvmTarget.JVM_17)\n"
                      "    }\n"
                      "}\n"
                  )
                  if anchor in text:
                      text = text.replace(anchor, block + anchor, 1)
                  elif "\nksp {" in text:
                      text = text.replace("\nksp {", block + "\nksp {", 1)
                  else:
                      raise RuntimeError(f"No insertion anchor in {path}")
              path.write_text(text, encoding="utf-8")
          PY
          ! grep -R 'jvmTarget = "17"' MyStudyCompanion --include='*.gradle.kts'

      - name: Build phone and Wear OS debug APKs
        working-directory: MyStudyCompanion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PMSC_LOCAL_OWNER_MODE=true \
            :app:assembleDebug \
            :wear:assembleDebug

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          PHONE_APK="$(find MyStudyCompanion/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          WEAR_APK="$(find MyStudyCompanion/wear/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -f "$PHONE_APK"
          test -f "$WEAR_APK"
          cp "$PHONE_APK" dist/MyStudyCompanion-phone-debug.apk
          cp "$WEAR_APK" dist/MyStudyCompanion-wear-debug.apk
          unzip -tq dist/MyStudyCompanion-phone-debug.apk
          unzip -tq dist/MyStudyCompanion-wear-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyStudyCompanion-debug-apks-v3
          if-no-files-found: error
          retention-days: 14
          path: dist/
