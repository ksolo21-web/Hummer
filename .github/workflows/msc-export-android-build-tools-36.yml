name: My Study Companion Export Android Build Tools 36

on:
  push:
    branches:
      - agent/msc-0.15.6-root-fix-ci
    paths:
      - .github/workflows/msc-export-android-build-tools-36.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and collect Android Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"
          rm -rf msc-android-build-tools-36
          cp -a "$SDK_ROOT/build-tools/36.0.0" msc-android-build-tools-36
      - uses: actions/upload-artifact@v6
        with:
          name: msc-android-build-tools-36-linux
          path: msc-android-build-tools-36
          retention-days: 7
          if-no-files-found: error
      - name: Publish run ID
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/msc-tools-status"
            git fetch origin agent/msc-0.15.6-root-fix-ci
            git worktree add --detach "$RUNNER_TEMP/msc-tools-status" origin/agent/msc-0.15.6-root-fix-ci
            (
              cd "$RUNNER_TEMP/msc-tools-status"
              cat > MSC-ANDROID-BUILD-TOOLS-36-STATUS.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_result=success
          artifact_name=msc-android-build-tools-36-linux
          EOF
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add MSC-ANDROID-BUILD-TOOLS-36-STATUS.txt
              git commit -m "Record Android Build Tools export ${GITHUB_RUN_ID}" || true
              git push origin HEAD:agent/msc-0.15.6-root-fix-ci
            ) && exit 0
            git worktree remove --force "$RUNNER_TEMP/msc-tools-status" || true
            sleep $((attempt * 2))
          done
          exit 1
