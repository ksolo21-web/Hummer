name: WITHDRAWN - My Study Companion 0.15.17 Signing Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  withdrawn:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete signing probe
        shell: bash
        run: |
          cat >&2 <<'EOF'
          PROBE REFUSED: the 0.15.17 GitHub signing path is obsolete.
          The permanent Firebase-registered key was recovered and is intentionally kept outside GitHub Actions.
          Use the fail-closed offline 0.15.18 canonical finalizer. Never upload or replace the canonical signer in CI merely to satisfy this withdrawn workflow.
          EOF
          exit 1
