name: Patch HAVENLINE Rig Refinement

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/patch-havenline-rig-refinement.yml'

permissions:
  contents: write

jobs:
  patch-rig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
          fetch-depth: 0
      - name: Replace portrait patches with modeled lead details
        shell: python
        run: |
          from pathlib import Path

          path = Path('.tooling/havenline-character-production/reference_face_refinement.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = 'from mathutils import Vector\n'
          import_replacement = (
              'from mathutils import Vector\n\n'
              'import modeled_face_details\n'
          )
          if 'import modeled_face_details' not in source:
              if import_anchor not in source:
                  raise SystemExit('Vector import anchor was not found')
              source = source.replace(import_anchor, import_replacement, 1)

          function_anchor = 'def create_reference_face_surface(character, root, meshes, bounds):\n'
          function_replacement = (
              'def create_reference_face_surface(character, root, meshes, bounds):\n'
              '    if character in ("Character1", "Character2"):\n'
              '        return modeled_face_details.create_modeled_face_details(\n'
              '            character,\n'
              '            meshes,\n'
              '            bounds,\n'
              '        )\n\n'
          )
          if 'return modeled_face_details.create_modeled_face_details' not in source:
              if function_anchor not in source:
                  raise SystemExit('Face refinement function anchor was not found')
              source = source.replace(function_anchor, function_replacement, 1)

          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8')
      - name: Commit modeled lead refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/havenline-character-production/reference_face_refinement.py
          git diff --cached --check
          git commit -m 'Use modeled 3D face details for Havenline leads'
          git fetch origin havenline-unity-reference-rebuild
          git rebase origin/havenline-unity-reference-rebuild
          git push origin HEAD:havenline-unity-reference-rebuild
