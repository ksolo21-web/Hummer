name: Patch HAVENLINE Rig Refinement

on:
  push:
    branches:
      - havenline-unity-reference-rebuild
    paths:
      - '.github/workflows/patch-havenline-rig-refinement.yml'

permissions:
  contents: write

jobs:
  patch-rig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: havenline-unity-reference-rebuild
      - name: Delegate cleanup and face fidelity to refinement module
        shell: python
        run: |
          from pathlib import Path

          path = Path('.tooling/havenline-character-production/rig_animate_character.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = 'import bpy\nfrom mathutils import Vector\n'
          import_replacement = (
              'import bpy\n'
              'from mathutils import Vector\n\n'
              'SCRIPT_DIR = pathlib.Path(__file__).resolve().parent\n'
              'if str(SCRIPT_DIR) not in sys.path:\n'
              '    sys.path.insert(0, str(SCRIPT_DIR))\n'
              'import reference_face_refinement as reference_refinement\n'
          )
          if 'import reference_face_refinement as reference_refinement' not in source:
              if import_anchor not in source:
                  raise SystemExit('Import anchor was not found')
              source = source.replace(import_anchor, import_replacement, 1)

          old_copy = 'approved_references = copy_approved_references(args.character, root)'
          new_copy = 'approved_references = reference_refinement.copy_approved_references(args.character, root)'
          if old_copy in source:
              source = source.replace(old_copy, new_copy, 1)

          old_main = (
              '        bounds = normalize(meshes)\n'
              '        face_refinement, face_object = create_reference_face_surface(\n'
          )
          new_main = (
              '        pre_rig_cleanup = reference_refinement.cleanup_disconnected_components(\n'
              '            meshes,\n'
              '            world_bounds,\n'
              '        )\n'
              '        bounds = normalize(meshes)\n'
              '        face_refinement, face_object = reference_refinement.create_reference_face_surface(\n'
          )
          if 'pre_rig_cleanup = reference_refinement.cleanup_disconnected_components' not in source:
              if old_main not in source:
                  raise SystemExit('Rig main anchor was not found')
              source = source.replace(old_main, new_main, 1)

          old_report = (
              '            approvedReferences=approved_references,\n'
              '            faceRefinement=face_refinement,\n'
          )
          new_report = (
              '            approvedReferences=approved_references,\n'
              '            preRigCleanup=pre_rig_cleanup,\n'
              '            faceRefinement=face_refinement,\n'
          )
          if 'preRigCleanup=pre_rig_cleanup' not in source:
              if old_report not in source:
                  raise SystemExit('Report anchor was not found')
              source = source.replace(old_report, new_report, 1)

          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8')
      - name: Commit patched rig builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/havenline-character-production/rig_animate_character.py
          git diff --cached --check
          git commit -m 'Use reference-faithful Havenline face refinement'
          git push origin HEAD:havenline-unity-reference-rebuild
