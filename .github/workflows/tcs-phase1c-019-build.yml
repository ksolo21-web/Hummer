          cp evidence/phase1c-source.patch phase1c-evidence/
          cp evidence/phase1c-source-sha256.txt phase1c-evidence/
          cp evidence/phase1c-0.1.19/pdf-sha256.txt phase1c-evidence/
          cp evidence/phase1c-0.1.19/style-validator.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/identity-validator.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/label-metrics-validator.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/navigation-validator.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/hard-override-validator.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/final-review.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/target-lock.json phase1c-evidence/
          cp evidence/phase1c-0.1.19/phase1c-A994a-1x.png.b64.txt phase1c-evidence/
          cp evidence/phase1c-0.1.19/phase1c-A994a-4x.png.b64.txt phase1c-evidence/
          cp evidence/apk.sha256 phase1c-evidence/
          cp evidence/aab.sha256 phase1c-evidence/
