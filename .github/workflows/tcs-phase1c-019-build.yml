          cp evidence/apk-signature.txt phase1c-evidence/
          cp evidence/aab-jar-verify.txt phase1c-evidence/
          cp evidence/apk-badging.txt phase1c-evidence/
          cp evidence/extracted-source-manifest.sha256 phase1c-evidence/
          cp evidence/source-package.sha256 phase1c-evidence/
          git add phase1c-evidence
          if ! git diff --cached --quiet; then
