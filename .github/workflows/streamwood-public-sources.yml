name: Streamwood public mapping sources
on:
  push:
    branches: ['data/streamwood-public-sources-20260920']
permissions:
  contents: read
jobs:
  fetch-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install PDF link reader
        run: python -m pip install --quiet pymupdf
      - name: Fetch public sources sequentially
        shell: bash
        run: |
          mkdir -p public-sources
          python - <<'PY'
          import urllib.request, urllib.parse, json, hashlib, datetime, time, re
          from pathlib import Path
          import fitz
          O=Path('public-sources'); receipts=[]
          def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def get(url,name,timeout=60):
              r={'url':url,'file':name,'started':now()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Public-Mapping-Source-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=timeout) as x: raw=x.read();r['http_status']=x.status
                  (O/name).write_bytes(raw);r.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),success=True)
              except Exception as e: raw=None;r.update(success=False,error=repr(e))
              r['finished']=now();receipts.append(r);return raw
          q='[out:json][timeout:75];(way[highway](42.6505,-83.1746,42.6575,-83.1600);nwr[building](42.6505,-83.1746,42.6575,-83.1600);nwr["addr:housenumber"](42.6505,-83.1746,42.6575,-83.1600);way[landuse](42.6505,-83.1746,42.6575,-83.1600);way[waterway](42.6505,-83.1746,42.6575,-83.1600););out meta;>;out skel qt;'
          (O/'osm-query.txt').write_text(q)
          for host in ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']:
              raw=get(host+'?'+urllib.parse.urlencode({'data':q}),'streamwood-osm-raw.json',105)
              if raw:
                  obj=json.loads(raw);receipts[-1].update(elements=len(obj.get('elements',[])),osm3s=obj.get('osm3s'),remark=obj.get('remark'),complete='elements' in obj and not obj.get('remark'))
                  if receipts[-1]['complete']:break
              time.sleep(5)
          index='https://www.rochesterhills.org/assessing/PropertyDescriptionMap.pdf'
          raw=get(index,'PropertyDescriptionMap.pdf',35);links=[]
          if raw:
              d=fitz.open(stream=raw,filetype='pdf')
              for pi,p in enumerate(d):
                  for l in p.get_links():
                      if l.get('uri'):links.append({'page':pi,'uri':l['uri'],'rect':list(l['from'])})
              (O/'index-links.json').write_text(json.dumps(links,indent=2))
              selected=[urllib.parse.urljoin(index,l['uri']) for l in links if re.search(r'(?<!\d)21(?!\d)',l['uri'])]
              sublinks=[]
              for i,u in enumerate(sorted(set(selected))[:4]):
                  b=get(u,'section21-%s.pdf'%i,35)
                  if b:
                      try:
                          dd=fitz.open(stream=b,filetype='pdf')
                          for pi,p in enumerate(dd):
                              for l in p.get_links():
                                  if l.get('uri'):sublinks.append({'base':u,'uri':l['uri'],'page':pi,'rect':list(l['from'])})
                      except Exception as e:receipts[-1]['parse_error']=repr(e)
              (O/'section21-links.json').write_text(json.dumps(sublinks,indent=2))
              us=sorted(set(urllib.parse.urljoin(l['base'],l['uri']) for l in sublinks if re.search(r'21[^/]*[eEfF]|21/[eEfF]',l['uri'])))
              for i,u in enumerate(us[:6]):get(u,'section21-detail-%s.pdf'%i,35)
          get('https://www.rochesterhills.org/assessing/ResidentialCondoInformation.pdf','ResidentialCondoInformation.pdf',35)
          (O/'RECEIPTS.json').write_text(json.dumps({'retrieved_at':now(),'scope':'Public map records only. No private assignment data.','sources':receipts},indent=2))
          print(json.dumps(receipts,indent=2))
          PY
      - name: Preserve raw public sources and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamwood-public-sources-${{ github.run_id }}
          path: public-sources/
          retention-days: 7
          if-no-files-found: error
