name: Report Neural Hummer Run

on:
  push:
    paths:
      - '.tooling/neural-hummer-run-check.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Query latest neural baseline workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tooling
          gh api \
            -H 'Accept: application/vnd.github+json' \
            '/repos/${{ github.repository }}/actions/workflows/generate-neural-hummer-baseline.yml/runs?per_page=5' \
            > .tooling/neural-hummer-runs-raw.json
          jq '{runs:[.workflow_runs[]|{id,status,conclusion,event,head_sha,created_at,updated_at,html_url,run_attempt}]}' \
            .tooling/neural-hummer-runs-raw.json \
            > .tooling/neural-hummer-run-status.json
          cat .tooling/neural-hummer-run-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tooling/neural-hummer-run-status.json
          git commit -m 'Record neural Hummer workflow run status' || exit 0
          git push
