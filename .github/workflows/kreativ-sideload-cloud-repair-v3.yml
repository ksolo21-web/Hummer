          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          vm = Path('app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt')
          replace_once(
              vm,
              '    val isCloudConfigured: Boolean get() = container.cloudSyncRepository.isConfigured\n',
              '    val isCloudConfigured: Boolean get() = container.cloudSyncRepository.isConfigured\n    val cloudFailureDetail: String? get() = container.cloudSyncRepository.lastFailureMessage\n',
          )
          replace_once(
              vm,
              '''    private fun cloudUnavailableMessage(): String =\n        "Cloud backup is not authorized yet. Your work remains safely stored on this device."\n''',
              '''    private fun cloudUnavailableMessage(): String =\n        (cloudFailureDetail ?: "Cloud access has not been verified yet.") +\n            " Your work remains safely stored on this device."\n''',
          )

          screens = Path('app/src/main/java/com/kreativstudio/app/ui/Screens.kt')
          replace_once(
              screens,
              'else "Google sign-in succeeded. Device autosave is active; Firebase cloud permission is not available yet.",',
              'else "Google sign-in succeeded. Device autosave is active. ${viewModel.cloudFailureDetail ?: "Cloud access has not been verified yet."}",',
          )

          gradle = Path('app/build.gradle.kts')
          replace_once(gradle, 'versionCode = 8', 'versionCode = 9')
          replace_once(gradle, 'versionName = "0.1.7"', 'versionName = "0.1.8"')
          gradle_text = gradle.read_text(encoding='utf-8')
          gradle_text = gradle_text.replace('    debugImplementation("com.google.firebase:firebase-appcheck-debug")\n', '')
          gradle_text = gradle_text.replace('    "privateAlphaImplementation"("com.google.firebase:firebase-appcheck-debug")\n', '')
          gradle.write_text(gradle_text, encoding='utf-8')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify repair and build
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -Fq 'getAppCheckToken(true)' app/src/main/java
          grep -Fq 'BuildConfig.BUILD_TYPE != "release"' app/src/main/java/com/kreativstudio/app/KreativApplication.kt
          grep -Fq 'verifyStorageAccess' app/src/main/java/com/kreativstudio/app/cloud/CloudSyncRepository.kt
          grep -Fq 'lastConnectionCheckAt' app/src/main/java/com/kreativstudio/app/cloud/CloudSyncRepository.kt
          grep -Fq 'versionCode = 9' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.8"' app/build.gradle.kts
          gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KREATIV Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/kreativstudio/app/cloud/CloudSyncRepository.kt \
                  app/src/main/java/com/kreativstudio/app/KreativApplication.kt \
                  app/src/main/java/com/kreativstudio/app/ui/KreativViewModel.kt \
                  app/src/main/java/com/kreativstudio/app/ui/Screens.kt \
                  app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix sideloaded Firebase cloud access in v0.1.8'
            git push origin HEAD:agent/kreativ-studio-v0.1
          fi

      - name: Upload repair APK
        uses: actions/upload-artifact@v4
        with:
          name: KREATIV-Studio-v0.1.8-sideload-cloud-repair-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
