name: Fetch public Rochester Hills map source
on:
  push:
    branches: [public-map-source-20260914]
    paths: [.github/workflows/fetch-public-map-source.yml]
permissions:
  contents: read
jobs:
  fetch-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve bounded public GIS data
        shell: bash
        run: |
          mkdir -p public-map-source
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, datetime, hashlib, time, traceback
          out=pathlib.Path('public-map-source')
          receipts=[]
          bbox='-83.190,42.678,-83.172,42.698'
          def fetch(url, params=None, binary=False):
              if params: url+='?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'PublicGISMapReview/1.0'})
              with urllib.request.urlopen(req,timeout=55) as r:
                  raw=r.read()
              receipts.append({'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              if binary:return raw
              obj=json.loads(raw)
              if isinstance(obj,dict) and 'error' in obj:raise RuntimeError(str(obj['error']))
              return obj
          def save(name,obj):
              (out/name).write_text(json.dumps(obj,ensure_ascii=False))
          def layer(name,url,fields=None):
              meta=fetch(url,{'f':'json'}); save(name+'-metadata.json',meta)
              base={'f':'json','where':'1=1','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              ids=fetch(url+'/query',dict(base,returnIdsOnly='true')); save(name+'-ids.json',ids)
              idlist=sorted(ids.get('objectIds') or [])
              count=fetch(url+'/query',dict(base,returnCountOnly='true'));save(name+'-count.json',count)
              assert count['count']==len(idlist)
              oid=ids['objectIdFieldName']
              if fields:
                  names=[f['name'] for f in meta.get('fields',[])]
                  chosen=[n for n in names if n.lower() in fields]
                  fields=','.join([oid]+chosen)
              else: fields='*'
              features=[]
              for i in range(0,len(idlist),150):
                  page=fetch(url+'/query',{'f':'json','objectIds':','.join(map(str,idlist[i:i+150])),'outFields':fields,'returnGeometry':'true','outSR':4326})
                  assert not page.get('exceededTransferLimit',False)
                  save(name+'-page-'+str(i)+'.json',page)
                  features.extend(page.get('features',[]))
              assert sorted(f['attributes'][oid] for f in features)==idlist
              save(name+'.json',{'source':url,'bbox':bbox,'spatialReference':{'wkid':4326},'expected_count':len(idlist),'complete':True,'features':features})
              print(name,len(features))
          jobs=[('roads','https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseTransportationDataMapService/MapServer/0',None),('parcels','https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseOpenParcelDataMapService/MapServer/1',{'pin','parcelnumber','propertyclass','propertyclassdescription','propertyclassification','taxclass','taxdescription','cvttaxname','cvttaxnameleft','sitenum','siteaddress','address','streetnumber','streetname','streettype','cartographicname','landuse','landusedescription','propertytype','propclass','propclassdesc','resbldgstyle','buildingstyle','situsaddress'})]
          for name,url,fields in jobs:
              try:layer(name,url,fields)
              except Exception as e:save(name+'-ERROR.json',{'error':str(e),'traceback':traceback.format_exc()});print(name,'ERROR',str(e))
          try:
              url='https://www2.census.gov/geo/tiger/TIGER2025/ROADS/tl_2025_26125_roads.zip'
              (out/'tl_2025_26125_roads.zip').write_bytes(fetch(url,binary=True));print('Census ZIP saved')
          except Exception as e:save('census-ERROR.json',{'error':str(e)})
          try:
              q='[out:json][timeout:30];way[highway](42.678,-83.190,42.698,-83.172);out tags geom;'
              data=fetch('https://overpass-api.de/api/interpreter',{'data':q});save('osm-highways.json',data);print('OSM',len(data.get('elements',[])))
          except Exception as e:save('osm-ERROR.json',{'error':str(e)})
          save('RECEIPTS.json',receipts)
          assert (out/'roads.json').exists() or (out/'tl_2025_26125_roads.zip').exists() or (out/'osm-highways.json').exists(), 'No usable public vector source'
          PY
      - name: Retain source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rochester-map-source-20260914
          path: public-map-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
