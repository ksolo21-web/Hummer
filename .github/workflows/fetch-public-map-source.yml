name: Fetch public Rochester Hills land use
on:
  push:
    branches: [public-map-source-20260914]
    paths: [.github/workflows/fetch-public-map-source.yml]
permissions:
  contents: read
jobs:
  public-land-use:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve and reconcile public land-use records
        shell: bash
        run: |
          mkdir -p public-land-use
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, datetime, hashlib, traceback
          out=pathlib.Path('public-land-use'); receipts=[]
          bbox='-83.190,42.678,-83.172,42.698'
          def fetch(url,params):
              url+='?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'PublicGISMapReview/1.0'})
              with urllib.request.urlopen(req,timeout=55) as r: raw=r.read()
              receipts.append({'url':url,'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              obj=json.loads(raw)
              if 'error' in obj: raise RuntimeError(str(obj['error']))
              return obj
          def save(name,obj): (out/name).write_text(json.dumps(obj,ensure_ascii=False))
          url='https://gisservices.oakgov.com/arcgis/rest/services/Enterprise/EnterpriseOpenPlanningMapService/MapServer/4'
          try:
              meta=fetch(url,{'f':'json'});save('landuse-metadata.json',meta)
              base={'f':'json','where':'1=1','geometry':bbox,'geometryType':'esriGeometryEnvelope','inSR':4326,'spatialRel':'esriSpatialRelIntersects'}
              ids=fetch(url+'/query',dict(base,returnIdsOnly='true'));save('landuse-ids.json',ids)
              expected=sorted(ids.get('objectIds') or []);oid=ids['objectIdFieldName']
              count=fetch(url+'/query',dict(base,returnCountOnly='true'));save('landuse-count.json',count)
              assert count['count']==len(expected) and len(expected)>0
              features=[]
              for i in range(0,len(expected),150):
                  page=fetch(url+'/query',{'f':'json','objectIds':','.join(map(str,expected[i:i+150])),'outFields':'*','returnGeometry':'true','outSR':4326})
                  assert not page.get('exceededTransferLimit',False)
                  save('landuse-page-'+str(i)+'.json',page);features.extend(page.get('features',[]))
              assert sorted(f['attributes'][oid] for f in features)==expected
              save('landuse.json',{'source':url,'bbox':bbox,'spatialReference':{'wkid':4326},'expected_count':len(expected),'complete':True,'features':features})
              print('Verified complete land-use feature count:',len(features))
          except Exception as e:
              save('ERROR.json',{'error':str(e),'traceback':traceback.format_exc()});raise
          finally:save('RECEIPTS.json',receipts)
          PY
      - name: Retain public source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-rochester-landuse-20260914
          path: public-land-use/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
